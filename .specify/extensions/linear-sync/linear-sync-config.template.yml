# Linear sync configuration for Spec Kit projects.
#
# Secrets must not be committed here. Put LINEAR_API_KEY in your shell,
# Codex environment, or CI secret store.

team_key: ""
product_name: ""
project_template: "{product} / {feature} {title}"
project_name: ""
cycle_name: ""
default_assignee: ""

github_repo: ""

language: ru
plain_language: true
dry_run_by_default: true

status_map:
  open: Todo
  in_progress: In Progress
  blocked: Blocked
  review: In Review
  done: Done

labels:
  - spec-kit
  - source:tasks-md
