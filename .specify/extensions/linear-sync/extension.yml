schema_version: "1.0"

extension:
  id: linear-sync
  name: "Linear Sync"
  version: "0.1.0"
  description: "Sync Spec Kit tasks and GitHub issues into Linear projects without duplicate work"
  author: yshishenya
  repository: https://github.com/yshishenya/spec-kit-ext-linear-sync
  license: MIT

requires:
  speckit_version: ">=0.9.0"
  tools:
    - name: git
      required: true
    - name: python3
      required: true

provides:
  commands:
    - name: speckit.linear-sync.init
      file: commands/speckit.linear-init.md
      description: "Create or refresh project Linear sync configuration"
    - name: speckit.linear-sync.import
      file: commands/speckit.linear-import.md
      description: "Import existing Linear/GitHub issue mappings before creating new Linear issues"
    - name: speckit.linear-sync.sync
      file: commands/speckit.linear-sync.md
      description: "Sync Spec Kit tasks, GitHub issues, and Linear issues"
    - name: speckit.linear-sync.validate
      file: commands/speckit.linear-validate.md
      description: "Validate task, GitHub issue, and Linear issue mapping health"

  config:
    - name: "linear-sync-config.yml"
      template: "linear-sync-config.template.yml"
      description: "Linear sync configuration"
      required: false

hooks:
  after_taskstoissues:
    command: speckit.linear-sync.sync
    optional: true
    description: "Sync tasks and GitHub issue links into Linear after task-to-issue sync"

tags:
  - linear
  - issues
  - projects
  - taskstoissues
  - workflow

config:
  defaults:
    language: ru
    plain_language: true
    dry_run_by_default: true
    tasks_source_of_truth: true
