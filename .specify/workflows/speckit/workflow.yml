schema_version: "1.0"
workflow:
  id: "speckit"
  name: "GRAF: разработка и завершение трекера"
  version: "1.0.1"
  author: "GRAF"
  description: "Полный проектный цикл с обязательной приёмкой и сверкой issues"

requires:
  speckit_version: ">=1.0.1"
  integrations:
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "Уточнить требования и обязательные проверки для {{ inputs.spec }}."

  - id: review-spec
    type: gate
    message: "Требования и существенные решения согласованы; неоднозначности устранены."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "Проверить требования по рискам текущего проекта и запланированного объёма."

  - id: review-plan
    type: gate
    message: "План и необходимые reviewer-owned checklists проверены; автор реализации не подменяет приёмку."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "Устранить блокирующие расхождения через нужный этап; к реализации переходить только после чистой повторной проверки."

  - id: review-analysis
    type: gate
    message: "Проверка analyze не оставила блокирующих расхождений; версии spec/plan/tasks согласованы."
    options: [approve, reject]
    on_reject: abort

  - id: taskstoissues
    command: speckit.taskstoissues
    integration: "{{ inputs.integration }}"
    input:
      args: "Связать текущие задачи с существующими issues без дубликатов."

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "При остатке выполнить цикл taskstoissues → implement → converge. Не считать локальную реализацию закрытием issues."

  - id: validation-release
    type: gate
    message: >-
      Перед продолжением подтвердить review, нужные проверки, разрешённое слияние
      и обязательную приёмку/выпуск на точном SHA по правилам проекта.
      Одни локальные тесты не достаточны. Если условия не выполнены, остановиться
      с конкретным остатком; approval этого gate не заменяет отсутствующие доказательства.
    options: [approve, reject]
    on_reject: abort

  - id: tracker-closeout
    command: speckit.taskstoissues
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        closeout: перечитать tasks.md и live issues, подтвердить все исходные
        критерии и merged PR/CI/runtime/release evidence. Через штатный
        validate-issue-closeout.py --verify-live закрыть только подтверждённые
        задачи с подробным русским комментарием; umbrella последним через live
        feature validation. Соблюдать разрешённый пользователем объём действий.
        Неполные задачи оставить открытыми с причиной. Выдать точный остаток,
        не завершать создание issues повторно и не считать [X] достаточным доказательством.

  - id: review-closeout
    type: gate
    message: >-
      Подтверждена финальная сверка трекера: закрытые issues проверены,
      все обязательные критерии выполнены. Если обязательные задачи ещё открыты,
      результат tracker pending, а workflow не завершён.
    options: [approve, reject]
    on_reject: abort
