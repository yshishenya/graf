name: twobrain-rec-local
services:
  rec-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: twobrain_rec
      POSTGRES_USER: twobrain_rec
      POSTGRES_PASSWORD: twobrain_rec
    ports: ["127.0.0.1:54330:5432"]
    volumes: [twobrain-rec-local-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twobrain_rec -d twobrain_rec"]
      interval: 5s
      timeout: 5s
      retries: 20
  rec-minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: twobrain_rec
      MINIO_ROOT_PASSWORD: twobrain_rec_dev_secret
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"]
    volumes: [twobrain-rec-local-minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  twobrain-rec-local-postgres:
  twobrain-rec-local-minio:
