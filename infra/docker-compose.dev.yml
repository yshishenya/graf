services:
  api:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    env_file:
      - ../apps/server/.env.example
    environment:
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec:twobrain_rec@rec-postgres:5432/twobrain_rec
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: twobrain_rec
      TWOBRAIN_MINIO_SECRET_KEY: twobrain_rec_dev_secret
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy

  rec-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: twobrain_rec
      POSTGRES_USER: twobrain_rec
      POSTGRES_PASSWORD: twobrain_rec
    ports:
      - "54329:5432"
    volumes:
      - rec-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twobrain_rec -d twobrain_rec"]
      interval: 5s
      timeout: 5s
      retries: 12

  rec-minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: twobrain_rec
      MINIO_ROOT_PASSWORD: twobrain_rec_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rec-minio-dev-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rec-postgres-dev-data:
  rec-minio-dev-data:
