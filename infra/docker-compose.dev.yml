services:
  api:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    env_file:
      - ../apps/server/.env.example
    environment:
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec:twobrain_rec@rec-postgres:5432/twobrain_rec
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: twobrain_rec_api
      TWOBRAIN_MINIO_SECRET_KEY: twobrain_rec_api_dev_secret
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy
      rec-minio-init:
        condition: service_completed_successfully

  rec-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: twobrain_rec
      POSTGRES_USER: twobrain_rec
      POSTGRES_PASSWORD: twobrain_rec
    ports:
      - "54329:5432"
    volumes:
      - rec-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twobrain_rec -d twobrain_rec"]
      interval: 5s
      timeout: 5s
      retries: 12

  rec-minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: twobrain_rec_root
      MINIO_ROOT_PASSWORD: twobrain_rec_root_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rec-minio-dev-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  rec-minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      rec-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set rec http://rec-minio:9000 twobrain_rec_root twobrain_rec_root_dev_secret
        mc mb --ignore-existing rec/twobrain-rec-ingest
        mc admin user add rec twobrain_rec_api twobrain_rec_api_dev_secret || true
        cat >/tmp/rec-api-policy.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::twobrain-rec-ingest"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::twobrain-rec-ingest/*"]}]}
        JSON
        mc admin policy create rec twobrain-rec-api /tmp/rec-api-policy.json || true
        mc admin policy attach rec twobrain-rec-api --user twobrain_rec_api

volumes:
  rec-postgres-dev-data:
  rec-minio-dev-data:
