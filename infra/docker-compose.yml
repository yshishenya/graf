  rec-db-runtime-bootstrap:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    restart: "no"
    user: twobrain
    group_add:
      - "${TWOBRAIN_RUNTIME_SECRET_GID:-1001}"
    environment:
      TWOBRAIN_DB_HOST: rec-postgres
      TWOBRAIN_DB_PORT: "5432"
      TWOBRAIN_DB_OWNER_PASSWORD_FILE: /run/secrets/twobrain_postgres_owner_password
      TWOBRAIN_DB_APP_PASSWORD_FILE: /run/secrets/twobrain_postgres_app_password
      TWOBRAIN_DB_MAINTENANCE_PASSWORD_FILE: /run/secrets/twobrain_postgres_maintenance_password
      TWOBRAIN_DB_MEDIA_PASSWORD_FILE: /run/secrets/twobrain_postgres_media_password
    secrets:
      - source: twobrain_postgres_password
        target: twobrain_postgres_owner_password
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_postgres_app_password
        target: twobrain_postgres_app_password
      - source: twobrain_postgres_maintenance_password
        target: twobrain_postgres_maintenance_password
      - source: twobrain_postgres_media_password
        target: twobrain_postgres_media_password
    command: ["python", "/app/scripts/bootstrap_runtime_database_roles.py"]
    depends_on:
      rec-migrate:
        condition: service_completed_successfully
      rec-postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
