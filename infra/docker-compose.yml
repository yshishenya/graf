  rec-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: twobrain_rec
      POSTGRES_USER: twobrain_rec
      POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
    secrets:
      - source: twobrain_postgres_password
        target: twobrain_postgres_password
    volumes:
      - rec-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twobrain_rec -d twobrain_rec"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - rec-private
      - rec-media-private

  rec-minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/twobrain_minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/twobrain_minio_root_password
    secrets:
      - source: twobrain_minio_root_user
        target: twobrain_minio_root_user
      - source: twobrain_minio_root_password
        target: twobrain_minio_root_password
    volumes:
      - rec-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - rec-private
      - rec-media-private

  rec-minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    group_add:
      - "${TWOBRAIN_RUNTIME_SECRET_GID:-1001}"
    depends_on:
      rec-minio:
        condition: service_healthy
    environment:
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
    secrets:
      - source: twobrain_minio_root_user
        target: twobrain_minio_root_user
      - source: twobrain_minio_root_password
        target: twobrain_minio_root_password
      - source: twobrain_minio_api_access_key
        target: twobrain_minio_api_access_key
      - source: twobrain_minio_api_secret_key
        target: twobrain_minio_api_secret_key
      - source: twobrain_minio_media_access_key
        target: twobrain_minio_media_access_key
      - source: twobrain_minio_media_secret_key
        target: twobrain_minio_media_secret_key
    entrypoint:
      - /bin/sh
      - -c
      - |
        MINIO_ROOT_USER="$$(cat /run/secrets/twobrain_minio_root_user)"
        MINIO_ROOT_PASSWORD="$$(cat /run/secrets/twobrain_minio_root_password)"
        TWOBRAIN_MINIO_API_ACCESS_KEY="$$(cat /run/secrets/twobrain_minio_api_access_key)"
        TWOBRAIN_MINIO_API_SECRET_KEY="$$(cat /run/secrets/twobrain_minio_api_secret_key)"
        TWOBRAIN_MINIO_MEDIA_ACCESS_KEY="$$(cat /run/secrets/twobrain_minio_media_access_key)"
        TWOBRAIN_MINIO_MEDIA_SECRET_KEY="$$(cat /run/secrets/twobrain_minio_media_secret_key)"
        mc alias set rec http://rec-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "rec/$$TWOBRAIN_MINIO_BUCKET"
        printf 'ready\n' >/tmp/storage-readiness
        mc cp /tmp/storage-readiness "rec/$$TWOBRAIN_MINIO_BUCKET/_system/readiness/ready"
        mc admin user add rec "$$TWOBRAIN_MINIO_API_ACCESS_KEY" "$$TWOBRAIN_MINIO_API_SECRET_KEY" || true
        cat >/tmp/rec-api-policy.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::twobrain-rec-ingest"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::twobrain-rec-ingest/*"]}]}
        JSON
        mc admin policy rm rec twobrain-rec-api || true
        mc admin policy create rec twobrain-rec-api /tmp/rec-api-policy.json
        mc admin policy attach rec twobrain-rec-api --user "$$TWOBRAIN_MINIO_API_ACCESS_KEY"
        mc admin user add rec "$$TWOBRAIN_MINIO_MEDIA_ACCESS_KEY" "$$TWOBRAIN_MINIO_MEDIA_SECRET_KEY" || true
        cat >/tmp/rec-media-policy.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::twobrain-rec-ingest"]},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::twobrain-rec-ingest/_system/readiness/ready","arn:aws:s3:::twobrain-rec-ingest/organizations/*/workspaces/*/meetings/*/sessions/*/tracks/media/parts/*","arn:aws:s3:::twobrain-rec-ingest/organizations/*/workspaces/*/meetings/*/sessions/*/tracks/microphone/parts/*","arn:aws:s3:::twobrain-rec-ingest/organizations/*/workspaces/*/meetings/*/sessions/*/tracks/system/parts/*","arn:aws:s3:::twobrain-rec-ingest/organizations/*/workspaces/*/meetings/*/sessions/*/tracks/playback/parts/*","arn:aws:s3:::twobrain-rec-ingest/organizations/*/workspaces/*/meetings/*/artifacts/media-revisions/*/tracks/media","arn:aws:s3:::twobrain-rec-ingest/organizations/*/workspaces/*/meetings/*/artifacts/media-revisions/*/tracks/microphone","arn:aws:s3:::twobrain-rec-ingest/organizations/*/workspaces/*/meetings/*/artifacts/media-revisions/*/tracks/system","arn:aws:s3:::twobrain-rec-ingest/organizations/*/workspaces/*/meetings/*/artifacts/media-revisions/*/tracks/playback"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::twobrain-rec-ingest/organizations/*/workspaces/*/meetings/*/artifacts/playback-normalization/revisions/*/attempts/*/meeting-review.m4a"]}]}
        JSON
        mc admin policy rm rec twobrain-rec-media || true
        mc admin policy create rec twobrain-rec-media /tmp/rec-media-policy.json
        mc admin policy attach rec twobrain-rec-media --user "$$TWOBRAIN_MINIO_MEDIA_ACCESS_KEY"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - rec-private

networks:
  rec-private:
    name: twobrain-rec-private
  rec-media-private:
    name: twobrain-rec-media-private
    internal: true
  postal-network:
    external: true
