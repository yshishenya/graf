name: twobrain-rec

services:
  rec-api:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/rec.production.env.example
    environment:
      TWOBRAIN_ENV: production
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec:__POSTGRES_PASSWORD__@rec-postgres:5432/twobrain_rec
      TWOBRAIN_POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_SECRET_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_ACCESS_KEY_FILE: /run/secrets/twobrain_minio_api_access_key
      TWOBRAIN_MINIO_SECRET_KEY_FILE: /run/secrets/twobrain_minio_api_secret_key
      TWOBRAIN_SMOKE_CREDENTIAL_FILE: /run/secrets/twobrain_smoke_credential
      GRAF_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/graf_credential_encryption_key
      TWOBRAIN_WEB_LOGIN_WORKSPACE_ID: ${TWOBRAIN_WEB_LOGIN_WORKSPACE_ID:-}
      TWOBRAIN_EMAIL_LOGIN_DELIVERY_ENABLED: ${TWOBRAIN_EMAIL_LOGIN_DELIVERY_ENABLED:-false}
      TWOBRAIN_EMAIL_LOGIN_FROM_ADDRESS: ${TWOBRAIN_EMAIL_LOGIN_FROM_ADDRESS:-}
      TWOBRAIN_EMAIL_LOGIN_FROM_NAME: ${TWOBRAIN_EMAIL_LOGIN_FROM_NAME:-GRAF}
      TWOBRAIN_POSTAL_API_URL: ${TWOBRAIN_POSTAL_API_URL:-}
      TWOBRAIN_POSTAL_API_KEY_FILE: ${TWOBRAIN_POSTAL_API_KEY_FILE:-/run/secrets/twobrain_postal_api_key}
      TWOBRAIN_POSTAL_HOST_HEADER: ${TWOBRAIN_POSTAL_HOST_HEADER:-postal.2brain.pro}
      TWOBRAIN_POSTAL_REQUEST_TIMEOUT_SECONDS: ${TWOBRAIN_POSTAL_REQUEST_TIMEOUT_SECONDS:-10}
      TWOBRAIN_YANDEX_CLIENT_ID: ${TWOBRAIN_YANDEX_CLIENT_ID:-twobrain-yandex-client-id}
      TWOBRAIN_YANDEX_CLIENT_SECRET_FILE: /run/secrets/twobrain_yandex_client_secret
      TWOBRAIN_VK_CLIENT_ID: ${TWOBRAIN_VK_CLIENT_ID:-twobrain-vk-client-id}
      TWOBRAIN_VK_CLIENT_SECRET_FILE: /run/secrets/twobrain_vk_client_secret
      TWOBRAIN_SUPPORT_INCIDENT_GITHUB_TOKEN_FILE: /run/secrets/twobrain_support_incident_github_token
      TWOBRAIN_PUBLIC_ANALYTICS_ENABLED: ${TWOBRAIN_PUBLIC_ANALYTICS_ENABLED:-false}
      TWOBRAIN_PUBLIC_ANALYTICS_YANDEX_METRICA_ID: ${TWOBRAIN_PUBLIC_ANALYTICS_YANDEX_METRICA_ID:-}
      TWOBRAIN_PUBLIC_ANALYTICS_VALIDATION_MODE: ${TWOBRAIN_PUBLIC_ANALYTICS_VALIDATION_MODE:-disabled}
      TWOBRAIN_PUBLIC_ANALYTICS_REPLAY_ENABLED: ${TWOBRAIN_PUBLIC_ANALYTICS_REPLAY_ENABLED:-false}
      TWOBRAIN_PUBLIC_ANALYTICS_CONSENT_COPY_VERSION: ${TWOBRAIN_PUBLIC_ANALYTICS_CONSENT_COPY_VERSION:-2026-07-08.1}
      TWOBRAIN_PRODUCT_ANALYTICS_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_VALIDATION_MODE: ${TWOBRAIN_PRODUCT_ANALYTICS_VALIDATION_MODE:-disabled}
      TWOBRAIN_PRODUCT_ANALYTICS_PROVIDER_MODE: ${TWOBRAIN_PRODUCT_ANALYTICS_PROVIDER_MODE:-disabled}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_HOST: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_HOST:-}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_PROJECT_KEY_FILE: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_PROJECT_KEY_FILE:-}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_AUTOCAPTURE_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_AUTOCAPTURE_ENABLED:-true}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_CREDENTIAL_SUPPRESSION_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_CREDENTIAL_SUPPRESSION_ENABLED:-true}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_WEB_DIRECT_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_WEB_DIRECT_ENABLED:-true}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_DESKTOP_DIRECT_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_DESKTOP_DIRECT_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_ALL_PAGES_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_ALL_PAGES_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_OFFLINE_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_OFFLINE_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_COUNTER_ID: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_COUNTER_ID:-}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_OAUTH_TOKEN_FILE: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_OAUTH_TOKEN_FILE:-}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_INVENTORY_VERSION: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_INVENTORY_VERSION:-096.2026-07-09.1}
      TWOBRAIN_PRODUCT_ANALYTICS_ROLLBACK_MODE: ${TWOBRAIN_PRODUCT_ANALYTICS_ROLLBACK_MODE:-none}
      TWOBRAIN_PRODUCT_ANALYTICS_REPLAY_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_REPLAY_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_RETENTION_MIN_DAYS: ${TWOBRAIN_PRODUCT_ANALYTICS_RETENTION_MIN_DAYS:-90}
      TWOBRAIN_PRODUCT_ANALYTICS_CONSENT_COPY_VERSION: ${TWOBRAIN_PRODUCT_ANALYTICS_CONSENT_COPY_VERSION:-2026-07-09.1}
      TWOBRAIN_PRODUCT_ANALYTICS_DIRECT_DESKTOP_EGRESS_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_DIRECT_DESKTOP_EGRESS_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_DIRECT_DESKTOP_EGRESS_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_DIRECT_DESKTOP_EGRESS_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_LEGAL_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_LEGAL_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_PRIVACY_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_PRIVACY_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_SECURITY_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_SECURITY_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_QA_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_QA_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_DISCLOSURE_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_DISCLOSURE_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_DASHBOARD_READY: ${TWOBRAIN_PRODUCT_ANALYTICS_DASHBOARD_READY:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_PROVIDER_SMOKE_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_PROVIDER_SMOKE_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_ROLLBACK_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_ROLLBACK_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_LIVE_PROVIDER_DELIVERY_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_LIVE_PROVIDER_DELIVERY_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_CAMPAIGN_READINESS_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_CAMPAIGN_READINESS_APPROVED:-false}
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
      TWOBRAIN_PROCESSING_ENABLED: "true"
      TWOBRAIN_TEMPORAL_ADDRESS: rec-temporal:7233
    secrets:
      - source: twobrain_postgres_password
        target: twobrain_postgres_password
      - source: twobrain_minio_api_access_key
        target: twobrain_minio_api_access_key
      - source: twobrain_minio_api_secret_key
        target: twobrain_minio_api_secret_key
      - source: twobrain_smoke_credential
        target: twobrain_smoke_credential
      - source: graf_credential_encryption_key
        target: graf_credential_encryption_key
      - source: twobrain_web_csrf_secret
        target: twobrain_web_csrf_secret
      - source: twobrain_postal_api_key
        target: twobrain_postal_api_key
      - source: twobrain_yandex_client_secret
        target: twobrain_yandex_client_secret
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_vk_client_secret
        target: twobrain_vk_client_secret
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_support_incident_github_token
        target: twobrain_support_incident_github_token
        uid: "100"
        gid: "101"
        mode: 0440
      - source: graf_posthog_project_key
        target: graf_posthog_project_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: graf_yandex_offline_oauth_token
        target: graf_yandex_offline_oauth_token
        uid: "100"
        gid: "101"
        mode: 0440
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    depends_on:
      rec-migrate:
        condition: service_completed_successfully
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy
      rec-minio-init:
        condition: service_completed_successfully
      rec-temporal:
        condition: service_started
    networks:
      - rec-private
      - postal-network

  rec-processing-worker:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    restart: unless-stopped
    user: root
    env_file:
      - ./env/rec.production.env.example
    environment:
      TWOBRAIN_ENV: production
      TWOBRAIN_PROCESSING_ENABLED: "true"
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec:__POSTGRES_PASSWORD__@rec-postgres:5432/twobrain_rec
      TWOBRAIN_POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_SECRET_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_ACCESS_KEY_FILE: /run/secrets/twobrain_minio_api_access_key
      TWOBRAIN_MINIO_SECRET_KEY_FILE: /run/secrets/twobrain_minio_api_secret_key
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
      TWOBRAIN_TEMPORAL_ADDRESS: rec-temporal:7233
      TWOBRAIN_MEDIASCRIBE_API_KEY_FILE: /run/secrets/twobrain_mediascribe_api_key
    secrets:
      - source: twobrain_postgres_password
        target: twobrain_postgres_password
      - source: twobrain_minio_api_access_key
        target: twobrain_minio_api_access_key
      - source: twobrain_minio_api_secret_key
        target: twobrain_minio_api_secret_key
      - source: twobrain_web_csrf_secret
        target: twobrain_web_csrf_secret
      - source: twobrain_mediascribe_api_key
        target: twobrain_mediascribe_api_key
    command: ["python", "-m", "twobrain_rec_server.workflows.worker"]
    depends_on:
      rec-migrate:
        condition: service_completed_successfully
      rec-temporal:
        condition: service_started
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - rec-private

  rec-temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    user: root
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: rec-postgres
      POSTGRES_USER: twobrain_rec
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    secrets:
      - source: twobrain_postgres_password
        target: twobrain_postgres_password
    entrypoint:
      - /bin/bash
      - -c
      - |
        export POSTGRES_PWD="$$(cat /run/secrets/twobrain_postgres_password)"
        exec /etc/temporal/entrypoint.sh autosetup
    depends_on:
      rec-postgres:
        condition: service_healthy
    expose:
      - "7233"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - rec-private

  rec-migrate:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    restart: "no"
    env_file:
      - ./env/rec.production.env.example
    environment:
      TWOBRAIN_ENV: production
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec:__POSTGRES_PASSWORD__@rec-postgres:5432/twobrain_rec
      TWOBRAIN_POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_SECRET_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_ACCESS_KEY_FILE: /run/secrets/twobrain_minio_api_access_key
      TWOBRAIN_MINIO_SECRET_KEY_FILE: /run/secrets/twobrain_minio_api_secret_key
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
    secrets:
      - source: twobrain_postgres_password
        target: twobrain_postgres_password
      - source: twobrain_minio_api_access_key
        target: twobrain_minio_api_access_key
      - source: twobrain_minio_api_secret_key
        target: twobrain_minio_api_secret_key
      - source: twobrain_smoke_credential
        target: twobrain_smoke_credential
      - source: twobrain_web_csrf_secret
        target: twobrain_web_csrf_secret
    command: ["alembic", "upgrade", "head"]
    depends_on:
      rec-postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - rec-private

  rec-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: twobrain_rec
      POSTGRES_USER: twobrain_rec
      POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
    secrets:
      - source: twobrain_postgres_password
        target: twobrain_postgres_password
    volumes:
      - rec-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twobrain_rec -d twobrain_rec"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - rec-private

  rec-minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/twobrain_minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/twobrain_minio_root_password
    secrets:
      - source: twobrain_minio_root_user
        target: twobrain_minio_root_user
      - source: twobrain_minio_root_password
        target: twobrain_minio_root_password
    volumes:
      - rec-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - rec-private

  rec-minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      rec-minio:
        condition: service_healthy
    environment:
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
    secrets:
      - source: twobrain_minio_root_user
        target: twobrain_minio_root_user
      - source: twobrain_minio_root_password
        target: twobrain_minio_root_password
      - source: twobrain_minio_api_access_key
        target: twobrain_minio_api_access_key
      - source: twobrain_minio_api_secret_key
        target: twobrain_minio_api_secret_key
    entrypoint:
      - /bin/sh
      - -c
      - |
        MINIO_ROOT_USER="$$(cat /run/secrets/twobrain_minio_root_user)"
        MINIO_ROOT_PASSWORD="$$(cat /run/secrets/twobrain_minio_root_password)"
        TWOBRAIN_MINIO_API_ACCESS_KEY="$$(cat /run/secrets/twobrain_minio_api_access_key)"
        TWOBRAIN_MINIO_API_SECRET_KEY="$$(cat /run/secrets/twobrain_minio_api_secret_key)"
        mc alias set rec http://rec-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "rec/$$TWOBRAIN_MINIO_BUCKET"
        mc admin user add rec "$$TWOBRAIN_MINIO_API_ACCESS_KEY" "$$TWOBRAIN_MINIO_API_SECRET_KEY" || true
        cat >/tmp/rec-api-policy.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::twobrain-rec-ingest"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::twobrain-rec-ingest/*"]}]}
        JSON
        mc admin policy rm rec twobrain-rec-api || true
        mc admin policy create rec twobrain-rec-api /tmp/rec-api-policy.json
        mc admin policy attach rec twobrain-rec-api --user "$$TWOBRAIN_MINIO_API_ACCESS_KEY"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - rec-private

networks:
  rec-private:
    name: twobrain-rec-private
  postal-network:
    external: true
    name: ${TWOBRAIN_POSTAL_DOCKER_NETWORK:-postal_postal-network}

volumes:
  rec-postgres-data:
    name: twobrain-rec-postgres-data
  rec-minio-data:
    name: twobrain-rec-minio-data

secrets:
  twobrain_postgres_password:
    file: ${TWOBRAIN_POSTGRES_PASSWORD_FILE:-./secrets/twobrain_postgres_password}
  twobrain_minio_root_user:
    file: ${TWOBRAIN_MINIO_ROOT_USER_FILE:-./secrets/twobrain_minio_root_user}
  twobrain_minio_root_password:
    file: ${TWOBRAIN_MINIO_ROOT_PASSWORD_FILE:-./secrets/twobrain_minio_root_password}
  twobrain_minio_api_access_key:
    file: ${TWOBRAIN_MINIO_API_ACCESS_KEY_FILE:-./secrets/twobrain_minio_api_access_key}
  twobrain_minio_api_secret_key:
    file: ${TWOBRAIN_MINIO_API_SECRET_KEY_FILE:-./secrets/twobrain_minio_api_secret_key}
  twobrain_smoke_credential:
    file: ${TWOBRAIN_SMOKE_CREDENTIAL_FILE:-./secrets/twobrain_smoke_credential}
  graf_credential_encryption_key:
    file: ${GRAF_CREDENTIAL_ENCRYPTION_KEY_SECRET_FILE:-./secrets/graf_credential_encryption_key}
  twobrain_web_csrf_secret:
    file: ${TWOBRAIN_WEB_CSRF_SECRET_FILE:-./secrets/twobrain_web_csrf_secret}
  twobrain_mediascribe_api_key:
    file: ${TWOBRAIN_MEDIASCRIBE_API_KEY_FILE:-./secrets/twobrain_mediascribe_api_key}
  twobrain_postal_api_key:
    file: ${TWOBRAIN_POSTAL_API_SECRET_FILE:-./secrets/twobrain_postal_api_key}
  twobrain_yandex_client_secret:
    file: ${TWOBRAIN_YANDEX_CLIENT_SECRET_FILE:-./secrets/twobrain_yandex_client_secret}
  twobrain_vk_client_secret:
    file: ${TWOBRAIN_VK_CLIENT_SECRET_FILE:-./secrets/twobrain_vk_client_secret}
  twobrain_support_incident_github_token:
    file: ${TWOBRAIN_SUPPORT_INCIDENT_GITHUB_TOKEN_FILE:-./secrets/twobrain_support_incident_github_token}
  graf_posthog_project_key:
    file: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_PROJECT_KEY_SECRET_FILE:-./secret-placeholders/disabled_optional_provider_secret}
  graf_yandex_offline_oauth_token:
    file: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_OAUTH_TOKEN_SECRET_FILE:-./secret-placeholders/disabled_optional_provider_secret}
