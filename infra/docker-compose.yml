name: twobrain-rec

services:
  rec-api:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    restart: unless-stopped
    group_add:
      - "${TWOBRAIN_RUNTIME_SECRET_GID:-1001}"
    env_file:
      - ./env/rec.production.env.example
    environment:
      TWOBRAIN_ENV: production
      TWOBRAIN_WEB_RUNTIME_ENABLED: "true"
      TWOBRAIN_WEB_CSRF_SECRET_FILE: /run/secrets/twobrain_web_csrf_secret
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec_app:__POSTGRES_PASSWORD__@rec-postgres:5432/twobrain_rec
      TWOBRAIN_POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_SECRET_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_ACCESS_KEY_FILE: /run/secrets/twobrain_minio_api_access_key
      TWOBRAIN_MINIO_SECRET_KEY_FILE: /run/secrets/twobrain_minio_api_secret_key
      TWOBRAIN_SMOKE_CREDENTIAL_FILE: /run/secrets/twobrain_smoke_credential
      GRAF_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/graf_credential_encryption_key
      TWOBRAIN_WEB_LOGIN_WORKSPACE_ID: ${TWOBRAIN_WEB_LOGIN_WORKSPACE_ID:-}
      TWOBRAIN_EMAIL_LOGIN_DELIVERY_ENABLED: ${TWOBRAIN_EMAIL_LOGIN_DELIVERY_ENABLED:-false}
      TWOBRAIN_EMAIL_LOGIN_FROM_ADDRESS: ${TWOBRAIN_EMAIL_LOGIN_FROM_ADDRESS:-}
      TWOBRAIN_EMAIL_LOGIN_FROM_NAME: ${TWOBRAIN_EMAIL_LOGIN_FROM_NAME:-GRAF}
      TWOBRAIN_POSTAL_API_URL: ${TWOBRAIN_POSTAL_API_URL:-}
      TWOBRAIN_POSTAL_API_KEY_FILE: ${TWOBRAIN_POSTAL_API_KEY_FILE:-/run/secrets/twobrain_postal_api_key}
      TWOBRAIN_POSTAL_HOST_HEADER: ${TWOBRAIN_POSTAL_HOST_HEADER:-postal.2brain.pro}
      TWOBRAIN_POSTAL_REQUEST_TIMEOUT_SECONDS: ${TWOBRAIN_POSTAL_REQUEST_TIMEOUT_SECONDS:-10}
      TWOBRAIN_BILLING_CHECKOUT_ENABLED: ${TWOBRAIN_BILLING_CHECKOUT_ENABLED:-false}
      TWOBRAIN_BILLING_RECEIPT_TAX_SYSTEM_CODE: ${TWOBRAIN_BILLING_RECEIPT_TAX_SYSTEM_CODE:-0}
      TWOBRAIN_BILLING_RECEIPT_VAT_CODE: ${TWOBRAIN_BILLING_RECEIPT_VAT_CODE:-0}
      TWOBRAIN_BILLING_RECEIPT_PAYMENT_SUBJECT: ${TWOBRAIN_BILLING_RECEIPT_PAYMENT_SUBJECT:-service}
      TWOBRAIN_BILLING_RECEIPT_PAYMENT_MODE: ${TWOBRAIN_BILLING_RECEIPT_PAYMENT_MODE:-full_payment}
      TWOBRAIN_BILLING_YOOKASSA_SECRET_FILE: /run/secrets/twobrain_yookassa_secret
      TWOBRAIN_BILLING_YOOKASSA_WEBHOOK_SECRET_FILE: /run/secrets/twobrain_yookassa_webhook_secret
      TWOBRAIN_BILLING_REFERRAL_SECRET_FILE: /run/secrets/twobrain_billing_referral_secret
      TWOBRAIN_SHARE_EXTERNAL_INVITATIONS_ENABLED: ${TWOBRAIN_SHARE_EXTERNAL_INVITATIONS_ENABLED:-false}
      TWOBRAIN_SHARE_IDENTITY_HASH_SECRET_FILE: /run/secrets/graf_share_identity_hash_secret
      TWOBRAIN_YANDEX_CLIENT_ID: ${TWOBRAIN_YANDEX_CLIENT_ID:-twobrain-yandex-client-id}
      TWOBRAIN_YANDEX_CLIENT_SECRET_FILE: /run/secrets/twobrain_yandex_client_secret
      TWOBRAIN_VK_CLIENT_ID: ${TWOBRAIN_VK_CLIENT_ID:-twobrain-vk-client-id}
      TWOBRAIN_VK_CLIENT_SECRET_FILE: /run/secrets/twobrain_vk_client_secret
      TWOBRAIN_SUPPORT_INCIDENT_GITHUB_TOKEN_FILE: /run/secrets/twobrain_support_incident_github_token
      TWOBRAIN_PUBLIC_ANALYTICS_ENABLED: ${TWOBRAIN_PUBLIC_ANALYTICS_ENABLED:-false}
      TWOBRAIN_PUBLIC_ANALYTICS_YANDEX_METRICA_ID: ${TWOBRAIN_PUBLIC_ANALYTICS_YANDEX_METRICA_ID:-}
      TWOBRAIN_PUBLIC_ANALYTICS_VALIDATION_MODE: ${TWOBRAIN_PUBLIC_ANALYTICS_VALIDATION_MODE:-disabled}
      TWOBRAIN_PUBLIC_ANALYTICS_REPLAY_ENABLED: ${TWOBRAIN_PUBLIC_ANALYTICS_REPLAY_ENABLED:-false}
      TWOBRAIN_PUBLIC_ANALYTICS_CONSENT_COPY_VERSION: ${TWOBRAIN_PUBLIC_ANALYTICS_CONSENT_COPY_VERSION:-2026-07-08.1}
      TWOBRAIN_PRODUCT_ANALYTICS_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_VALIDATION_MODE: ${TWOBRAIN_PRODUCT_ANALYTICS_VALIDATION_MODE:-disabled}
      TWOBRAIN_PRODUCT_ANALYTICS_PROVIDER_MODE: ${TWOBRAIN_PRODUCT_ANALYTICS_PROVIDER_MODE:-disabled}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_HOST: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_HOST:-}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_PROJECT_KEY_FILE: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_PROJECT_KEY_FILE:-}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_AUTOCAPTURE_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_AUTOCAPTURE_ENABLED:-true}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_CREDENTIAL_SUPPRESSION_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_CREDENTIAL_SUPPRESSION_ENABLED:-true}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_WEB_DIRECT_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_WEB_DIRECT_ENABLED:-true}
      TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_DESKTOP_DIRECT_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_POSTHOG_DESKTOP_DIRECT_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_ALL_PAGES_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_ALL_PAGES_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_OFFLINE_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_OFFLINE_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_COUNTER_ID: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_COUNTER_ID:-}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_OAUTH_TOKEN_FILE: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_OAUTH_TOKEN_FILE:-}
      TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_INVENTORY_VERSION: ${TWOBRAIN_PRODUCT_ANALYTICS_YANDEX_INVENTORY_VERSION:-096.2026-07-09.1}
      TWOBRAIN_PRODUCT_ANALYTICS_ROLLBACK_MODE: ${TWOBRAIN_PRODUCT_ANALYTICS_ROLLBACK_MODE:-none}
      TWOBRAIN_PRODUCT_ANALYTICS_REPLAY_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_REPLAY_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_RETENTION_MIN_DAYS: ${TWOBRAIN_PRODUCT_ANALYTICS_RETENTION_MIN_DAYS:-90}
      TWOBRAIN_PRODUCT_ANALYTICS_CONSENT_COPY_VERSION: ${TWOBRAIN_PRODUCT_ANALYTICS_CONSENT_COPY_VERSION:-2026-07-09.1}
      TWOBRAIN_PRODUCT_ANALYTICS_DIRECT_DESKTOP_EGRESS_ENABLED: ${TWOBRAIN_PRODUCT_ANALYTICS_DIRECT_DESKTOP_EGRESS_ENABLED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_DIRECT_DESKTOP_EGRESS_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_DIRECT_DESKTOP_EGRESS_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_LEGAL_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_LEGAL_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_PRIVACY_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_PRIVACY_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_SECURITY_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_SECURITY_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_QA_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_QA_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_DISCLOSURE_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_DISCLOSURE_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_DASHBOARD_READY: ${TWOBRAIN_PRODUCT_ANALYTICS_DASHBOARD_READY:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_PROVIDER_SMOKE_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_PROVIDER_SMOKE_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_ROLLBACK_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_ROLLBACK_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_LIVE_PROVIDER_DELIVERY_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_LIVE_PROVIDER_DELIVERY_APPROVED:-false}
      TWOBRAIN_PRODUCT_ANALYTICS_CAMPAIGN_READINESS_APPROVED: ${TWOBRAIN_PRODUCT_ANALYTICS_CAMPAIGN_READINESS_APPROVED:-false}
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
      TWOBRAIN_PLAYBACK_NORMALIZATION_ENABLED: ${TWOBRAIN_PLAYBACK_NORMALIZATION_ENABLED:-true}
      TWOBRAIN_PLAYBACK_NORMALIZATION_AUTOMATIC_DISPATCH_ENABLED: ${TWOBRAIN_PLAYBACK_NORMALIZATION_AUTOMATIC_DISPATCH_ENABLED:-true}
      TWOBRAIN_PROCESSING_ENABLED: "true"
      TWOBRAIN_TEMPORAL_ADDRESS: rec-temporal:7233
      TWOBRAIN_OUTCOME_GENERATION_ENABLED: ${TWOBRAIN_OUTCOME_GENERATION_ENABLED:-false}
      TWOBRAIN_LITELLM_BASE_URL: ${TWOBRAIN_LITELLM_BASE_URL:-}
      TWOBRAIN_LITELLM_API_KEY_FILE: /run/secrets/twobrain_litellm_api_key
      TWOBRAIN_LANGFUSE_BASE_URL: https://cloud.langfuse.com
      TWOBRAIN_LANGFUSE_PUBLIC_KEY_FILE: /run/secrets/twobrain_langfuse_public_key
      TWOBRAIN_LANGFUSE_SECRET_KEY_FILE: /run/secrets/twobrain_langfuse_secret_key
      TWOBRAIN_LANGFUSE_ENVIRONMENT: production
      TWOBRAIN_LANGFUSE_RELEASE: ${TWOBRAIN_LANGFUSE_RELEASE:-}
    secrets:
      - source: twobrain_postgres_app_password
        target: twobrain_postgres_password
      - source: twobrain_minio_api_access_key
        target: twobrain_minio_api_access_key
      - source: twobrain_minio_api_secret_key
        target: twobrain_minio_api_secret_key
      - source: twobrain_smoke_credential
        target: twobrain_smoke_credential
      - source: graf_credential_encryption_key
        target: graf_credential_encryption_key
      - source: graf_share_identity_hash_secret
        target: graf_share_identity_hash_secret
      - source: twobrain_web_csrf_secret
        target: twobrain_web_csrf_secret
      - source: twobrain_postal_api_key
        target: twobrain_postal_api_key
      - source: twobrain_yookassa_secret
        target: twobrain_yookassa_secret
      - source: twobrain_yookassa_webhook_secret
        target: twobrain_yookassa_webhook_secret
      - source: twobrain_billing_referral_secret
        target: twobrain_billing_referral_secret
      - source: twobrain_yandex_client_secret
        target: twobrain_yandex_client_secret
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_vk_client_secret
        target: twobrain_vk_client_secret
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_support_incident_github_token
        target: twobrain_support_incident_github_token
        uid: "100"
        gid: "101"
        mode: 0440
      - source: graf_posthog_project_key
        target: graf_posthog_project_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: graf_yandex_offline_oauth_token
        target: graf_yandex_offline_oauth_token
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_litellm_api_key
        target: twobrain_litellm_api_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_langfuse_public_key
        target: twobrain_langfuse_public_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_langfuse_secret_key
        target: twobrain_langfuse_secret_key
        uid: "100"
        gid: "101"
        mode: 0440
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./runtime/public-downloads:/usr/local/lib/python3.13/site-packages/twobrain_rec_server/public/static/public/downloads:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    depends_on:
      rec-db-runtime-bootstrap:
        condition: service_completed_successfully
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy
      rec-minio-init:
        condition: service_completed_successfully
      rec-temporal:
        condition: service_healthy
    networks:
      - rec-private
      - postal-network

  rec-processing-worker:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    restart: unless-stopped
    user: twobrain
    group_add:
      - "${TWOBRAIN_RUNTIME_SECRET_GID:-1001}"
    env_file:
      - ./env/rec.production.env.example
    environment:
      TWOBRAIN_ENV: production
      TWOBRAIN_WEB_RUNTIME_ENABLED: "false"
      TWOBRAIN_PROCESSING_ENABLED: "true"
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec_app:__POSTGRES_PASSWORD__@rec-postgres:5432/twobrain_rec
      TWOBRAIN_POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_SECRET_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_ACCESS_KEY_FILE: /run/secrets/twobrain_minio_api_access_key
      TWOBRAIN_MINIO_SECRET_KEY_FILE: /run/secrets/twobrain_minio_api_secret_key
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
      TWOBRAIN_TEMPORAL_ADDRESS: rec-temporal:7233
      GRAF_CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/graf_credential_encryption_key
      TWOBRAIN_WEB_LOGIN_WORKSPACE_ID: ${TWOBRAIN_WEB_LOGIN_WORKSPACE_ID:-}
      TWOBRAIN_EMAIL_LOGIN_DELIVERY_ENABLED: ${TWOBRAIN_EMAIL_LOGIN_DELIVERY_ENABLED:-false}
      TWOBRAIN_EMAIL_LOGIN_FROM_ADDRESS: ${TWOBRAIN_EMAIL_LOGIN_FROM_ADDRESS:-}
      TWOBRAIN_EMAIL_LOGIN_FROM_NAME: ${TWOBRAIN_EMAIL_LOGIN_FROM_NAME:-GRAF}
      TWOBRAIN_POSTAL_API_URL: ${TWOBRAIN_POSTAL_API_URL:-}
      TWOBRAIN_POSTAL_API_KEY_FILE: /run/secrets/twobrain_postal_api_key
      TWOBRAIN_POSTAL_HOST_HEADER: ${TWOBRAIN_POSTAL_HOST_HEADER:-postal.2brain.pro}
      TWOBRAIN_POSTAL_REQUEST_TIMEOUT_SECONDS: ${TWOBRAIN_POSTAL_REQUEST_TIMEOUT_SECONDS:-10}
      TWOBRAIN_SHARE_EXTERNAL_INVITATIONS_ENABLED: ${TWOBRAIN_SHARE_EXTERNAL_INVITATIONS_ENABLED:-false}
      TWOBRAIN_SHARE_IDENTITY_HASH_SECRET_FILE: /run/secrets/graf_share_identity_hash_secret
      TWOBRAIN_MEDIASCRIBE_API_KEY_FILE: /run/secrets/twobrain_mediascribe_api_key
      TWOBRAIN_OUTCOME_GENERATION_ENABLED: ${TWOBRAIN_OUTCOME_GENERATION_ENABLED:-false}
      TWOBRAIN_LITELLM_BASE_URL: ${TWOBRAIN_LITELLM_BASE_URL:-}
      TWOBRAIN_LITELLM_API_KEY_FILE: /run/secrets/twobrain_litellm_api_key
      TWOBRAIN_LANGFUSE_BASE_URL: https://cloud.langfuse.com
      TWOBRAIN_LANGFUSE_PUBLIC_KEY_FILE: /run/secrets/twobrain_langfuse_public_key
      TWOBRAIN_LANGFUSE_SECRET_KEY_FILE: /run/secrets/twobrain_langfuse_secret_key
      TWOBRAIN_LANGFUSE_ENVIRONMENT: production
      TWOBRAIN_LANGFUSE_RELEASE: ${TWOBRAIN_LANGFUSE_RELEASE:-}
    secrets:
      - source: twobrain_postgres_app_password
        target: twobrain_postgres_password
      - source: graf_credential_encryption_key
        target: graf_credential_encryption_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: graf_share_identity_hash_secret
        target: graf_share_identity_hash_secret
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_postal_api_key
        target: twobrain_postal_api_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_minio_api_access_key
        target: twobrain_minio_api_access_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_minio_api_secret_key
        target: twobrain_minio_api_secret_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_mediascribe_api_key
        target: twobrain_mediascribe_api_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_litellm_api_key
        target: twobrain_litellm_api_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_langfuse_public_key
        target: twobrain_langfuse_public_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_langfuse_secret_key
        target: twobrain_langfuse_secret_key
        uid: "100"
        gid: "101"
        mode: 0440
    command: ["python", "-m", "twobrain_rec_server.workflows.worker"]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/verify_processing_worker_ready.py"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    depends_on:
      rec-db-runtime-bootstrap:
        condition: service_completed_successfully
      rec-temporal:
        condition: service_healthy
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - rec-private
      - postal-network

  rec-prompt-optimization-worker:
    profiles: ["operations"]
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    restart: "no"
    init: true
    user: twobrain
    group_add:
      - "${TWOBRAIN_RUNTIME_SECRET_GID:-1001}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1770,uid=100,gid=101
    env_file:
      - ./env/rec.production.env.example
    environment:
      TWOBRAIN_ENV: production
      TWOBRAIN_WEB_RUNTIME_ENABLED: "false"
      TWOBRAIN_PROCESSING_ENABLED: "false"
      TWOBRAIN_OUTCOME_GENERATION_ENABLED: "false"
      TWOBRAIN_PROMPT_OPTIMIZATION_ENABLED: ${TWOBRAIN_PROMPT_OPTIMIZATION_ENABLED:-false}
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec_maintenance:__POSTGRES_PASSWORD__@rec-postgres:5432/twobrain_rec
      TWOBRAIN_POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
      TWOBRAIN_PROMPT_OPTIMIZATION_DATABASE_URL: postgresql+asyncpg://twobrain_rec_maintenance:__POSTGRES_PASSWORD__@rec-postgres:5432/twobrain_rec
      TWOBRAIN_PROMPT_OPTIMIZATION_POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_SECRET_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_ACCESS_KEY_FILE: /run/secrets/twobrain_minio_api_access_key
      TWOBRAIN_MINIO_SECRET_KEY_FILE: /run/secrets/twobrain_minio_api_secret_key
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
      TWOBRAIN_TEMPORAL_ADDRESS: rec-temporal:7233
      TWOBRAIN_LITELLM_BASE_URL: ${TWOBRAIN_LITELLM_BASE_URL:-}
      TWOBRAIN_LITELLM_API_KEY_FILE: /run/secrets/twobrain_litellm_api_key
      TWOBRAIN_LANGFUSE_BASE_URL: https://cloud.langfuse.com
      TWOBRAIN_LANGFUSE_PUBLIC_KEY_FILE: /run/secrets/twobrain_langfuse_public_key
      TWOBRAIN_LANGFUSE_SECRET_KEY_FILE: /run/secrets/twobrain_langfuse_secret_key
      TWOBRAIN_LANGFUSE_ENVIRONMENT: production
      TWOBRAIN_LANGFUSE_RELEASE: ${TWOBRAIN_LANGFUSE_RELEASE:-}
    secrets:
      - source: twobrain_postgres_maintenance_password
        target: twobrain_postgres_password
      - source: twobrain_minio_api_access_key
        target: twobrain_minio_api_access_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_minio_api_secret_key
        target: twobrain_minio_api_secret_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_litellm_api_key
        target: twobrain_litellm_api_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_langfuse_public_key
        target: twobrain_langfuse_public_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_langfuse_secret_key
        target: twobrain_langfuse_secret_key
        uid: "100"
        gid: "101"
        mode: 0440
    command: ["python", "-m", "twobrain_rec_server.workflows.prompt_optimization_worker"]
    depends_on:
      rec-db-runtime-bootstrap:
        condition: service_completed_successfully
      rec-temporal:
        condition: service_healthy
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy
      rec-minio-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - rec-private

  rec-media-worker:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
      target: media-runtime
    restart: unless-stopped
    init: true
    user: twobrain
    group_add:
      - "${TWOBRAIN_RUNTIME_SECRET_GID:-1001}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: "1.0"
    mem_limit: 1g
    env_file:
      - ./env/rec.production.env.example
    environment:
      TWOBRAIN_ENV: production
      TWOBRAIN_WEB_RUNTIME_ENABLED: "false"
      TWOBRAIN_PLAYBACK_NORMALIZATION_ENABLED: "true"
      TWOBRAIN_PLAYBACK_NORMALIZATION_AUTOMATIC_DISPATCH_ENABLED: ${TWOBRAIN_PLAYBACK_NORMALIZATION_AUTOMATIC_DISPATCH_ENABLED:-true}
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec_media:__POSTGRES_PASSWORD__@rec-postgres:5432/twobrain_rec
      TWOBRAIN_POSTGRES_PASSWORD_FILE: /run/secrets/twobrain_postgres_password
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_SECRET_KEY: __DOCKER_SECRET_FILE__
      TWOBRAIN_MINIO_ACCESS_KEY_FILE: /run/secrets/twobrain_minio_media_access_key
      TWOBRAIN_MINIO_SECRET_KEY_FILE: /run/secrets/twobrain_minio_media_secret_key
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
      TWOBRAIN_TEMPORAL_ADDRESS: rec-temporal:7233
      TWOBRAIN_PLAYBACK_NORMALIZATION_TASK_QUEUE: twobrain-rec-playback-normalization
      TWOBRAIN_PLAYBACK_NORMALIZATION_WORKER_CONCURRENCY: "1"
      TWOBRAIN_PLAYBACK_NORMALIZATION_WORK_DIRECTORY: /var/lib/twobrain-rec/playback-normalization
      TMPDIR: /var/lib/twobrain-rec/playback-normalization
    secrets:
      - source: twobrain_postgres_media_password
        target: twobrain_postgres_password
      - source: twobrain_minio_media_access_key
        target: twobrain_minio_media_access_key
      - source: twobrain_minio_media_secret_key
        target: twobrain_minio_media_secret_key
    command: ["python", "-m", "twobrain_rec_server.normalization.worker"]
    healthcheck:
      test: ["CMD", "python", "/app/scripts/verify_playback_normalization_worker_ready.py"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    volumes:
      - rec-media-work:/var/lib/twobrain-rec/playback-normalization
    depends_on:
      rec-db-runtime-bootstrap:
        condition: service_completed_successfully
      rec-temporal:
        condition: service_healthy
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 128
    networks:
      - rec-media-private

  rec-temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    user: root
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: rec-postgres
      POSTGRES_USER: twobrain_rec
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
    secrets:
      - source: twobrain_postgres_password
        target: twobrain_postgres_password
    entrypoint:
      - /bin/bash
      - -c
      - |
        export POSTGRES_PWD="$$(cat /run/secrets/twobrain_postgres_password)"
        exec /etc/temporal/entrypoint.sh autosetup
    depends_on:
      rec-postgres:
        condition: service_healthy
    expose:
      - "7233"
    healthcheck:
      test:
        - CMD-SHELL
        - temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - rec-private
      - rec-media-private

  rec-migrate:
