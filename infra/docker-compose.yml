      TWOBRAIN_LITELLM_API_KEY_FILE: /run/secrets/twobrain_litellm_api_key
      TWOBRAIN_LANGFUSE_BASE_URL: https://cloud.langfuse.com
      TWOBRAIN_LANGFUSE_PUBLIC_KEY_FILE: /run/secrets/twobrain_langfuse_public_key
      TWOBRAIN_LANGFUSE_SECRET_KEY_FILE: /run/secrets/twobrain_langfuse_secret_key
      TWOBRAIN_LANGFUSE_ENVIRONMENT: production
      TWOBRAIN_LANGFUSE_RELEASE: ${TWOBRAIN_LANGFUSE_RELEASE:-}
    secrets:
      - source: twobrain_postgres_maintenance_password
        target: twobrain_postgres_password
      - source: twobrain_minio_api_access_key
        target: twobrain_minio_api_access_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_minio_api_secret_key
        target: twobrain_minio_api_secret_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_litellm_api_key
        target: twobrain_litellm_api_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_langfuse_public_key
        target: twobrain_langfuse_public_key
        uid: "100"
        gid: "101"
        mode: 0440
      - source: twobrain_langfuse_secret_key
        target: twobrain_langfuse_secret_key
        uid: "100"
        gid: "101"
        mode: 0440
    command: ["python", "-m", "twobrain_rec_server.workflows.maintenance_worker"]
    depends_on:
      rec-db-runtime-bootstrap:
        condition: service_completed_successfully
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy
      rec-temporal:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - rec-private

  rec-reprocess-maintenance:
    profiles: ["operations"]
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    restart: "no"
    init: true
    user: twobrain
    group_add:
      - "${TWOBRAIN_RUNTIME_SECRET_GID:-1001}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1770,uid=100,gid=101
    env_file:
