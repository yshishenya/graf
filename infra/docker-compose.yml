services:
  rec-api:
    build:
      context: ..
      dockerfile: infra/server/Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/server/.env.example
    environment:
      TWOBRAIN_ENV: production
      TWOBRAIN_DATABASE_URL: postgresql+asyncpg://twobrain_rec:${TWOBRAIN_POSTGRES_PASSWORD:?set in deployment environment}@rec-postgres:5432/twobrain_rec
      TWOBRAIN_MINIO_ENDPOINT: rec-minio:9000
      TWOBRAIN_MINIO_ACCESS_KEY: ${TWOBRAIN_MINIO_API_ACCESS_KEY:?set in deployment environment}
      TWOBRAIN_MINIO_SECRET_KEY: ${TWOBRAIN_MINIO_API_SECRET_KEY:?set in deployment environment}
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
      TWOBRAIN_MINIO_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    depends_on:
      rec-postgres:
        condition: service_healthy
      rec-minio:
        condition: service_healthy
      rec-minio-init:
        condition: service_completed_successfully
    networks:
      - rec-private

  rec-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: twobrain_rec
      POSTGRES_USER: twobrain_rec
      POSTGRES_PASSWORD: ${TWOBRAIN_POSTGRES_PASSWORD:?set in deployment environment}
    volumes:
      - rec-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twobrain_rec -d twobrain_rec"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - rec-private

  rec-minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TWOBRAIN_MINIO_ROOT_USER:?set in deployment environment}
      MINIO_ROOT_PASSWORD: ${TWOBRAIN_MINIO_ROOT_PASSWORD:?set in deployment environment}
    volumes:
      - rec-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - rec-private

  rec-minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      rec-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${TWOBRAIN_MINIO_ROOT_USER:?set in deployment environment}
      MINIO_ROOT_PASSWORD: ${TWOBRAIN_MINIO_ROOT_PASSWORD:?set in deployment environment}
      TWOBRAIN_MINIO_API_ACCESS_KEY: ${TWOBRAIN_MINIO_API_ACCESS_KEY:?set in deployment environment}
      TWOBRAIN_MINIO_API_SECRET_KEY: ${TWOBRAIN_MINIO_API_SECRET_KEY:?set in deployment environment}
      TWOBRAIN_MINIO_BUCKET: twobrain-rec-ingest
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set rec http://rec-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "rec/$$TWOBRAIN_MINIO_BUCKET"
        mc admin user add rec "$$TWOBRAIN_MINIO_API_ACCESS_KEY" "$$TWOBRAIN_MINIO_API_SECRET_KEY" || true
        cat >/tmp/rec-api-policy.json <<'JSON'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::twobrain-rec-ingest"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::twobrain-rec-ingest/*"]}]}
        JSON
        mc admin policy create rec twobrain-rec-api /tmp/rec-api-policy.json || true
        mc admin policy attach rec twobrain-rec-api --user "$$TWOBRAIN_MINIO_API_ACCESS_KEY"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - rec-private

networks:
  rec-private:
    name: twobrain-rec-private

volumes:
  rec-postgres-data:
    name: twobrain-rec-postgres-data
  rec-minio-data:
    name: twobrain-rec-minio-data
