server {
    listen 80;
    listen [::]:80;
    server_name rec.2brain.pro;

    access_log /var/log/nginx/rec.2brain.pro.access.log;
    error_log /var/log/nginx/rec.2brain.pro.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:10444 ssl http2;
    listen [::1]:10444 ssl http2;
    server_name rec.2brain.pro;

    access_log /var/log/nginx/rec.2brain.pro.access.log;
    error_log /var/log/nginx/rec.2brain.pro.error.log;

    ssl_certificate /etc/letsencrypt/live/rec.2brain.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rec.2brain.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 6g;

    location = /api/v1/billing/webhook {
        return 404;
    }

    location ~ ^/api/v1/billing/providers/yookassa/webhook/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Billing-Webhook-Secret "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# YooKassa supports HTTPS callbacks on 8443. A dedicated listener preserves
# the real source address without changing the shared SNI router on 443.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name rec.2brain.pro;

    access_log /var/log/nginx/rec.2brain.pro.webhook.access.log;
    error_log /var/log/nginx/rec.2brain.pro.webhook.error.log;

    ssl_certificate /etc/letsencrypt/live/rec.2brain.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rec.2brain.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # One explicitly selected shop is served at a time. Keep route names
    # bounded here; the application validates the configured environment.
    location ~ ^/api/v1/billing/providers/yookassa/webhook/(test|production)$ {
        if ($request_method != POST) { return 405; }

        allow 185.71.76.0/27;
        allow 185.71.77.0/27;
        allow 77.75.153.0/25;
        allow 77.75.156.11/32;
        allow 77.75.156.35/32;
        allow 77.75.154.128/25;
        allow 2a02:5180::/32;
        deny all;

        client_max_body_size 256k;
        limit_req zone=graf_billing_webhook burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        include /etc/nginx/snippets/graf-billing-webhook-secret.conf;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / { return 404; }
}
