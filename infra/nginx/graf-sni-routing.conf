# Include inside the existing stream context. Preserve its old map/upstreams,
# public bind and access_log. The public server uses $graf_sni_target and
# proxy_protocol on. Apply only with F273 staged drain/rollback gates.
map $ssl_preread_server_name $graf_sni_target {
    rec.2brain.pro 127.0.0.1:10446;
    default 127.0.0.1:10447;
}

server {
    listen 127.0.0.1:10447 proxy_protocol;
    listen [::1]:10447 proxy_protocol;
    access_log off;
    error_log /dev/null;
    ssl_preread on;
    proxy_protocol off;
    proxy_pass $kvn_443_backend;
}
