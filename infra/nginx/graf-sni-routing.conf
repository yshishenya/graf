# Include inside the existing stream context. Keep its two existing upstreams,
# public listen and access_log unchanged. The public server uses:
#   proxy_pass $graf_sni_target;
#   proxy_protocol on;
# Apply only with the staged receivers/drain/rollback in F273 plan/scenario8.
map $ssl_preread_server_name $graf_sni_target {
    rec.2brain.pro 127.0.0.1:10445;
    www.amazon.com 127.0.0.1:10447;
    default 127.0.0.1:10446;
}

server {
    listen 127.0.0.1:10446 proxy_protocol;
    listen [::1]:10446 proxy_protocol;
    access_log off;
    error_log /dev/null crit;
    proxy_protocol off;
    proxy_pass kvn_https_nginx;
}

server {
    listen 127.0.0.1:10447 proxy_protocol;
    listen [::1]:10447 proxy_protocol;
    access_log off;
    error_log /dev/null crit;
    proxy_protocol off;
    proxy_pass kvn_xray_reality;
}
