[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "twobrain-rec-server"
version = "0.1.0"
description = "2brain Rec backend ingest foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=42,<50",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6,<4",
    "minio>=7.2,<8",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "temporalio>=1.10,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-xdist>=3.8,<4",
    "ruff==0.15.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twobrain_rec_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "strict_rls: PostgreSQL RLS proof that must run in the serialized advisory-lock lane",
]

[tool.ruff]
line-length = 100
# Ruff <1 does not recognize py313 yet; keep lint parsing stable until the toolchain catches up.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
