[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "twobrain-rec-server"
version = "0.1.0"
description = "2brain Rec backend ingest foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "minio>=7.2,<8",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25.0,<26",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.22,<1",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff==0.15.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twobrain_rec_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Ruff <1 does not recognize py313 yet; keep lint parsing stable until the toolchain catches up.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
