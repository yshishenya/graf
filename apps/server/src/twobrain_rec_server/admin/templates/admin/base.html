<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} · 2brain Rec</title>
    <link rel="stylesheet" href="/static/cabinet/cabinet.css">
    <link rel="stylesheet" href="{{ admin_static_url }}/admin.css">
  </head>
  <body data-surface-mode="standalone_browser">
    <div class="app-shell admin-app-shell">
      <aside class="sidebar admin-sidebar">
        <div class="brand">
          <div class="brand-mark">2</div>
          <div>
            <div class="workspace-title">2brain Rec</div>
            <div class="workspace-subtitle">Админка</div>
          </div>
        </div>
        {% if view is defined and view.navigation is defined %}
          <nav class="nav admin-nav" aria-label="Админ-навигация">
            {% for item in view.navigation.items %}
              <a class="admin-nav__link{% if item.id == view.navigation.active %} active is-active{% endif %}" href="{{ item.href }}">{{ item.label }}</a>
            {% endfor %}
          </nav>
        {% endif %}
      </aside>
      <main class="main admin-main">
        <header class="topline admin-header">
          <div class="page-title">
            <p class="admin-kicker">2brain Rec</p>
            <h1>{% block title %}{{ page_title }}{% endblock %}</h1>
            {% block subtitle %}{% endblock %}
          </div>
          <div class="admin-header-brand" aria-label="GRAF">GRAF</div>
        </header>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
