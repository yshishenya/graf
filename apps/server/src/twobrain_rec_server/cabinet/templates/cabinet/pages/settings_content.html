<main id="cabinet-main" class="cabinet-main" tabindex="-1">
  <div class="cabinet-workspace settings-page">
    <div class="settings-page__content">
    <header class="cabinet-topbar settings-page__topbar">
      <div class="page-title">
        <h1>Настройки</h1>
        <p class="muted">Все разделы в одном месте.</p>
      </div>
    </header>
    <section class="settings-overview" aria-labelledby="settings-overview-title">
      <h2 id="settings-overview-title" class="sr-only">Разделы настроек</h2>
      {% for item in settings_navigation %}
      <a class="settings-overview-card" href="{{ item.href }}" data-settings-category="{{ item.id }}">
        <span class="settings-scope-badge">{{ item.scope_label }}</span>
        <h3>{{ item.label }}</h3>
        <p class="muted">{{ item.description }}</p>
        <span class="settings-overview-card__link">Открыть раздел <span aria-hidden="true">→</span></span>
      </a>
      {% endfor %}
    </section>
    </div>
  </div>
</main>
