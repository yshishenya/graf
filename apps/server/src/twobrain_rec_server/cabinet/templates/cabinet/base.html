<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  {% if csrf_token is defined and csrf_token %}
  <meta name="csrf-token" content="{{ csrf_token }}">
  {% endif %}
  <title>{{ title }} - 2brain Rec</title>
  <link rel="stylesheet" href="{{ cabinet_static_url }}/cabinet.css">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false}'>
  <script src="{{ cabinet_static_url }}/htmx-2.0.10.min.js" defer></script>
  <script src="{{ cabinet_static_url }}/cabinet.js" defer></script>
</head>
<body data-surface-mode="{{ surface_mode|default('standalone_browser') }}">
  {{ content }}
</body>
</html>
