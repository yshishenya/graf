{% import "cabinet/components/sections.html" as sections %}

{% macro navigation(embedded=False, active='profile', csrf_token=None) -%}
<div class="account-navigation" role="group" aria-label="Разделы аккаунта">
  <a href="{{ '/desktop/account/profile' if embedded else '/account/profile' }}"{% if active == 'profile' %} class="is-selected"{% endif %}>Профиль</a>
  <a href="{{ '/desktop/account/security' if embedded else '/account/security' }}"{% if active == 'security' %} class="is-selected"{% endif %}>Безопасность</a>
  <a href="{{ '/desktop/account/notifications' if embedded else '/account/notifications' }}"{% if active == 'notifications' %} class="is-selected"{% endif %}>Уведомления</a>
  <a href="/billing">Тариф и оплата</a>
  <a href="/referrals">Пригласить друзей</a>
  <a href="{{ '/desktop/account/fair-use' if embedded else '/account/fair-use' }}"{% if active == 'fair-use' %} class="is-selected"{% endif %}>Проверка добросовестного использования</a>
  <span class="account-navigation__divider" aria-hidden="true"></span>
  <form class="account-navigation__logout" method="post" action="{{ '/desktop/meetings' if embedded else '/logout' }}">
    {{ sections.csrf_field(csrf_token) }}
    <input type="hidden" name="next" value="{{ '/login?next=/desktop/meetings' if embedded else '/login?next=/meetings' }}">
    <button type="submit">Выйти</button>
  </form>
</div>
{%- endmacro %}
