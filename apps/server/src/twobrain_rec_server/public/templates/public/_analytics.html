{% if not suppress_analytics_footer|default(false) %}
  <footer class="legal-footer" aria-label="Юридическая информация">
    <a href="/privacy">Конфиденциальность</a>
    <a href="/cookies">Cookies</a>
    <a href="/terms">Условия</a>
    <a href="/offer">Оплата и возврат</a>
    <a href="/analytics-consent">Об аналитике</a>
    {% if public_analytics.get('consent_ui_enabled', false) %}
      <button class="cookie-settings-link" type="button" data-cc="show-preferencesModal">
        Настройки cookies
      </button>
    {% endif %}
  </footer>
{% endif %}

{% if public_analytics.get('consent_ui_enabled', false) %}
  <link rel="stylesheet" href="{{ public_static_asset_url('cookieconsent.css') }}">
  <script
    defer
    src="{{ public_static_asset_url('cookieconsent.umd.js') }}"
    data-graf-cookieconsent-version="{{ public_analytics.cookieconsent_version }}"
  ></script>
  <script id="graf-public-analytics-config" type="application/json">
    {{ public_analytics | tojson }}
  </script>
  <script defer src="{{ public_static_asset_url('analytics.js') }}"></script>
{% endif %}
