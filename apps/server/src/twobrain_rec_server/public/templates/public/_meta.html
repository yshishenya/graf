<link rel="canonical" href="{{ canonical_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ social_title }}">
<meta property="og:description" content="{{ social_description }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="ГРАФ">
<meta name="twitter:card" content="{{ 'summary_large_image' if social_image_filename is defined else 'summary' }}">
<meta name="twitter:title" content="{{ social_title }}">
<meta name="twitter:description" content="{{ social_description }}">
{%- if social_image_filename is defined %}
{% set social_image_url = (canonical_url.split('/')[:3] | join('/')) ~ public_static_asset_url(social_image_filename) %}
<meta property="og:image" content="{{ social_image_url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ social_image_alt }}">
<meta name="twitter:image" content="{{ social_image_url }}">
<meta name="twitter:image:alt" content="{{ social_image_alt }}">
{% endif %}
