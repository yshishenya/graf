openapi: 3.1.0
info:
  title: 2brain Rec Server Ingest API
  version: 0.1.0
  description: Backend ingest foundation for finalized local recording artifacts. 012 is server-mediated only and does not start Temporal workflows or MediaScribe jobs.
servers:
  - url: https://rec.2brain.dev
    description: Future production deployment
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /api/v1/health/live:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health/ready:
    get:
      summary: Ingest readiness check
      description: Checks API configuration, Postgres, MinIO, and ingest limits. It must not require Temporal or MediaScribe in 012.
      security: []
      responses:
        "200":
          description: Ingest dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Ingest dependency is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/meetings:
    post:
      summary: Create or resolve an ingest meeting
      operationId: createMeeting
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingRequest"
      responses:
        "201":
          description: Meeting created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingResponse"
        "200":
          description: Existing idempotent meeting returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/meetings/{meeting_id}/upload-sessions:
    post:
      summary: Create a server-mediated upload session
      operationId: createUploadSession
      parameters:
        - $ref: "#/components/parameters/MeetingId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "200":
          description: Existing idempotent session returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/upload-sessions/{session_id}:
    get:
      summary: Get upload session status
      operationId: getUploadSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Current session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/upload-sessions/{session_id}/tracks/{track_role}/parts/{part_number}:
    put:
      summary: Upload one server-mediated track part
      operationId: putUploadPart
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TrackRole"
        - $ref: "#/components/parameters/PartNumber"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - name: X-Byte-Offset
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
        - name: X-Content-SHA256
          in: header
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{64}$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Idempotent matching part already accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartResponse"
        "201":
          description: Part accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/v1/upload-sessions/{session_id}/missing-ranges:
    get:
      summary: Return missing upload ranges for resumable clients
      operationId: getMissingRanges
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Missing ranges by track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingRangesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/upload-sessions/{session_id}/finalize:
    post:
      summary: Finalize a complete upload session
      operationId: finalizeUploadSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeUploadRequest"
      responses:
        "200":
          description: Session finalized or idempotently returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/v1/upload-sessions/{session_id}/abort:
    post:
      summary: Abort an upload session
      operationId: abortUploadSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbortUploadRequest"
      responses:
        "200":
          description: Session aborted or already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: provider-neutral-token
  parameters:
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    MeetingId:
      name: meeting_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackRole:
      name: track_role
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TrackRole"
    PartNumber:
      name: part_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request or failed validation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated identity is not authorized for workspace/device/session
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found or not visible to caller
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Idempotency or checksum conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Configured duration, track, or package limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready]
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            postgres: ok
            minio: ok
            config: ok
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - checksum_conflict
            - idempotency_conflict
            - upload_session_terminal
            - recording_duration_limit_exceeded
            - track_size_limit_exceeded
            - package_size_limit_exceeded
            - manifest_validation_failed
            - dependency_unavailable
        detail:
          type: string
        trace_id:
          type: string
    TrackRole:
      type: string
      enum: [microphone, system, manifest]
    UploadStrategy:
      type: string
      enum: [server_mediated]
    MeetingStatus:
      type: string
      enum: [draft, uploading, ingested_pending_processing, degraded, failed, aborted, expired]
    ProcessingStatus:
      type: string
      enum: [not_submitted, pending_processing]
    UploadSessionStatus:
      type: string
      enum: [pending, uploading, retrying, finalizing, finalized, degraded, failed, aborted, expired]
    TrackDescriptor:
      type: object
      required: [track_role, codec, sample_rate_hz, channel_count, duration_seconds, byte_length, sha256]
      properties:
        track_role:
          $ref: "#/components/schemas/TrackRole"
        codec:
          type: string
          example: pcm_s16le
        sample_rate_hz:
          type: integer
          minimum: 8000
        channel_count:
          type: integer
          minimum: 1
          maximum: 2
        duration_seconds:
          type: number
          minimum: 0
        byte_length:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    CreateMeetingRequest:
      type: object
      required: [local_recording_id, started_at, ended_at, duration_seconds]
      properties:
        local_recording_id:
          type: string
          minLength: 8
          maxLength: 128
        title:
          type: string
          maxLength: 240
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_seconds:
          type: number
          minimum: 0
    MeetingResponse:
      type: object
      required: [meeting_id, workspace_id, local_recording_id, status, processing_status]
      properties:
        meeting_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        local_recording_id:
          type: string
        status:
          $ref: "#/components/schemas/MeetingStatus"
        processing_status:
          $ref: "#/components/schemas/ProcessingStatus"
    CreateUploadSessionRequest:
      type: object
      required: [upload_strategy, tracks]
      properties:
        upload_strategy:
          $ref: "#/components/schemas/UploadStrategy"
        tracks:
          type: array
          minItems: 3
          items:
            $ref: "#/components/schemas/TrackDescriptor"
        manifest_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    UploadSessionResponse:
      type: object
      required: [session_id, meeting_id, status, upload_strategy, expires_at, accepted_bytes_by_track, processing_status]
      properties:
        session_id:
          type: string
          format: uuid
        meeting_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UploadSessionStatus"
        upload_strategy:
          $ref: "#/components/schemas/UploadStrategy"
        expires_at:
          type: string
          format: date-time
        accepted_bytes_by_track:
          type: object
          additionalProperties:
            type: integer
        processing_status:
          $ref: "#/components/schemas/ProcessingStatus"
        workflow_id:
          type: "null"
          description: Always null in 012.
        mediascribe_job_id:
          type: "null"
          description: Always null in 012.
    UploadPartResponse:
      type: object
      required: [session_id, track_role, part_number, byte_offset, byte_length, sha256, status]
      properties:
        session_id:
          type: string
          format: uuid
        track_role:
          $ref: "#/components/schemas/TrackRole"
        part_number:
          type: integer
        byte_offset:
          type: integer
        byte_length:
          type: integer
        sha256:
          type: string
        status:
          type: string
          enum: [accepted]
    MissingRangesResponse:
      type: object
      required: [session_id, ranges_by_track]
      properties:
        session_id:
          type: string
          format: uuid
        ranges_by_track:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [start, end]
              properties:
                start:
                  type: integer
                  minimum: 0
                end:
                  type: integer
                  minimum: 0
    FinalizeUploadRequest:
      type: object
      required: [manifest_sha256, tracks]
      properties:
        manifest_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackDescriptor"
    FinalizeUploadResponse:
      type: object
      required: [meeting, upload_session, object_count]
      properties:
        meeting:
          $ref: "#/components/schemas/MeetingResponse"
        upload_session:
          $ref: "#/components/schemas/UploadSessionResponse"
        object_count:
          type: integer
          minimum: 0
        workflow_started:
          type: boolean
          const: false
        mediascribe_job_created:
          type: boolean
          const: false
    AbortUploadRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 240
