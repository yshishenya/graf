components:
  schemas:
    AbortUploadRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 240
            pattern: ^[^\x00-\x1f\x7f]+$
          - type: 'null'
          title: Reason
      type: object
      title: AbortUploadRequest
    AuthCallbackResponse:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
        active_session_id:
          type: string
          format: uuid
          title: Active Session Id
        session_token:
          type: string
          title: Session Token
        session_expires_at:
          type: string
          format: date-time
          title: Session Expires At
        provider:
          type: string
          title: Provider
        provider_subject:
          type: string
          title: Provider Subject
        external_identity_id:
          type: string
          format: uuid
          title: External Identity Id
      type: object
      required:
      - user_id
      - workspace_id
      - active_session_id
      - session_token
      - session_expires_at
      - provider
      - provider_subject
      - external_identity_id
      title: AuthCallbackResponse
    AuthDeviceRegisterRequest:
      properties:
        device_public_id:
          type: string
          maxLength: 160
          minLength: 1
          title: Device Public Id
        platform:
          type: string
          maxLength: 32
          minLength: 1
          title: Platform
          default: macos
        client_version:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Client Version
      type: object
      required:
      - device_public_id
      title: AuthDeviceRegisterRequest
    AuthDeviceRevokeResponse:
      properties:
        device_id:
          type: string
          format: uuid
          title: Device Id
        status:
          type: string
          title: Status
        revoked_at:
          type: string
          format: date-time
          title: Revoked At
      type: object
      required:
      - device_id
      - status
      - revoked_at
      title: AuthDeviceRevokeResponse
    AuthDeviceStateResponse:
      properties:
        device_id:
          type: string
          format: uuid
          title: Device Id
        status:
          type: string
          title: Status
        registration_state:
          type: string
          title: Registration State
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - device_id
      - status
      - registration_state
      - created_at
      title: AuthDeviceStateResponse
    AuthLinkRequest:
      properties:
        candidate_provider:
          type: string
          minLength: 1
          title: Candidate Provider
        candidate_provider_subject:
          type: string
          maxLength: 240
          minLength: 1
          title: Candidate Provider Subject
        candidate_display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Candidate Display Name
        candidate_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Candidate Email
        candidate_phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Candidate Phone
        expected_workspace_id:
          type: string
          format: uuid
          title: Expected Workspace Id
      type: object
      required:
      - candidate_provider
      - candidate_provider_subject
      - expected_workspace_id
      title: AuthLinkRequest
    AuthLinkResponse:
      properties:
        status:
          type: string
          title: Status
        user_id:
          type: string
          format: uuid
          title: User Id
        provider:
          type: string
          title: Provider
        linked_identity_id:
          type: string
          format: uuid
          title: Linked Identity Id
        message:
          type: string
          title: Message
      type: object
      required:
      - status
      - user_id
      - provider
      - linked_identity_id
      - message
      title: AuthLinkResponse
    AuthPolicyUpdateRequest:
      properties:
        allow_yandex:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Yandex
        allow_vk:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Vk
        allow_telegram:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Telegram
        allow_tid:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Tid
        allow_sber_id:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Sber Id
        allow_mts_id:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Mts Id
        allow_esia:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Esia
        allow_provider_self_enrollment:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allow Provider Self Enrollment
        require_ru_local:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Require Ru Local
        residency_region_tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Residency Region Tag
        consent_text_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Consent Text Version
      type: object
      title: AuthPolicyUpdateRequest
    AuthProvidersResponse:
      properties:
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
        providers:
          items:
            $ref: '#/components/schemas/_ProviderEntry'
          type: array
          title: Providers
        residency:
          $ref: '#/components/schemas/_ResidencyState'
        enrollment:
          $ref: '#/components/schemas/_EnrollmentState'
        consent_version:
          type: string
          title: Consent Version
        consent:
          $ref: '#/components/schemas/_ConsentCopy'
      type: object
      required:
      - workspace_id
      - providers
      - residency
      - enrollment
      - consent_version
