components:
  schemas:
    AbortUploadRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 240
            pattern: ^[^\x00-\x1f\x7f]+$
          - type: 'null'
          title: Reason
      type: object
      title: AbortUploadRequest
    CreateMeetingRequest:
      properties:
        local_recording_id:
          type: string
          maxLength: 240
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]+$
          title: Local Recording Id
        title:
          anyOf:
          - type: string
            maxLength: 500
            pattern: ^[^\x00-\x1f\x7f]+$
          - type: 'null'
          title: Title
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
        duration_seconds:
          type: integer
          exclusiveMinimum: 0.0
          title: Duration Seconds
      type: object
      required:
      - local_recording_id
      - duration_seconds
      title: CreateMeetingRequest
    CreateUploadSessionRequest:
      properties:
        expected_tracks:
          items:
            $ref: '#/components/schemas/TrackRole'
          type: array
          title: Expected Tracks
        expected_track_sizes:
          additionalProperties:
            type: integer
          propertyNames:
            $ref: '#/components/schemas/TrackRole'
          type: object
          title: Expected Track Sizes
        manifest_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          title: Manifest Sha256
      type: object
      title: CreateUploadSessionRequest
    FinalizeUploadRequest:
      properties:
        manifest_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Manifest Sha256
        tracks:
          items:
            $ref: '#/components/schemas/TrackDescriptor'
          type: array
          minItems: 3
          title: Tracks
      type: object
      required:
      - manifest_sha256
      - tracks
      title: FinalizeUploadRequest
    FinalizeUploadResponse:
      properties:
        meeting:
          $ref: '#/components/schemas/MeetingResponse'
        upload_session:
          $ref: '#/components/schemas/UploadSessionResponse'
        object_count:
          type: integer
          minimum: 0.0
          title: Object Count
        workflow_started:
          type: boolean
          title: Workflow Started
          default: false
        mediascribe_job_created:
          type: boolean
          title: Mediascribe Job Created
          default: false
      type: object
      required:
      - meeting
      - upload_session
      - object_count
      title: FinalizeUploadResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          default: ok
      type: object
      title: HealthResponse
    MeetingResponse:
      properties:
        meeting_id:
          type: string
          format: uuid
          title: Meeting Id
        workspace_id:
          type: string
          format: uuid
          title: Workspace Id
        local_recording_id:
          type: string
          title: Local Recording Id
        status:
          $ref: '#/components/schemas/MeetingStatus'
        processing_status:
          $ref: '#/components/schemas/ProcessingStatus'
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
      type: object
      required:
      - meeting_id
      - workspace_id
      - local_recording_id
      - status
      - processing_status
      title: MeetingResponse
    MeetingStatus:
      type: string
      enum:
      - draft
      - uploading
      - ingested_pending_processing
      - degraded
      - failed
