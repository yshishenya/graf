          title: X-Workspace-Id
      - name: X-Device-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Device-Id
      - name: X-Client-Version
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Client-Version
      responses:
        '200':
          description: Complete canonical review M4A.
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
          headers:
            Accept-Ranges:
              description: Supported byte range unit. Always `bytes`.
              schema:
                type: string
            Content-Disposition:
              description: Safe inline playback filename.
              schema:
                type: string
            Content-Length:
              description: Number of bytes in this response body.
              schema:
                type: integer
        '206':
          description: Requested byte range from the canonical review M4A.
          content:
            audio/mp4:
              schema:
                type: string
                format: binary
          headers:
            Accept-Ranges:
              description: Supported byte range unit. Always `bytes`.
