<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Эталон карточки уведомления GRAF</title>
<style>
  /* Независимая вёрстка GRAF по наблюдаемым параметрам эталона:
     448 точек окно, 420 карточка, скругление 16, поля 10/10/10/12,
     тень 0 1px 8px, кнопка высотой 40 со скруглением 10. */
  :root {
    --surface: rgba(254, 254, 254, .97);
    --border: #d2d3d4;
    --text-primary: #242729;
    --text-secondary: #6c6e70;
    --accent: #614efa;
    --shadow: 0 1px 8px rgba(27,30,33,.16), 0 1px 8px rgba(27,30,33,.06);
    --font: -apple-system, "SF Pro Text", Inter, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: rgba(28, 31, 32, .92);
      --border: #474a4c;
      --text-primary: #fefefe;
      --text-secondary: #bec0c2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    width: 448px;
    background: transparent;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 420px;
    margin: 10px 0 12px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  .icon { width: 24px; height: 24px; color: var(--accent); flex: none; }
  .text { min-width: 0; flex: 1; }
  .title {
    font-size: 14px; line-height: 20px; font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .message {
    font-size: 14px; line-height: 20px; font-weight: 400;
    color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .actions { display: flex; gap: 8px; flex: none; }
  .btn {
    min-height: 40px; padding: 9px 15px; border-radius: 10px;
    font-size: 13px; font-weight: 600; font-family: var(--font);
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-primary); white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .close {
    position: absolute; top: 12px; right: 14px;
    width: 20px; height: 20px; border-radius: 10px;
    border: none; background: var(--surface); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1;
  }
  .indicator {
    width: 232px; margin: 6px 0 6px 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow);
    padding: 8px 10px 8px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: #e63936; flex: none; }
  .dot.transcribing { background: #008065; }
  .indicator .title { flex: 1; font-size: 13px; }
  .indicator .elapsed { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .indicator .btn { min-height: 28px; padding: 3px 9px; font-size: 12px; border-radius: 6px; }
  .stack { display: flex; flex-direction: column; gap: 0; }
</style>
</head>
<body>
  <div class="stack">
    <div class="card">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="5" width="18" height="16" rx="3"/>
        <path d="M3 10h18M8 3v4M16 3v4"/>
      </svg>
      <div class="text">
        <div class="title">Встреча команды</div>
        <div class="message">Начало в 10:00</div>
      </div>
      <div class="actions">
        <button class="btn">Подключиться</button>
        <button class="btn primary">Подключиться и начать запись</button>
      </div>
      <button class="close">✕</button>
    </div>

    <div class="indicator">
      <span class="dot"></span>
      <span class="title">Идёт запись</span>
      <span class="elapsed">0:42</span>
      <button class="btn primary">Остановить</button>
    </div>

    <div class="indicator">
      <span class="dot transcribing"></span>
      <span class="title">Идёт расшифровка</span>
      <span class="elapsed">12:07</span>
      <button class="btn primary">Остановить</button>
    </div>
  </div>
</body>
</html>
