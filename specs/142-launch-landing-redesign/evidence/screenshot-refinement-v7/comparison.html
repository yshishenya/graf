<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GRAF landing screenshot comparison</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      body { margin: 0; padding: 32px; color: #f7f4fa; background: #09080d; }
      h1 { margin: 0 0 28px; font-size: 28px; }
      section { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px; }
      figure { margin: 0; padding: 16px; border: 1px solid #302b3a; border-radius: 18px; background: #111016; }
      img { display: block; width: 100%; height: auto; border-radius: 12px; }
      figcaption { margin-bottom: 12px; color: #c8baff; font-size: 14px; font-weight: 650; }
    </style>
  </head>
  <body>
    <h1>Источник и финальная реализация</h1>
    <section>
      <figure><figcaption>До — расшифровка</figcaption><img src="00-source-transcript.png" alt=""></figure>
      <figure><figcaption>После — диалог и slider</figcaption><img src="01-final-desktop-hero-transcript.jpg" alt=""></figure>
    </section>
    <section>
      <figure><figcaption>До — ручная запись</figcaption><img src="00-source-recording.png" alt=""></figure>
      <figure><figcaption>После — автозапись</figcaption><img src="03-final-desktop-autorecord.jpg" alt=""></figure>
    </section>
    <section>
      <figure><figcaption>Итоги того же диалога</figcaption><img src="02-final-desktop-hero-outcomes.jpg" alt=""></figure>
      <figure><figcaption>Календарь и сценарий записи</figcaption><img src="04-final-desktop-calendar.jpg" alt=""></figure>
    </section>
  </body>
</html>
