<!doctype html>
<meta charset="utf-8">
<title>GRAF hero design comparison</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; color: #f6f2fb; font: 15px -apple-system, sans-serif; background: #050408; }
  main { display: grid; grid-template-columns: 0.4fr 0.6fr; gap: 24px; height: 1052px; }
  figure { min-width: 0; margin: 0; padding: 14px; border: 1px solid #332943; border-radius: 14px; background: #0a0810; }
  figcaption { margin-bottom: 10px; color: #c7b7ff; font-weight: 650; }
  img { display: block; width: 100%; height: 976px; object-fit: contain; object-position: top; }
</style>
<main>
  <figure><figcaption>Source hero crop · 863 × 650</figcaption><img src="selected-direction-3-hero.png" alt=""></figure>
  <figure><figcaption>Rendered hero · viewport 1440 × 1000</figcaption><img src="landing-1440-hero.jpg" alt=""></figure>
