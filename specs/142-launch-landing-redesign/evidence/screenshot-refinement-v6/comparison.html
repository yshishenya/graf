<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GRAF landing screenshot comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #f7f4fa; background: #07060a; font: 14px system-ui, sans-serif; }
      main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; color: #bdb4c8; }
      img { display: block; width: 100%; height: auto; border: 1px solid #302a38; border-radius: 12px; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Выбранное направление 3</figcaption>
        <img src="../../design/selected-direction-3.png" alt="Выбранное визуальное направление">
      </figure>
      <figure>
        <figcaption>До: технический outcome crop</figcaption>
        <img src="01-current-hero.jpg" alt="Предыдущая версия первого экрана">
      </figure>
      <figure>
        <figcaption>После: отдельная реальная расшифровка</figcaption>
        <img src="21-final-desktop-hero.jpg" alt="Финальная версия первого экрана">
      </figure>
    </main>
  </body>
</html>
