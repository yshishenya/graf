<!doctype html>
<meta charset="utf-8">
<title>GRAF full design comparison</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; color: #f6f2fb; font: 15px -apple-system, sans-serif; background: #050408; }
  main { display: grid; grid-template-columns: 0.36fr 0.64fr; gap: 24px; height: 1052px; }
  figure { min-width: 0; margin: 0; padding: 14px; border: 1px solid #332943; border-radius: 14px; background: #0a0810; }
  figcaption { margin-bottom: 10px; color: #c7b7ff; font-weight: 650; }
  .source img { display: block; width: 100%; height: 976px; object-fit: contain; object-position: top; }
  .implementation { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start; }
  .implementation figure { padding: 8px; }
  .implementation img { display: block; width: 100%; height: 278px; object-fit: cover; object-position: top; }
  .implementation figcaption { margin: 0 0 6px; font-size: 12px; }
</style>
<main>
  <figure class="source">
    <figcaption>Source · selected direction 3 · 863 × 1823</figcaption>
    <img src="selected-direction-3.png" alt="">
  </figure>
  <section class="implementation" aria-label="Rendered implementation regions">
    <figure><figcaption>Hero · 1440 × 1000</figcaption><img src="landing-1440-hero.jpg" alt=""></figure>
    <figure><figcaption>Capture proof</figcaption><img src="landing-1440-platforms.jpg" alt=""></figure>
    <figure><figcaption>Outcome proof</figcaption><img src="landing-1440-outcomes.jpg" alt=""></figure>
    <figure><figcaption>Control proof</figcaption><img src="landing-1440-control.jpg" alt=""></figure>
    <figure><figcaption>Final CTA</figcaption><img src="landing-1440-final.jpg" alt=""></figure>
    <figure><figcaption>Mobile hero · 390 × 844</figcaption><img src="landing-390-hero.jpg" alt=""></figure>
  </section>
</main>
