*{box-sizing:border-box}body{margin:0;background:var(--outside);color:var(--text)}button,input,select{font:inherit;color:inherit}button,a,input,select,summary{-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none}button:disabled,select:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button,select,input{border:1px solid var(--line);border-radius:6px;background:var(--field);min-height:32px}button{padding:5px 11px}button:hover:not(:disabled){background:var(--hover)}select{padding:4px 30px 4px 10px;width:172px;max-width:100%}input[type=search],input[type=text]{padding:7px 10px}h1,h2,h3,p{margin:0}h1{font-size:13px;font-weight:600}h2{font-size:15px;font-weight:600;margin-bottom:14px}h3{font-size:13px;font-weight:600}p{color:var(--muted)}svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.lab{max-width:1240px;margin:22px auto 16px;padding:0 12px;display:flex;gap:16px;align-items:center;justify-content:space-between}.lab strong{font-size:16px;font-weight:600}.lab p{font-size:12px;margin-top:4px}.lab-controls{display:flex;align-items:center;gap:8px}.lab-controls select{width:205px}.lab-controls button{font-size:12px}.window{max-width:1240px;height:min(850px,calc(100dvh - 128px));min-height:580px;margin:0 auto 28px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.titlebar{height:30px;flex:none;background:var(--rail);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 12px}.dot{width:10px;height:10px;border-radius:50%;background:#ee625d}.dot:nth-child(2){background:#e9bb4b}.dot:nth-child(3){background:#62bf6e}.window-title{font-size:11px;color:var(--muted);margin-left:12px}.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:0;flex:1}.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;display:flex;flex-direction:column}.back{display:flex;align-items:center;gap:9px;border:0;background:none;padding:9px 10px;margin-bottom:20px;text-align:left}.group{margin-bottom:23px}.group-title{font-size:11px;color:var(--muted);padding:0 10px;margin-bottom:6px}.nav-link{min-height:34px;display:flex;gap:9px;align-items:center;border-radius:6px;padding:7px 10px;margin:2px 0;line-height:1.25}.nav-link:hover{background:var(--hover)}.nav-link[aria-current=page]{background:var(--selected);font-weight:500}.rail-note{margin-top:auto;font-size:11px;padding:12px 10px 0;color:var(--muted)}.main{min-width:0;min-height:0;display:flex;flex-direction:column}.page-head{height:52px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--line);flex:none}.content{padding:32px 40px 48px;overflow:auto;min-height:0;scrollbar-gutter:stable}.column{max-width:760px;margin:auto}.section+.section{border-top:1px solid var(--line);margin-top:26px;padding-top:26px}.intro{max-width:600px;margin:-5px 0 17px}.hint{font-size:12px;line-height:1.6;color:var(--muted)}.rule-help{margin-top:15px;max-width:640px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;min-height:58px;padding:9px 0}.copy{min-width:0}.copy strong{display:block;font-weight:500;overflow-wrap:anywhere}.copy p{font-size:12px;margin-top:3px;max-width:520px}.app-row{min-height:48px;padding:7px 0;gap:20px}.app-row .copy strong{font-weight:400}.bulk{padding:13px 0 17px;border-bottom:1px solid var(--line)}.search{width:100%;margin:18px 0 8px;background:var(--bg);height:34px}.switch{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:32px;cursor:pointer}.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.track{width:30px;height:18px;border:1px solid var(--muted);background:var(--bg);border-radius:12px;pointer-events:none;position:relative;transition:background .12s}.track:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;top:2px;left:2px;background:var(--muted);transition:transform .12s}.switch input:checked+.track{background:var(--accent);border-color:var(--accent)}.switch input:checked+.track:after{transform:translateX(12px);background:var(--bg)}.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:4px}.switch input:disabled+.track{opacity:.5}.status{min-height:24px;margin:9px 0 0;font-size:12px;color:var(--good)}.status.error{color:var(--error)}.status button{margin-left:10px;color:var(--text)}.notice{padding:12px 14px;margin:0 0 14px;border:1px solid var(--line);border-radius:6px;display:flex;justify-content:space-between;gap:18px;align-items:center}.notice p{font-size:12px}.notice strong{font-weight:500}.notice button{flex:none}.permission-ok{color:var(--good)}.quiet{color:var(--muted)}.footer-actions{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.text-link{color:var(--text);text-decoration:underline;text-underline-offset:3px}.themes{display:flex;gap:6px;flex-wrap:wrap}.themes button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--bg)}.field{display:flex;flex-direction:column;gap:7px;margin:18px 0;max-width:370px}.field input{width:100%}.divider{height:1px;background:var(--line);margin:23px 0}.empty{padding:24px 0}.empty h2{margin-bottom:8px}.muted-tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}.nav-mobile{display:none}.route-button{border:0;background:none;color:var(--text);text-decoration:underline;text-underline-offset:3px;padding:0;min-height:28px}.meeting-card{border:1px solid var(--line);border-radius:6px;padding:20px;margin:20px 0}.meeting-card p{margin-top:4px}.rec-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ed655f;margin-right:6px}.recording-bar{border-top:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:10px;font-size:12px}.recording-bar button{margin-left:auto}.mobile-label{display:none}.screenreader{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}.counter{color:var(--muted);font-variant-numeric:tabular-nums}
@media(max-width:900px){.lab{align-items:flex-start;flex-direction:column;gap:10px;margin-top:12px}.window{margin:0 12px 16px;height:calc(100dvh - 155px)}.content{padding:26px}.app{grid-template-columns:188px minmax(0,1fr)}}
@media(max-width:760px){.app{display:flex}.rail{display:none}.main{width:100%}.page-head{padding:12px 20px;height:auto;min-height:54px;justify-content:space-between;gap:10px}.nav-mobile{display:block;width:180px}.mobile-label{display:block}.content{padding:24px 20px}.lab-controls{flex-wrap:wrap}.window{min-height:520px}.window-title{margin-left:8px}}
@media(max-width:560px){.window{margin:0;border-radius:0;border-left:0;border-right:0}.lab{margin:12px 0}.lab-controls select{max-width:190px}.row:not(.toggle-row){grid-template-columns:minmax(0,1fr);gap:7px}.row:not(.toggle-row) select{width:100%}.toggle-row{gap:12px}.notice{align-items:flex-start;flex-direction:column;gap:10px}.page-head h1{font-size:12px}.page-head{padding:12px 16px}.nav-mobile{width:165px}.content{padding:22px 18px}.app-row{padding:10px 0;border-bottom:1px solid var(--line)}.status button{margin:8px 0 0}.recording-bar{padding:8px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media(forced-colors:active){.track,.switch input:checked+.track{border:1px solid ButtonText}.switch input:checked+.track:after{background:Highlight}.nav-link[aria-current=page]{outline:1px solid Highlight}}

<body>
<header class="lab"><div><strong>GRAF · Единые настройки</strong><p>Интерактивный макет. Демонстрационные значения, реальные настройки не меняются.</p></div><div class="lab-controls"><label><span class="screenreader">Сценарий макета</span><select id="scenario"><option value="normal">Обычное состояние</option><option value="denied">macOS: уведомления выключены</option><option value="notDetermined">macOS: нет разрешения</option><option value="error">Ошибка сохранения</option><option value="empty">Нет списка приложений</option><option value="offline">Кабинет недоступен</option><option value="browser">В обычном браузере</option><option value="recording">Идёт запись встречи</option></select></label><button id="theme-lab">Светлая тема</button></div></header>
<div class="window"><div class="titlebar" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="window-title">GRAF</span></div><div class="app"><aside class="rail" id="rail"></aside><main class="main" id="main"></main></div></div>
<script id="registry" type="application/json">[{"id": "three_cx", "name": "3CX"}, {"id": "eight_by_eight_work", "name": "8x8 Work"}, {"id": "adobe_connect", "name": "Adobe Connect"}, {"id": "aircall", "name": "Aircall"}, {"id": "alfaview", "name": "alfaview"}, {"id": "avaya_cloud_office", "name": "Avaya Cloud Office"}, {"id": "ayugram_desktop", "name": "AyuGram Desktop"}, {"id": "cisco_jabber", "name": "Cisco Jabber"}, {"id": "cloudtalk_phone", "name": "CloudTalk Phone"}, {"id": "cloudya", "name": "Cloudya"}, {"id": "dialpad", "name": "Dialpad"}, {"id": "dingtalk", "name": "DingTalk"}, {"id": "dion", "name": "Dion"}, {"id": "discord", "name": "Discord"}, {"id": "element_calls", "name": "Element / Matrix calls"}, {"id": "enreach_contact", "name": "Enreach Contact"}, {"id": "express", "name": "eXpress"}, {"id": "facetime", "name": "FaceTime"}, {"id": "gather", "name": "Gather"}, {"id": "gotomeeting", "name": "GoTo Meeting"}, {"id": "iva_connect", "name": "IVA Connect"}, {"id": "jami", "name": "Jami"}, {"id": "jitsi_desktop", "name": "Jitsi Desktop / Jitsi Meet"}, {"id": "kakaotalk_calls", "name": "KakaoTalk calls"}, {"id": "kontur_talk", "name": "Kontur Talk"}, {"id": "kotatogram_desktop", "name": "Kotatogram Desktop"}, {"id": "lark", "name": "Lark / Feishu"}, {"id": "lifesize", "name": "Lifesize"}, {"id": "line_calls", "name": "LINE calls"}, {"id": "linphone", "name": "Linphone"}, {"id": "loop_messenger", "name": "LOOP Messenger calls"}, {"id": "mattermost_calls", "name": "Mattermost calls"}, {"id": "microsoft_teams_classic", "name": "Microsoft Teams classic"}, {"id": "microsoft_teams_new", "name": "Microsoft Teams new"}, {"id": "mts_link", "name": "MTS Link"}, {"id": "mumble", "name": "Mumble"}, {"id": "onsip", "name": "OnSIP"}, {"id": "pachca", "name": "Pachca"}, {"id": "pexip", "name": "Pexip Infinity Connect"}, {"id": "quo_business_phone", "name": "Quo / OpenPhone"}, {"id": "ringcentral", "name": "RingCentral / Glip"}, {"id": "rocket_chat_calls", "name": "Rocket.Chat calls"}, {"id": "salutejazz", "name": "SaluteJazz"}, {"id": "signal_calls", "name": "Signal calls"}, {"id": "sipgate", "name": "sipgate"}, {"id": "skype", "name": "Skype"}, {"id": "slack_calls", "name": "Slack calls"}, {"id": "tandem", "name": "Tandem"}, {"id": "teamspeak", "name": "TeamSpeak 3"}, {"id": "teamviewer_meeting", "name": "TeamViewer Meeting"}, {"id": "teamviewer_quickjoin", "name": "TeamViewer QuickJoin"}, {"id": "telegram_a", "name": "Telegram A"}, {"id": "telegram_desktop", "name": "Telegram Desktop / TDX / Forkgram / 64Gram"}, {"id": "telegram_macos", "name": "Telegram for macOS / Telegram Lite"}, {"id": "telephone_sip", "name": "Telephone SIP calls"}, {"id": "tencent_meeting", "name": "Tencent Meeting"}, {"id": "trueconf", "name": "TrueConf"}, {"id": "tuple", "name": "Tuple"}, {"id": "viber_calls", "name": "Viber calls"}, {"id": "videomost", "name": "VideoMost"}, {"id": "vinteo", "name": "VINTEO"}, {"id": "vk_calls", "name": "VK Calls"}, {"id": "vk_messenger_calls", "name": "VK Messenger calls"}, {"id": "vk_teams", "name": "VK Teams"}, {"id": "vonage_business", "name": "Vonage Business Communications"}, {"id": "voov_meeting", "name": "VooV Meeting"}, {"id": "vsee", "name": "VSee Messenger"}, {"id": "webex", "name": "Webex"}, {"id": "webex_current", "name": "Webex current"}, {"id": "wechat_calls", "name": "WeChat calls"}, {"id": "wecom_calls", "name": "WeCom / WeChat Work calls"}, {"id": "whatsapp", "name": "WhatsApp"}, {"id": "wire_calls", "name": "Wire calls"}, {"id": "yandex_telemost", "name": "Yandex Telemost"}, {"id": "yealink_meeting", "name": "Yealink Meeting"}, {"id": "zoho_cliq", "name": "Zoho Cliq"}, {"id": "zoom", "name": "Zoom"}, {"id": "zoom_phone", "name": "Zoom Phone"}, {"id": "zulip_calls", "name": "Zulip calls"}]</script>
<script>
'use strict';
// The prototype uses only synthetic in-memory preferences. No network or system actions.
const icons={back:'<path d="m10 4-4 4 4 4"/>',account:'<circle cx="8" cy="5" r="2.5"/><path d="M3 14v-1a5 5 0 0 1 10 0v1"/>',workspace:'<path d="M3 3h10v11H3zM6 6h4M6 9h4"/>',billing:'<rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 7h12M5 10h3"/>',recording:'<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.5"/>',summaries:'<rect x="3" y="2" width="10" height="12" rx="1"/><path d="M5 5h6M5 8h6M5 11h3"/>',calendar:'<rect x="2" y="3" width="12" height="11" rx="2"/><path d="M5 1v4M11 1v4M2 7h12"/>',notifications:'<path d="M3 11h10l-1.5-2V6a3.5 3.5 0 0 0-7 0v3zM6.5 14h3"/>',meetings:'<rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5 1v4M11 1v4"/>'};
const svg=id=>`<svg viewBox="0 0 16 16" aria-hidden="true">${icons[id]||icons.account}</svg>`;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=[['Личное',[['account','Аккаунт']]],['Рабочее пространство',[['workspace','Пространства'],['billing','Тариф и оплата']]],['Встречи',[['recording','Запись'],['summaries','Итоги'],['calendar','Календари']]],['Приложение',[['notifications','Уведомления']]]];
const pages=groups.flatMap(g=>g[1]);
const targets=JSON.parse(document.getElementById('registry').textContent);
const rules=Object.fromEntries(targets.map(t=>[t.id,'ask']));rules.zoom='always';rules.discord='never';
const preferences={reminders:true,offsetMinutes:5,showTitles:false,sound:true,email:false,tips:true};
let current='recording',scenario='normal',search='',busy=false,operation=0;
const model={bulk(values){const list=Object.values(values);return list.length&&list.every(x=>x===list[0])?list[0]:''},patchRule(values,id,rule,known){if(!['always','ask','never'].includes(rule))throw Error('Invalid rule');if(id!=='all'&&!known.includes(id))throw Error('Unknown target');const next={...values};for(const key of known)if(id==='all'||key===id)next[key]=rule;return next},patchPreference(values,field,value){if(field==='offsetMinutes'){if(![0,1,5].includes(value))throw Error('Invalid offset')}else if(!['reminders','showTitles','sound','email','tips'].includes(field)||typeof value!=='boolean')throw Error('Invalid preference');return {...values,[field]:value}}};
window.prototypeModel=model;
const opts=value=>`${value===''?'<option value="" selected disabled>Разные правила</option>':''}<option value="always" ${value==='always'?'selected':''}>Всегда</option><option value="ask" ${value==='ask'?'selected':''}>Спрашивать</option><option value="never" ${value==='never'?'selected':''}>Никогда</option>`;
const ruleSelect=(id,title,value)=>`<select data-rule="${esc(id)}" aria-label="Автозапись: ${esc(title)}">${opts(value)}</select>`;
const toggle=(field,title,desc)=>`<div class="row toggle-row"><div class="copy"><strong id="label-${field}">${title}</strong><p id="help-${field}">${desc}</p></div><label class="switch"><input type="checkbox" data-pref="${field}" ${preferences[field]?'checked':''} aria-labelledby="label-${field}" aria-describedby="help-${field}"><span class="track"></span></label></div>`;
function nav(){const offline=scenario==='offline';const shown=offline?[['На этом Mac',[['recording','Запись'],['notifications','Уведомления']]]]:groups;return `<button class="back" data-nav="meetings">${svg('back')}<span>Назад</span></button><nav aria-label="Разделы настроек">${shown.map(([label,items])=>`<div class="group"><div class="group-title">${label}</div>${items.map(([id,name])=>`<a class="nav-link" href="#${id}" ${current===id?'aria-current="page"':''}>${svg(id)}<span>${name}</span></a>`).join('')}</div>`).join('')}</nav>${offline?'<div class="rail-note">Кабинет недоступен.<br>Локальные настройки доступны.<br><button class="route-button" data-action="reconnect">Все настройки GRAF</button></div>':''}`}
function recording(){if(scenario==='browser')return `<section class="section"><h2>Запись на вашем Mac</h2><p>Автозапись настраивается в приложении GRAF на нужном Mac.</p><p class="hint" style="margin-top:10px">Откройте GRAF → Настройки → Запись.</p></section>`;
return `<section class="section"><h2>Автозапись</h2><p class="intro">Выберите, как начинать запись встреч в каждом приложении на этом Mac.</p><p class="hint rule-help">Всегда — без запроса. Спрашивать — запись начнётся через 8 секунд, если вы не откажетесь. Никогда — только ручной запуск.</p>${scenario==='empty'?'<div class="empty"><h3>Список приложений пока недоступен</h3><p class="hint">Сохранённые правила остаются в силе.</p><button data-action="retry-list" style="margin-top:12px">Повторить</button></div>':`<div class="row bulk"><div class="copy"><strong>Для всех приложений</strong><p>Применить правило ко всему списку, включая скрытые поиском.</p></div>${ruleSelect('all','для всех приложений',model.bulk(rules))}</div><label class="screenreader" for="app-search">Найти приложение</label><input type="search" id="app-search" class="search" placeholder="Найти приложение" value="${esc(search)}" aria-controls="targets"><div id="targets">${appRows()}</div>`}<p class="hint" style="margin-top:16px">Поддерживаемые приложения на macOS. Ручная запись остаётся доступна.</p><div id="save-status" class="status" role="status" aria-live="polite"></div></section>`}
function appRows(){const visible=targets.filter(t=>t.name.toLocaleLowerCase('ru').includes(search.toLocaleLowerCase('ru')));return visible.length?visible.map(t=>`<div class="row app-row"><div class="copy"><strong>${esc(t.name)}</strong></div>${ruleSelect(t.id,t.name,rules[t.id])}</div>`).join(''):'<p class="empty" role="status">Приложение не найдено. Проверьте название или очистите поиск.</p>'}
function notifications(){const denied=scenario==='denied',unknown=scenario==='notDetermined',browser=scenario==='browser',offline=scenario==='offline';return `<section class="section"><h2>На этом Mac</h2>${browser?'<p>Эти настройки доступны в приложении GRAF на нужном Mac: Настройки → Уведомления.</p>':`${denied||unknown?`<div class="notice"><div><strong>${denied?'Уведомления выключены в macOS':'Разрешение ещё не запрашивалось'}</strong><p>${denied?'Выбранные правила начнут действовать после разрешения в системе.':'Разрешите GRAF показывать напоминания о встречах.'}</p></div><button data-action="${unknown?'permission':'system'}">${unknown?'Разрешить уведомления':'Настройки macOS'}</button></div>`:`<div class="row"><div class="copy"><strong>Уведомления macOS</strong><p class="permission-ok">Разрешены в системных настройках</p></div><button data-action="system">Настройки macOS</button></div>`}${toggle('reminders','Напоминать о встречах','Перед началом встречи из подключённого календаря.')}<div class="row"><div class="copy"><strong id="offset-label">Когда напоминать</strong></div><select data-pref="offsetMinutes" aria-labelledby="offset-label" ${preferences.reminders?'':'disabled'}>${[[0,'В момент начала'],[1,'За минуту'],[5,'За 5 минут']].map(([n,s])=>`<option value="${n}" ${preferences.offsetMinutes===n?'selected':''}>${s}</option>`).join('')}</select></div>${toggle('showTitles','Показывать названия встреч','В системных уведомлениях. Выключите, чтобы скрыть названия.')}${toggle('sound','Звук уведомлений','Во время записи звук всегда выключен.')}<div class="footer-actions"><button data-action="test" ${denied||unknown?'disabled':''}>Проверить уведомление</button><span class="hint">Используются сохранённые настройки.</span></div>`}</section>${offline?'<section class="section"><p>Письма и подсказки аккаунта доступны после подключения к кабинету.</p></section>':`<section class="section"><h2>Письма и подсказки</h2><p class="intro hint">Для вашего аккаунта на всех устройствах.</p>${toggle('email','Письма с новостями и советами','Необязательные письма о GRAF.')}${toggle('tips','Подсказки в GRAF','Советы рядом с функциями.')}<p class="hint" style="margin-top:16px">Сообщения о безопасности и оплате сохраняются. Проблемы записи всегда видны в GRAF.</p><div class="footer-actions"><button class="route-button" data-nav="history">Открыть историю уведомлений</button></div></section>`}<div id="save-status" class="status" role="status" aria-live="polite"></div>`}
function account(){return `<section class="section"><h2>Профиль</h2><form data-demo-form><label class="field">Отображаемое имя<input type="text" value="Александра" maxlength="240" autocomplete="off"></label><p class="hint">alexandra@example.test · демонстрационный аккаунт</p><div class="footer-actions"><button type="submit">Сохранить</button><button type="reset">Отменить</button></div></form></section><section class="section"><h2>Интерфейс</h2><div class="row"><div class="copy"><strong>Оформление</strong><p>Как выглядит GRAF в вашем аккаунте.</p></div><div class="themes">${[['light','Светлое'],['dark','Тёмное'],['system','Системное']].map(([id,n])=>`<button data-theme-choice="${id}" aria-pressed="${document.documentElement.dataset.theme===id}">${n}</button>`).join('')}</div></div><div class="row"><div class="copy"><strong>Часовой пояс</strong><p>Используется на всех ваших устройствах.</p></div><select aria-label="Часовой пояс" data-example-select><option>Екатеринбург · UTC+5</option><option>Москва · UTC+3</option></select></div><p class="hint">Интерфейс GRAF пока доступен на русском. Язык расшифровки не меняется здесь.</p></section><section class="section"><h2>Безопасность</h2><div class="row"><div class="copy"><strong>Способы входа</strong><p>Email · подключён</p></div><button data-action="account-detail">Управлять</button></div><div class="row"><div class="copy"><strong>Где вы вошли</strong><p>Этот Mac · текущий вход</p></div><button data-action="sessions">Посмотреть</button></div><p class="hint">Подтверждения выхода, подключения и закрытия аккаунта сохраняются в действующих формах.</p></section><div id="save-status" class="status" role="status" aria-live="polite"></div>`}
function other(){const rows={workspace:['Пространства','Рабочее пространство','Личное пространство','Новые встречи сохраняются здесь.','Настроить пространство'],billing:['Тариф и оплата','Текущий тариф','Тариф и использование','Данные тарифа, счета и оплачиваемые действия — в существующем разделе.','Открыть сведения о тарифе'],summaries:['Итоги','Форматы итогов','Итоги встречи','Существующие форматы и структура сохраняются.','Настроить форматы'],calendar:['Календари','Подключения','Календарь не подключён','Подключите календарь, чтобы видеть встречи и получать напоминания.','Подключить календарь']};const r=rows[current];return `<section class="section"><h2>${r[1]}</h2><div class="row"><div class="copy"><strong>${r[2]}</strong><p>${r[3]}</p></div><button data-action="existing">${r[4]}</button></div><p class="hint" style="margin-top:16px">В этом разделе меняется общая компоновка. Существующие возможности и подтверждения сохраняются.</p></section><div id="save-status" class="status" role="status" aria-live="polite"></div>`}
function meetings(){return `<section class="section"><h2>Мои встречи</h2><p>Демонстрация входа в единые настройки.</p><div class="meeting-card"><strong>Тестовая встреча</strong><p>Пример для проверки навигации · без содержимого записи</p></div><div class="footer-actions"><button data-nav="account">Настройки</button><button data-nav="recording">Настройки автозаписи</button><button data-nav="notifications">Настройки уведомлений</button></div></section>`}
function history(){return `<section class="section"><h2>История уведомлений</h2><p>Здесь остаются результаты встреч и события, требующие внимания.</p><div class="meeting-card"><strong>Итоги тестовой встречи готовы</strong><p>Без звука · демонстрационное событие</p></div><button data-nav="notifications">Настройки уведомлений</button></section>`}
function render(focus=false){document.getElementById('rail').innerHTML=nav();const title=current==='meetings'?'Мои встречи':current==='history'?'Уведомления':pages.find(x=>x[0]===current)[1];const mobilePages=scenario==='offline'?pages.filter(x=>['recording','notifications'].includes(x[0])):pages;document.getElementById('main').innerHTML=`<header class="page-head">${svg(current==='history'?'notifications':current)}<h1 tabindex="-1" id="page-title">${title}</h1><label class="screenreader" for="mobile-nav">Раздел настроек</label><select class="nav-mobile" id="mobile-nav"><option value="meetings" ${current==='meetings'?'selected':''}>← К встречам</option>${mobilePages.map(([id,n])=>`<option value="${id}" ${current===id?'selected':''}>${n}</option>`).join('')}</select></header><div class="content"><div class="column">${current==='recording'?recording():current==='notifications'?notifications():current==='account'?account():current==='meetings'?meetings():current==='history'?history():other()}</div></div>${scenario==='recording'?'<div class="recording-bar"><span><span class="rec-dot"></span>Идёт тестовая запись</span><span class="quiet">Звук уведомлений выключен</span><button data-action="stop">Остановить</button></div>':''}`;if(focus)document.getElementById('page-title').focus()}
function go(page){if(scenario==='offline'&&!['recording','notifications','meetings'].includes(page))page='recording';current=page;location.hash=page;render(true)}
function status(text,error=false){const el=document.getElementById('save-status');if(!el)return;el.className='status'+(error?' error':'');el.textContent=text;el.setAttribute('role',error?'alert':'status')}
async function save(change,origin){if(busy)return;busy=true;const seq=++operation;const scroll=document.querySelector('.content').scrollTop;document.querySelectorAll('[data-pref],[data-rule]').forEach(x=>x.disabled=true);status('Сохраняем…');await new Promise(r=>setTimeout(r,350));if(seq!==operation)return;busy=false;if(scenario!=='error')change();render();document.querySelector('.content').scrollTop=scroll;const el=document.querySelector(origin);el?.focus({preventScroll:true});status(scenario==='error'?'Не удалось сохранить. Прежнее значение осталось в силе. Повторите выбор.':'Сохранено',scenario==='error')}
document.addEventListener('click',event=>{const btn=event.target.closest('[data-nav],[data-action],[data-theme-choice]');if(!btn)return;if(btn.dataset.nav){go(btn.dataset.nav);return}if(btn.dataset.themeChoice){setTheme(btn.dataset.themeChoice);render();return}switch(btn.dataset.action){case'retry-list':case'reconnect':scenario='normal';document.getElementById('scenario').value='normal';render();break;case'permission':scenario='normal';document.getElementById('scenario').value='normal';render();status('Макет: разрешение включено. Системный запрос не отправлялся.');break;case'system':status('В приложении эта кнопка откроет настройки уведомлений macOS. Макет не меняет систему.');break;case'test':status('Макет: запрос передан macOS. Реальное уведомление не отправлялось.');break;case'stop':scenario='normal';document.getElementById('scenario').value='normal';render();break;default:status('Этот макет показывает общий вид раздела. Действующая форма GRAF сохраняется; действие не выполнялось.')}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='mobile-nav'){go(el.value);return}if(el.dataset.rule){const id=el.dataset.rule,value=el.value;save(()=>Object.assign(rules,model.patchRule(rules,id,value,targets.map(t=>t.id))),`[data-rule="${id}"]`)}else if(el.dataset.pref){const field=el.dataset.pref,value=field==='offsetMinutes'?Number(el.value):el.checked;save(()=>Object.assign(preferences,model.patchPreference(preferences,field,value)),`[data-pref="${field}"]`)}else if(el.hasAttribute('data-example-select'))status('Демонстрационный выбор. Настройки аккаунта не менялись.')});
document.addEventListener('input',event=>{if(event.target.id==='app-search'){search=event.target.value;document.getElementById('targets').innerHTML=appRows()}});
document.addEventListener('submit',event=>{if(event.target.matches('[data-demo-form]')){event.preventDefault();status('Имя в макете проверено. Реальный профиль не менялся.')}});
document.getElementById('scenario').addEventListener('change',event=>{scenario=event.target.value;operation++;busy=false;if(scenario==='offline'&&!['recording','notifications'].includes(current))current='recording';if(['denied','notDetermined','recording'].includes(scenario))current='notifications';render()});
function setTheme(theme){const resolved=theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):theme;document.documentElement.dataset.theme=resolved;document.getElementById('theme-lab').textContent=resolved==='dark'?'Светлая тема':'Тёмная тема'}
document.getElementById('theme-lab').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(pages.some(p=>p[0]===next)||['meetings','history'].includes(next)){current=next;render(true)}});
if(pages.some(p=>p[0]===location.hash.slice(1)))current=location.hash.slice(1);render();
</script>
</body></html>
