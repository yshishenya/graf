name: GRAF validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      lane:
        description: Validation lane to run
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: graf-validation-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.lane || 'fast' }}
  cancel-in-progress: true

jobs:
  server-fast:
    name: Server fast lane
    if: github.event_name == 'pull_request' || github.event.inputs.lane == 'fast'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - name: Run fast local CI
        run: infra/scripts/ci-local.sh --fast

  macos-fast:
    name: macOS fast build
    if: github.event_name == 'pull_request' || github.event.inputs.lane == 'fast'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS architecture boundary
        run: sh apps/macos/Scripts/validate-no-legacy-audio-driver.sh
      - name: Build macOS app
        run: swift build --package-path apps/macos

  server-full:
    name: Server full lane
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - name: Run full server CI
        run: infra/scripts/ci-local.sh --full

  macos-full:
    name: macOS full lane
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'full'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run macOS full validation
        run: |
          sh apps/macos/Scripts/validate-no-legacy-audio-driver.sh
          swift build --package-path apps/macos
          swift test --package-path apps/macos
          swift run --package-path apps/macos ContractValidation
