name: Sign GRAF app update to draft release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable GRAF tag for the draft release
        required: true
        type: string
      version:
        description: CalVer without a leading v
        required: true
        type: string
      previous_tag:
        description: Exact immutable predecessor tag
        required: true
        type: string
      candidate_app_asset:
        description: Draft-release ZIP containing the candidate GRAF.app
        required: true
        type: string
      previous_app_asset:
        description: Draft-release ZIP containing the previous GRAF.app
        required: true
        type: string
      release_notes_asset:
        description: Draft-release Russian release notes asset
        required: true
        type: string
      keychain_attestation_asset:
        description: Metadata-only Keychain readiness attestation from the release operator
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: graf-stable-update-feed
  cancel-in-progress: false

jobs:
  sign-draft:
    name: Validate and sign approved draft assets
    if: github.ref == 'refs/heads/master'
    runs-on: macos-14
    environment:
      name: graf-release-signing
    permissions:
      contents: write
    steps:
      - name: Check out the requested immutable tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Validate draft inputs and stage signed update assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          CANDIDATE_APP_ASSET: ${{ inputs.candidate_app_asset }}
          PREVIOUS_APP_ASSET: ${{ inputs.previous_app_asset }}
          RELEASE_NOTES_ASSET: ${{ inputs.release_notes_asset }}
          KEYCHAIN_ATTESTATION_ASSET: ${{ inputs.keychain_attestation_asset }}
          GRAF_SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.GRAF_SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -eu
          printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$' || {
            echo "invalid version" >&2
            exit 1
          }
          [ "$RELEASE_TAG" = "v$VERSION" ] || {
            echo "release tag and version disagree" >&2
            exit 1
          }
          printf '%s' "$PREVIOUS_TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$' || {
            echo "invalid predecessor tag" >&2
            exit 1
          }
          for ASSET in "$CANDIDATE_APP_ASSET" "$PREVIOUS_APP_ASSET" "$RELEASE_NOTES_ASSET" "$KEYCHAIN_ATTESTATION_ASSET"; do
            case "$ASSET" in
              ''|*[!A-Za-z0-9._-]*) echo "invalid draft asset name" >&2; exit 1 ;;
            esac
          done
          [ -n "$GRAF_SPARKLE_ED25519_PRIVATE_KEY" ] || {
            echo "protected signing secret is unavailable" >&2
            exit 1
          }
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" "refs/tags/$PREVIOUS_TAG:refs/tags/$PREVIOUS_TAG"
          TAG_COMMIT=$(git rev-parse "refs/tags/$RELEASE_TAG^{}")
          MASTER_COMMIT=$(git ls-remote origin refs/heads/master | awk 'NR == 1 { print $1 }')
          [ -n "$MASTER_COMMIT" ] && [ "$TAG_COMMIT" = "$MASTER_COMMIT" ] || {
            echo "release tag is not the current master commit" >&2
            exit 1
          }
          [ "$(git rev-parse HEAD)" = "$TAG_COMMIT" ] || {
            echo "checked-out source does not match the requested tag" >&2
            exit 1
          }
          COMMIT=$(git rev-parse HEAD)
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true" ] || {
            echo "target GitHub release must remain a draft" >&2
            exit 1
          }
          INPUT_DIR="$RUNNER_TEMP/graf-signing-inputs"
          WORK_DIR="$RUNNER_TEMP/graf-signing-work"
          KEY_FILE="$RUNNER_TEMP/graf-sparkle-signing-key"
          rm -rf "$INPUT_DIR" "$WORK_DIR"
          mkdir -p "$INPUT_DIR" "$WORK_DIR"
          cleanup() {
            rm -f "$KEY_FILE"
            rm -rf "$INPUT_DIR" "$WORK_DIR"
          }
          trap cleanup EXIT HUP INT TERM
          gh release download "$RELEASE_TAG" --pattern "$CANDIDATE_APP_ASSET" --dir "$INPUT_DIR"
          gh release download "$PREVIOUS_TAG" --pattern "$PREVIOUS_APP_ASSET" --dir "$INPUT_DIR"
          gh release download "$RELEASE_TAG" --pattern "$RELEASE_NOTES_ASSET" --dir "$INPUT_DIR"
          gh release download "$RELEASE_TAG" --pattern "$KEYCHAIN_ATTESTATION_ASSET" --dir "$INPUT_DIR"
          CANDIDATE_ARCHIVE="$INPUT_DIR/$CANDIDATE_APP_ASSET"
          PREVIOUS_ARCHIVE="$INPUT_DIR/$PREVIOUS_APP_ASSET"
          RELEASE_NOTES="$INPUT_DIR/$RELEASE_NOTES_ASSET"
          KEYCHAIN_ATTESTATION="$INPUT_DIR/$KEYCHAIN_ATTESTATION_ASSET"
          [ -f "$CANDIDATE_ARCHIVE" ] && [ -f "$PREVIOUS_ARCHIVE" ] && [ -f "$RELEASE_NOTES" ] && [ -f "$KEYCHAIN_ATTESTATION" ] || {
            echo "required draft asset is missing" >&2
            exit 1
          }
          extract_graf_app() {
            ARCHIVE=$1
            DESTINATION=$2
            unzip -tq "$ARCHIVE" >/dev/null
            ARCHIVE_LIST=$(unzip -Z1 "$ARCHIVE")
            printf '%s\n' "$ARCHIVE_LIST" | grep -q '^GRAF.app/' || return 1
            if printf '%s\n' "$ARCHIVE_LIST" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              return 1
            fi
            if printf '%s\n' "$ARCHIVE_LIST" | grep -Eq '^/|\\'; then
              return 1
            fi
            mkdir -p "$DESTINATION"
            ditto -x -k "$ARCHIVE" "$DESTINATION"
            [ -d "$DESTINATION/GRAF.app" ]
          }
          extract_graf_app "$CANDIDATE_ARCHIVE" "$WORK_DIR/candidate" || {
            echo "candidate draft asset is not a safe GRAF.app ZIP" >&2
            exit 1
          }
          extract_graf_app "$PREVIOUS_ARCHIVE" "$WORK_DIR/previous" || {
            echo "predecessor draft asset is not a safe GRAF.app ZIP" >&2
            exit 1
          }
          FEED_URL=$(/usr/bin/plutil -extract SUFeedURL raw -o - "$WORK_DIR/candidate/GRAF.app/Contents/Info.plist" 2>/dev/null || true)
          case "$FEED_URL" in
            https://*/graf-appcast.xml) ;;
            *) echo "candidate app does not contain a valid trusted update feed" >&2; exit 1 ;;
          esac
          DOWNLOAD_BASE_URL=${FEED_URL%/graf-appcast.xml}
          umask 077
          printf '%s' "$GRAF_SPARKLE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          [ "$(stat -f '%Lp' "$KEY_FILE")" = "600" ] || {
            echo "temporary signing file permissions are unsafe" >&2
            exit 1
          }
          MANIFEST=apps/macos/Installer/UpdateSigningKey.json
          . apps/macos/Installer/Scripts/release-signing-common.sh
          release_signing_require_active_manifest "$MANIFEST" || {
            echo "public signing manifest is not active" >&2
            exit 1
          }
          release_signing_require_keychain_attestation "$KEYCHAIN_ATTESTATION" "$RELEASE_TAG" "$COMMIT" || {
            echo "safe Keychain attestation is unavailable for this release" >&2
            exit 1
          }
          KEY_ID=$RELEASE_SIGNING_KEY_ID
          TRUST_GENERATION=$RELEASE_SIGNING_TRUST_GENERATION
          SIGNER_PUBLIC_KEY=$(/usr/bin/xcrun swift apps/macos/Installer/Scripts/derive-sparkle-public-key.swift "$KEY_FILE" 2>/dev/null) || {
            echo "could not derive protected signer identity" >&2
            exit 1
          }
          SIGNER_KEY_ID="sha256:$(printf '%s' "$SIGNER_PUBLIC_KEY" | /usr/bin/base64 -D | /usr/bin/shasum -a 256 | awk '{print $1}')"
          [ "$SIGNER_KEY_ID" = "$KEY_ID" ] || {
            echo "protected signer does not match the active public manifest" >&2
            exit 1
          }
          CHECKED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          ATTESTATION="$WORK_DIR/custody-attestation.json"
          cat > "$ATTESTATION" <<EOF
          {
            "schemaVersion": 1,
            "keyId": "$KEY_ID",
            "trustGeneration": $TRUST_GENERATION,
            "channel": "github-environment",
            "state": "ready",
            "checkedAt": "$CHECKED_AT",
            "releaseRef": "$RELEASE_TAG",
            "commit": "$COMMIT",
            "workflow": "sign-graf-app-update",
            "runId": "$GITHUB_RUN_ID"
          }
          EOF
          /usr/bin/plutil -lint "$ATTESTATION" >/dev/null
          GRAF_VERSION="$VERSION" \
          GRAF_UPDATE_APP_BUNDLE="$WORK_DIR/candidate/GRAF.app" \
          GRAF_PREVIOUS_APP_BUNDLE="$WORK_DIR/previous/GRAF.app" \
          GRAF_UPDATE_RELEASE_NOTES="$RELEASE_NOTES" \
          GRAF_UPDATE_DOWNLOAD_BASE_URL="$DOWNLOAD_BASE_URL" \
          GRAF_RELEASE_SIGNING_MODE=ephemeral-ci \
          GRAF_RELEASE_SIGNING_CI_KEY_FILE="$KEY_FILE" \
          GRAF_RELEASE_SIGNING_ATTESTATION="$ATTESTATION" \
          GRAF_RELEASE_SIGNING_KEYCHAIN_ATTESTATION="$KEYCHAIN_ATTESTATION" \
          GRAF_REQUIRE_RELEASE_PROVENANCE=1 \
            sh apps/macos/Installer/Scripts/prepare-app-update.sh
          OUTPUT_DIR=apps/macos/.build/updates
          ARCHIVE="GRAF-$VERSION.zip"
          [ -f "$OUTPUT_DIR/$ARCHIVE" ] && [ -f "$OUTPUT_DIR/graf-appcast.xml" ] || {
            echo "signing did not produce the required staged artifacts" >&2
            exit 1
          }
          CHECKSUM="$OUTPUT_DIR/GRAF-$VERSION.sha256"
          RELEASE_ATTESTATION="$OUTPUT_DIR/GRAF-$VERSION-signing-attestation.json"
          (
            cd "$OUTPUT_DIR"
            shasum -a 256 "$ARCHIVE" graf-appcast.xml > "$(basename -- "$CHECKSUM")"
          )
          cp "$ATTESTATION" "$RELEASE_ATTESTATION"
          gh release upload "$RELEASE_TAG" \
            "$OUTPUT_DIR/$ARCHIVE" \
            "$OUTPUT_DIR/graf-appcast.xml" \
            "$CHECKSUM" \
            "$RELEASE_ATTESTATION" \
            --clobber
          trap - EXIT HUP INT TERM
          cleanup
