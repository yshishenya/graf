name: macos-pr

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  scope:
    name: Determine native scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native_required: ${{ steps.scope.outputs.native_required }}
      text_only: ${{ steps.scope.outputs.text_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout current workflow tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/pr-check-policy.json
          sparse-checkout-cone-mode: false
      - name: Resolve exact scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci-tools/scripts/ci-pr-scope.py "$GITHUB_EVENT_PATH" --event-name pull_request \
            --result "$RUNNER_TEMP/native-scope.json" > /dev/null
          python3 - "$RUNNER_TEMP/native-scope.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          with open(sys.argv[2], "a") as output:
              for key in ("native_required", "text_only"):
                  output.write(f"{key}={str(value[key]).lower()}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: graf-native-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-scope.json
          if-no-files-found: error
          retention-days: 90

  native:
    name: Swift build and tests
    needs: scope
    if: needs.scope.outputs.native_required == 'true' && needs.scope.outputs.text_only == 'false'
    concurrency:
      # Only a real code/base check can cancel another native execution.
      group: graf-macos-code-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.0.3"
      - name: Cache Swift build
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/macos/.build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          # The .build tree holds compiled outputs for repository sources, so the
          # key must change with them; caches are immutable, so a key based on the
          # dependency lockfile alone kept restoring a stale build state.
          key: swift-${{ runner.os }}-${{ runner.arch }}-spm6.0.3-${{ hashFiles('apps/macos/Package.resolved') }}-${{ hashFiles('apps/macos/**/*.swift', 'apps/macos/Package.swift') }}-v2
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-spm6.0.3-
      - name: Refresh restored build timestamps
        if: steps.swift-cache.outputs.cache-hit == 'true'
        shell: bash
        # actions/checkout writes sources after the restore, so freshly restored
        # outputs look older than the checkout; llbuild would then rebuild all
        # modules. Touch the restored artifacts so incremental state is honored.
        run: find apps/macos/.build -exec touch {} +
      - name: Build and validate native contracts
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]]
          swift build --package-path apps/macos
          bash apps/macos/Scripts/run-swift-tests.sh
          swift run --package-path apps/macos ContractValidation

  result:
    name: macos-pr
    needs: [scope, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Assert required native execution
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.native_required }}
          NATIVE_RESULT: ${{ needs.native.result }}
          TEXT_ONLY: ${{ needs.scope.outputs.text_only }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          if [[ "$TEXT_ONLY" == false ]]; then
            case "$NATIVE_REQUIRED:$NATIVE_RESULT" in
              true:success|false:skipped) exit 0 ;;
              *) echo "macos-pr: required execution missing or unsuccessful" >&2; exit 1 ;;
            esac
          fi
          [[ "$TEXT_ONLY" == true ]]
      - name: Checkout exact PR SHA for proof validation
        if: needs.scope.outputs.text_only == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout current workflow tools
        if: needs.scope.outputs.text_only == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/pr-check-policy.json
          sparse-checkout-cone-mode: false
      - name: Verify existing native proof
        if: needs.scope.outputs.text_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I .ci-tools/scripts/validate-pr-checks.py --repository "$GITHUB_REPOSITORY" \
            --reuse-component macos-pr --event "$GITHUB_EVENT_PATH" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --wait-seconds 1980
