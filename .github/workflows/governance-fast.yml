name: governance-fast

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      requested_sha:
        description: Full commit SHA to audit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    graf-governance-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_sha || github.sha) ||
      format('manual-{0}', inputs.requested_sha)
    }}
  cancel-in-progress: true

jobs:
  governance-fast:
    name: governance-fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRAF_CI_REQUESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || inputs.requested_sha }}
      GRAF_CI_EVIDENCE_PATH: .dev/ci-evidence/github-${{ github.run_id }}.json
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure fixture git identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install frozen Spec Kit CLI and bootstrap
        shell: bash
        env:
          SPECIFY_CLI_VERSION: "1.0.1"
          SPEC_KIT_REF: 9118ed15a0ba65053469a94c560ea5d233f75884
          SPECKIT_BOOTSTRAP_SHA256: bdbfa1d56ab567de209ed55e2d2992284315bac43597a7c9f63f4f95b330a71c
        run: |
          set -euo pipefail
          venv_dir="$RUNNER_TEMP/graf-specify-venv"
          python3 -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --disable-pip-version-check \
            "specify-cli @ git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}" \
            "pytest==9.1.1" \
            "uv==0.11.28"
          bin_dir="$RUNNER_TEMP/graf-bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/yshishenya/speckit-bootstrap/releases/download/v0.9.9/speckit-bootstrap" \
            --output "$bin_dir/speckit-bootstrap"
          printf '%s  %s\n' "$SPECKIT_BOOTSTRAP_SHA256" "$bin_dir/speckit-bootstrap" | sha256sum --check --status -
          chmod 0755 "$bin_dir/speckit-bootstrap"
          {
            printf '%s\n' "$venv_dir/bin"
            printf '%s\n' "$bin_dir"
            printf '%s\n' "$HOME/.local/bin"
          } >> "$GITHUB_PATH"
          export PATH="$venv_dir/bin:$bin_dir:$HOME/.local/bin:$PATH"
          [[ "$(specify --version)" == "specify ${SPECIFY_CLI_VERSION}" ]]
          specify --version
          speckit-bootstrap --version

      - name: Resolve event identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          identity="$(python3 scripts/ci-event-identity.py "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME")"
          printf '%s\n' "$identity" > "$RUNNER_TEMP/graf-event-identity.json"
          python3 - "$RUNNER_TEMP/graf-event-identity.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for key in ("target_sha", "base_sha", "event_name", "merge_group_id", "concurrency_key"):
                  item = value.get(key)
                  output.write(f"{key}={'' if item is None else item}\n")
              output.write("pull_request_numbers=" + ",".join(str(x) for x in value["pull_request_numbers"]) + "\n")
          PY

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GRAF_CI_REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          checkout_sha="$(git rev-parse HEAD)"
          [[ "${checkout_sha,,}" == "${GRAF_CI_REQUESTED_SHA,,}" ]]
          [[ "${checkout_sha,,}" == "${{ steps.identity.outputs.target_sha }}" ]]

      - name: Verify authoritative merge-group mapping
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${{ steps.identity.outputs.target_sha }}/pulls" \
            > "$RUNNER_TEMP/graf-merge-group-api.json"
          python3 scripts/verify-merge-group-mapping.py \
            --identity "$RUNNER_TEMP/graf-event-identity.json" \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --authoritative-response "$RUNNER_TEMP/graf-merge-group-api.json" \
            | tee "$RUNNER_TEMP/graf-merge-group-verification.json"

      - name: Validate pull request metadata
        if: ${{ github.event_name == 'pull_request' }}
        id: pr_metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          body_path="$RUNNER_TEMP/graf-pr-body.md"
          feature_id_path="$RUNNER_TEMP/graf-feature-id"
          python3 - "$GITHUB_EVENT_PATH" "$body_path" "$feature_id_path" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          event_path, body_path, feature_id_path = map(Path, sys.argv[1:])
          try:
              event = json.loads(event_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"cannot read pull_request event payload: {exc}")
          pull_request = event.get("pull_request")
          body = pull_request.get("body") if isinstance(pull_request, dict) else None
          if not isinstance(body, str) or not body.strip():
              raise SystemExit("pull_request.body is required for metadata validation")
          marker = re.search(r"Feature ID:\s*`?F?(\d{3,})", body)
          if marker is None:
              raise SystemExit("Feature ID is required in pull request body")
          body_path.write_text(body, encoding="utf-8")
          feature_id_path.write_text(marker.group(1), encoding="ascii")
          PY
          feature_id="$(<"$feature_id_path")"
          python3 scripts/validate-pr-metadata.py \
            "$body_path" \
            --feature-id "$feature_id" \
            --expected-sha "$EXPECTED_SHA" \
            --title "$PR_TITLE"

      - name: Run bounded fast lane
        id: fast_lane
        run: infra/scripts/ci-local.sh --fast

      - name: Prepare terminal metadata-only evidence and identity
        if: ${{ always() }}
        id: terminal
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .dev/ci-evidence
          python3 - "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/graf-event-identity.json" "$EVENT_NAME" "$JOB_STATUS" "$GRAF_CI_REQUESTED_SHA" "$RUN_ID" <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import sys
          from pathlib import Path

          event_path, identity_path, event_name, job_status, requested, run_id = sys.argv[1:]
          try:
              payload = json.loads(Path(event_path).read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              payload = {}
          sha_re = re.compile(r"^[0-9a-fA-F]{40}$")
          target = requested if sha_re.fullmatch(requested or "") else "0" * 40
          base = None
          prs = []
          group_id = None
          if event_name == "pull_request":
              pull = payload.get("pull_request") if isinstance(payload, dict) else None
              if isinstance(pull, dict):
                  value = pull.get("base")
                  base = value.get("sha") if isinstance(value, dict) else None
                  number = pull.get("number", payload.get("number"))
                  if isinstance(number, int) and number > 0:
                      prs = [number]
          elif event_name == "merge_group":
              group = payload.get("merge_group") if isinstance(payload, dict) else None
              group = group if isinstance(group, dict) else payload
              base = group.get("base_sha")
              value = group.get("id", group.get("merge_group_id"))
              group_id = value if isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9._:-]{1,256}", value) else f"mg-{target[:12]}"
              rows = group.get("pull_requests")
              if isinstance(rows, list):
                  prs = [row.get("number") if isinstance(row, dict) else row for row in rows]
                  prs = [number for number in prs if isinstance(number, int) and number > 0]
          if not sha_re.fullmatch(base or ""):
              base = None
          safe_event = event_name if event_name in {"pull_request", "merge_group", "workflow_dispatch"} else "workflow_dispatch"
          if not Path(identity_path).is_file():
              if safe_event == "pull_request" and prs:
                  concurrency_key = f"pr-{prs[0]}"
              elif safe_event == "merge_group" and group_id:
                  concurrency_key = f"merge-group-{group_id}"
              else:
                  concurrency_key = f"manual-{target}"
              Path(identity_path).write_text(json.dumps({
                  "schema_version": 1, "event_name": safe_event, "target_sha": target,
                  "base_sha": base, "pull_request_numbers": prs,
                  "merge_group_id": group_id if safe_event == "merge_group" else None,
                  "concurrency_key": concurrency_key,
              }, ensure_ascii=False, sort_keys=True) + "\n", encoding="utf-8")

          evidence_path = Path(os.environ.get("GRAF_CI_EVIDENCE_PATH", ""))
          if not evidence_path.is_file():
              evidence_path = None
              for path in sorted(Path(".dev/ci-evidence").glob("*.json"), reverse=True):
                  if path.name.startswith("receipt-"):
                      continue
                  try:
                      value = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, UnicodeError, json.JSONDecodeError):
                      continue
                  if str(value.get("requested_sha", "")).lower() == target.lower():
                      evidence_path = path
                      break
          if evidence_path is None:
              evidence_path = Path(".dev/ci-evidence") / f"terminal-{run_id}.json"
              now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
              status = "cancelled" if job_status == "cancelled" else "failed"
              evidence_path.write_text(json.dumps({
                  "run_id": f"ci-terminal-{run_id}", "lane": "fast",
                  "requested_sha": target, "observed_sha_start": target,
                  "observed_sha_end": target, "status": status,
                  "started_at": (now - dt.timedelta(seconds=1)).isoformat().replace("+00:00", "Z"),
                  "finished_at": now.isoformat().replace("+00:00", "Z"),
                  "commands": ["governance-fast terminal receipt fallback"],
                  "skipped_gates": [], "scope": "github-actions terminal fallback",
                  "reason": f"workflow_{status}_before_ci_evidence",
                  "artifact_digests": {"terminal-fallback": "sha256:" + "0" * 64},
                  "component_shas": {"repository": target},
              }, ensure_ascii=False, sort_keys=True) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"evidence_path={evidence_path}\n")
          PY

      - name: Create metadata-only CI receipt
        if: ${{ always() }}
        id: receipt
        shell: bash
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/emit-ci-receipt.py \
            --identity "$RUNNER_TEMP/graf-event-identity.json" \
            --evidence "${{ steps.terminal.outputs.evidence_path }}" \
            --output ".dev/ci-evidence/receipt-${RUN_ID}.json" \
            --workflow "${GITHUB_WORKFLOW}" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow-url "$WORKFLOW_URL"
          printf 'path=.dev/ci-evidence/receipt-%s.json\n' "$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Validate metadata-only evidence
        if: ${{ always() }}
        id: validate_evidence
        run: python3 scripts/validate-ci-evidence.py "${{ steps.terminal.outputs.evidence_path }}"

      - name: Validate metadata-only CI receipt
        if: ${{ always() }}
        id: validate_receipt
        run: python3 scripts/validate-ci-receipt.py "${{ steps.receipt.outputs.path }}"

      - name: Assert mandatory governance outcomes
        if: ${{ always() }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_METADATA_OUTCOME: ${{ steps.pr_metadata.outcome }}
          FAST_LANE_OUTCOME: ${{ steps.fast_lane.outcome }}
          TERMINAL_OUTCOME: ${{ steps.terminal.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
          EVIDENCE_VALIDATION_OUTCOME: ${{ steps.validate_evidence.outcome }}
          RECEIPT_VALIDATION_OUTCOME: ${{ steps.validate_receipt.outcome }}
        run: |
          set -euo pipefail
          failures=()
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_METADATA_OUTCOME" != "success" ]]; then
            failures+=("pr_metadata:$PR_METADATA_OUTCOME")
          fi
          if [[ "$FAST_LANE_OUTCOME" != "success" ]]; then
            failures+=("fast_lane:$FAST_LANE_OUTCOME")
          fi
          if [[ "$TERMINAL_OUTCOME" != "success" ]]; then
            failures+=("terminal:$TERMINAL_OUTCOME")
          fi
          if [[ "$RECEIPT_OUTCOME" != "success" ]]; then
            failures+=("receipt:$RECEIPT_OUTCOME")
          fi
          if [[ "$EVIDENCE_VALIDATION_OUTCOME" != "success" ]]; then
            failures+=("evidence_validation:$EVIDENCE_VALIDATION_OUTCOME")
          fi
          if [[ "$RECEIPT_VALIDATION_OUTCOME" != "success" ]]; then
            failures+=("receipt_validation:$RECEIPT_VALIDATION_OUTCOME")
          fi
          if (( ${#failures[@]} > 0 )); then
            printf 'governance-fast: mandatory outcome failure: %s\n' "${failures[*]}" >&2
            exit 1
          fi

      - name: Upload metadata-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: graf-governance-fast-evidence
          path: |
            ${{ steps.terminal.outputs.evidence_path }}
            ${{ steps.receipt.outputs.path }}
            ${{ runner.temp }}/graf-merge-group-api.json
            ${{ runner.temp }}/graf-merge-group-verification.json
          if-no-files-found: warn
          retention-days: 14
