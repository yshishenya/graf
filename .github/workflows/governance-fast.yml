name: governance-fast

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      requested_sha:
        description: Full commit SHA to audit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: >-
    graf-governance-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.id) ||
      format('manual-{0}', inputs.requested_sha)
    }}
  cancel-in-progress: true

jobs:
  governance-fast:
    name: governance-fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRAF_CI_REQUESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || inputs.requested_sha }}
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve event identity
        id: identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          identity="$(python3 scripts/ci-event-identity.py "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME")"
          printf '%s\n' "$identity" > "$RUNNER_TEMP/graf-event-identity.json"
          python3 - "$RUNNER_TEMP/graf-event-identity.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for key in ("target_sha", "base_sha", "event_name", "merge_group_id", "concurrency_key"):
                  item = value.get(key)
                  output.write(f"{key}={'' if item is None else item}\n")
              output.write("pull_request_numbers=" + ",".join(str(x) for x in value["pull_request_numbers"]) + "\n")
          PY

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GRAF_CI_REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          checkout_sha="$(git rev-parse HEAD)"
          [[ "${checkout_sha,,}" == "${GRAF_CI_REQUESTED_SHA,,}" ]]
          [[ "${checkout_sha,,}" == "${{ steps.identity.outputs.target_sha }}" ]]

      - name: Verify authoritative merge-group mapping
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${{ steps.identity.outputs.target_sha }}/pulls" \
            > "$RUNNER_TEMP/graf-merge-group-api.json"
          python3 scripts/verify-merge-group-mapping.py \
            --identity "$RUNNER_TEMP/graf-event-identity.json" \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --authoritative-response "$RUNNER_TEMP/graf-merge-group-api.json" \
            | tee "$RUNNER_TEMP/graf-merge-group-verification.json"

      - name: Run bounded fast lane
        run: infra/scripts/ci-local.sh --fast

      - name: Prepare terminal metadata-only evidence and identity
        if: ${{ always() }}
        id: terminal
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p .dev/ci-evidence
          python3 - "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/graf-event-identity.json" "$EVENT_NAME" "$JOB_STATUS" "$GRAF_CI_REQUESTED_SHA" "$RUN_ID" <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import sys
          from pathlib import Path

          event_path, identity_path, event_name, job_status, requested, run_id = sys.argv[1:]
          try:
              payload = json.loads(Path(event_path).read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              payload = {}
          sha_re = re.compile(r"^[0-9a-fA-F]{40}$")
          target = requested if sha_re.fullmatch(requested or "") else "0" * 40
          base = None
          prs = []
          group_id = None
          if event_name == "pull_request":
              pull = payload.get("pull_request") if isinstance(payload, dict) else None
              if isinstance(pull, dict):
                  value = pull.get("base")
                  base = value.get("sha") if isinstance(value, dict) else None
                  number = pull.get("number", payload.get("number"))
                  if isinstance(number, int) and number > 0:
                      prs = [number]
          elif event_name == "merge_group":
              group = payload.get("merge_group") if isinstance(payload, dict) else None
              group = group if isinstance(group, dict) else payload
              base = group.get("base_sha")
              value = group.get("id", group.get("merge_group_id"))
              group_id = value if isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9._:-]{1,256}", value) else None
              rows = group.get("pull_requests")
              if isinstance(rows, list):
                  prs = [row.get("number") if isinstance(row, dict) else row for row in rows]
                  prs = [number for number in prs if isinstance(number, int) and number > 0]
          if not sha_re.fullmatch(base or ""):
              base = None
          safe_event = event_name if event_name in {"pull_request", "merge_group", "workflow_dispatch"} else "workflow_dispatch"
          if not Path(identity_path).is_file():
              if safe_event == "pull_request" and prs:
                  concurrency_key = f"pr-{prs[0]}"
              elif safe_event == "merge_group" and group_id:
                  concurrency_key = f"merge-group-{group_id}"
              else:
                  concurrency_key = f"manual-{target}"
              Path(identity_path).write_text(json.dumps({
                  "schema_version": 1, "event_name": safe_event, "target_sha": target,
                  "base_sha": base, "pull_request_numbers": prs,
                  "merge_group_id": group_id if safe_event == "merge_group" else None,
                  "concurrency_key": concurrency_key,
              }, ensure_ascii=False, sort_keys=True) + "\n", encoding="utf-8")

          evidence_path = None
          for path in sorted(Path(".dev/ci-evidence").glob("*.json"), reverse=True):
              if path.name.startswith("receipt-"):
                  continue
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  continue
              if str(value.get("requested_sha", "")).lower() == target.lower():
                  evidence_path = path
                  break
          if evidence_path is None:
              evidence_path = Path(".dev/ci-evidence") / f"terminal-{run_id}.json"
              now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
              status = "cancelled" if job_status == "cancelled" else "failed"
              evidence_path.write_text(json.dumps({
                  "run_id": f"ci-terminal-{run_id}", "lane": "fast",
                  "requested_sha": target, "observed_sha_start": target,
                  "observed_sha_end": target, "status": status,
                  "started_at": (now - dt.timedelta(seconds=1)).isoformat().replace("+00:00", "Z"),
                  "finished_at": now.isoformat().replace("+00:00", "Z"),
                  "commands": ["governance-fast terminal receipt fallback"],
                  "skipped_gates": [], "scope": "github-actions terminal fallback",
                  "reason": f"workflow_{status}_before_ci_evidence",
                  "artifact_digests": {"terminal-fallback": "sha256:" + "0" * 64},
                  "component_shas": {"repository": target},
              }, ensure_ascii=False, sort_keys=True) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"evidence_path={evidence_path}\n")
          PY

      - name: Create metadata-only CI receipt
        if: ${{ always() }}
        id: receipt
        shell: bash
        continue-on-error: true
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/emit-ci-receipt.py \
            --identity "$RUNNER_TEMP/graf-event-identity.json" \
            --evidence "${{ steps.terminal.outputs.evidence_path }}" \
            --output ".dev/ci-evidence/receipt-${RUN_ID}.json" \
            --workflow "${GITHUB_WORKFLOW}" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow-url "$WORKFLOW_URL"
          printf 'path=.dev/ci-evidence/receipt-%s.json\n' "$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Validate metadata-only evidence
        if: ${{ always() }}
        continue-on-error: true
        run: python3 scripts/validate-ci-evidence.py "${{ steps.terminal.outputs.evidence_path }}"

      - name: Validate metadata-only CI receipt
        if: ${{ always() }}
        continue-on-error: true
        run: python3 scripts/validate-ci-receipt.py "${{ steps.receipt.outputs.path }}"

      - name: Upload metadata-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: graf-governance-fast-evidence
          path: |
            ${{ steps.terminal.outputs.evidence_path }}
            ${{ steps.receipt.outputs.path }}
            ${{ runner.temp }}/graf-merge-group-api.json
            ${{ runner.temp }}/graf-merge-group-verification.json
          if-no-files-found: error
          retention-days: 14
