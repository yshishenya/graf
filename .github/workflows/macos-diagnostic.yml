name: macos-diagnostic

on:
  workflow_dispatch:
    inputs:
      requested_sha:
        description: Exact 40-character SHA to diagnose
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: graf-macos-diagnostic-${{ inputs.requested_sha }}
  cancel-in-progress: true

jobs:
  macos-diagnostic:
    name: macOS diagnostic (non-authoritative)
    runs-on: macos-14
    timeout-minutes: 45
    env:
      REQUESTED_SHA: ${{ inputs.requested_sha }}
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          checkout_sha="$(git rev-parse HEAD)"
          [[ "$checkout_sha" == "$REQUESTED_SHA" ]]
          [[ "$(uname -m)" == "arm64" ]]

      - name: Select installed Swift 6.0.3
        shell: bash
        run: |
          set -euo pipefail
          toolchain_bin=/Applications/Xcode_16.2.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin
          developer_before="$(/usr/bin/xcode-select -p)"
          sdk_before="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          [[ -n "$developer_before" && -n "$sdk_before" ]]
          for tool in swift swiftc; do
            [[ -x "$toolchain_bin/$tool" ]]
            tool_version="$("$toolchain_bin/$tool" --version)"
            [[ "$tool_version" =~ (^|[[:space:]])Swift[[:space:]]version[[:space:]]6\.0\.3([[:space:]]|$) ]]
            printf '%s\n%s\n' "$toolchain_bin/$tool" "$tool_version"
          done
          export PATH="$toolchain_bin:$PATH"
          [[ "$(command -v swift)" == "$toolchain_bin/swift" ]]
          [[ "$(command -v swiftc)" == "$toolchain_bin/swiftc" ]]
          developer_after="$(/usr/bin/xcode-select -p)"
          sdk_after="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"
          [[ "$developer_before" == "$developer_after" && "$sdk_before" == "$sdk_after" ]]
          printf 'developer=%s\nsdk=%s\n' "$developer_after" "$sdk_after"
          printf '%s\n' "$toolchain_bin" >> "$GITHUB_PATH"

      - name: Run macOS diagnostic
        shell: bash
        run: |
          set -euo pipefail
          sh apps/macos/Scripts/validate-no-legacy-audio-driver.sh
          swift build --package-path apps/macos
          bash apps/macos/Scripts/run-swift-tests.sh
          swift run --package-path apps/macos ContractValidation
