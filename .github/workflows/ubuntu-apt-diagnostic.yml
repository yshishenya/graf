name: Ubuntu APT diagnosis (temporary, non-authoritative)

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]
    paths: [.github/workflows/ubuntu-apt-diagnostic.yml]

permissions: {}

jobs:
  apt-metadata:
    name: APT metadata (${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        sample: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Read bounded public source metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          def describe(uri):
              if uri == "mirror+file:/etc/apt/apt-mirrors.txt":
                  return {"kind": "mirror_list"}
              try:
                  value = urlsplit(uri)
                  host = value.hostname or ""
                  if (value.scheme in {"http", "https"}
                          and len(host) <= 253
                          and re.fullmatch(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)*ubuntu\.com", host)
                          and all(32 < ord(char) < 127 for char in uri)
                          and value.netloc.lower() == host
                          and value.path in {"/ubuntu", "/ubuntu/"}
                          and value.username is None and value.password is None
                          and value.port is None and not value.query and not value.fragment):
                      return {"kind": "ubuntu_uri", "scheme": value.scheme,
                              "host": host, "path": value.path}
              except ValueError:
                  pass
              return {"kind": "UNKNOWN", "sha256": hashlib.sha256(uri.encode()).hexdigest()}

          for name in ("sources.list.d/ubuntu.sources", "apt-mirrors.txt"):
              path = Path("/etc/apt") / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 16384:
                  raise SystemExit("APT diagnostic: missing, linked or oversized file")
              data = path.read_bytes()
              if len(data) > 16384:
                  raise SystemExit("APT diagnostic: oversized file")
              uris = [describe(uri) for line in data.decode().splitlines()
                      if line.lower().startswith("uris:") for uri in line.split(":", 1)[1].split()]
              print(json.dumps({"file": name, "size": len(data),
                                "sha256": hashlib.sha256(data).hexdigest(), "uris": uris}))
          PY
