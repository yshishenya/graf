name: release-full

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Immutable release-candidate ID from release-candidate.sh
        required: true
        type: string
      requested_sha:
        description: Exact 40-character post-merge master SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: graf-release-full-${{ inputs.candidate_id }}
  cancel-in-progress: false

jobs:
  reserve:
    name: reserve candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_key: ${{ steps.identity.outputs.artifact_key }}
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate identity and reserve once
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_ID" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags --depth=1 origin master
          master_sha="$(git rev-parse origin/master)"
          checkout_sha="$(git rev-parse HEAD)"
          [[ "${checkout_sha,,}" == "${REQUESTED_SHA,,}" ]]
          [[ "${master_sha,,}" == "${REQUESTED_SHA,,}" ]]
          artifact_key="$(printf '%s' "$CANDIDATE_ID" | sed 's/[^A-Za-z0-9._-]/-/g')"
          [[ -n "$artifact_key" ]]
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name')"
          if printf '%s\n' "$existing" | grep -Fxq "graf-full-lock-${artifact_key}" \
            || printf '%s\n' "$existing" | grep -Fxq "graf-full-ci-${artifact_key}"; then
            echo "candidate_already_reserved: ${CANDIDATE_ID}" >&2
            exit 1
          fi
          printf 'artifact_key=%s\n' "$artifact_key" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/graf-candidate-reservation.json" <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import sys

          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          payload = {
              "schema_version": 1,
              "candidate_id": os.environ["CANDIDATE_ID"],
              "requested_sha": os.environ["REQUESTED_SHA"].lower(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "status": "reserved",
              "reserved_at": now,
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload create-once reservation
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-lock-${{ steps.identity.outputs.artifact_key }}
          path: ${{ runner.temp }}/graf-candidate-reservation.json
          if-no-files-found: error
          retention-days: 90

  server-static:
    name: Ubuntu static and governance full
    needs: reserve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure fixture git identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install production-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node for browser behavior tests
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Install frozen test toolchain
        shell: bash
        env:
          SPECIFY_CLI_VERSION: "1.0.7"
          SPEC_KIT_REF: fe1d00e3ccaf495880aaf90fb0e17679e82f065b
          SPECKIT_BOOTSTRAP_SHA256: d6b0bee447aa62aa97b04c5aba081360e166bed240049fdbfd269ff8ca494aaf
        run: |
          set -euo pipefail
          venv_dir="$RUNNER_TEMP/graf-specify-venv"
          python3 -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --disable-pip-version-check \
            "specify-cli @ git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}" \
            "pytest==9.1.1" \
            "uv==0.11.28"
          bin_dir="$RUNNER_TEMP/graf-bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/yshishenya/speckit-bootstrap/releases/download/v0.9.10/speckit-bootstrap" \
            --output "$bin_dir/speckit-bootstrap"
          printf '%s  %s\n' "$SPECKIT_BOOTSTRAP_SHA256" "$bin_dir/speckit-bootstrap" | sha256sum --check --status -
          chmod 0755 "$bin_dir/speckit-bootstrap"
          {
            printf '%s\n' "$venv_dir/bin"
            printf '%s\n' "$bin_dir"
            printf '%s\n' "$HOME/.local/bin"
          } >> "$GITHUB_PATH"
          export PATH="$venv_dir/bin:$bin_dir:$HOME/.local/bin:$PATH"
          [[ "$(specify --version)" == "specify ${SPECIFY_CLI_VERSION}" ]]
          speckit-bootstrap --version

      - name: Cache pinned browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/server/tests/browser/package-lock.json') }}

      - name: Run Ubuntu static and governance component
        shell: bash
        run: |
          set +e
          result_path="$RUNNER_TEMP/server-static-result.json"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (
            set -euo pipefail
            (cd apps/server && PYTHONPATH=src uv run --extra dev ruff check .)
            python3 -m compileall -q apps/server/src apps/server/tests apps/server/scripts
            python3 scripts/check_spec_kit_governance.py
            pytest -q tests/governance
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=harness/src \
              python3 -c 'from dev_harness.validators import self_test; raise SystemExit(self_test())'
            while IFS= read -r shell_path; do
              [[ -z "$shell_path" ]] || bash -n "$shell_path"
            done < <(git ls-files '*.sh')
            sh apps/macos/Scripts/validate-no-legacy-audio-driver.sh
            docker compose -f infra/docker-compose.yml config >/dev/null
            infra/scripts/scan-deployment-evidence.sh docs/deployments/2brain-rec
            python3 scripts/check-development-process.py
            python3 scripts/validate-full-ci-workflow.py .github/workflows/release-full.yml
            git diff --check
          )
          component_status=$?
          status=passed
          if (( component_status != 0 )); then status=failed; fi
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$result_path" "$status" "$started_at" "$finished_at" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path, status, started, finished = sys.argv[1:]
          value = {
              "schema_version": 1,
              "component": "server",
              "status": status,
              "requested_sha": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_start": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_end": os.environ["REQUESTED_SHA"].lower(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "started_at": started,
              "finished_at": finished,
              "skipped_gates": [],
          }
          pathlib.Path(path).write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY
          exit "$component_status"

      - name: Upload metadata-only server static result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-component-server-${{ needs.reserve.outputs.artifact_key }}-${{ github.run_id }}-static
          path: ${{ runner.temp }}/server-static-result.json
          if-no-files-found: error
          retention-days: 90

  server-phases:
    name: Ubuntu postgres strict and performance
    needs: reserve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure fixture git identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install production-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node for browser behavior tests
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Install frozen test toolchain
        shell: bash
        env:
          SPECIFY_CLI_VERSION: "1.0.7"
          SPEC_KIT_REF: fe1d00e3ccaf495880aaf90fb0e17679e82f065b
          SPECKIT_BOOTSTRAP_SHA256: d6b0bee447aa62aa97b04c5aba081360e166bed240049fdbfd269ff8ca494aaf
        run: |
          set -euo pipefail
          venv_dir="$RUNNER_TEMP/graf-specify-venv"
          python3 -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --disable-pip-version-check \
            "specify-cli @ git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}" \
            "pytest==9.1.1" \
            "uv==0.11.28"
          bin_dir="$RUNNER_TEMP/graf-bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/yshishenya/speckit-bootstrap/releases/download/v0.9.10/speckit-bootstrap" \
            --output "$bin_dir/speckit-bootstrap"
          printf '%s  %s\n' "$SPECKIT_BOOTSTRAP_SHA256" "$bin_dir/speckit-bootstrap" | sha256sum --check --status -
          chmod 0755 "$bin_dir/speckit-bootstrap"
          {
            printf '%s\n' "$venv_dir/bin"
            printf '%s\n' "$bin_dir"
            printf '%s\n' "$HOME/.local/bin"
          } >> "$GITHUB_PATH"
          export PATH="$venv_dir/bin:$bin_dir:$HOME/.local/bin:$PATH"
          [[ "$(specify --version)" == "specify ${SPECIFY_CLI_VERSION}" ]]
          speckit-bootstrap --version

      - name: Cache pinned browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/server/tests/browser/package-lock.json') }}

      - name: Prepare pinned browser test resources
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -nostdin -version >/dev/null
          ffprobe -version >/dev/null
          npm ci --ignore-scripts --prefix apps/server/tests/browser
          apps/server/tests/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Run Ubuntu postgres strict and performance component
        env:
          GRAF_TEST_REPORT_DIR: ${{ runner.temp }}/test-timings
        shell: bash
        run: |
          set +e
          result_path="$RUNNER_TEMP/server-phases-result.json"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (
            set -euo pipefail
            GRAF_TEST_WORKERS=4 GRAF_PERFORMANCE_GATE=required \
              bash apps/server/scripts/run_local_postgres_tests.sh \
              --focused --partitioned --phases strict,performance -q
            (cd apps/server && PYTHONPATH=src uv run python scripts/verify_rls_hardening.py)
          )
          component_status=$?
          status=passed
          if (( component_status != 0 )); then status=failed; fi
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$result_path" "$status" "$started_at" "$finished_at" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path, status, started, finished = sys.argv[1:]
          value = {
              "schema_version": 1,
              "component": "server",
              "status": status,
              "requested_sha": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_start": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_end": os.environ["REQUESTED_SHA"].lower(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "started_at": started,
              "finished_at": finished,
              "skipped_gates": [],
          }
          pathlib.Path(path).write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY
          exit "$component_status"

      - name: Upload safe test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graf-test-timings-${{ inputs.requested_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-phases
          path: ${{ runner.temp }}/test-timings/*.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Upload metadata-only server phases result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-component-server-${{ needs.reserve.outputs.artifact_key }}-${{ github.run_id }}-phases
          path: ${{ runner.temp }}/server-phases-result.json
          if-no-files-found: error
          retention-days: 90

  server-parallel:
    name: Ubuntu postgres parallel shard
    needs: reserve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Every part keeps running after a sibling fails so the aggregating job can
    # always check the coverage proof of all parts at once.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure fixture git identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install production-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node for browser behavior tests
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Install frozen test toolchain
        shell: bash
        env:
          SPECIFY_CLI_VERSION: "1.0.7"
          SPEC_KIT_REF: fe1d00e3ccaf495880aaf90fb0e17679e82f065b
          SPECKIT_BOOTSTRAP_SHA256: d6b0bee447aa62aa97b04c5aba081360e166bed240049fdbfd269ff8ca494aaf
        run: |
          set -euo pipefail
          venv_dir="$RUNNER_TEMP/graf-specify-venv"
          python3 -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --disable-pip-version-check \
            "specify-cli @ git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}" \
            "pytest==9.1.1" \
            "uv==0.11.28"
          bin_dir="$RUNNER_TEMP/graf-bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/yshishenya/speckit-bootstrap/releases/download/v0.9.10/speckit-bootstrap" \
            --output "$bin_dir/speckit-bootstrap"
          printf '%s  %s\n' "$SPECKIT_BOOTSTRAP_SHA256" "$bin_dir/speckit-bootstrap" | sha256sum --check --status -
          chmod 0755 "$bin_dir/speckit-bootstrap"
          {
            printf '%s\n' "$venv_dir/bin"
            printf '%s\n' "$bin_dir"
            printf '%s\n' "$HOME/.local/bin"
          } >> "$GITHUB_PATH"
          export PATH="$venv_dir/bin:$bin_dir:$HOME/.local/bin:$PATH"
          [[ "$(specify --version)" == "specify ${SPECIFY_CLI_VERSION}" ]]
          speckit-bootstrap --version

      - name: Cache pinned browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/server/tests/browser/package-lock.json') }}

      - name: Prepare pinned browser test resources
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -nostdin -version >/dev/null
          ffprobe -version >/dev/null
          npm ci --ignore-scripts --prefix apps/server/tests/browser
          apps/server/tests/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Run Ubuntu postgres parallel shard component
        shell: bash
        env:
          GRAF_TEST_REPORT_DIR: ${{ runner.temp }}/test-timings
        run: |
          set +e
          result_path="$RUNNER_TEMP/server-shard-${{ matrix.shard }}-result.json"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (
            set -euo pipefail
            GRAF_TEST_WORKERS=4 bash apps/server/scripts/run_local_postgres_tests.sh \
              --focused --partitioned --phases parallel --shard ${{ matrix.shard }}/4 -q
          )
          component_status=$?
          if (( component_status == 0 )); then
            for evidence in parallel-full-nodeids shard-nodeids; do
              if [[ ! -s "$GRAF_TEST_REPORT_DIR/${evidence}-${{ matrix.shard }}.txt" ]]; then
                printf 'missing shard coverage evidence: %s-%s.txt\n' "$evidence" "${{ matrix.shard }}" >&2
                component_status=1
              fi
            done
          fi
          status=passed
          if (( component_status != 0 )); then status=failed; fi
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$result_path" "$status" "$started_at" "$finished_at" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path, status, started, finished = sys.argv[1:]
          value = {
              "schema_version": 1,
              "component": "server",
              "status": status,
              "requested_sha": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_start": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_end": os.environ["REQUESTED_SHA"].lower(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "started_at": started,
              "finished_at": finished,
              "skipped_gates": [],
          }
          pathlib.Path(path).write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY
          exit "$component_status"

      - name: Upload safe test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graf-test-timings-${{ inputs.requested_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-timings/*.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Upload metadata-only server shard result and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-component-server-${{ needs.reserve.outputs.artifact_key }}-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/server-shard-${{ matrix.shard }}-result.json
            ${{ runner.temp }}/test-timings/parallel-full-nodeids-${{ matrix.shard }}.txt
            ${{ runner.temp }}/test-timings/shard-nodeids-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 90

  macos-full:
    name: macOS Swift full
    needs: reserve
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Swift 6 toolchain
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.0.3"

      - name: Cache Swift build
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/macos/.build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          # The .build tree holds compiled outputs for repository sources, so the
          # key must change with them; caches are immutable, so a key based on the
          # dependency lockfile alone kept restoring a stale build state.
          key: swift-${{ runner.os }}-${{ runner.arch }}-spm6.0.3-${{ hashFiles('apps/macos/Package.resolved') }}-${{ hashFiles('apps/macos/**/*.swift', 'apps/macos/Package.swift') }}-v2
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-spm6.0.3-

      - name: Refresh restored build timestamps
        if: steps.swift-cache.outputs.cache-hit == 'true'
        shell: bash
        # actions/checkout writes sources after the restore, so freshly restored
        # outputs look older than the checkout; llbuild would then rebuild all
        # modules. Touch the restored artifacts so incremental state is honored.
        run: find apps/macos/.build -exec touch {} +

      - name: Run macOS full component
        shell: bash
        run: |
          set +e
          result_path="$RUNNER_TEMP/macos-result.json"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (
            set -euo pipefail
            [[ "$(uname -m)" == "arm64" ]]
            while IFS= read -r shell_path; do
              [[ -z "$shell_path" ]] || bash -n "$shell_path"
            done < <(git ls-files '*.sh')
            sh apps/macos/Scripts/validate-no-legacy-audio-driver.sh
            swift build --package-path apps/macos
            bash apps/macos/Scripts/run-swift-tests.sh
            swift run --package-path apps/macos ContractValidation
          )
          component_status=$?
          status=passed
          if (( component_status != 0 )); then status=failed; fi
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$result_path" "$status" "$started_at" "$finished_at" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path, status, started, finished = sys.argv[1:]
          value = {
              "schema_version": 1,
              "component": "macos_app",
              "status": status,
              "requested_sha": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_start": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_end": os.environ["REQUESTED_SHA"].lower(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "started_at": started,
              "finished_at": finished,
              "skipped_gates": [],
          }
          pathlib.Path(path).write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY
          exit "$component_status"

      - name: Upload metadata-only macOS result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-component-macos-${{ needs.reserve.outputs.artifact_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate authoritative Full CI
    if: always()
    needs: [reserve, server-static, server-phases, server-parallel, macos-full]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
      ARTIFACT_KEY: ${{ needs.reserve.outputs.artifact_key }}
    steps:
      - name: Require all component jobs to pass
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.reserve.result }}" == success ]]
          [[ "${{ needs.server-static.result }}" == success ]]
          [[ "${{ needs.server-phases.result }}" == success ]]
          [[ "${{ needs.server-parallel.result }}" == success ]]
          [[ "${{ needs.macos-full.result }}" == success ]]

      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download component results
        uses: actions/download-artifact@v4
        with:
          pattern: graf-full-component-*-${{ needs.reserve.outputs.artifact_key }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/graf-full-components

      - name: Validate component results and emit authoritative evidence
        shell: bash
        run: |
          set -euo pipefail
          component_dir="$RUNNER_TEMP/graf-full-components"
          python3 - "$component_dir" <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          expected = {
              "server-static-result.json": "server",
              "server-phases-result.json": "server",
              "server-shard-0-result.json": "server",
              "server-shard-1-result.json": "server",
              "server-shard-2-result.json": "server",
              "server-shard-3-result.json": "server",
              "macos-result.json": "macos_app",
          }
          # Artifacts keep the directory layout they were uploaded with, so the
          # coverage evidence arrives under test-timings/ while the component
          # results sit at the root.  Index every file by name instead of
          # assuming one flat directory.
          by_name = {path.name: path for path in root.rglob("*") if path.is_file()}
          files = {name: path for name, path in by_name.items() if name.endswith("-result.json")}
          if set(files) != set(expected):
              raise SystemExit(f"unexpected component result set: {sorted(files)}")
          requested = os.environ["REQUESTED_SHA"].lower()
          for filename, component in expected.items():
              value = json.loads(files[filename].read_text(encoding="utf-8"))
              if value.get("component") != component or value.get("status") != "passed":
                  raise SystemExit(f"component failed: {filename}")
              if any(str(value.get(key, "")).lower() != requested for key in (
                  "requested_sha", "observed_sha_start", "observed_sha_end"
              )):
                  raise SystemExit(f"component SHA mismatch: {filename}")
              if value.get("skipped_gates") != []:
                  raise SystemExit(f"component skipped gates: {filename}")
          # Доказательство полноты: части должны ровно покрывать полный список
          # фазы parallel. Пропуск или повтор теста обязан провалить проверку.
          full_lists = {}
          union = []
          for index in range(4):
              full_path = by_name.get(f"parallel-full-nodeids-{index}.txt")
              shard_path = by_name.get(f"shard-nodeids-{index}.txt")
              if full_path is None or shard_path is None:
                  raise SystemExit(f"shard coverage evidence missing for shard {index}")
              full = [line for line in full_path.read_text(encoding="utf-8").splitlines() if line]
              shard = [line for line in shard_path.read_text(encoding="utf-8").splitlines() if line]
              if not full or not shard:
                  raise SystemExit(f"shard coverage evidence empty for shard {index}")
              full_lists[index] = full
              union.extend(shard)
          digests = {tuple(sorted(nodes)) for nodes in full_lists.values()}
          if len(digests) != 1:
              raise SystemExit("shards collected different test sets")
          expected_nodes = sorted(full_lists[0])
          if sorted(union) != expected_nodes:
              raise SystemExit("shard union does not cover the full parallel test set")
          if len(union) != len(set(union)):
              raise SystemExit("shard union repeats test cases")
          PY
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          finished_at="$(date -u -v+1S +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d '1 second' +%Y-%m-%dT%H:%M:%SZ)"
          evidence_path=".dev/ci-evidence/authoritative-${CANDIDATE_ID}.json"
          mkdir -p .dev/ci-evidence
          python3 scripts/emit-ci-evidence.py \
            --output "$evidence_path" \
            --run-id "github-full-${GITHUB_RUN_ID}" \
            --lane full \
            --requested-sha "$REQUESTED_SHA" \
            --observed-sha-start "$REQUESTED_SHA" \
            --observed-sha-end "$REQUESTED_SHA" \
            --status passed \
            --started-at "$started_at" \
            --finished-at "$finished_at" \
            --command "GitHub Actions release-full: Ubuntu server/infrastructure + macOS Swift" \
            --scope "frozen release candidate" \
            --candidate-id "$CANDIDATE_ID" \
            --authoritative-full \
            --component-sha "repository=$REQUESTED_SHA" \
            --component-sha "server=$REQUESTED_SHA" \
            --component-sha "macos_app=$REQUESTED_SHA" \
            --artifact "server-static-result=$component_dir/server-static-result.json" \
            --artifact "server-phases-result=$component_dir/server-phases-result.json" \
            --artifact "server-shard-0-result=$component_dir/server-shard-0-result.json" \
            --artifact "server-shard-1-result=$component_dir/server-shard-1-result.json" \
            --artifact "server-shard-2-result=$component_dir/server-shard-2-result.json" \
            --artifact "server-shard-3-result=$component_dir/server-shard-3-result.json" \
            --artifact "macos-result=$component_dir/macos-result.json" \
            --artifact "parallel-full-nodeids-0=$component_dir/parallel-full-nodeids-0.txt" \
            --artifact "parallel-full-nodeids-1=$component_dir/parallel-full-nodeids-1.txt" \
            --artifact "parallel-full-nodeids-2=$component_dir/parallel-full-nodeids-2.txt" \
            --artifact "parallel-full-nodeids-3=$component_dir/parallel-full-nodeids-3.txt" \
            --artifact "shard-nodeids-0=$component_dir/shard-nodeids-0.txt" \
            --artifact "shard-nodeids-1=$component_dir/shard-nodeids-1.txt" \
            --artifact "shard-nodeids-2=$component_dir/shard-nodeids-2.txt" \
            --artifact "shard-nodeids-3=$component_dir/shard-nodeids-3.txt"
          python3 scripts/validate-ci-evidence.py "$evidence_path"
          python3 - "$RUNNER_TEMP/graf-full-identity.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          value = {
              "schema_version": 1,
              "event_name": "workflow_dispatch",
              "target_sha": os.environ["REQUESTED_SHA"].lower(),
              "base_sha": os.environ["REQUESTED_SHA"].lower(),
              "pull_request_numbers": [],
              "merge_group_id": None,
              "concurrency_key": "manual-" + os.environ["CANDIDATE_ID"],
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 scripts/emit-ci-receipt.py \
            --identity "$RUNNER_TEMP/graf-full-identity.json" \
            --evidence "$evidence_path" \
            --output ".dev/ci-evidence/receipt-${GITHUB_RUN_ID}.json" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 scripts/validate-ci-receipt.py ".dev/ci-evidence/receipt-${GITHUB_RUN_ID}.json"

      - name: Upload one authoritative evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-ci-${{ needs.reserve.outputs.artifact_key }}
          path: .dev/ci-evidence/
          if-no-files-found: error
          retention-days: 90
