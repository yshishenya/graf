name: release-full

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Immutable release-candidate ID from release-candidate.sh
        required: true
        type: string
      requested_sha:
        description: Exact 40-character post-merge master SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: graf-release-full-${{ inputs.candidate_id }}
  cancel-in-progress: false

jobs:
  reserve:
    name: reserve candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_key: ${{ steps.identity.outputs.artifact_key }}
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate identity and reserve once
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_ID" =~ ^[A-Za-z0-9._:-]{1,160}$ ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags --depth=1 origin master
          master_sha="$(git rev-parse origin/master)"
          checkout_sha="$(git rev-parse HEAD)"
          [[ "${checkout_sha,,}" == "${REQUESTED_SHA,,}" ]]
          [[ "${master_sha,,}" == "${REQUESTED_SHA,,}" ]]
          artifact_key="$(printf '%s' "$CANDIDATE_ID" | sed 's/[^A-Za-z0-9._-]/-/g')"
          [[ -n "$artifact_key" ]]
          existing="$({
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .name'
          } || true)"
          if printf '%s\n' "$existing" | grep -Fxq "graf-full-lock-${artifact_key}" \
            || printf '%s\n' "$existing" | grep -Fxq "graf-full-ci-${artifact_key}"; then
            echo "candidate_already_reserved: ${CANDIDATE_ID}" >&2
            exit 1
          fi
          printf 'artifact_key=%s\n' "$artifact_key" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/graf-candidate-reservation.json" <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import sys

          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          payload = {
              "schema_version": 1,
              "candidate_id": os.environ["CANDIDATE_ID"],
              "requested_sha": os.environ["REQUESTED_SHA"].lower(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "status": "reserved",
              "reserved_at": now,
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload create-once reservation
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-lock-${{ steps.identity.outputs.artifact_key }}
          path: ${{ runner.temp }}/graf-candidate-reservation.json
          if-no-files-found: error
          retention-days: 90

  server-full:
    name: Ubuntu server and infrastructure full
    needs: reserve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure fixture git identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install frozen test toolchain
        shell: bash
        env:
          SPECIFY_CLI_VERSION: "1.0.1"
          SPEC_KIT_REF: 9118ed15a0ba65053469a94c560ea5d233f75884
          SPECKIT_BOOTSTRAP_SHA256: bdbfa1d56ab567de209ed55e2d2992284315bac43597a7c9f63f4f95b330a71c
        run: |
          set -euo pipefail
          venv_dir="$RUNNER_TEMP/graf-specify-venv"
          python3 -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --disable-pip-version-check \
            "specify-cli @ git+https://github.com/github/spec-kit.git@${SPEC_KIT_REF}" \
            "pytest==9.1.1" \
            "uv==0.11.28"
          bin_dir="$RUNNER_TEMP/graf-bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/yshishenya/speckit-bootstrap/releases/download/v0.9.9/speckit-bootstrap" \
            --output "$bin_dir/speckit-bootstrap"
          printf '%s  %s\n' "$SPECKIT_BOOTSTRAP_SHA256" "$bin_dir/speckit-bootstrap" | sha256sum --check --status -
          chmod 0755 "$bin_dir/speckit-bootstrap"
          {
            printf '%s\n' "$venv_dir/bin"
            printf '%s\n' "$bin_dir"
            printf '%s\n' "$HOME/.local/bin"
          } >> "$GITHUB_PATH"
          export PATH="$venv_dir/bin:$bin_dir:$HOME/.local/bin:$PATH"
          [[ "$(specify --version)" == "specify ${SPECIFY_CLI_VERSION}" ]]
          speckit-bootstrap --version

      - name: Run Ubuntu full component
        shell: bash
        run: |
          set +e
          result_path="$RUNNER_TEMP/graf-server-result.json"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (
            set -euo pipefail
            python3 scripts/check_spec_kit_governance.py
            pytest -q tests/governance
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=harness/src \
              python3 -c 'from dev_harness.validators import self_test; raise SystemExit(self_test())'
            while IFS= read -r shell_path; do
              [[ -z "$shell_path" ]] || bash -n "$shell_path"
            done < <(git ls-files '*.sh')
            sh apps/macos/Scripts/validate-no-legacy-audio-driver.sh
            GRAF_TEST_WORKERS=4 GRAF_PERFORMANCE_GATE=required \
              bash apps/server/scripts/run_local_postgres_tests.sh --full -q
            (cd apps/server && PYTHONPATH=src uv run --extra dev ruff check .)
            python3 -m compileall -q apps/server/src apps/server/tests apps/server/scripts
            (cd apps/server && PYTHONPATH=src uv run python scripts/verify_rls_hardening.py)
            docker compose -f infra/docker-compose.yml config >/dev/null
            infra/scripts/scan-deployment-evidence.sh docs/deployments/2brain-rec
            python3 scripts/check-development-process.py
            python3 scripts/validate-full-ci-workflow.py .github/workflows/release-full.yml
            git diff --check
          )
          component_status=$?
          status=passed
          if (( component_status != 0 )); then status=failed; fi
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$result_path" "$status" "$started_at" "$finished_at" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path, status, started, finished = sys.argv[1:]
          value = {
              "schema_version": 1,
              "component": "server",
              "status": status,
              "requested_sha": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_start": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_end": os.environ["REQUESTED_SHA"].lower(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "started_at": started,
              "finished_at": finished,
              "skipped_gates": [],
          }
          pathlib.Path(path).write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY
          exit "$component_status"

      - name: Upload metadata-only server result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-component-server-${{ needs.reserve.outputs.artifact_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/graf-server-result.json
          if-no-files-found: error
          retention-days: 90

  macos-full:
    name: macOS Swift full
    needs: reserve
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Swift 6 toolchain
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.0.3"

      - name: Run macOS full component
        shell: bash
        run: |
          set +e
          result_path="$RUNNER_TEMP/graf-macos-result.json"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (
            set -euo pipefail
            [[ "$(uname -m)" == "arm64" ]]
            while IFS= read -r shell_path; do
              [[ -z "$shell_path" ]] || bash -n "$shell_path"
            done < <(git ls-files '*.sh')
            sh apps/macos/Scripts/validate-no-legacy-audio-driver.sh
            swift build --package-path apps/macos
            swift test --package-path apps/macos
            swift run --package-path apps/macos ContractValidation
          )
          component_status=$?
          status=passed
          if (( component_status != 0 )); then status=failed; fi
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$result_path" "$status" "$started_at" "$finished_at" <<'PY'
          import json
          import os
          import pathlib
          import sys

          path, status, started, finished = sys.argv[1:]
          value = {
              "schema_version": 1,
              "component": "macos_app",
              "status": status,
              "requested_sha": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_start": os.environ["REQUESTED_SHA"].lower(),
              "observed_sha_end": os.environ["REQUESTED_SHA"].lower(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "started_at": started,
              "finished_at": finished,
              "skipped_gates": [],
          }
          pathlib.Path(path).write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY
          exit "$component_status"

      - name: Upload metadata-only macOS result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-component-macos-${{ needs.reserve.outputs.artifact_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/graf-macos-result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate authoritative Full CI
    if: always()
    needs: [reserve, server-full, macos-full]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      REQUESTED_SHA: ${{ inputs.requested_sha }}
      ARTIFACT_KEY: ${{ needs.reserve.outputs.artifact_key }}
    steps:
      - name: Require all component jobs to pass
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.reserve.result }}" == success ]]
          [[ "${{ needs.server-full.result }}" == success ]]
          [[ "${{ needs.macos-full.result }}" == success ]]

      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.requested_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download component results
        uses: actions/download-artifact@v4
        with:
          pattern: graf-full-component-*-${{ needs.reserve.outputs.artifact_key }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/graf-full-components

      - name: Validate component results and emit authoritative evidence
        shell: bash
        run: |
          set -euo pipefail
          component_dir="$RUNNER_TEMP/graf-full-components"
          python3 - "$component_dir" <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          expected = {"server-result.json": "server", "macos-result.json": "macos_app"}
          files = {path.name: path for path in root.glob("*-result.json")}
          if set(files) != set(expected):
              raise SystemExit(f"unexpected component result set: {sorted(files)}")
          requested = os.environ["REQUESTED_SHA"].lower()
          for filename, component in expected.items():
              value = json.loads(files[filename].read_text(encoding="utf-8"))
              if value.get("component") != component or value.get("status") != "passed":
                  raise SystemExit(f"component failed: {filename}")
              if any(str(value.get(key, "")).lower() != requested for key in (
                  "requested_sha", "observed_sha_start", "observed_sha_end"
              )):
                  raise SystemExit(f"component SHA mismatch: {filename}")
              if value.get("skipped_gates") != []:
                  raise SystemExit(f"component skipped gates: {filename}")
          PY
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          finished_at="$(date -u -v+1S +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d '1 second' +%Y-%m-%dT%H:%M:%SZ)"
          evidence_path=".dev/ci-evidence/authoritative-${CANDIDATE_ID}.json"
          mkdir -p .dev/ci-evidence
          python3 scripts/emit-ci-evidence.py \
            --output "$evidence_path" \
            --run-id "github-full-${GITHUB_RUN_ID}" \
            --lane full \
            --requested-sha "$REQUESTED_SHA" \
            --observed-sha-start "$REQUESTED_SHA" \
            --observed-sha-end "$REQUESTED_SHA" \
            --status passed \
            --started-at "$started_at" \
            --finished-at "$finished_at" \
            --command "GitHub Actions release-full: Ubuntu server/infrastructure + macOS Swift" \
            --scope "frozen release candidate" \
            --candidate-id "$CANDIDATE_ID" \
            --authoritative-full \
            --component-sha "repository=$REQUESTED_SHA" \
            --component-sha "server=$REQUESTED_SHA" \
            --component-sha "macos_app=$REQUESTED_SHA" \
            --artifact "server-result=$component_dir/server-result.json" \
            --artifact "macos-result=$component_dir/macos-result.json"
          python3 scripts/validate-ci-evidence.py "$evidence_path"
          python3 - "$RUNNER_TEMP/graf-full-identity.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          value = {
              "schema_version": 1,
              "event_name": "workflow_dispatch",
              "target_sha": os.environ["REQUESTED_SHA"].lower(),
              "base_sha": os.environ["REQUESTED_SHA"].lower(),
              "pull_request_numbers": [],
              "merge_group_id": None,
              "concurrency_key": "manual-" + os.environ["CANDIDATE_ID"],
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 scripts/emit-ci-receipt.py \
            --identity "$RUNNER_TEMP/graf-full-identity.json" \
            --evidence "$evidence_path" \
            --output ".dev/ci-evidence/receipt-${GITHUB_RUN_ID}.json" \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 scripts/validate-ci-receipt.py ".dev/ci-evidence/receipt-${GITHUB_RUN_ID}.json"

      - name: Upload one authoritative evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: graf-full-ci-${{ needs.reserve.outputs.artifact_key }}
          path: .dev/ci-evidence/
          if-no-files-found: error
          retention-days: 90
