schema_version: 1
feature_id: 273
category: Changed
summary: "Добавлен серверный и браузерный контроль согласия публичной аналитики"
issue: 7696
tasks: [T106]
compatibility: "Миграция 0108 добавляет отдельную таблицу контроля выбора; relay требует UUID выбора и серверную редакцию разрешения. Откат миграции 0108 блокируется при сохранённых решениях об аналитике; удалять решения ради отката нельзя. Совместимый откат и восстановление требуют отдельной проверки"
known_limitations: ["Рабочее измерение, внешний SDK, T106/T113 и T0 остаются закрытыми", "Рабочие права, тексты, приём данных получателем, резервирование, восстановление и ёмкость требуют отдельной приёмки"]
release_notes: "Отказ сохраняется независимо от включения аналитики; браузер показывает, подтверждено ли его сохранение сервером. Для нового разрешения требуется явное действие, старые запросы не возобновляются. После восстановления копии прежние разрешения недействительны; отдельное решение об удалении применяется повторно. Проверка хранения учитывает контроль согласия без удаления по возрасту. Этот срез не включает рабочую аналитику."
