schema_version: 1
feature_id: 273
category: Fixed
summary: "Добавлен серверный контроль согласия и устранена повторная загрузка его интерфейса на входе и регистрации"
issue: 7696
tasks: [T106]
compatibility: "Миграция 0108 добавляет отдельную таблицу контроля выбора; relay требует UUID выбора и серверную редакцию разрешения. Откат миграции 0108 блокируется при сохранённых решениях об аналитике; удалять решения ради отката нельзя. Совместимый откат и восстановление требуют отдельной проверки. Исправление загрузки интерфейса не меняет схему базы, API, правила согласия и рабочие настройки; оба блока настроек и отдельный путь продуктовых страниц сохранены"
known_limitations: "Рабочее измерение, внешний SDK/replay, полный T106/T113 и T0 остаются закрытыми. Рабочие права, тексты, приём данных получателем, резервирование, восстановление и ёмкость требуют отдельной приёмки. Выпуск и рабочая приёмка требуют отдельных проверок"
release_notes: "Отказ сохраняется независимо от включения аналитики; браузер показывает, подтверждено ли его сохранение сервером. Для нового разрешения требуется явное действие, старые запросы не возобновляются. После восстановления копии прежние разрешения недействительны; отдельное решение об удалении применяется повторно. Проверка хранения учитывает контроль согласия без удаления по возрасту. При совместных публичных и продуктовых настройках библиотека согласия и её обработчик загружаются один раз. Отказ остаётся доступным при выключенном измерении. Учебные проверки учитывают серверное подтверждение согласия и новую категорию хранения; действующие защитные проверки не ослаблены. Этот срез не включает рабочую аналитику."
