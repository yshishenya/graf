schema_version: 1
feature_id: 284
category: Fixed
summary: "Длинный звонок сохраняет непрерывную автозапись, а сохранённое на Mac аудио открывается из карточки встречи"
issue: 7447
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019]
compatibility: "Тарифы, серверные права и формат локальных файлов сохранены; миграций нет. Кнопка локального аудио требует обновлённых macOS-приложения и кабинета"
known_limitations:
  - "Квота серверного хранения сохраняется; локальная кнопка доступна только на Mac с собственной сохранённой копией"
  - "Непрерывность подтверждена эмуляцией и физической записью Telemost 49 минут 41 секунда; автоматические проверки сохраняют отказ при настоящей потере звука"
  - "На проверочном Mac оценки Gatekeeper отключены настройкой системы; отдельная проверка spctl выполняется, настройки системы не менялись"
release_notes: "Текущая активность микрофона проверяется через CoreAudio вместо устаревшего системного журнала. При завершении действует ожидание 15 секунд, при потере наблюдения — защитная остановка через 600 секунд. Подпись хранилища соответствует действующим правилам текста. Нехватка места больше не отображается как ошибка кодека; получателю общей встречи предлагается обратиться к владельцу без ссылки на оплату. Локальное воспроизведение сохраняет проверки доступа, удаления и целостности; кнопка работает в настоящей разметке и после обновления статуса. Технический перезапуск наблюдения сохраняет незавершённое предложение записи. Ошибка чтения соседнего аудиопроцесса сохраняет подтверждённую активность звонка; неполное наблюдение не считается завершением. Накопленные пакеты микрофона и системного звука обрабатываются по времени звука, что предотвращает искусственное переполнение при разных размерах пакетов. Пауза сохраняет заглушение всей принятой очереди микрофона даже при быстром возобновлении; граница возобновления применяется атомарно относительно добавления новых кадров; запоздалый ответ опроса не меняет карточку другой встречи; Завершение принятой записи через 15 секунд не зависит от доступности реестра приложений; новые предложения без реестра запрещены; Принудительно закрытое из-за входа предложение восстанавливается после возвращения доступа; ручной отказ и Stop остаются окончательными; пределы памяти и остановка при настоящей потере сохранены."
