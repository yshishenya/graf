schema_version: 1
feature_id: 272
category: Fixed
summary: "Наблюдение за боевыми платежами больше не теряет секрет вебхука при выключенном checkout: API и граница получают согласованный production-secret, а тестовый placeholder остаётся только для отключённых путей."
issue: 7165
tasks: [T037, T039]
compatibility: "Checkout остаётся выключенным до завершения операционных согласований; после обновления production нужно повторно подтвердить секрет, TLS и доставку вебхука."
known_limitations:
  - "Фактическое применение новой конфигурации, регистрация адреса вебхука и живая оплата требуют отдельных production-проверок и подписей запуска."
release_notes: "Исправлено fail-closed поведение production-наблюдения: при TWOBRAIN_BILLING_PROVIDER_OBSERVATION_ENABLED=true API теперь получает webhook-secret и может безопасно принимать поздние уведомления даже при выключенном checkout. При полном включении оплаты дополнительно требуются referral-secret и остальные денежные ворота."
