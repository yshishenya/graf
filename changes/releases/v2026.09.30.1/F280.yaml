tasks: ["T013", "T001", "T002", "T003", "T004", "T005", "T006", "T007", "T008", "T009", "T010"]
compatibility: "Работа приложения, цены, согласия и финансовые защиты не меняются. Миграции данных не требуются. Цены, финансовые расчеты, провайдер, согласия и защита от повторных списаний сохраняются. Миграции данных не требуются. Действия покупки во встроенном кабинете требуют обновления macOS-клиента."
release_notes: "Устранены устаревшие ожидания полной проверки выпуска. Сохранены проверки безопасного письма в поддержку, чека, копирования номера платежа, отсутствия автоматического возврата и бесплатного тарифа после истечения пробного срока. Повторяющиеся пояснения убраны, необязательная детализация раскрывается по запросу. Полная сумма, срок, условия будущего продления и отдельные согласия остаются видимыми. Исправлены переходы покупки места в macOS, сохранение годового периода и восстановление оплаты из истории. Подтверждение платежа отделено от проверки предоставления услуги; помощь и отключение автопродления доступны без лишних шагов."
known_limitations: ["Публичная оплата требует отдельной финансовой и человеческой приёмки F278; проверки кода не подтверждают банковское зачисление либо рост конверсии.", "Финансовая приемка и разрешение публичных продаж F278 остаются отдельными условиями выпуска.", "Рост конверсии и удержания не подтверждается проверками кода; нужны отдельные прохождения с людьми и данные после выпуска."]
