schema_version: 1
feature_id: 280
category: Changed
summary: "Страницы оплаты стали короче: итог и продление видны сразу, место выбирается общим объемом, а незавершенный платеж можно найти и продолжить."
issue: 7366
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010]
compatibility: "Цены, финансовые расчеты, провайдер, согласия и защита от повторных списаний сохраняются. Миграции данных не требуются. Действия покупки во встроенном кабинете требуют обновления macOS-клиента."
known_limitations:
  - "Финансовая приемка и разрешение публичных продаж F278 остаются отдельными условиями выпуска."
  - "Рост конверсии и удержания не подтверждается проверками кода; нужны отдельные прохождения с людьми и данные после выпуска."
release_notes: "Повторяющиеся пояснения убраны, необязательная детализация раскрывается по запросу. Полная сумма, срок, условия будущего продления и отдельные согласия остаются видимыми. Исправлены переходы покупки места в macOS, сохранение годового периода и восстановление оплаты из истории. Подтверждение платежа отделено от проверки предоставления услуги; помощь и отключение автопродления доступны без лишних шагов."
