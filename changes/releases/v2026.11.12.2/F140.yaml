schema_version: 1
feature_id: 140
category: "Fixed"
summary: "Обязательные письма о планировании и отмене закрытия аккаунта Проверка чеков, письма биллинга и защищённое рассмотрение fair-use"
issue: "4926"
tasks: ["T068", "T070", "T075", "T077"]
compatibility: "Новых миграций и настроек нет; неполные исторические снимки очереди подавляются без рассылки задним числом. Миграция чеков останавливается при неоднозначной связи; откат новой миграции архива запрещён при непустом состоянии или курсоре. Миграция fair-use сохраняет старые проверки без выдуманной истории и отказывает при конфликте защищённого журнала; откат с новой историей запрещён."
release_notes: "Новое планирование и сохранённая отмена закрытия аккаунта ставят обязательные письма в той же транзакции. Повтор не создаёт письмо, новое планирование после отмены имеет отдельную историю. Перед отправкой заново проверяются исходный запрос, его даты, активный владелец и подтверждённый адрес. Письмо описывает сохранённое действие с точными датами и ведёт в настройки аккаунта; оно не обещает текущее закрытие или завершённое удаление. После начала финализации новая отправка запрещена; ранее сохранённую попытку нельзя отозвать у транспорта. Неполная старая очередь подавляется. Известный временный отказ допускает повтор не раньше 60 секунд и максимум пять попыток, неопределённый исход не повторяется. Проверены browser→commit→ outbox→обычный отправщик, откаты, права, финализация и конкуренция на синтетической PostgreSQL; реальное получение и выпуск проверяются отдельно. Связанные задачи: #4922/T068 и #4926/T070; полностью они этим не закрываются. GRAF проверяет идентификатор чека в ответе YooKassa и не заменяет уже привязанный чек оплаты другим чеком. Ответы о платеже и чеке обновляют одно состояние; ошибка в данных чека не отменяет подтверждение оплаты. Один чек в том же магазине и среде нельзя привязать к двум счетам. Проверенная связь старого счёта с магазином сохраняется для повторной сверки. Для чеков оплаты и возврата GRAF сохраняет первое подтверждённое время ожидания и основание подтверждённой отмены. Повтор не меняет уже сохранённое время. Если свежий ответ после 72 часов всё ещё показывает ожидание, GRAF сохраняет основание просрочки. Отмена регистрации чека не меняет оплату или возврат. При ограниченном опросе недоступность YooKassa не меняет последнее подтверждённое состояние, а просрочка помечается как требующая сверки. Операторское наблюдение получает три раздельных накопительных счётчика без сведений о счёте и клиенте. Счётчики переживают удаление счёта. Образы наблюдателей должны понимать формат 2 перед переключением источника. Подтверждённый владелец получает письмо при явном начале пробного срока, напоминания за три дня и за сутки, а также письмо при окончании. Письма содержат даты и объясняют, что карта и автосписание не требуются. Сквозная проверка подтверждает, что готовый после опроса чек даёт одно уведомление, а отмена, ожидание и неполный ответ не меняют оплату. Подтверждение автоматического продления поясняет, если новый оплаченный период в GRAF начался после окончания предыдущего. Повторного письма и нового списания из-за этого пояснения нет. При наблюдённом достижении 80%, 95% и 100% архива GRAF сохраняет одно необязательное письмо владельцу с точными байтами и датой снимка. Отказ от необязательной почты учитывается до отправки; письмо другому владельцу не перенаправляется. Обход сохраняет продвижение и неполноту после перезапуска, закрытие аккаунта очищает состояние наблюдения. При замене записи квота учитывает последнюю опубликованную ревизию, сохраняя прежние объекты для разрешённого чтения и восстановления. После штатной очистки новой записи без архива прежняя архивная версия не возвращается в квоту. Поздняя проверка отсутствующего файла не восстанавливает явно удалённое аудио. Служебная роль получает только ограниченное чтение подтверждения такой публикации. Новая миграция добавляет состояние и курсор с FORCE RLS; непустое состояние запрещает откат миграции ради сохранения дедупликации. Уполномоченная служба может принять основание fair-use и сохранить решение через внутреннюю команду с читающей проверкой по умолчанию. Первое действие, апелляция и решение сохраняются вместе с защищённой историей и отдельным обязательным письмом исходным получателям. PostgreSQL запрещает приложению создавать или разрешать проверки и подделывать либо стирать эту историю. Перед отправкой GRAF заново проверяет источник, право получателя и подтверждённый адрес; старую очередь новому владельцу не перенаправляет. Неизвестный результат отправки повторно не отправляется. Кабинет отличает рассмотрение от фактического применения ограничения. Очистка тестовых данных безопасно отказывает при защищённой истории до удаления строк и файлов. Связанные задачи: #4922/T068 и #4926/T070; полностью они этим не закрываются."
known_limitations: ["Подставной транспорт в проверках не подтверждает реальное получение письма; задача #7524 остаётся отдельной.", "Полные T068/T070 и остальные семейства уведомлений сохраняют отдельную приёмку.", "Уже сохранённую попытку отправки нельзя отозвать у транспорта после начала финализации.", "Без проверенной привязки магазина время ожидания и основание отмены не сохраняются.", "Проверка получения письма владельцем и проверка тестового магазина остаются отдельными шагами.", "Пропущенные окна отправки не догоняются; старые письма о начале не восстанавливаются.", "Периодический обход архива сообщает исторический снимок; принятие Postal не доказывает получение.", "Замена требует полного резерва нового аудио; около лимита она может быть отклонена.", "Сохранённое решение fair-use не подтверждает применение ограничения; реальные полномочия оператора и рассмотрение в течение 24 часов проверяются отдельно."]
