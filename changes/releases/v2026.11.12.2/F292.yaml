schema_version: 1
feature_id: 292
category: "Fixed"
summary: "Упрощено окно передачи встречи и согласованы выпускные проверки"
issue: "7918"
tasks: ["T017", "T033", "T034", "T035"]
compatibility: "Права доступа, политики базы и схема данных не меняются. Существующие ссылки, записи и параметры доступа сохраняются."
release_notes: "В окне «Поделиться» приглашения и люди с доступом собраны в компактную раскрываемую строку. Общая аудитория и материалы видны до копирования ссылки даже при длинном списке приглашений. Уточнены отправка итогов, разрешение скачивания для приглашенных и оформление срока ссылки. Сохранены просмотр расшифровки, итогов и аудио. Подпись разрешения скачивания приведена к принятому написанию интерфейса. Проверка перечня миграций включает существующие служебные таблицы уведомлений и защищенной истории; прежние проверки каждой таблицы сохранены. Связанные задачи: #7918, #8016, #8019 и #8025."
known_limitations:
  - "Выпуск и проверка установленного приложения остаются отдельными шагами."
  - "Для прослушивания нужна готовая запись; её отсутствие не заменяется скачиванием."
  - "Установленное приложение и выпуск принимаются отдельно от браузерных проверок."
