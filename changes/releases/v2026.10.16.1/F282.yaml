schema_version: 1
feature_id: 282
category: Added
summary: "Добавлены самостоятельные страницы о расшифровке аудио и видео, протоколе встречи и записи без бота; основной лендинг сохранён."
issue: 7396
tasks: [T001, T002, T003, T004, T005]
compatibility: "Три новых публичных URL и ссылки в подвале/карте сайта. API, данные, запись, оплата и аналитические поверхности не меняются."
known_limitations:
  - "Приложение Windows разрабатывается; текущая доступность уточняется на странице скачивания."
  - "Индексация, рост переходов и органические активации проверяются после публикации по доступным отчётам."
  - "Новые страницы не расширяют счётчики и разрешённые поверхности аналитики; полная атрибуция входа через них не доказана."
release_notes: "Поисковые материалы дают инструкции и ограничения под конкретные задачи. Первый экран, преимущества, метаданные, CTA и общие стили главной сохраняются; добавлены только три ссылки в подвале. Локальная проверка не означает подтверждённый рост посещаемости."
