schema_version: 1
feature_id: 271
category: Fixed
summary: "Обновление приложения снова может выйти в том же выпуске. Подписывающая часть требует черновик выпуска, а серверный выпуск создавался сразу опубликованным: тег появлялся на шаге публикации, то есть окно для вложения закрывалось раньше, чем открывалось. Настоящий прогон это подтвердил — приложение собралось и прошло проверки доверия за 2 минуты 40 секунд, но приложить обновление оказалось некуда. Теперь выпуск создаётся черновиком, обновление прикладывается до публикации, и только после этого выпуск становится публичным. Сборка приложения идёт параллельно поезду, полной проверке и выкатке."
issue: 7127
tasks: [T029]
compatibility: "Изменений совместимости нет. Выпуск становится публичным последним действием, после прикладывания всех вложений; состав проверок, ворота и обязательное подтверждение выкатки сохраняются. Флаг --no-app позволяет выпустить только сервер."
known_limitations:
  - "Замена публичной ленты обновлений infra/runtime/public-downloads/graf-appcast.xml остаётся отдельным осознанным действием владельца."
release_notes: "Обновление приложения снова выходит вместе с выпуском. Раньше сборка приложения проходила успешно, но приложить его было некуда: выпуск на GitHub создавался сразу публичным, а подписывающая часть принимает вложения только в черновик. Теперь выпуск сначала существует черновиком, обновление приложения прикладывается к нему, и только потом выпуск становится публичным. Сборка приложения идёт одновременно с серверной проверкой и выкаткой, поэтому общее время выпуска не растёт."
