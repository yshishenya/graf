schema_version: 1
feature_id: 295
category: Fixed
summary: "Устранена ложная блокировка записи из-за исторической очереди"
issue: 8049
tasks: ["T001", "T002", "T003", "T004", "T005", "T006", "T007", "T008", "T009", "T010", "T011", "T012", "T013", "T014", "T015", "T016", "T017"]
compatibility: "Формат очереди, локальные записи, bundle ID и разрешения не меняются. F295 не удаляет файлы."
release_notes: "Проверка локального места теперь использует фактический размер папки записей, а не историю очереди. Warning больше не блокирует ручную и автоматическую запись, блокировка остаётся только для critical, полного лимита и нехватки резерва. Измерение выполняется вне MainActor с кэшем. В состоянии ошибки меню-бар больше не показывает красный индикатор записи и объясняет причину рядом с «Повторить запись»."
known_limitations:
  - "Очистка локальных файлов и серверная библиотека остаются отдельной фичей F296."
  - "Временная политика 2 ГБ / 75% / 90% / 20 МБ сохраняется."
  - "Полный 60-минутный аппаратный performance gate и полный Dynamic Type остаются отдельными ограничениями."
