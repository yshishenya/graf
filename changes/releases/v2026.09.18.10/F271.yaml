schema_version: "1"
feature_id: "271"
category: "Fixed"
summary: "Повтор выпуска не обрывается молча, когда подготовка уже влита в мастер, а разные категории фрагментов одной доработки больше не останавливают выпуск: раздел выбирает свежая работа, и подготовка сообщает об этом. Провалившийся выпуск больше не блокирует следующий: подготовка сводит фрагменты пережившей его доработки в один файл и оставляет в журнале ровно одну запись, а брошенный кандидат получает отдельную отметку об отмене, поэтому повторный запуск проходит без ручной расчистки."
issue: "7127"
tasks: ["T040", "T041", "T037", "T038", "T039"]
compatibility: "Изменений совместимости нет."
release_notes: "Внутреннее улучшение процесса выпуска, для пользователя ничего не меняется."
known_limitations: ["Продолжение выпуска после такого повтора остаётся отдельной командой, а не выполняется автоматически.", "Проверка на испорченный архив сохраняется: одинаковое имя файла при разных номерах доработки по-прежнему останавливает подготовку до изменений."]
