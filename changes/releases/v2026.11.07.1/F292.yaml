compatibility: Исправление выпускных проверок T028 не меняет права доступа, политики базы, миграции и поведение приложения. В четырех подписях интерфейса принято
  написание через е. Прежние ссылки сохраняют доступ только к итогам. Полная встреча публикуется отдельным действием. Схемы
  перехода Dev и production разделены. F292 не добавляет миграций базы.
release_notes: Обновлены каноническое описание API, точные перечни таблиц и маршрутов воспроизведения, проверки доступности
  панели и браузерный путь комментариев. Проверка безопасного журнала изолирована от настройки других тестов. Публичное аудио
  использует общее описание полных и частичных ответов API; проверяются все три маршрута воспроизведения. Панель владельца
  объединяет приглашения, роли, список доступа, общую аудиторию и экспорт. Получатель видит выбранные материалы, может найти
  реплику, перейти по времени и продолжить после входа или в приложении. Приглашение начать пользоваться GRAF не мешает чтению.
  Отзыв, срок и замена записи повторно проверяются при выдаче аудио.
known_limitations:
- Предметные проверки не заменяют обязательную полную проверку нового кандидата выпуска.
- Публичная ссылка разрешает чтение; комментарии, редактирование, скачивание и экспорт требуют адресных прав.
- Доступность внешних приглашений, общей ссылки и аудитории пространства зависит от серверных настроек.
- Живая приёмка и обязательные проверки PR фиксируются отдельно; этот фрагмент не подтверждает выпуск.
