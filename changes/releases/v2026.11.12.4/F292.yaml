schema_version: 1
feature_id: 292
category: "Fixed"
summary: "Упрощено окно передачи встречи и согласованы выпускные проверки"
issue: "7918"
tasks: ["T017", "T033", "T034", "T035", "T036", "T037"]
compatibility: "Права доступа, политики базы и схема данных не меняются. Существующие ссылки, записи и параметры доступа сохраняются."
release_notes: "В окне «Поделиться» приглашения и люди с доступом собраны в компактную раскрываемую строку. Общая аудитория и материалы видны до копирования ссылки даже при длинном списке приглашений. Уточнены отправка итогов, разрешение скачивания для приглашенных и оформление срока ссылки. Сохранены просмотр расшифровки, итогов и аудио. Подпись разрешения скачивания приведена к принятому написанию интерфейса. Проверка перечня миграций включает существующие служебные таблицы уведомлений и защищенной истории; прежние проверки каждой таблицы сохранены. Для последовательной группы строгих проверок базы и производительности задан конечный бюджет 90 минут вместо 30. Строгие проверки служебных полномочий и очереди изолированы друг от друга: тестовые сценарии задают обязательные настройки оператора и удаляют свои синтетические события. Проверено: 48 строгих сценариев RLS и очереди в одном процессе, self-test границ 90/91 и validator workflow — без отказов. Связанные задачи: #7918, #8016, #8019, #8025, #8036, #8039."
known_limitations:
  - "Выпуск и проверка установленного приложения остаются отдельными шагами."
  - "Проверки кода не заменяют приёмку рабочего сервера и установленного приложения."
  - "Для прослушивания нужна готовая запись; её отсутствие не заменяется скачиванием."
  - "Установленное приложение и выпуск принимаются отдельно от браузерных проверок."
  - "Достаточность бюджета должна подтвердиться новым полным запуском."
  - "Максимальное время занятия runner при зависании увеличено только для server-phases."
