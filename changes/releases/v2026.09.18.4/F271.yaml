schema_version: 1
feature_id: 271
category: Fixed
summary: "Выпуск переживает временный сетевой сбой и не пересобирает готовое приложение. Живой прогон вскрыл два отказа подряд: скачивание доказательств полной проверки упало на TLS handshake timeout уже после того, как все проверки прошли, а повторный заход зря пересобрал приложение, хотя сборка для нужного источника была готова. Теперь загрузка повторяется с растущей паузой, а готовая сборка переиспользуется."
issue: 7127
tasks: [T031]
compatibility: "Изменений совместимости нет. Поведение меняется только при сбое; успешный путь, состав проверок и ворота сохраняются."
known_limitations:
  - "Замена публичной ленты обновлений infra/runtime/public-downloads/graf-appcast.xml остаётся отдельным осознанным действием владельца."
release_notes: "Выпуск стал устойчивее к сбоям. Раньше временный сбой сети GitHub при скачивании доказательств останавливал выпуск целиком — уже после того, как все проверки прошли. Теперь загрузка повторяется несколько раз с растущей паузой. Повторный заход больше не пересобирает приложение, если сборка для нужного источника уже готова: раньше нотаризация отвергала вторую попытку для той же версии и выпуск останавливался на том, что уже было сделано."
