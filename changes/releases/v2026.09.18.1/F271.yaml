summary: "Выпуск новой версии ускорился до двадцати минут. Серверная проверка релиза разбита на восемь частей вместо четырёх, доказательства проверок скачиваются одновременно, а не по очереди. Убраны три повторные сверки квитанций: при заморозке поезда, при вынесении решения по кандидату и при подтверждении. Релизный прогон снова запускается: значение runner.temp стояло в окружении задачи, а этот контекст доступен только шагу. Подготовка релиза приложения занимает 2 минуты 40 секунд и идёт параллельно серверному поезду."
issue: 7127
tasks: [T016, T017, T018, T019, T020, T021, T022, T023, T024, T025, T026, T027, T028]
compatibility: "Изменений совместимости нет: состав проверок, пороги, строгая фаза, фаза производительности и доказательства сохраняются. Разбиение на восемь частей остаётся точным делением набора: части идут шаговой выборкой, а агрегирующая задача проваливает проверку при пропуске или повторе случая. Резервная копия перед выкаткой остаётся обязательной."
known_limitations:
  - "Проверка восстановления из резервной копии выполняется отдельным запуском по расписанию, а не на каждом выпуске, чтобы не удваивать работу с копией. Сама резервная копия в релизе сохраняется."
  - "Полная длительность цикла сложена из замеров отдельных шагов: сплошной замер возможен только на выпуске с новыми записями журнала."
release_notes: "Выпуск новой версии стал заметно быстрее: от начала до работающего прода около двадцати минут вместо прежних пятидесяти. Полная проверка перед выпуском идёт восемью частями вместо четырёх, а доказательства проверок скачиваются одновременно, а не по очереди — на заморозке поезда это экономит минуты. Убраны три повторные сверки квитанций: подтверждённый поезд и кандидат больше не считаются непроверенными, если доказательство уже записано. Релизный прогон снова запускается: значение, доступное только шагу, стояло в окружении всей задачи, и GitHub отвергал файл целиком. Подготовка обновления приложения — сборка, подпись, нотаризация Apple и проверки доверия — занимает 2 минуты 40 секунд и идёт одновременно с серверным выпуском."
