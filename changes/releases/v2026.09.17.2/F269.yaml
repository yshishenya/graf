schema_version: 1
feature_id: 269
category: Changed
summary: "Dev-стенд хранит только архив целевого отката и приложения активного и целевого манифестов; остальные артефакты, снапшоты завершённых переходов схемы и immutable-теги удаляются автоматически, добавлена команда prune с предварительным просмотром. macOS-проверки используют кэш Swift-сборки, а доказательства привязаны к собранным продуктам вместо всего каталога сборки."
issue: 7089
tasks: [T010, T011, T012, T013, T015, T018, T019, T020, T023, T024]
compatibility: "build больше не создаёт runtime-images.tar; архив появляется при promote только для целевого отката. rehydrate работает для манифестов в политике хранения; откат за пределы удержанного поколения требует пересборки из исходников. Схема манифеста и формат архива не меняются."
known_limitations:
  - "Откат глубже одного поколения после уборки требует пересборки из точного SHA"
  - "При недоступности Docker уборка сообщает status: partial, файловые удаления при этом выполнены"
release_notes: "Стенд GRAF Dev больше не накапливает гигабайты локальных артефактов: хранится один архив целевого отката, остальное удаляется автоматически после сборки, продвижения и отката, а команда prune показывает план уборки заранее. Проверки Swift на macOS кэшируются между запусками, доказательства привязаны к собранным продуктам."
