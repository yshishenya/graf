release_notes: "Настройки открываются в основном окне GRAF. Для каждого приложения показаны имя и одно правило; поиск сохраняет полный поддерживаемый реестр. Уведомления macOS и аккаунта собраны на одной странице; исправлены показ тестового уведомления и переход по нему. При недоступном кабинете сохраняется одно локальное резервное окно."
