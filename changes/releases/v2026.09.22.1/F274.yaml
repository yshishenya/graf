summary: "Уведомления GRAF в macOS приведены к понятной модели: одна карточка в правом верхнем углу используется только для встречи, вопроса о записи, проблемы сохранения/отправки и короткой записи. Знак закрытия находится в левом верхнем углу карточки, отделён от содержимого, а высота карточки увеличивается по длинному русскому тексту без обрезания. Рутинные состояния «Запись началась», «Расшифровка началась» и «Запись остановлена» не создают ни карточек, ни системных баннеров — они видны в приложении и строке меню. Для карточек заданы сроки по смыслу: встреча до 120 секунд и до начала, вопрос 8 секунд с отсчётом, проблема и короткая запись 20 секунд. Вопрос о записи содержит действия «Записать», «Не записывать» и отдельный флажок «Запомнить выбор»; крестик означает отказ только от текущей встречи, а постоянная настройка не меняется. Короткая запись называется «Запись слишком короткая» и поясняется одной фразой без дублирования. Кнопка «Проверить уведомление» показывает ту же карточку 6 секунд без системного баннера и побочных эффектов."
