compatibility: "Изменений совместимости нет. Системные уведомления macOS сохраняются для совместимых резервных сценариев календаря, но не дублируют карточку GRAF для полезных событий. Контракты верхней панели и разделения «контроль сейчас» и истории не меняются."
known_limitations:
  - "Внешний вид карточки воспроизводит наблюдаемые параметры эталона; побайтовое совпадение шрифтов и значков не заявляется."
  - "Собственная карточка звук не проигрывает; системный звук не используется для тех же полезных событий, чтобы не создавать дублирование."
  - "Постоянного окна с длительностью записи нет: состояние записи видно в приложении и строке меню, а отдельные сообщения о переходах не показываются."
release_notes: "Уведомления в macOS стали заметными, спокойными и одинаковыми по виду. Карточка в правом верхнем углу показывается только по делу: перед встречей, при вопросе о записи, при проблеме сохранения или отправки и для записи короче 30 секунд. Знак закрытия расположен слева сверху и не пересекается с содержимым; длинный русский текст переносится без обрезания и лишних повторов. Рутинные сообщения «Запись началась», «Расшифровка началась» и «Запись остановлена» убраны — состояние видно в самом приложении и строке меню. Для карточки встречи задан срок до 120 секунд, для вопроса о записи — 8 секунд с отсчётом, для проблемы и короткой записи — 20 секунд. Вопрос о записи содержит отдельный флажок «Запомнить выбор», а его крестик означает отказ от текущей встречи и не меняет постоянную настройку приложения. Кнопка проверки в настройках показывает ту же карточку 6 секунд, не создавая системного баннера и не меняя реальные напоминания."
