compatibility: "Нужен файл миграции 0097_public_attribution_admission_index.py с revision 0097_public_attribution_index. Миграции аналитики продолжаются после 0093_billing_catalog_seed и не создают отдельную Alembic head. Durable-атрибуция публичного визита ограничена общим PostgreSQL admission guard: по умолчанию не более 10000 новых строк за 3600 секунд; исчерпание квоты не блокирует страницу и обезличенный агрегат. Защита аналитического узла больше не выключает измерение из-за общехостовой нагрузки: авто-откат срабатывает только по причинам области аналитики, общехостовые пороги только оповещают. Прежние переменные защиты продолжают работать, значения по умолчанию сохранены."
known_limitations: ["Живая доставка в провайдера выключена до оформления записей об одобрении и отработки отката на стенде, поэтому дашборды остаются пустыми: пустой дашборд означает выключенную доставку, а не отсутствие интереса", "Передача офлайн-конверсий в рекламную платформу закрыта по умолчанию: она требует одновременно записи об основании, раскрытия на сайте, которое называет офлайн-конверсии, и решения самого посетителя. Публичные документы офлайн-конверсии пока не называют, поэтому реальная передача запрещена; это осознанное состояние, а не недоделка", "Решение посетителя об атрибуции обязан передать вызывающий код: у событий активации поле согласия не разрешено каталогом, поэтому вызов экспорта с решением посетителя еще не проведен из потока приема событий", "Записи об основании передачи и об отзывах лежат в файле вне git и содержат только метаданные; устное подтверждение юриста нужно перевести в такую запись", "Нагрузочная проверка на сервере аналитики и снятие абсолютного объёма хранилища (T076) не проведены", "Владельцы правил оповещения задаются ролями в репозитории, персональные имена — вне git через переменные окружения", "Реестр мостов атрибуции и защита от двойного счёта вех живут в памяти процесса", "Согласие на телеметрию в приложении пока не имеет интерфейса, отправитель вех закрыт по умолчанию", "Внутренний и служебный трафик пока исключается только ручной меткой: визиты оператора попадают в цифры по каналам как внешние (T087)", "Правило последнего непрямого источника не подключено к рабочему пути: кампания берется из текущей cookie визита (T088)", "Доля давших необязательное согласие считается кодом продукта на отчётной поверхности (GET /api/v1/product-analytics/reports) из обезличенного счёта уровня 1, но в плитку дашборда её переносит оператор: дашборд наполняется вручную, пока доставка в PostHog выключена (T089)", "Стоимость результата считается кодом продукта из выгрузки кабинета, но выгрузку расхода и счётчики конверсий кладёт оператор: без файла TWOBRAIN_PRODUCT_ANALYTICS_AD_CABINET_EXPORT_FILE стоимость показывается как «нет данных» (T090)", "Второй оператор с обязательным вторым фактором, версионирование конфигурации и отзыв доступа описаны в руководстве, но не управляются кодом (T091)", "Определения дашбордов и отчетов подготовлены, но не применены, и помечены как незаполняемые (T092)", "Опубликованные копии документов ссылаются на редакцию текста согласия токеном, поэтому согласованность текстов не полная (T093)", "Откат измерения на живом сценарии не отработан: готовность к откату есть, прогона нет (T094)"]
release_notes: "Аналитика платного трафика построена по трём правовым уровням. Первый уровень — обезличенный счёт посещений всех публичных страниц: он работает без согласия, не хранит адрес устройства, не создаёт долгоживущих идентификаторов и не связывает визиты между собой; в отчёты попадают только корзины не меньше трёх посещений. Он включён по умолчанию, потому что нужен как знаменатель для доли согласия, а два уровня, которые обрабатывают персональные данные, по умолчанию выключены. Отдельный переключатель позволяет остановить только этот счёт, не трогая остальные уровни. Второй уровень — атрибуция и данные зарегистрированных пользователей на основании договора: метки кампании переживают переходы между страницами визита и записываются атрибутом клиента при регистрации. Третий уровень — измерение по согласию, включая запись поведения. Воронка от клика до первой ценности теперь действительно измеряется: вехи активации отправляются из реальных путей приложения, а не только из тестов, и каждое конверсионное событие несёт исходную кампанию и уровень надёжности атрибуции. Событие без известной кампании помечается как неизвестное, а не как прямой заход. Отдельно считается фактическая отдача файла установщика, а не только нажатие кнопки; шаги веб-регистрации считаются по отдельности и сохраняют кампанию визита. Передача данных в рекламную платформу проходит через правовой шлюз: нужны запись об основании в нужной области, раскрытие, которое посетитель действительно читает, и его собственное решение; для рекламы по сетям электросвязи требуется отдельное предварительное согласие абонента, и согласие на измерение его не заменяет. Отпадение основания останавливает обработку уровня и запускает удаление или обезличивание в сроки хранения, а отзыв согласия прослеживается до внешнего получателя. Подготовлены четырнадцать дашбордов PostHog и десять отчётов Яндекс.Метрики, где у каждого отчёта есть владелец и обязательные оговорки, а пробел в данных показывается как пробел, а не как ноль. Платный запуск разрешается только записями об одобрении: технический флаг может задержать разрешение, но не выдать его. Удаление по сроку хранения теперь действительно работает: имена таблиц в скрипте принудительного удаления приведены в соответствие со схемой, и сверка с моделями закрыта тестом, иначе обязательное законом удаление не выполнялось бы ни для одной категории. Откат всех трёх миграций фичи проверен на чистой базе без отката предшествующего billing catalog. Веха подключения аккаунта отправляется и из входа по коду из письма — именно так настольное приложение подключает аккаунт, — а способ входа записывается отдельно от входа через внешнего провайдера. Порядок записей о правовом основании и отзывах описан для оператора отдельным документом."
