summary: "Word-шаблон и учебное видео в протоколе; даты редакции двух руководств"
issue: 7391
tasks: [T024, T026, T028]
compatibility: "Добавлены редакционный вход к Word-шаблону и нативное видео с ручным запуском, подписями и текстовой версией; даты редакции Zoom и протокола совпадают с Article.dateModified; URL, остальные метаданные, DOCX и общие стили сохранены"
known_limitations:
  - "Уточнение навигации не подтверждает индексацию, внешний трафик, регистрации или продажи"
  - "Видео показывает вымышленный учебный результат с одним синтезированным голосом; скорость и доля точности не измерялись"
release_notes: "В начале руководства по протоколу встречи появилась ссылка к готовому Word-шаблону. Добавлен 72-секундный разбор учебных итогов, задач и найденной ошибки: без звука, с ручным запуском, русскими подписями и отдельным текстом. MP4 не загружается до запуска читателем. В двух руководствах указаны подтверждённые даты содержательной редакции: 27 октября у Zoom и 1 ноября у протокола."
