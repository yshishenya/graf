schema_version: 1
feature_id: 267
category: Changed
summary: "Итоги встречи: одна понятная шапка, главное и задачи перед подробностями, свёрнутые темы и компактные таймкоды в конце мысли. Задачи сохраняют читаемость при открытой боковой панели."
issue: 7015
tasks: [T001, T002, T003, T004, T005, T006, T007]
compatibility: "Без новых полей и миграций. Исторические типы встречи сохраняют прежнюю подпись; полный экспорт и исходные формулировки не меняются."
known_limitations:
  - "Содержательное «О чём встреча» появится после отдельной оценки и включения новой версии формирования итогов; до этого используется прежняя подпись типа встречи."
  - "Старые встречи не пересчитываются автоматически."
release_notes: "Новое представление итогов работает с текущей генерацией: главы «О чём встреча», главное и задачи идут перед подробностями, темы и примечания раскрываются по запросу, таймкоды стоят в конце мысли. Источники и полный экспорт остаются доступными."
