category: Fixed
summary: "Исправлены подтверждения и переходы встроенного кабинета, подсказки, подменю, фокус итогов и неточные подписи"
issue: 6567
tasks: [T003, T004, T005, T007, T009, T010, T011, T017]
compatibility: "Без миграций и новых зависимостей. Права и машинные коды не меняются; подписи в текстовых выгрузках приведены к терминам Итоги и Расшифровка."
known_limitations:
  - "VoiceOver недоступен в среде проверки; имена и фокус дополнительно проверены в реальном macOS AX/WKWebView. Полная сертификация WCAG не заявляется."
release_notes: "Устранено падение при отсутствии запроса исходного фрейма WebKit в macOS 14. Добавлены безопасные нативные подтверждения с отменой по Return/Escape и завершением при закрытии или смене страницы. Общие встречи и ссылки хранилища сохраняют поверхность кабинета. Подсказки и подменю помещаются в узком окне, длинные подписи переносятся. После принятия итогов восстанавливается фокус. Удалены 19 неиспользуемых макросов и 20 CSS-токенов с сохранением действующих страниц и защиты аналитики."
