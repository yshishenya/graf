schema_version: 1
feature_id: 273
category: Fixed
summary: "Новые резервные копии создаются в закрытом каталоге, репетиция проверяет очистку собственных временных целей"
issue: 7804
tasks: [T113, T110]
compatibility: "Формат копии сохранён. Существующая цель отклоняется без перезаписи. Автоматический выбор использует полные датированные комплекты GRAF; другие полные комплекты задаются явным абсолютным путём"
release_notes: "Каталоги новой копии имеют права 0700, файлы — 0600. Временный дамп изолирован; ошибка копирования, проверки прав или очистки запрещает успешный результат. Репетиция создаёт новые БД и хранилища, удаляет только подтверждённые собственные цели и проверяет их отсутствие. Запрос остановки во время создания исполняется после фиксации успешного владения; ранний сигнал сохраняется до запуска дочернего процесса. Дамп передаётся через стандартный ввод, временный журнал закрыт и удаляется. Общий замок удерживается до окончания работы и очистки"
known_limitations:
  - "Полная проверка схемы, ролей, RLS, реестра первых вех и повторного удаления остаётся отдельным срезом T113"
  - "Локальный режим, рабочая установка и включение аналитики этим исправлением не принимаются"
  - "До штатной установки нового скрипта будущие копии ещё могут получить прежние права"
