schema_version: 1
feature_id: 292
category: Fixed
summary: Удобнее делиться встречей, смотреть запись и открывать её в GRAF
issue: 7906
tasks: [T006, T008, T030]
compatibility: Существующие ссылки, права и проигрыватель GRAF сохранены. Миграций нет.
release_notes: >-
  В панели владельца заметнее копирование ссылки. На телефоне названия вкладок
  «Итоги» и «Расшифровка» больше не разрываются. Если GRAF не открылся,
  подсказка с установкой и продолжением в браузере видна сразу рядом с материалами.
  Переход по дорожке и к следующей реплике применяет позицию один раз.
known_limitations:
  - Системное открытие приложения зависит от настроек браузера и macOS.
