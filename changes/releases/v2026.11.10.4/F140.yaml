schema_version: 1
feature_id: 140
category: Changed
summary: Автоматическая проверка доставки пяти уведомлений об оплате и продлении
issue: 4922
tasks: [T068]
compatibility: Поведение приложения, схема данных и настройки не меняются.
known_limitations:
  - Почтовый транспорт подставной; фактическое получение письма проверяется отдельно.
  - Проверка не охватывает пробный срок, пороги хранилища, реферальные бонусы, другие состояния чека и позднюю успешную оплату.
release_notes: >-
  В изолированной PostgreSQL проверяются оплата, готовый чек, напоминание о
  продлении, неизвестный исход и поздний подтверждённый отказ. Штатный
  обработчик передаёт каждое уведомление подтверждённому получателю один раз.
