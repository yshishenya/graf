compatibility: "Без миграций и новых служб; финансовые действия и права не меняются"
known_limitations: ["Плановый интервал FR-105, вся T048/T068 и настоящая доставка #7524 остаются открытыми", "Отчёт T077 всегда неполный; остальные источники, регулярность, тревоги и сохраняемая реакция FR-089 не завершены"]
release_notes: "Внутренний отчёт доступен только служебной роли PostgreSQL, читает согласованный снимок без записи и отделяет нули от неподключённых источников. Дневной показатель считает только служебные события проекции подписки на Free по московскому дню: отдельно показывает неизвестные причины, строки без даты и записи после момента расчёта. Поздняя фиксация транзакции может изменить прошлый итог. Это не все переходы на Free и не проверка своевременности; задача #4932 остаётся открытой. Подтверждения оплаты из прежнего выпуска этим изменением не переделываются."
