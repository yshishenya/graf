compatibility: "Меняется только испытательное окружение; производственный набор прав, схема данных и интерфейс сохранены Схема данных, цены, квоты и клиентский протокол не меняются; требуется штатная повторная настройка серверных ролей из новой версии"
release_notes: "Устранены ошибки проверок, выявленные перед выпуском исправления подготовки аудио. Проверки результата и ограничений доступа сохраняются. Служба подготовки аудио читает только нужные столбцы финансовых фактов своей рабочей области. Повторная настройка очищает лишние права и проверяет точный набор. Расчёт объёма, проверки источника и последовательность повторов сохраняются."
known_limitations: ["Публикация требует успешной полной проверки нового замороженного кандидата и проверки рабочего сервера", "Локальные проверки разрешений не заменяют проверки выпуска и рабочего сервера"]
