schema_version: 1
feature_id: 262
category: "Fixed"
summary: "Проверка удаления учитывает открытую запись и большую локальную историю Удаление проверяет принятие сервером, доступ и смену сеанса; отмена сохраняет исходное устройство"
issue: "6895"
tasks: ["T020", "T024", "T025", "T005", "T006", "T007", "T008", "T010", "T012", "T014", "T015", "T016", "T018"]
compatibility: "Формат сохранённой очереди и серверные API не меняются. Для приоритетной проверки, ограниченного числа запросов и повторов требуется новый нативный клиент; видимость строк передаётся обновлённым cabinet.js. Формат очереди и отчёта, основания очистки сохранены. Внутренний протокол отправки требует контекст сеанса; HTTP использует существующую серверную проверку expected actor/workspace. Требуется обновление приложения и совместимый сервер."
release_notes: "Приложение объединяет одновременные проверки состояния, сначала проверяет открытые и видимые записи, а остальную историю обходит порциями до 100 записей. Старые записи с неизвестной принадлежностью проверяются отдельно и не задерживают открытую запись. Проверка состояния, удаление и подтверждение очистки используют общий предел двух запросов; отменённый запрос и запрос прежнего аккаунта или пространства не отправляются после ожидания. Повторы удаления получают небольшой устойчивый разброс времени; срок сохраняется после перезапуска и никогда не становится раньше указанного сервером. Пакетная проверка состояния записи дополнена настоящими серверными сеансами: отзыв доступа или членства действует при следующем запросе, чужое пространство и чужой локальный источник не раскрываются. Подтверждение удаления получает только текущий владелец или управляющий с соответствующим правом; недоступность не разрешает очистку. Проверены общая граница 100 целей и устранение повторов; рабочий серверный код не меняется. Сетевое подтверждение удаления теперь требует явного phase=accepted как в прямом ответе, так и при выяснении результата через lifecycle. Неверное или отсутствующее поле не разрешает очистку локальных файлов; операция остаётся доступной для выяснения результата. Сохранённые подтверждённые операции прежней очереди продолжают читаться без изменения формата. Новая отмена записи до создания встречи сохраняет исполнителя, устройство и связь с серверным подтверждением в существующем журнале аудита. Подтверждение и аудит фиксируются одной транзакцией; при ошибке аудита отмена не принимается. Повтор с другого допустимого устройства сохраняет исходное подтверждение и первое устройство. Повторная проверка серверного удаления покрывает HTML/HTMX, смену сессии и отзыв прав управляющего; рабочий серверный код не меняется. Состояние записи и отчёт поддержки различают неизвестный ответ и подтверждённое серверное удаление. Принятое сервером подтверждение удаления сохраняет приоритет после позднего неизвестного ответа или устаревшего разрешения просмотра, в том числе при копировании отчёта после перезапуска приложения. Копирование, отправка и обновление обращения проверяют принадлежность всех выбранных записей: смена аккаунта, пространства, сервера или выход блокируют чужой отчёт до изменения очереди и обращения к сети. Локальное удаление и отмена ещё не созданной встречи не выдаются за удаление серверной копии. Ссылка просмотра учитывает блокирующее состояние удаления. Недоступные записи исключаются до группировки доступных кандидатов отчёта. Асинхронная отправка привязана к исходному сеансу и документу кабинета; устаревшие ответы не меняют очередь. Пересекающиеся отправки отклоняются до второго запроса. Прерванная отправка восстанавливает доступные действия без перезапуска только в своём контексте; обновление сохраняет известный номер обращения и доступно для повтора. Активный запрос и чужое состояние не изменяются. PostgreSQL-проверки create/cancel дополнены одинаковым ID записи у разных пользователей и в разных пространствах: отмена одной записи не затрагивает другую, повторы сохраняют исходные ID и подтверждения, независимые запреты создания хранятся отдельно. Повторная приёмка списка проверяет одну команду после переноса выбора на серверную строку, согласованные счётчики после нескольких удалений и независимую защиту от старого HTML и повторного состояния локальных копий. Браузер без сети сохраняет строку и сообщает об ошибке до явного повтора; код продукта не меняется."
known_limitations: ["Выпуск, production и новая установленная приёмка GRAF Dev в этом PR не выполняются.", "T019/T021/T022/T023 и установочные остатки T013/T016 F262 остаются открытыми.", "Срок повтора округляется вверх к секундной точности существующей очереди: прибавка меньше одной секунды.", "Запрет доступа при неизвестном состоянии сохраняется до подтверждения сервером.", "Новый выпуск и установленная приёмка этим изменением не подтверждены.", "Полная приёмка индекса отчётов T018 и всей F262 остаётся отдельной задачей.", "Для старых подтверждений отмены без аудита историческое устройство не восстанавливается.", "Приёмка T015 дополнена проверками списка; T016 остаётся открытой до позднего смешанного ответа и установленного server-only удаления с перезапуском."]
