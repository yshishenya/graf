schema_version: 1
feature_id: 263
category: Fixed
summary: Ошибка удаления временного PostgreSQL больше не считается успешным завершением проверок.
issue: 6907
tasks: [T006, T007, T008]
compatibility: Продукт и схема данных не меняются; код ошибки тестового скрипта учитывает обязательную очистку.
release_notes:
  - При отказе удаления собственного контейнера проверка завершается ошибкой и сообщает о ней; итоговая отметка успеха появляется только после успешной очистки.
  - Исходные ошибки и завершение по сигналу сохраняются; чужие контейнеры и данные не затрагиваются.
known_limitations:
  - При недоступном Docker удаление не гарантируется; скрипт честно сообщает об отказе.
  - Остальные задачи F263 и утраченные исходные измерения остаются открытыми.
