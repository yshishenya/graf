schema_version: 1
feature_id: 228
category: Fixed
summary: Исключения совместимости в спецификациях и PR требуют полной декларации и будущего срока удаления.
issue: 6238
tasks: [T009, T019]
compatibility: Продукт и данные не меняются; неполные исключения блокируются, remove и untouched сохраняют прежний смысл.
release_notes:
  - Общая проверка требует восемь заполненных полей, точную будущую дату UTC и связь фичи, задачи и issue.
  - Пустые, повторные и шаблонные значения, истёкший срок и повторная классификация отклоняются.
  - Проверка PR использует доверенную версию правил без исполнения исходников PR; шаблон и руководство уточнены.
known_limitations:
  - Формат ссылки не доказывает существование или приёмку задачи; реестр и обнаружение изменённых путей остаются открытой работой F228.
  - Удаление старого кода и данных, выпуск и развёртывание не выполнялись.
