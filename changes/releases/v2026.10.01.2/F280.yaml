schema_version: 1
feature_id: 280
category: Changed
summary: "Можно оплатить один период без автопродления: галочка включена по умолчанию, но её можно снять перед оплатой."
issue: 7408
tasks: ["T020", "T021", "T022"]
compatibility: "Миграции данных и обновление macOS-приложения не нужны. Принятие оферты остаётся обязательным и не включается автоматически."
release_notes: "При снятой галочке карта не сохраняется для будущих списаний, а оплаченный месяц или год доступен полностью. Выбор сохраняется в той же вкладке при применении промокода, смене периода и обновлении страницы. Повтор существующего платежа сохраняет его исходные условия."
known_limitations:
  - "Перенос выбора между страницами требует JavaScript и доступного хранилища текущей вкладки; без JavaScript разовая оплата доступна в текущей форме."
  - "Реальные платежи, чеки, банковское зачисление и возвраты остаются отдельной финансовой приёмкой F278."
  - "Человеческая приёмка и измерение конверсии остаются отдельными задачами."
