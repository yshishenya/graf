compatibility: "Изменений совместимости нет. Исправление касается только арбитража временных карточек уведомлений; системный резервный канал и настройки записи не меняются."
known_limitations:
  - "Полная живая матрица macOS с разрешениями, «Не беспокоить», темами, VoiceOver, крупным шрифтом, полноэкранным режимом и несколькими мониторами остаётся отдельным незакрытым этапом проверки F274."
release_notes: "После истечения более важного уведомления GRAF снова показывает ожидающую карточку встречи. Сценарий, в котором проблема сохранения или короткая запись временно перекрывает напоминание о встрече, больше не теряет напоминание до следующего обновления календаря."
