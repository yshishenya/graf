schema_version: 1
feature_id: 292
category: Fixed
summary: "Публикация итогов и возобновление ссылки работают для встреч без известного времени начала"
issue: 8045
tasks: [T038]
compatibility: "Без миграций и изменения JSON: обязательная дата сохраняет прежнее значение начала или создания; права, адрес и выбранный срок ссылки прежние"
known_limitations: ["Состояния установленного приложения и выпуск проверяются отдельно от локальных серверных тестов"]
release_notes: "Исправлена ошибка при создании снимка итогов без времени начала, в том числе при возобновлении истёкшей полной ссылки с ограничением до итогов. Все страницы сохранённых итогов используют общие правила достоверного отображения даты: неизвестное начало не подменяется созданием, для загруженной записи показывается метка загрузки. Опубликованные заголовок, известная дата и содержимое снимка сохраняются."
