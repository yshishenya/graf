category: Changed
summary: "Панель прослушивания с дорожками спикеров и обсуждениями записи"
issue: 6793
tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T013, T014, T015, T016, T017]
compatibility: "Миграции 0090–0091 добавляют комментарии и явные права комментирования и редактирования, ограниченные проекции имён авторов и участников. Прежние получатели доступа не получают новые права автоматически."
known_limitations:
  - "Ножницы, удаление части аудио и ссылки на произвольный диапазон отложены на следующий этап."
release_notes: "Добавлены выбор скорости, переходы между репликами, прослушивание выбранных спикеров, управление дорожками и комментарии к моменту или реплике с ответами, реакциями и упоминаниями. Роли доступа определяют возможности участия в обсуждениях. Выровнены иконки перемотки на 15 секунд; ручка изменения высоты остаётся скрытой при изменении размера свёрнутой панели. В свёрнутом виде общая шкала сохраняет цветную разметку спикеров. Переход к реплике учитывает высоту проигрывателя и шапки; при увеличении масштаба начало текста остаётся в видимой области."
