compatibility: "Сохраняются записи, очередь, настройки и режимы автозаписи F214. Постоянное плавающее окно удалено; запись видна в строке меню F255, остановка первым пунктом. Новых миграций нет; media worker получает SELECT восьми колонок processing_workflows при сохранении прежних ограничений."
known_limitations: ["Показ системного уведомления определяется разрешением macOS и Фокусированием", "Готовность результатов остаётся в кабинете и не создаёт баннер macOS", "Установленная приёмка объединённой сборки и точный PR CI остаются обязательными до готовности PR"]
release_notes: "Объединены исправления F249/F255 после релиза и полезный объём F258. Календарное уведомление показывает время и отдельные действия подключения и настройки. Локальная ошибка открывает нужную запись; кнопка обновления встроенного кабинета больше не отменяет собственный запрос. Частичные итоги явно показывают ограничения. Если готовность объявлена без сохранённого результата, кабинет показывает недоступность итогов; новый ещё не выбранный формат остаётся незапрошенным. При появлении расшифровки обновляются спикеры и привязка комментариев, сохраняются звук и черновик. Устранено непрерывное обновление списка при ещё не заказанных или готовящихся итогах. Старый сценарий ручной проверки направляет к единственному GRAF Dev; проверка AAC принимает штатный формат метаданных macOS. Готовый звук доступен до итогов; результаты выбранного формата появляются автоматически без потери проигрывания и введённого названия. Сохранение названия передаёт обязательное подтверждение запроса. Открытый черновик названия больше не задерживает появление готовых итогов; нажатие системного уведомления сохраняет выбранное окно настроек."
