summary: "GRAF сохраняет вход при регулярной работе и требует повторную авторизацию после 30 дней без активности"
issue: 6930
tasks: [T001, T002, T003, T004, T005, T006, T007]
compatibility: "Схема данных не меняется; сервер и обновлённый клиент macOS выпускаются совместно. Действующая прежняя сессия продлевается, уже истёкшая требует повторного входа. Явная настройка срока сохраняется."
known_limitations: ["Конкурирующие сетевые Set-Cookie не имеют атомарного сравнения; отозванный доступ на сервере не восстанавливается. Запрос, закончившийся после срока бездействия, не возобновляет истёкший вход."]
release_notes: "Продлевается существующий вход и срок его сохранения в обеих копиях на Mac, включая фоновые ответы 304. Явный выход, отзыв устройства и отказ авторизации сохраняют силу. Продление того же входа больше не выглядит сменой аккаунта."
