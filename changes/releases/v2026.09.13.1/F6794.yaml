compatibility: "Правила доступа, сроки и хранение записей не изменены. Миграций и новых зависимостей нет."
known_limitations: "Список относится к текущему рабочему пространству. Показывается приложение или браузер и система, если они известны; геолокация не собирается."
release_notes: "Текущий вход показан первым; общий счётчик относится ко всем действующим входам. Карточки заменены строками с разделителями. Недоступные и завершённые входы больше не выводятся. Кнопки и подтверждения используют единые формулировки; справка объясняет действия при незнакомом входе."
