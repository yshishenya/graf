schema_version: 1
feature_id: 285
category: Fixed
summary: "Убраны большие рамки страниц и сообщений; руководства выделяют заголовок вместо всей карточки"
issue: 7499
tasks: [T012, T013, T014, T015]
compatibility: "Без миграций и новых зависимостей. Программные переходы, порядок Tab, возврат фокуса, клавиатурные действия и область клика руководств сохранены"
known_limitations:
  - "По прямому разрешению пользователя переход VoiceOver из уведомления к записи не проверялся в установленном приложении; его работа остаётся неподтверждённой, настройки VoiceOver не менялись"
  - "Нативная навигация кнопок следует системной настройке macOS"
  - "WebKit проверяется в обеих темах и повышенном контрасте; forced-colors проверяется в Chromium"
release_notes: "Информационные цели перехода больше не получают внешнюю рамку. Карточки руководств при Tab подчёркивают заголовок. Конкретные кнопки и поля сохраняют видимое выделение. macOS выпуск доставляет также исправление большой рамки панели записи из PR #7461, ранее выпущенное только на сервере"
