schema_version: 1
feature_id: 140
category: "Fixed"
summary: "Добавлены напоминание до продления и уведомления о неизвестном результате и подтверждённом отказе при окончании периода Добавлен внутренний импорт платёжных реестров, согласованы требования интерфейса и проверена цепочка трёх отказов продления"
issue: "4903"
tasks: ["T048", "T074", "T075", "T079", "T083"]
compatibility: "Используется существующая очередь; схема БД, платежи и правила доступа не меняются Требуется миграция 0107_billing_registry: две отдельные служебные таблицы с обязательной RLS; откат запрещён при наличии истории. Проверка восстановления учитывает точное состояние последовательностей. По умолчанию команда только проверяет файлы"
release_notes: "Текущий плательщик получает одно напоминание при создании первой допустимой попытки продления за 72–48 часов до окончания периода, а также сообщение о неизвестном результате или подтверждённом отказе. Поздний ответ провайдера учитывается по времени обработки после ожидания, включая уже состоявшийся переход на Free. Напоминание содержит принятую сумму, цикл, даты МСК и безопасную маску способа оплаты. Записи сохраняются атомарно с существующей операцией или переходом и не повторяются при повторной обработке. Текст описывает расписание или событие в прошлом и направляет за актуальным статусом в кабинет без предложения повторной оплаты. Результат проверки и ответственные за расхождения сохраняются без исходного CSV, сумм и платёжных идентификаторов. Повтор не дублирует результат, замена проверяет текущую версию, отдельная команда читает состояние после перезапуска. Импорт не меняет платежи или доступ пользователя. Требования F140 к интерфейсу приведены к действующей конституции: допускается наблюдаемый интерфейс Krisp при независимом коде, подтверждённых правах на материалы, доступности и правдивых текстах GRAF; ручная приёмка T079/T083 остаётся открытой"
known_limitations: ["Остальные события T048 и фактическая доставка писем остаются открытыми; обратной массовой рассылки нет", "Поддерживается один русский CSV-профиль UTF-8; импорт доступен только фактической служебной роли PostgreSQL", "financial_status=not_checked: полнота файлов не доказывает сверку с API YooKassa и финансовыми записями GRAF", "T075 и #4930, проверка магазина и открытие продаж остаются незавершёнными", "Новая PostgreSQL-проверка T074 использует подставной транспорт и не заменяет настоящий магазин или всю FR-090", "Счётчики последовательностей не входят в снимок PostgreSQL: расхождение между чтениями pg_dump и описи отклоняет восстановление и требует повторного резервирования"]
