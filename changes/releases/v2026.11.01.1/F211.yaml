schema_version: 1
feature_id: 211
category: "Fixed"
summary: "Проверка inventory не зависит от числа ранее созданных учебных рабочих пространств. Подготовка Ubuntu в CI восстанавливает безопасные права проверенного ключа и двух каталогов Проверки macOS перенесены с отключаемого образа GitHub на поддерживаемый"
issue: "7873"
tasks: ["T115", "T112", "T113", "T114", "T105", "T106", "T107", "T108", "T109"]
compatibility: "Только курсор существующего теста PostgreSQL; рабочие SQL, роли, RLS, лимит50 и проверки результата сохранены. Только GitHub-hosted Ubuntu 24.04/noble amd64: доверие APT сохранено; root:root0777 ключ, /usr/share и каталог ключей исправляются только после полной проверки source, защищённых root/usr и точного официального pin ключа3607bytes Сохраняются Apple Silicon, Swift 6.0.3 и Xcode 16.2; SDK закреплён на уровне задания, кэш macOS 14 не переиспользуется; deployment target macOS14 сохранён, старый выбор WebKit callback по версии Swift удалён"
release_notes: "Учебная запись выбирается начиная с UUID непосредственно перед ней, поэтому переполненная первая страница общей тестовой базы не вызывает ложный отказ полного прогона. Известный официальный ключ Ubuntu после проверки контрольной суммы атомарно заменяется копией тех же байтов с правами 0644. Каталоги /usr/share и ключей с root:root0777 исправляются через проверенные дескрипторы сверху вниз в0755, только под защищёнными root/usr; после любого ремонта ключ обязательно получает новую inode. Неизвестное содержимое, подмена и ошибки блокируют APT; полностью безопасный путь не переписывается. Числовые метаданные отказа не раскрывают содержимое Для PR, полной проверки кандидата и отдельной диагностики используется поддерживаемый образ macOS 15. Ошибка архитектуры, compiler или SDK останавливает проверку; состав тестов, права и проверка происхождения доказательств сохранены. Для SDK15.2 используются существующие MainActor/Sendable типы WebKit; Обработчик подтверждения использует стандартный асинхронный метод WebKit; проверки доверия, отмены и однократного ответа сохранены. Подготовка настоящих UI-тестов учитывает небольшой экран, обновление геометрии доступности и завершение предыдущего диалога без ослабления защитных проверок"
known_limitations: ["Новый полный прогон, выпуск, рабочая аналитика и T0 принимаются отдельно", "Остальные открытые задачи F211 и коммерческие цели не закрываются", "Настоящая подготовка с проверенным официальным ключом принята в PR #7863; неизвестный доступный для записи ключ остаётся отказом, новая полная проверка выпуска обязательна", "Фактический прежний источник AWS остаётся неизвестным; T110 не принята, новый Full и выпуск принимаются отдельно", "Не является новым выпуском или приёмкой установленного приложения; очередной кандидат требует обычного release-full", "Ускорение повторной сборки F269/T031 и остальные открытые задачи F211 не принимаются"]
