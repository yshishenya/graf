schema_version: 1
feature_id: 224
category: Fixed
summary: "Стенд восстанавливает GRAF Dev, проверяет службу обслуживания и сохраняет доступные образы хранилищ при сборке"
issue: 7640
tasks: [T009, T011]
compatibility: "Существующая команда promote и формат квитанции сохранены; дополнительный SHA инструмента разрешён только для остановленной той же активной версии с проверенной парой файлов запуска"
release_notes: "Исходники инструмента и восстанавливаемой версии проверяются раздельно. Перед допуском запуска повторно проверяются блокировка, закреплённые исходники и запись дочернего процесса. Повреждённая контрольная сумма прежнего запуска отклоняется общим читателем квитанции. Проверка стенда и переходов теперь отклоняет остановленную службу обслуживания; при обратном восстановлении схемы используется текущая проверка с прежними закреплёнными путями. Сборка переиспользует доступные PostgreSQL/Temporal, как и MinIO; отсутствующие образы требуют успешной загрузки, а проверка фактических ID и совместимости сохраняется"
known_limitations:
  - "Исправление допускает только явно проверенную пару прежних файлов запуска; неизвестная совместимость означает отказ"
  - "Проверка службы обслуживания подтверждает запуск и совпадение версии/образа, но не выполнение её внутренних задач"
  - "Фактическая T009 подтверждена на единственном GRAF Dev и всех службах с отрицательной остановкой; живой совместимый откат, сохранение разрешений и общий выпуск остаются T011, T012, T013 и открытой F224"
