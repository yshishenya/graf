schema_version: 1
feature_id: 273
category: Fixed
summary: "Учебные проверки создают временный реестр основания. Публичная аналитика проверяет основание и сохраняет обработчик SDK при остановке Проверки выпуска учитывают новую миграцию реестра платежей и сохраняют защиту истории аналитики; резервная копия и повтор точных удалений проверяются в учебной восстановленной БД"
issue: 7696
tasks: [T106, T113]
compatibility: "Рабочие флаги, защита основания и состав событий не меняются. Рабочие флаги и редакция согласия не меняются; public путь требует читаемого валидного реестра, отсутствие файла закрывает передачу Рабочий код, миграции и права доступа не изменены. Проверка восстановления требует закрытый полный комплект с inventory формата 2 и контрольными суммами. Старые комплекты сохраняются, но новую проверку не проходят. Сохранённая revision должна быть известна в линейной цепочке начиная с 0106 и совпадать с восстановлением, но не обязана быть текущим head проверяющего checkout. Восстановление сохраняет владельцев объектов и создаёт отдельную временную БД для разбора исходной схемы"
release_notes: "Старый тест области Метрики запрашивает существующую явную учебную предпосылку. Проверка провайдера использует собственный временный реестр только при построении публичного контекста; запрет сети и отказ восстановления до и после учебной проверки транспорта сохранены. Общее свежее решение применяется к контексту страницы, приёму события и доставке. Сохранённый выбор посетителя сверяется перед управляемыми отправками и при возврате вкладки; старое уведомление не восстанавливает отозванное согласие. Очистка очереди сохраняет исходный массив и обработчик SDK, чтобы команда остановки действительно исполнялась. Ручной профиль проверяет настоящий SDK при полностью перехваченной сети. Дополнительная проверка PostHog сохранена; ошибки аналитики не останавливают продукт Два теста отката проверяют историю аналитики в собственных БД на revision 0106. Проверочная опись и матрица RLS учитывают существующие таблицы 0107, а проверка ручного просмотра лендинга использует действующую формулировку о независимом коде и правах на материалы. Строгие ошибки, равенство описи и защитные проверки сохранены. Штатные psql и pg_dump используют один экспортированный снимок для дампа, схемы, полного счёта таблиц и состояний первых вех. После восстановления сверяются схема, права, ограничения, количества и состояния доставки. Одноразовый процесс в собственной учебной БД помещает неподтверждённую доставку в карантин и повторяет точные удаления по актуальным явным решениям с ответственным и сроком. Карантин и удаления выполняются одной транзакцией с отдельным чтением результата; неизвестный исход сохранения и ошибка очистки не дают успеха. Повреждённый реестр запрещает запись аналитики, сохраняя обычную работу продукта"
known_limitations:
  - "Рабочее включение аналитики, полный T106, измерение и T0 требуют отдельной приёмки"
  - "Профиль SDK ограничен analytics-only, локальными ответами и 20 секундами; replay, реальный backend, серверное обновление разрешения активной вкладки и индивидуальный серверный отзыв ещё не приняты"
  - "Выпуск, включение аналитики и начало измерения требуют отдельной приёмки"
  - "Повтор удалений принимает только собственный учебный источник и временную UUID-цель. Полнота рабочей истории, остановка всех пишущих служб, рабочее восстановление, неизвестный интервал после копии и готовность первого локального периода требуют дальнейшей реализации"
  - "Роли не входят в обычный pg_dump: сохранены только безопасные характеристики для последующего сравнения без паролей"
  - "Рабочая установка, включение аналитики, IP и получателей этим срезом не выполняются"
