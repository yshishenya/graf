release_notes: "В разделе шаблона протокола доступен файл Word с формой для заполнения, инструкцией и вымышленным примером. Новое скачивание требует штатного выпуска и проверки рабочего сайта. Сверены точный исходник, Full, штатная выкладка и публикация уже выпущенного исправления. Повторная проверка действующего сайта подтвердила 70 сочетаний размеров окна и текста на семи страницах, а также сохранение защищённых ресурсов. Восстановлены восемь связей уже существующих задач с общей issue без новых задач и изменения исходных критериев. Прежняя документальная приёмка не требовала нового выпуска; добавление шаблона публикуется отдельно через штатный выпуск."
