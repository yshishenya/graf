release_notes: "Подтверждены принадлежность рабочих копий, конечный безопасный набор доказательств и полная запись пропусков; независимый checklist принят 23/23. Исправлена команда инструкции, ранее выводившая только справку; сохранены исторические результаты и отменённые задачи. Исправлены пропуски распознавания присваиваний секретов и закреплён опубликованный harness v0.1.15. Настоящие артефакты, чистая установка, обновление и возврат проверены; ShellCheck выполняется до сборки; лицензионный текст сохранён, его обозначение уточнено в метаданных."
known_limitations: ["Обязательные проверки окончательного PR и итоговая сверка трекера принимаются отдельно; новая проверка разрешений и реальный откат не выполнялись; родитель F216 закрывается отдельно после проверки исторических детей", "Итоговая приёмка F216 остаётся открытой; проверка не гарантирует обнаружение любых секретов во всех форматах; возврат v0.1.14 сохраняет известное предупреждение ShellCheck"]
