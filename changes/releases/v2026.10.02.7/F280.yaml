schema_version: 1
feature_id: 280
category: Fixed
summary: "Промокод проверяется без перезагрузки страницы, а недоступная скидка получает понятное объяснение."
issue: 7460
tasks: ["T026", "T027", "T028"]
compatibility: "Новых API, зависимостей и миграций нет. Обычные формы без JavaScript, сроки промокода и расчета, выбранное продление и финансовые проверки сохранены."
release_notes: "Применение, исправление и удаление промокода, а также выбор месяца или года обновляют оформление на месте. Итог и кнопка оплаты согласованы. Во время проверки оплата недоступна; после сбоя можно повторить проверку. Отключенное продление сохраняется даже при недоступном хранилище браузера. Недоступность промокода и оплаты аккаунта объясняется отдельно без внутреннего проверочного окна."
known_limitations:
  - "Без JavaScript используется прежняя обычная отправка формы с переходом страницы."
  - "Реальное списание, привязка карты, чек, банковское зачисление и возврат требуют отдельной финансовой приемки."
  - "Приемка людьми и измерение конверсии остаются отдельными задачами."
