schema_version: 1
feature_id: 278
category: Fixed
summary: "Письма оплаты отправляются существующей почтовой службой; неизвестный результат отправки не вызывает автоматический повтор."
issue: 7524
tasks: [T032]
compatibility: "Без миграций, изменения цен, финансовых правил, адресатов и провайдера. Сохраняются оплаченные права, бюджет и согласие на автопродление; используется прежняя outbox очередь и Postal."
known_limitations:
  - "Принятие письма Postal и получение пользователем проверяются отдельно после выпуска."
  - "Исторические failed письма не сбрасываются автоматически; неоднозначный исход требует отдельной сверки."
  - "Возвраты, точная комиссия и обязательная ручная приемка всей F278 остаются открытыми."
release_notes: "Почтовые настройки согласованы API/processing/maintenance и проверяются перед заменой служб и после запуска. Захват строки фиксируется до отправки, чтобы сбой или конкурирующая служба не повторили письмо с неизвестным исходом."
