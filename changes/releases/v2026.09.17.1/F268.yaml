schema_version: 1
feature_id: 268
category: Changed
summary: "Кабинет, публичный сайт и macOS-приложение приведены к одному визуальному языку и одному словарю: единый источник цветов, радиусов и типографики в обеих темах, правдивые и различимые состояния обработки, один индикатор обновления, тексты без «ё», страницы уведомлений и удалений в общем стиле. Поведение записи, авторизации, доступа, удаления, оплаты и обработки не меняется."
issue: 7060
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019, T020, T021, T022, T023, T024, T025, T026, T027]
compatibility: "Поведение не меняется: запись, авторизация, доступ, удаление, оплата и обработка работают как прежде. Канонические сохранённые значения не переписаны — метка спикера и каталог шаблонов версии 1 восстановлены, конвенция текста применяется на границе показа; формат экспорта сохранён под версией export-v2. Внешние потребители (API, экспорт) получают прежние значения."
known_limitations:
  - "Пиксельный осмотр нативных панелей не выполнен: процессу недоступен захват экрана. Вместо него содержимое живого приложения проверено через доступность — меню трея содержит «Начать запись», «Открыть GRAF», «Настройки…», «Выйти из GRAF», все пункты активны, серых информационных строк и второго индикатора обновления нет. Поведение баннера обновления и онбординга покрыто тестами AppUpdateControllerTests и SystemAudioPermissionUXTests."
  - "Биллинг и рефералы проверены контрактными тестами, живым браузером не проверялись: маршрутов биллинга в синтетическом стенде нет."
  - "Публичный сайт (лендинг) в браузере не поднимался; конвенция текста проверяется контрактным тестом."
  - "Ручная визуальная проверка индикатора обновления, трея и онбординга осталась за оператором (задача T026 не закрыта): нет разрешения на запись экрана."
  - "scripts/check_spec_kit_governance.py завершается предупреждением speckit-bootstrap: doctor failed из-за версии локального инструмента (v1.0.4 против ожидаемой v1.0.7). Файлы репозитория не менялись; требуется обновление инструмента окружения."
release_notes: "Интерфейс GRAF стал единым и предсказуемым. Кабинет, публичный сайт и приложение теперь используют один набор цветов, радиусов и типографики, поэтому светлая и тёмная темы выглядят согласованно, а фирменные элементы больше не зависят от системного акцента. Состояния обработки и сообщений стали различимыми и правдивыми: видно, что происходит с записью и расшифровкой, появился скелетон загрузки без смещения вёрстки, а описание внешнего доступа в окне «Поделиться» соответствует действительности. Индикатор обновления остался один, подписи меню и трея берутся из одного источника, названия разделов больше не обрезаются. Тексты приведены к одному словарю и пишутся без «ё». История уведомлений и страницы удаления работают в общей оболочке кабинета. Поведение записи, авторизации, доступа, удаления, оплаты и обработки при этом не изменилось, а сохранённые данные и формат экспорта остались прежними."
