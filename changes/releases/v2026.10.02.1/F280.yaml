schema_version: 1
feature_id: 280
category: Fixed
summary: "При отклонённом создании платежа показывается понятный отказ начала оплаты и способ вручную выбрать разовую покупку."
issue: 7414
tasks: ["T023", "T024", "T025"]
compatibility: "Миграции данных и обновление macOS-приложения не нужны. Режим автопродления по умолчанию, обязательная оферта и финансовые переходы сохраняются."
release_notes: "Подтверждённый отказ автопродления объясняется без противоречивой просьбы проверить не созданный платеж позже. Можно вернуться к оформлению, вручную снять галочку автоматических списаний и оплатить один период. Старые общие отказы показываются без выдуманной подробной причины; неизвестный результат сохраняет безопасную проверку существующего платежа. Автоматического изменения режима или повторного платежа нет."
known_limitations:
  - "Доступность автоплатежей магазина зависит от подключения этой возможности у ЮKassa; исправление GRAF её не включает."
  - "Реальные платежи, чеки, банковское зачисление и возвраты остаются отдельной финансовой приёмкой F278."
  - "Человеческая приёмка и измерение конверсии остаются отдельными задачами."
