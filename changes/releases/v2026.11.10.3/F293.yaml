release_notes: "Интерфейс GRAF стал предсказуемее: статусы записи больше не зависят от точного текста, ошибки не показывают внутренние коды, остановка доступна из меню при закрытом окне, смена аккаунта очищает старый контекст, настройки объясняют недоступные разделы, а окно, панель и микрофон сохраняются между запусками. Во время записи интерфейс не выполняет файловые проверки и перечисление устройств в пути отрисовки. Добавлены поведенческие тесты и проверка согласованности дизайн-токенов."
