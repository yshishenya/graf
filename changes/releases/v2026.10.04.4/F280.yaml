summary: "Подписка и платежный документ стали компактнее: состояние, срок и нужное действие видны сразу."
issue: 7503
tasks: [T046, T047, T048, T049, T050, T051, T052, T053, T054, T055, T056, T057, T058, T059]
compatibility: "Без миграций и изменений платежных API, согласий или денежных обработчиков. Нативные раскрытия и ссылки доступны без JavaScript; Прежние проверки доступа к чеку и безопасным адресам сохраняются; защищенная проверка чека остается доступной без нового списания."
release_notes: "На странице подписки сразу видны тариф, срок оплаты и автопродление. Доступна заметная кнопка продления, дополнительные условия раскрываются по запросу. Убрано ложное предупреждение при отсутствии карты; при ожидающем платеже предлагается проверка его результата. Пробный период отображается по действующему тарифу. История прямо названа в дополнительных сведениях; проверка карты остается доступной при незавершенной операции, а истечение ключа само по себе не меняет правила нового оформления. Любой неподтвержденный платеж описывается нейтрально, без утверждения отправки. Причина приостановки автопродления видна и при незавершенном платеже; бесплатный и пробный доступ не получают выдуманный период оплаты. Платежный документ показывает сумму и купленный срок, точные реквизиты и помощь доступны в раскрытиях. Дата создания явно отделена от подтверждения оплаты. Вопрос об оплате и запрос возврата открывают подготовленные письма с разными темами. Сохранена защищенная проверка чека после задержки его появления; исправлены подписи и проверки, отличающие получение чека от денежных действий. Предвыбор автоматических списаний при новом оформлении сохранен; его можно снять и оплатить один период."
known_limitations: ["Открытие подготовленного письма не отправляет запрос и не оформляет возврат.", "Частный экран пользователя, банковское зачисление, возврат, реальное автоматическое продление и человеческая приёмка остаются отдельными проверками."]
