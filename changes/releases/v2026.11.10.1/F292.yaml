schema_version: 1
feature_id: 292
category: Fixed
summary: Приглашение на полную встречу работает без разрешения скачивать файлы
issue: 7899
tasks: [T007, T008]
compatibility: Прежние права сохраняются. Скачивание и экспорт можно задать отдельно в API. Для приглашения только к итогам они недоступны.
release_notes: Получатель может открыть встречу и прослушать доступную запись, если владелец оставил скачивание и экспорт выключенными. Письмо и страница приглашения больше не обещают скачивание. Добавлена локальная проверка возврата к исходной записи после регистрации нового пользователя.
known_limitations:
  - Локальная проверка использует тестовые данные и не подтверждает доставку письма или приёмку в установленном приложении.
