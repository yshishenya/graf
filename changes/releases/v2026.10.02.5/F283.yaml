release_notes: "Новые подписи календаря приведены к принятому словарю. Динамические подписи защищены существующей проверкой текста; сохраненное описание API совпадает с реализацией. Ближайшие даты и история разделены. Убраны повторяющиеся названия и предупреждения. Сохранены проверка доступа, приватность и подключение к конкретной встрече. История начинается с последних встреч; отмены, пустые списки и ошибки имеют понятные состояния."
known_limitations: ["Доступны сохранённые календарные даты за 180 прошлых и 30 будущих дней; поиск связанных записей ограничен"]
