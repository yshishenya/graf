summary: "Проверка оформления до подтверждения почты согласована с доступным редактором промокода; запреты оплаты и денежных согласий сохранены. Промокод и выбранный период оплаты сохраняются после обновления страницы и возврата к оформлению в течение пяти минут."
issue: "7402"
tasks: ["T018", "T019", "T016", "T017"]
compatibility: "Рабочий код, цены, миграции и macOS-приложение не меняются. Цены, согласия и правила оплаты сохраняются. Миграции данных и обновление macOS-приложения не требуются; старое неподписанное состояние промокода не переносится."
release_notes: "Дополнена проверка предварительного ввода промокода без разрешения оплаты до подтверждения почты. Обновление оформления больше не убирает примененную скидку. Ошибочный код остается в поле для исправления; смена периода сохраняет ввод. Старые вкладки и просмотр истории не сбрасывают актуальный выбор. Период из страницы тарифов сохраняется и после отказа оформления. Итоговая цена проверяется заново перед оплатой."
known_limitations: ["Реальная финансовая и человеческая приемка остаются отдельными.", "Сохранение выбора ограничено пятью минутами и текущей сессией.", "\"Реальные платежи", "чеки", "банковское зачисление и возвраты F278 требуют отдельной финансовой приемки.\"", "Рост конверсии и удержания требует наблюдения за реальными пользователями."]
