compatibility: "Цены, согласия и правила оплаты сохраняются. Миграции данных и обновление macOS-приложения не требуются; старое неподписанное состояние промокода не переносится."
release_notes: "Ошибочный код остаётся доступным для исправления. Смена периода и старые вкладки не сбрасывают актуальный выбор. Период со страницы тарифов сохраняется после отказа оформления. Перед оплатой итог проверяется заново. Дополнены проверки предварительного редактора без разрешения оплаты до подтверждения почты."
