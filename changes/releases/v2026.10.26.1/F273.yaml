schema_version: 1
feature_id: 273
category: "Fixed"
summary: "Защита аналитики отклоняет недоказанное восстановление; проверка транспорта отдельно подтверждает штатную блокировку. История аналитики в хранилищах ГРАФ сохраняется до отдельного решения об удалении."
issue: "7185"
tasks: ["T116", "T117", "T118", "T119", "T098", "T109", "T111", "T115"]
compatibility: "Нужна отдельная установка согласованных helpers и операторская приёмка. Рабочие флаги расширенной аналитики и записи IP не включены. До полноценного T118 самодекларированные отчёты восстановления блокируют готовность. Нужны явный GRAF_PRODUCT_ANALYTICS_RETENTION_MODE=until_decision, удаление старой POSTHOG_EVENT_RETENTION_DAYS и операторская миграция event TTL; старые receipts не открывают готовность; проверка режима действительна менее 26 часов и не принимает будущее или неизвестное время. Окно атрибуции и сессии не продлены. Неиспользуемый TWOBRAIN_PRODUCT_ANALYTICS_RETENTION_MIN_DAYS убран из настройки API/Compose; условия для зарегистрированных пользователей обновлены до 2026-10-22.1 и until_decision. Новый выбор сохраняется после смены редакции; повторные обработчики проверяют действительную сохранённую revision и категории до включения измерения. Публичная редакция согласия 2026-10-22.1 требует нового выбора необязательных целей; старый env отключает браузерное измерение."
release_notes: "Исправлены выбранная группа чтения состояния, очистка собственных неудачных копий, имена томов проекта, локальные причины готовности аналитики и проверки резервных копий; подготовлен независимый контроль доступности. Изменения не подтверждают работающий монитор, восстановление, трафик или продажи и не включают необязательное измерение. Агрегаты используют фиксированный порог 3 до суммирования; малые исходные счётчики скрыты, сырой дубль consent_visits удалён из диагностического counts_state; числитель скрыт также при нулевом или неизвестном знаменателе после подавления малых корзин. Публичная география остаётся unknown. Ежедневная задача больше не удаляет агрегаты и атрибуцию по возрасту. Миграция снимает TTL событий без удаления строк. Отдельные сроки удаления передаются через план из реестра отзыва и не выводятся из срока хранения."
known_limitations: ["T116: подготовлен полный учёт выделенных блоков и защитное состояние до ручного восстановления. Полный свежий вход, принятый бюджет и итоговая готовность проверяются отдельно; противоречивая неготовность имеет собственную причину. Рабочие замеры, установка и доставка оповещений ещё не приняты.", "T117: локальный кандидат проверяет inventory томов, manifest и архивы, атомарно завершает набор и сохраняет последние 7 пригодных копий. Готовность требует минимум 2 полных набора моложе 26 часов. Рабочая установка и восстановление остаются открытыми; потеря узла может уничтожить историю.", "T118: самодекларированный отчёт с произвольными хешами и списком классов не открывает готовность. Полный согласованный механизм восстановления ещё не реализован и не установлен. Возраст отчёта проверяется независимо. Проверка транспорта использует только синтетические данные внутри тестового процесса и подтверждает блокировку до и после неё.", "T119: подготовлен независимый наблюдатель доступности с повтором доставки и отдельным состоянием канала. Установка на отдельный узел и получение учебного оповещения ещё не приняты.", "T115: добавлена миграция 0105 с закрытым регионом и полным ключом; схема должна обновиться до запуска новых readers. При nonunknown строках откат схемы запрещён. Длительность блокировки на рабочем объёме не принята.", "T098: убрано CLI-перекрытие доверия прокси, штатный FORWARDED_ALLOW_IPS принимает только точные IP; пустое значение, wildcard и CIDR отклоняются. Изолированная сетевая матрица 14/14 принята независимым ревью; рабочая приемка нового peer еще не выполнена.", "Рабочие настройки, политики провайдера и полное восстановление требуют отдельной приемки; расширенная аналитика и запись IP не включены.", "Новая редакция подготовлена локально; публикация, рабочие настройки и применимое основание T111 ещё не приняты. Правка кода не подтверждает юридическую или коммерческую готовность."]
