schema_version: 1
feature_id: 280
category: "Changed"
summary: "Сохранение карты описано как добровольный выбор для автопродления Подписка, хранилище и оплата собраны на одной странице"
issue: "7622"
tasks: ["T072", "T073", "T074", "T071"]
compatibility: "Оплата без автопродления остается доступной. Маршруты, цены, согласия и предвыбор не меняются; миграции не нужны. Старые адреса и формы сохранены. Цены, платежные согласия и обработка денег не меняются; миграция данных не требуется."
release_notes: "На обеих страницах без сохраненной карты пояснено, что ее можно сохранить для автопродления. Кнопка называется «Перейти к оплате» и не обещает обязательную привязку карты. Срок подписки, автопродление, использование места и последний платеж видны в одном месте. Объем можно выбрать, автопродление отключить и сохраненную карту удалить из основной страницы. Перед покупкой остается точный расчет и отдельное подтверждение. Ошибки сохраняют выбранный объем, чек проще найти, одинаковые периоды свернуты в подробности."
known_limitations: ["Изменение текста не заменяет человеческую и финансовую приемку.", "Включение автопродления требует отдельной проверки условий; замена сохраненной карты пока недоступна.", "Проверки интерфейса не заменяют пользовательскую и финансовую приемку."]
