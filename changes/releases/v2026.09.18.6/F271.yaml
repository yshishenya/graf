schema_version: 1
feature_id: 271
category: Changed
summary: "Обновление приложения готовится одной фоновой работой параллельно выпуску. Сплошной замер дал 21 минуту 14 секунд: подпись и загрузка обновления (3 минуты 54 секунды) шли после выкатки и целиком входили в критический путь. Теперь черновик выпуска создаётся сразу после подготовки, а сборка, прикладывание входных файлов и подпись идут одной фоновой работой одновременно с поездом, полной проверкой и выкаткой. Тег по-прежнему создаётся только после всех проверок: черновик тега не создаёт, поэтому неудачный выпуск не оставляет лишний тег."
issue: 7127
tasks: [T032, T033]
compatibility: "Изменений совместимости нет. Публикация остаётся последним действием, тег создаётся после всех проверок, состав проверок и ворота сохраняются."
known_limitations:
  - "Замена публичной ленты обновлений infra/runtime/public-downloads/graf-appcast.xml остаётся отдельным осознанным действием владельца."
release_notes: "Выпуск стал быстрее. Раньше подпись и загрузка обновления приложения шли после выкатки и добавляли почти четыре минуты к общему времени. Теперь черновик выпуска готовится сразу после подготовки, а сборка, прикладывание входных файлов и подпись идут одной фоновой работой одновременно с серверной проверкой и выкаткой. Выпуск по-прежнему становится публичным последним действием, а тег создаётся только после того, как все проверки прошли."
