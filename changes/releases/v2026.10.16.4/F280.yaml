schema_version: 1
feature_id: 280
category: Changed
summary: "Подписка, хранилище и оплата собраны на одной странице"
issue: 7622
tasks: [T071, T072, T073, T074]
compatibility: "Старые адреса и формы сохранены. Цены, платежные согласия и обработка денег не меняются; миграция данных не требуется."
known_limitations:
  - "Включение автопродления требует отдельной проверки условий; замена сохраненной карты пока недоступна."
  - "Проверки интерфейса не заменяют пользовательскую и финансовую приемку."
release_notes: "Срок подписки, автопродление, использование места и последний платеж видны в одном месте. Объем можно выбрать, автопродление отключить и сохраненную карту удалить из основной страницы. Перед покупкой остается точный расчет и отдельное подтверждение. Ошибки сохраняют выбранный объем, чек проще найти, одинаковые периоды свернуты в подробности. Сохранение карты описано как выбор для автопродления; оплата без него остается доступной."
