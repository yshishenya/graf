compatibility: "Права доступа, политики базы и схема данных не меняются. Существующие права, ссылки, записи и параметры доступа сохраняются; схема данных не меняется. Старые ссылки и серверные исходные права сохраняются; миграций нет."
release_notes: "Подпись разрешения скачивания приглашенным приведена к принятому написанию интерфейса. Проверка перечня миграций включает существующие служебные таблицы уведомлений и защищенной истории; прежние проверки каждой таблицы сохранены. Проверено: 88 предметных проверок написания и перечня защищенных таблиц, а также по 4 браузерных сценария в Chromium и WebKit — без отказов. Проверки правил проекта и Ruff также пройдены. Полная проверка нового кандидата и выпуск выполняются отдельно. Связанные задачи: #7918, #8016, #8019 и #8025. Приглашения и люди с доступом собраны в компактную раскрываемую строку. Общая аудитория и материалы видны до копирования ссылки даже при длинном списке приглашений. Уточнены отправка итогов, разрешение скачивания для приглашённых и оформление срока ссылки. Сохранены просмотр расшифровки, итогов и аудио. Согласованы проверки окна передачи встречи, восстановления базы и служебных уведомлений; ограничения публичных страниц и защищённой истории сохранены. В окне «Поделиться» исправлены поля, значки и размещение нижней кнопки. Права нового приглашения видны сразу: просмотр итогов, расшифровки и доступной записи. Скачивание и экспорт включаются отдельно. Встреча остаётся закрытой, пока владелец явно не выберет общий доступ. Состав общего доступа можно выбрать до публикации, включая только итоги, без промежуточного доступа к записи и расшифровке. Существующие ссылки только на итоги сохраняют прежние ограничения. Запоздавший поиск адресатов больше не раскрывает подсказки после отправки приглашения или закрытия окна. Длинные адреса, состояния приглашений и выбор прав больше не накладываются на действия в списке участников. Истёкшая ссылка возобновляется после подтверждения на выбранный срок, сохраняя адрес и прежние ограничения. Кнопка копирования остаётся видна при длинном списке приглашений. Вкладки и закрытие доступны и при прокрутке дополнительных настроек."
known_limitations: ["Выпуск и проверка установленного приложения остаются отдельными шагами.", "Проверки кода не заменяют приёмку рабочего сервера и установленного приложения.", "Для прослушивания нужна готовая запись; её отсутствие не заменяется скачиванием.", "Установленное приложение и выпуск принимаются отдельно от браузерных проверок."]
