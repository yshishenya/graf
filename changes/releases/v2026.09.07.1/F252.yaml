schema_version: 1
feature_id: 252
category: Fixed
summary: "Единые российские даты и пользовательское время в списке встреч, карточках, календаре, общем доступе и аккаунте"
issue: 6663
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009]
compatibility: "Наблюдатель cookies сохраняет изоляцию главного потока при сборке Swift 6 с SDK macOS 14. Миграция 0086 расширяет настройку часового пояса до IANA. Прежний UTC и подтверждённый выбор Москвы сохраняются; старое значение Москвы по умолчанию уступает поясу устройства. Новые аккаунты используют устройство до сохранения выбора. Сохранённые моменты, API, финансовые периоды и сроки выполнения не меняются. Downgrade блокируется при новых поясах, чтобы не потерять выбор."
known_limitations:
  - "Без доступного пояса используется явно обозначенный UTC; без сохранённого выбора при блокировке cookies сохраняется единый серверный пояс для отображения и поиска."
  - "Локальные записи без времени последнего изменения идут после записей с известной датой при соответствующей сортировке."
  - "На Mac после холодного запуска до подтверждения аккаунта используется пояс устройства; временная потеря сети сохраняет уже подтверждённый выбор в процессе."
release_notes: "Встречи сортируются по реальному началу, ручные загрузки без начала помечаются датой загрузки. Даты отображаются как ДД.ММ.ГГГГ, время — в 24-часовом формате. Нативный и веб-списки согласованы; точные сроки содержат UTC-смещение на момент события. В настройках одно поле часового пояса с русскими названиями, поиском, предварительным просмотром и сохранением для аккаунта."
