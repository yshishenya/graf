schema_version: 1
feature_id: 250
category: Added
summary: "GRAF постоянно показывает доступное обновление в главном окне и строке меню, сохраняя напоминание после откладывания и перезапуска."
issue: 6644
tasks: [T001, T002, T003, T004, T005, T006, T007]
compatibility: "Требуется новый подписанный выпуск macOS; миграция сервера не нужна. Отключенный автоматический поиск и пользовательский интервал сохраняются."
known_limitations:
  - "Проверка обычно выполняется при запуске и раз в четыре часа; сон, отсутствие сети и открытая сессия обновления могут ее отложить."
  - "До публичного выпуска нужны проверка меню при закрытом окне, VoiceOver и живой подписанный переход с защитой записи."
release_notes: "Номер новой версии и кнопка обновления остаются видимыми после «Позже», «Пропустить», сетевой ошибки и перезапуска. Установленная версия или подтвержденный отзыв убирают напоминание. Установка остается ручной, с проверкой подписи и защитой записи от преждевременного перезапуска."
