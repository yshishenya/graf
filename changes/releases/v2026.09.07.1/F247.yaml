schema_version: 1
feature_id: 247
category: Changed
summary: "Настройка звука для встречи: один понятный шаг за раз, короткие подсказки и продолжение после перезапуска."
issue: 6598
tasks: [T001, T002, T003, T004, T005, T006, T007, T008]
compatibility: "macOS 14+. Подсказка с иконкой приложения явно выполняется на главном потоке для совместимости с SDK macOS 14. Настройка открывается по действию пользователя и продолжается после перезапуска, пока не выбрано Позже/Готово; правила автозаписи сохранены. Серверные контракты не изменены."
known_limitations:
  - "Реальные выдача, отказ, отзыв и системный перезапуск проверены; VoiceOver страницы разрешений подтверждён владельцем. Только проверка MDM отложена по решению владельца из-за отсутствия управляемого тестового Mac."
release_notes: "Вместо повторного окна при активации доступна подготовка записи с подсказками и автоматическим обновлением статусов. Открытие настроек и выдача права больше не требуют безусловного перезапуска. Проверка ограничена по времени; перезапуск защищен от прерывания записи. Настройка стала немодальной страницей: внешний выход macOS не блокируется листом, после запуска можно продолжить настройку. Вместо служебной сводки показаны цель текущего шага и одно главное действие. Помощь раскрывается по необходимости; кнопка выхода всегда видна, вернуться к ожидающему запросу можно без повторного запроса."
