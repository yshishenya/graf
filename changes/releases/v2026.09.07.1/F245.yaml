release_notes: "В разделе «Настройки → Запись» доступны правила «Всегда / Спрашивать / Никогда» и применение ко всему текущему списку приложений. Изменения сохраняются локально; страница подтверждает сохранение и обновляется после выбора в предложении записи. При недоступном кабинете открываются локальные настройки. Проверено XCTest с настоящим WebKit, серверными и интеграционными тестами, а также в браузере. Связанные задачи: #6591, #6592, #6593, #6594, #6595."
