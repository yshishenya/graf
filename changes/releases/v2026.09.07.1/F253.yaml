schema_version: 1
feature_id: 253
category: Added
summary: "Название встречи редактируется прямо в заголовке: Enter или уход фокуса сохраняют, Esc отменяет ввод"
issue: 6684
tasks: [T001, T002, T003, T004, T005, T006, T007]
compatibility: "Миграция базы не нужна. Общий кабинет работает в браузере и macOS; название события внешнего календаря не меняется"
known_limitations:
  - "Переименование доступно только автору встречи; локальные записи до отправки на сервер не входят в сценарий"
  - "Без JavaScript сохранение выполняется обычной формой по Enter с перезагрузкой страницы"
release_notes: "Успешное сохранение не показывает дополнительных подписей и не останавливает плеер. При ошибке ввод сохраняется. Одновременные правки обнаруживаются; календарь и завершение обработки не возвращают старое имя. Новые выгрузки сохраняют полное пользовательское название. Проверки обновления карточки согласованы с защитой переименования; описание API дополнено версией названия."
