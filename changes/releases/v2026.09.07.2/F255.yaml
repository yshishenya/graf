compatibility: "Миграций данных нет. Прежние левая навигация и меню пользователя сохранены; экспериментальная нативная замена отменена."
known_limitations:
  - "Ручная проверка VoiceOver пропущена по решению владельца от 2026-09-08; автоматические проверки доступности сохранены."
  - "Применена матовая оболочка; Liquid Glass не внедряется. Оставшаяся нативная приёмка должна завершиться до публикации."
  - "Ручная проверка на macOS 14.5 не выполнена: у владельца нет такой системы; ограничение принято владельцем 2026-09-08. Поддержка macOS 14 сохранена."
release_notes: "Добавлена общая скруглённая рамка содержимого окна, смягчены декоративные границы списка и настроек. На экране встречи убрана тяжёлая тень над плеером, декоративные разделители приведены к общей мягкой линии. Убраны одинаковые пустые значки в настройках автозаписи, уменьшены кнопки. По отзыву владельца восстановлены прежняя левая навигация и полное меню пользователя; удалён ставший ненужным механизм нативной замены меню. Подменю профиля открываются наведением по одному, имеют непрерывную зону перехода и закрываются при уходе указателя; убраны рамки отдельных вариантов темы. Выбор темы в профиле сохраняется без ухода с текущего экрана, с возвратом выбора при ошибке. Проверка GRAF Dev больше не зависит от закрытой F229; контроль конфигурации и запрещённого содержимого отчётов сохранён и покрыт общей регрессией. Меню строки macOS закрывается при внешнем клике и использует фиолетовую кнопку GRAF. Повышен контраст выбранных кнопок автозаписи. Тема кабинета синхронизируется с нативными панелями и окнами без отдельной настройки. Исправлены передача выбранной темы и CSRF при автосохранении. Сервер учитывает округление длительности короткой записи Mac без ослабления контроля хешей и размеров. Сохранены исправление жизненного цикла WebView и адресная чистка недостижимого кода. Не включать в публичный выпуск до закрытия обязательной приёмки."
