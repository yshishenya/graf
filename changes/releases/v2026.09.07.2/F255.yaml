known_limitations:
  - "Матовая геометрия проходит отдельную приёмку; Liquid Glass и полная матрица остаются открытыми"
  - "Матрица macOS 14.5/26, доступности и совместных сценариев остаётся открытой"
release_notes: "Добавлена общая скруглённая рамка содержимого окна, смягчены декоративные границы списка и настроек. На экране встречи убрана тяжёлая тень над плеером, декоративные разделители приведены к общей мягкой линии. Убраны одинаковые пустые значки в настройках автозаписи, уменьшены кнопки. По отзыву владельца восстановлены прежняя левая навигация и полное меню пользователя; удалён ставший ненужным механизм нативной замены меню. Подменю профиля открываются наведением по одному, имеют непрерывную зону перехода и закрываются при уходе указателя; убраны рамки отдельных вариантов темы. Выбор темы в профиле сохраняется без ухода с текущего экрана, с возвратом выбора при ошибке. Проверка GRAF Dev больше не зависит от закрытой F229; контроль конфигурации и запрещённого содержимого отчётов сохранён и покрыт общей регрессией. Сохранены исправление жизненного цикла WebView и адресная чистка недостижимого кода. Не включать в публичный выпуск до закрытия обязательной приёмки."
