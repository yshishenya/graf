schema_version: 1
feature_id: 292
category: Changed
summary: Полная передача и просмотр встречи с общим проигрывателем GRAF
issue: 7899
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019, T020, T021, T022, T023, T024, T025, T026, T027, T028, T029]
compatibility: >-
  Прежние ссылки сохраняют доступ только к итогам. Полная встреча публикуется
  отдельным действием. Схемы перехода Dev и production разделены. F292 не
  добавляет миграций и не меняет редакцию согласия или настройки аналитики.
release_notes: >-
  Панель владельца объединяет приглашения, роли, список доступа, общую аудиторию
  и экспорт. Получатель видит разрешённые итоги, расшифровку и запись с дорожками
  спикеров. Вход и переход в приложение сохраняют вкладку и время. Отзыв, срок
  и версия записи повторно проверяются при выдаче аудио. Описание API согласовано
  с полными и частичными ответами. Возврат в окно сохраняет явный выбор cookies;
  изменённая запись отвергает поздний ответ, при ошибке доступен явный повтор.
known_limitations:
  - Публичная ссылка разрешает чтение и прослушивание; комментарии, редактирование, скачивание и экспорт требуют адресных прав.
  - Доступность внешних приглашений, общей ссылки и аудитории пространства зависит от настроек сервера.
  - Изменение выбора cookies не включает новые виды аналитики.
