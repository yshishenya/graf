summary: "Сохранение выбора cookies при возвращении в окно браузера Полная передача и просмотр встречи с общим проигрывателем GRAF; согласованные выпускные проверки"
issue: "7938"
tasks: ["T029"]
compatibility: "API, база данных, редакция согласия и настройки провайдеров не меняются. Действующие ограничения публичной аналитики сохраняются. Исправление выпускных проверок T028 не меняет права доступа, политики базы, миграции и поведение приложения. В четырех подписях интерфейса принято"
release_notes: "Возврат в окно браузера больше не отменяет выполняемое сохранение выбора cookies. Изменение выбора в другой вкладке, очистка или повреждение записи по-прежнему отключают необязательную аналитику и отвергают устаревший ответ. При ошибке доступен явный повтор. Обновлены каноническое описание API, точные перечни таблиц и маршрутов воспроизведения, проверки доступности"
known_limitations: ["Изменение не включает новые виды аналитики и не меняет серверные разрешения.", "Выпуск требует новых проверок точного коммита и полной проверки замороженного кандидата."]
