schema_version: 1
feature_id: 281
category: Docs
summary: "В руководствах Zoom и протокола уточнён переход к загрузке готового файла и добавлено описание страниц для поиска."
issue: 7391
tasks: [T019, T020]
compatibility: "Действия готового файла ведут на существующий /meetings со штатным входом; auth, загрузчик, аналитика, canonical и главная сохранены. JSON-LD не исполняет код; контракт обезличенного входа разрешает только эту разметку и продолжает запрещать исполняемые скрипты и cookie."
known_limitations:
  - "Разметка не гарантирует расширенный результат, индексирование, переходы или продажи."
  - "Дата и изображение статьи не заявлены без подтверждённого видимого источника."
release_notes: "Из инструкций можно перейти к готовой записи через /meetings; без сессии сохраняется штатный вход с возвратом. Article и BreadcrumbList описывают видимые заголовки, редакцию и раздел руководств без вымышленных рейтингов и отзывов."
