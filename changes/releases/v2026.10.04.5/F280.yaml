schema_version: 1
feature_id: 280
category: Changed
summary: "Платежный документ стал компактнее: сумма, купленный срок и чек видны сразу."
issue: 7518
tasks: [T052, T053, T054, T055, T056, T059, T060, T061]
compatibility: "Без миграций и изменений платежных API, согласий или денежных обработчиков. Нативные раскрытия и ссылки доступны без JavaScript; прежние проверки доступа к чеку и безопасным адресам сохраняются."
release_notes: "Платежный документ показывает сумму, результат и купленный срок в компактной карточке, согласованной со страницей подписки. Точные реквизиты и помощь доступны по раскрытию. Дата создания явно отделена от подтверждения оплаты; неизвестный срок или цикл не подменяются месяцем. Вопрос об оплате и запрос возврата открывают подготовленные письма с разными безопасными темами. Сохранена защищенная проверка задержавшегося чека без нового списания; общие проверки отличают получение чека от денежных действий. Общая помощь скрывает неправильный адрес поддержки и использует безопасные почтовые ссылки. Предвыбор автоматических списаний при новом оформлении сохранен; его можно снять и оплатить один период."
known_limitations: ["Открытие подготовленного письма не отправляет запрос и не оформляет возврат.", "Банковское зачисление, возврат, реальное автоматическое продление и человеческая приемка остаются отдельными проверками."]
