summary: "Полноценные итоги встреч: связное мемо, обсуждения по темам, решения, задачи и ссылки на таймкоды"
issue: 6503
tasks: [T071, T072, T073, T074, T075, T076, T077, T078, T079, T080]
compatibility: "Миграции 0088_meeting_protocol и 0089_merge_protocol_notify; формат выгрузок graf.transcript-export.v3, первые четыре листа XLSX сохранены, полный протокол добавлен последним; согласованная смена Langfuse-промптов на полный контракт. Старые сохранённые итоги доступны без перегенерации."
known_limitations:
  - "Качество зависит от расшифровки; проверены три реальные встречи и синтетические сценарии, не вся база."
  - "Для длинных встреч проверено ожидание GRAF 240 секунд; поставщик может завершиться ошибкой, Jailbreak сохраняется включённым."
release_notes: "Один этап LLM без модельного оценщика и смысловой правки слов GRAF. Настройки модели в Langfuse. Полный документ одинаково доступен в интерфейсе и выгрузках; просмотр не вызывает генерацию. Восстановление после сбоя сохраняет причину ошибки без нового вызова модели; метаданные учитывают название из календаря или загрузки и часовой пояс записи. Ссылки выгрузок закрепляют редакцию расшифровки и проверяют доступ."
