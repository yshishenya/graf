compatibility: "Добавочная миграция 0086 и объединение ветвей схемы 0088/0089; прежние отказы от подсказок и настройки автозаписи сохраняются. Локальная разработка использует единственный GRAF Dev; переход схемы сохраняет холодную пару PostgreSQL/MinIO, откат старых данных после новых записей запрещён"
known_limitations:
  - "Полная аппаратная приёмка второго дисплея, Focus, заполненного диска, отсутствия речи и снимка видимого системного баннера остаются обязательствами; VoiceOver исключён владельцем, вместо исследования людей выполнены пять экспертных проходов субагентами"
release_notes: "Восстановлена совместимость проверки разрешений и экрана уведомлений со Swift 6.0.3. Mac показывает запись, источники, восстановление и календарные напоминания. Веб хранит результаты и предоставленный доступ без всплывающих баннеров; точка обозначает только новое важное. Пауза явно касается микрофона, общий таймер продолжает идти. Действия автозаписи различимы для диктора. Напоминание о встрече без ссылки открывает меню GRAF; календарное предложение не отключает ручной старт в меню. Уведомления перенесены из верхней строки в меню; верхнее меню и оформление берутся из F255, доставка и история уведомлений сохраняются из F249. Убраны недостижимая очередь встроенного кабинета и отдельные команды запуска GRAF Local. Во время записи напоминания о других встречах сохраняются без звука; устаревшая или ошибочная HTML-форма объясняет конфликт и предлагает загрузить актуальные настройки."
