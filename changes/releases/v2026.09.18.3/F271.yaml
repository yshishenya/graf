schema_version: 1
feature_id: 271
category: Fixed
summary: "Обновление приложения выходит вместе с выпуском без ручных действий. Настоящий прогон вскрыл два отказа подряд на последнем шаге: выпуск не прикладывал входные файлы, которые читает подписывающая часть, а копирование этих файлов падало, потому что каталог назначения никто не создавал. Теперь выпуск сам кладёт образец приложения и заметки в черновик перед подписью."
issue: 7127
tasks: [T030]
compatibility: "Изменений совместимости нет. Состав проверок, ворота и обязательное подтверждение выкатки сохраняются."
known_limitations:
  - "Замена публичной ленты обновлений infra/runtime/public-downloads/graf-appcast.xml остаётся отдельным осознанным действием владельца."
release_notes: "Обновление приложения выходит вместе с выпуском без ручных действий. Раньше выпуск не прикладывал входные файлы, которые читает подписывающая часть, а копирование этих файлов падало из-за отсутствующего каталога — обновление приходилось прикладывать руками. Теперь выпуск сам готовит и прикладывает всё нужное до подписи, а выпуск становится публичным последним действием, когда все вложения уже на месте."
