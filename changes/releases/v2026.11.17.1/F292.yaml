schema_version: 1
feature_id: 292
category: "Fixed"
summary: "Обязательные проверки восстанавливают запуск временной БД только после подтверждённой очистки; замена записи сохраняет длительность новой версии; окно «Поделиться» доступно при увеличении интерфейса"
issue: "8131"
tasks: ["T043", "T039", "T040", "T041", "T042"]
compatibility: "Рабочие БД, приложение, API, схема, образы и правила доступа не меняются. Без миграций и изменения прав; исходные параметры встречи сохраняются. Ubuntu 24.04 закреплена только для трёх заданий с APT-помощником. Dev использует принятый образ PostgreSQL; формат БД, данные, защита совместимости, состав проверок, права и ограничения времени сохранены."
release_notes: "После первого превышения времени запуска временного PostgreSQL разрешён один повтор только после доказанного удаления своего контейнера или его отсутствия. Ошибка очистки больше не скрывается. Тело проверки, миграции и правила безопасности не повторяются и не ослабляются. Исправлены загрузка и повтор загрузки аудио другой длительности; общая страница использует длительность текущей записи. Старая версия по-прежнему требует явного обновления. В рамках #8119 устранено падение подготовки проверок после перехода ubuntu-latest на Ubuntu 26.04; добавлены контракт трёх заданий и отрицательная проверка возврата полного workflow к неподдерживаемой среде. В рамках #8121 закреплены одинаковые настройки PostgreSQL в Dev harness и Compose, чтобы обновление внешнего тега не блокировало проверку функции Поделиться. В рамках #8124 панель Поделиться временно использует высоту окна, если увеличенный проигрыватель не оставляет места для управления; при восстановлении места она возвращается над проигрывателем, сохраняя его состояние. Новых параметров и зависимостей нет."
known_limitations: ["Причина отдельных задержек Docker не установлена; при повторном отказе или неопределённой очистке проверка остаётся неуспешной", "Выпуск и полная приёмка функции проверяются отдельно", "Ранее повреждённые принятые ревизии автоматически не переписываются"]
