schema_version: 1
feature_id: 99
category: Fixed
summary: "Проверяемое скачивание сохраняет существующий файл при отказе создания"
issue: 3361
tasks: [T014]
compatibility: "API, схема данных, ключи объектов и причины ошибок сохраняются. Очистка после ошибки создания больше не удаляет прежний локальный файл или символическую ссылку."
known_limitations: ["Слияние, выпуск, развёртывание и исходная приёмка T014 проверяются отдельно", "Гонка замены пути после успешного создания и ошибки самой очистки или закрытия ресурсов этим исправлением не доказаны"]
release_notes: "Общий verified-download удаляет незавершённый файл при ошибке файловой системы только после успешного исключительного создания текущим вызовом. Постоянные регрессии проверяют обычный файл и ссылку, отказы до и после создания, ограниченное чтение, права 0600, освобождение ресурсов, асинхронный путь и потребителей нормализации и отправки на обработку. Проверки используют синтетический транспорт и настоящие временные файлы."
