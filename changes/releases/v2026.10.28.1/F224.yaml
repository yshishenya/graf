release_notes: "Архивное описание проверяется без запуска, переписывания и присвоения. Неоднозначный JSON и бесконечные числа отклоняются; исходные снимки и блокировки сохраняются. T009 и общая F224 остаются открытыми до реальной приёмки. Тесты определения фичи и версии миграции используют собственный временный машинный каталог и не читают привязку установленного стенда."
