schema_version: 1
feature_id: 273
category: "Fixed"
summary: "Подготовлены устойчивый учёт первых событий и согласованное описание API"
issue: "7698"
tasks: ["T113", "T106", "T112"]
compatibility: "Миграция 0106 добавляет таблицу, откат непустой истории запрещён. Формы тела запросов сохраняются; account-вехи требуют существующую авторизацию и серверный псевдоним. Старый клиент получает безопасный отказ аналитики. OpenAPI дополнен тремя существующими необязательными заголовками двух POST"
release_notes: "Устранено расхождение канонической схемы OpenAPI с серверной зависимостью авторизации двух путей приёма событий. Строгая проверка полного равенства схем сохранена; доступ и сбор данных не расширяются. Подготовлено хранение первого события каждого типа на аккаунт: повторные запросы и перезапуск не должны увеличивать счёт. Для двух получателей отдельно сохраняется состояние доставки; неопределённый исход не разрешает слепой повтор. Закрытие аккаунта удаляет только его историю, а откат непустой таблицы блокируется. Оба API и серверный desktop-вход используют общий авторизованный приём; обычный браузерный вход не считается подключением приложения. Прямая отправка первых событий и временный счёт в памяти убраны. До проверки полного восстановления GRAF DB запись закрыта; служебная доставка ограничена 20 строками за проход и одним запросом получателю, её неизвестный исход не пересылается автоматически. Заблокированные до отправки события перемещаются в очереди после рассмотрения и не задерживают новые события доступного получателя. Закрытие аккаунта отменяет ожидающие отправки до удаления содержимого. Подтверждение события у получателя и показ результата требуют следующей приёмки."
known_limitations: ["Включение рабочей аналитики и приёмка полной воронки остаются отдельными шагами", "Общий приём подключён к двум API и desktop-авторизации; ограниченная служебная доставка реализована; подтверждение чтением, триггеры результата и проверка восстановления GRAF DB ещё не завершены", "Рабочая аналитика, запись IP и доставка провайдерам этим изменением не включаются", "Готовность копирования, восстановления и полной воронки остаётся отдельной приёмкой"]
