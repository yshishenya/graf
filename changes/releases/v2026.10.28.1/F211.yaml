compatibility: "Меняются только тесты; код продукта, данные и рабочие настройки сохраняются. Документальная сверка; код, форматы, права и правила выпуска не меняются"
release_notes: "Зависимость от migrated_postgres_urls теперь автоматически выбирает последовательную strict_rls-фазу. Шесть сценариев Temporal используют ограниченный повтор только подготовки среды; workflow и проверки не повторяются. Прежняя коллекция сохранена. Документальная сверка #6986: 673 профильных проверки и три сценария изменения описания современного PR подтверждают сохранение source proofs, постоянных обязательных имён и исторической основы после слияния. Выпуск и развёртывание для этой сверки не выполнялись."
known_limitations: ["Подготовка Temporal повторяется только при download HTTP429: до трёх попыток с паузами 5 и 15 секунд", "Допуск выпуска требует нового успешного Full на замороженном кандидате (T104)", "Исторический PR со старым YAML не подтверждает исполнение нового workflow", "Общая F211, T077/A9 и приёмка выпуска macOS остаются открытыми"]
