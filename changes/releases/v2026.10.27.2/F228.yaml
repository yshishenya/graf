compatibility: Код продукта и действующие защиты не меняются; предметная проверка конкретных изменений сохраняется.
release_notes:
  - Для ранней стадии проекта отменены 29 незапущенных задач общей автоматизации; семь принятых результатов сохранены.
  - Исходные описания, индивидуальные причины отмены и условия возвращения к работе сохранены; отмена не объявляется реализацией.
known_limitations:
  - Общий реестр и сканер не реализованы; решение не подтверждает нулевое число старых путей или готовность всей системы.
  - Отдельные реальные дефекты и обязательные проверки данных, совместимости, macOS и выпуска остаются в своих задачах.
