release_notes: "Подготовлены конфигурация отдельного входа ГРАФ и проверочный сценарий; настройки8443 сохранены. Штатный серверный выпуск не применяет эту конфигурацию nginx. Рабочий переход выполняется отдельно согласованным набором по полному сценарию8 и выпускным проверкам; простая замена rec-конфига запрещена. T098 остаётся открытой до полной сетевой и рабочей приёмки, включая настоящий special-протокол своим клиентом. Аналитика и запись IP этим выпуском не включаются."
