known_limitations:
  - "T046/native picker снят с текущего плана как NOT_PLANNED; T047 описывает только будущую интеграцию, provider lookup и referral не включаются"
  - "Синтетические проверки не заменяют приёмку выпуска и работающего приложения"
release_notes: "Определён проект жизненного цикла referral T043/#4449: одна регистрация, ограниченный срок применения, отдельные хранение и обязательное удаление; повтор и пересылка не создают новые аккаунты или доступ. Сбор событий остаётся выключенным. Поиск получателей проверяется через действующую браузерную форму и оба серверных маршрута: без доступа к адресной книге, скрытых запросов к поставщикам контактов и неявной выдачи доступа (T048/#4454). Для будущего подключения Google/Microsoft определены права только на чтение, короткое хранение результатов, отключение и понятное согласие (T047/#4453). Системный выбор контактов T046/#4451 снят с текущего плана: раннему MVP достаточно ввода email и существующих подсказок. Новые возможности и разрешения не включаются."
