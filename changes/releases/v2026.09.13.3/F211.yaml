schema_version: 1
feature_id: 211
category: Fixed
summary: "Ускорены подготовка и выполнение CI, подготовлены отдельные проверки PR и macOS"
issue: 6982
tasks: [T048, T049, T050, T051, T053, T054, T055, T056, T057, T058, T059]
compatibility: "Полный состав тестов и защита выкатки сохранены. Обязательное включение новых PR-проверок выполняется отдельным проверенным этапом."
known_limitations:
  - "Скорость полного релиза подтверждается отдельным запуском замороженного кандидата"
  - "Foundation сохраняет прежний обязательный combined gate до включения всех новых проверок"
release_notes: "Статические ошибки обнаруживаются до серверных тестов. CI-контракты выполняются один раз. Чистые unit запускаются до PostgreSQL, браузерные проверки больше не скрываются пропусками. Подготовка двух семейств создаёт только нужную встречу. Закреплён путь импорта и исправлена загрузка модуля безопасных отчётов в параллельных процессах полного CI. Добавлены безопасные отчёты времени и отдельная проверка macOS; описание PR проверяется доверенной версией валидатора."
