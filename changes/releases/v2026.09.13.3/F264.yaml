compatibility: "Без миграций и новых зависимостей. Прежние формы сохраняют серверные маршруты; автосохранение получает явное подтверждение."
known_limitations:
  - "Основные сценарии, локальные отказы и задержанное закрытие установленного GRAF Dev проверены. Выпуск разрешён владельцем; VoiceOver он проверит отдельно после выпуска."
release_notes: "Удалены кнопки обычного сохранения и длинные повторяющиеся пояснения. Закрытие аккаунта использует компактное подтверждение с прежней семидневной отменой. Унифицированы строки, группы, ошибки и повтор сохранения. Конфликт можно разрешить загрузкой серверного значения без выхода со страницы. Количественное использование пространства показывается только плательщику, включая владельца с другим плательщиком; участникам доступны возможности тарифа, предупреждение о лимите и действия с архивом; отказ загрузки данных показан отдельно, включая неполный ответ без состояния лимита. Создание, подключение, удаление и финансовые действия остаются явными."
