compatibility: "Изменено только ожидание текста в тесте; работа приложения и API сохранена. PostgreSQL-only миграции 0102–0104; данные и права не меняются. Согласованный интерфейс и вход с подтвержденной почтой сохранены. Добавочные миграции 0102–0104. Ранее выданный доступ сохраняется; непринятые приглашения требуют самостоятельного входа с подтвержденной почтой. Автоотправка по умолчанию выключена. Выпуск сервера сохраняет установленное приложение и подписанные файлы обновления."
release_notes: "Полная проверка выпуска не обходится; после исправления создается новый кандидат. Проверены миграции, секреты служебного процесса, открытие приглашения, интерфейс итогов и сохранение прежних прав на полную встречу. Получатель читает сохраненные выбранные итоги. Аудио и расшифровка не открываются по общей ссылке. Ссылку можно обновить, заменить или отключить. Автоотправка включается явно для встречи или будущих встреч серии, с паузой и отменой."
known_limitations: ["Автоотправка остается выключенной по умолчанию и доступна для проверенных участников Google Calendar внутри пространства.", "Автоотправка доступна только для проверенного полного состава участников Google Calendar внутри пространства; остальные встречи отправляются вручную.", "Неизвестный результат доставки требует проверки и не повторяется автоматически.", "Письмо считается отправленным после принятия почтовой службой; получение во входящих проверяется отдельно."]
