release_notes: "Убраны технические названия, повторения и ссылка на отчёт, который ещё не существует до удаления. В окне остаётся предупреждение: «Встреча будет удалена из GRAF. Восстановить её не получится.» Полные сведения об удалении сохранены в отчёте. Tab и Shift-Tab переключают кнопки внутри окна, включая встроенный кабинет macOS. Исправлены блокировка отправки формы удаления приложением и передача защитного поля формы."
