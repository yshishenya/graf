release_notes: "Ввод фильтрует варианты, выбор подтверждает значение. Сохранённое название настройки выделяется перед вводом; запрос приложений сохраняется при повторном открытии, варианты и строки используют одинаковый поиск. Поддержаны клавиатура, отмена, ошибки сохранения и локальные настройки macOS. Резервное окно увеличено с учётом экрана; строки приложений стали компактнее. Раскрытые списки показывают целые строки без указателя и лишних рамок, ширина списка приложений ограничена. Dev-сборка повторно использует доступные датированные образы MinIO с сохранением проверок установки."
