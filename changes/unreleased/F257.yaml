release_notes: "Итоги и расшифровка используют общую центрированную колонку. Копирование проверяет доступность текущей вкладки и не использует устаревший ответ после замены страницы. Переход к источнику учитывает место под шапкой и над плеером, в том числе при масштабе 200%, и позволяет вернуться к прежнему месту итогов. Без JavaScript доступны разрешённые артефакты через существующие скачивания."
