schema_version: 1
feature_id: 297
category: Fixed
summary: "Публичные обещания о длительности и автопродлении приведены к фактическому поведению; referral-ссылки больше не отдают 500"
issue: 8123
tasks: [T017, T018, T020, T021]
compatibility: "Схема данных, API, bundle ID и appcast не меняются. Меняются только публичные тексты лендинга, оферты и политики конфиденциальности, а также обработка ошибок referral-страниц: безопасный default public_analytics и 503 вместо 500 при недоступной БД."
release_notes: "Лендинг и оферта больше не обещают запись без ограничения длительности: указан реальный предел 4 часа (14 400 секунд) на одну встречу. Раздел автопродления честно описывает, что оно включено по умолчанию в оформлении заказа и снимается до оплаты. Политика конфиденциальности уточняет, что ежедневная retention-проверка запускается после явного включения оператором и разрешения удаления, а операторское задание удаляет только собственные датированные резервные копии GRAF старше срока и сохраняет самую свежую копию. Referral-страницы рендерятся без обязательного контекста публичной аналитики и при недоступной БД отдают повторяемое 503 вместо 500. Новых параметров и зависимостей нет."
known_limitations:
  - "Автоматическая retention-очистка и ротация резервных копий по-прежнему выключены в production и включаются отдельным действием оператора после dry-run и проверенной резервной копии."
  - "Публичная аналитика (Метрика и Вебвизор) управляется отдельной конфигурацией и этим выпуском не включается."
  - "macOS-приложение этим выпуском не меняется."
