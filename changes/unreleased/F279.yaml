schema_version: 1
feature_id: 279
category: Fixed
summary: "Подключение к встречам из календаря открывает приложение сервиса; повторы объединены в карточку серии с датами и отдельными записями."
issue: 7357
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010]
compatibility: "Старый API отдельных событий, напоминания, ссылки на записи и сохранённые ключи календарных контекстов сохраняются. Новые серии используют ключ v2 без миграции данных."
known_limitations:
  - "История ограничена сохранёнными доступными событиями: по умолчанию последние 180 и ближайшие 30 календарных дней, включая весь последний день."
  - "Для Teams проверен переход по HTTPS при отсутствии Mac-приложения; прямой запуск установленного Teams остаётся непроверенным. Неизвестные и браузерные сервисы открываются по HTTPS."
release_notes: "Добавлены актуальная проверка ссылки и доступа при подключении, защита от повторного нажатия и смены сессии, карточка повторяющейся встречи и постраничная история дат. Отменённая дата сохраняет доступные записи. При сбое приложения доступен явный переход в браузер с повторной проверкой ссылки; ошибка подключения из напоминания сохраняет возможность повтора. Запуск встречи не включает запись автоматически."
