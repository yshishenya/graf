summary: "Серверная копия записи стала доказуемой, а локальный кэш — безопасно управляемым"
issue: 8063
tasks: ["T000", "T001", "T002", "T003", "T004", "T005", "T006", "T007", "T008", "T009", "T010", "T011", "T012", "T013", "T014", "T015", "T016", "T017", "T018", "T019", "T020", "T021", "T022", "T023", "T024", "T025", "T026", "T027", "T028", "T029", "T030"]
compatibility: "JSON-поля аддитивны, схема очереди остаётся v3, миграций нет. Старые клиенты игнорируют новые поля; новый клиент при отсутствии доказательства оставляет локальные файлы. Удаляются только WAV у подтверждённых серверных копий; review-аудио, manifest, local-only режим и F284 fallback сохраняются."
release_notes: "Приложение теперь проверяет, что серверная копия записи реально воспроизводима и относится к той же ревизии. Появился сухой отчёт, ручная очистка только локального WAV и автоматическая очистка подтверждённых WAV по политике 5 ГБ / 80% / 95% / 10 ГБ-или-10% / 7 дней. Review-аудио и описание записи остаются на Mac, серверная встреча не удаляется, локальное прослушивание работает. Любое отсутствующее, устаревшее или ошибочное доказательство оставляет файлы на месте; автоматическую очистку можно выключить."
known_limitations:
  - "Удаляется только meeting-transcription.wav; review-аудио и manifest остаются."
  - "Автоматический eviction включается после выкладки контракта и чистого production dry-run; kill switch доступен."
  - "SQLite, app-level encryption, pin/offline и произвольная формула бюджета вне PRD остаются отдельными срезами."
  - "Полный 60-минутный аппаратный performance gate и полный Dynamic Type остаются отдельными ограничениями."
