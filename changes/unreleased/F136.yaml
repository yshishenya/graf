schema_version: 1
feature_id: 136
category: Fixed
summary: "Обычное сохранение настроек сохраняет кабинет и результат формы; история очищается при смене сессии после сохранения конечной страницы."
issue: 4732
tasks: [T005, T006, T010, T017, T018]
compatibility: "Серверные маршруты, способы входа, cookies и права доступа не меняются. Устаревшие завершения навигации остаются заблокированы."
known_limitations:
  - "OAuth подключения провайдера и ручная приёмка всей F136 остаются отдельными открытыми задачами."
  - "Выпуск и проверка установленного GRAF Dev этим изменением не подтверждаются."
release_notes: "Устранены пересоздание кабинета после обычного POST, потеря результата формы, преждевременная граница при входе и отсутствие очистки при выходе. Подтверждённое перенаправление формы сохраняет идентификатор WebKit; отменённый переход больше не остаётся в состоянии загрузки. При потере сессии защищённая история и переход на главную недоступны. Одноразовые вложенные адреса входа исключены из истории и восстановления маршрута; корневые страницы входа сохраняются."
