schema_version: 1
feature_id: 211
category: Ops
summary: "Подготовка Ubuntu в CI восстанавливает безопасные права проверенного ключа и двух каталогов"
issue: 7859
tasks: [T112, T113, T114]
compatibility: "Только GitHub-hosted Ubuntu 24.04/noble amd64: доверие APT сохранено; root:root0777 ключ, /usr/share и каталог ключей исправляются только после полной проверки source, защищённых root/usr и точного официального pin ключа3607bytes"
known_limitations:
  - "Фактический ключ runner ещё должен совпасть с официальным эталоном; неизвестный writable ключ остаётся отказом, промежуточный отказ не разрешён к слиянию"
  - "Фактический прежний источник AWS остаётся неизвестным; T110 не принята, новый Full и выпуск принимаются отдельно"
release_notes: "Известный официальный ключ Ubuntu после проверки контрольной суммы атомарно заменяется копией тех же байтов с правами 0644. Каталоги /usr/share и ключей с root:root0777 исправляются через проверенные дескрипторы сверху вниз в0755, только под защищёнными root/usr; после любого ремонта ключ обязательно получает новую inode. Неизвестное содержимое, подмена и ошибки блокируют APT; полностью безопасный путь не переписывается. Числовые метаданные отказа не раскрывают содержимое"
