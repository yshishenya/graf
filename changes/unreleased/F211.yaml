schema_version: 1
feature_id: 211
category: Fixed
summary: "CI использует точную базовую ревизию PR и раньше обнаруживает ошибки сервера; описание PR получает отдельную дополнительную проверку."
issue: 6845
tasks: [T033, T034, T035, T036, T037, T038, T039, T040, T041, T042]
compatibility: "Команды и набор тестов сохранены. Локальный широкий CI остаётся диагностическим; обязательные проверки GitHub и выпуска не изменены."
known_limitations:
  - "Правки описания PR пока повторно запускают общий CI; разделение проверок требует отдельного перехода защиты ветки."
  - "Ускорение подтверждено порядком этапов и ранней остановкой, без нового измерения общей длительности или расхода токенов."
  - "Новый pr-metadata пока дополнительный и не поддерживает merge group. Его успех не заменяет проверки кода, свежесть описания перед слиянием или разрешение выпуска."
release_notes: "База сравнения совпадает с ревизией отчёта CI, недоступная база блокирует тесты. Инструкции различают целевые локальные проверки, обязательный fast в GitHub и диагностику. В A2 (#6850, T038–T042) отдельный pr-metadata проверяет актуальное описание и точную идентичность PR без продуктовых тестов; прежний обязательный CI и ограничения выпуска сохранены."
