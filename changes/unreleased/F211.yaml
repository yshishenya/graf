compatibility: "Обязательны governance-fast, macos-pr и pr-metadata на точных исходниках и базе. Состав проверок и защита выкатки сохранены."
known_limitations:
  - "Скорость полного релиза подтверждается отдельным запуском замороженного кандидата"
release_notes: "Изменение заголовка или описания PR, включая уже слитый PR, повторно использует последний действительный результат кода и macOS. Ошибки, отмену и незавершённую попытку нельзя скрыть прежним успехом. Повтор CI получает артефакт с номером попытки; исходные доказательства сохраняют срок действия. Подготовка встреч сокращена в проверенных семействах тестов без потери проверок прав доступа и альтернативных состояний. Синтетические тесты аудио и разрешений больше не зависят от порядка таймеров. Сервер собирает два образа до остановки служб и повторно использует их для того же выпуска; откат возвращает проверенные прежние образы без пересборки."
