schema_version: 1
feature_id: 211
category: Ops
summary: "Подготовка Ubuntu в CI использует официальные HTTPS источники независимо от облака"
issue: 7859
tasks: [T112]
compatibility: "Только GitHub-hosted Ubuntu 24.04/noble amd64: набор пакетов сохранён, ключи и доверие APT, три вызывающие задачи и рабочий сервер не меняются"
known_limitations:
  - "Фактический прежний источник AWS остаётся неизвестным; T110 не принята, новый Full и выпуск принимаются отдельно"
release_notes: "Общий скрипт проверяет платформу, исходный файл и штатный ключ Ubuntu, сохраняет параметры пакетов для каждой suite и атомарно заменяет URI на официальный HTTPS адрес. Исходные URI не открываются и не печатаются. Неожиданные поля, права, архитектура или ошибка записи блокируют следующие этапы"
