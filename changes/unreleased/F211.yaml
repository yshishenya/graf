schema_version: 1
feature_id: 211
category: Fixed
summary: "CI использует официальные зеркала Ubuntu и доказывает каждый перенесённый коммит перед выпуском"
issue: 7742
tasks: [T099, T100, T101, T102]
compatibility: "Приложение, сервер и API не меняются. Подготовка runner сохраняет официальные источники пакетов; проверка выпуска восстанавливает исходную базу PR по каждому промежуточному дереву. Прежние обязательные проверки и доказательства выпуска сохраняются."
known_limitations:
  - "Поддерживается только проверенный mirror-list/deb822 формат официального образа GitHub; другой формат вызывает отказ."
  - "T100 подтверждена настоящим GitHub server-change run: подготовка42s, выбранные2465+183+100 проверок PASS. Это одно наблюдение fast, не медиана и не release-full."
  - "Общая F211, её исторические задачи и F263 не закрываются этим исправлением."
  - "Squash с пересечением исходных путей и промежуточных изменений целевой ветки может блокироваться как неоднозначный; совпадение конечного дерева не заменяет доказательство истории."
  - "T102: окончательная приёмка нового выпуска требует актуального frozen candidate, release-full, dry-run и проверки production. Локальные тесты её не заменяют."
release_notes: "Три существующих шага подготовки FFmpeg и Playwright удаляют только известную строку Azure из списка зеркал GitHub runner (#7738). Официальные HTTPS archive/security, источники пакетов и проверка подписей сохраняются. Общий проверяющий исторического слияния доказывает каждое дерево переноса на обновлённую цель и сохраняет исходную базу PR (#7742). Независимый squash проверяется по всем промежуточным путям, включая отменённые изменения, переименования и отношение файл/каталог. Squash после синхронизации с основной веткой сохраняет отдельное доказательство также при последующих обычных коммитах; тип истории определяется по всему исходному диапазону. Ошибки Git, конфликты и подмены блокируют проверку; состав тестов, лимиты и точная привязка результатов CI сохраняются."
