schema_version: 1
feature_id: 211
category: Ops
summary: "Подготовка Ubuntu в CI восстанавливает безопасные права только проверенного официального ключа"
issue: 7859
tasks: [T112, T113, T114]
compatibility: "Только GitHub-hosted Ubuntu 24.04/noble amd64: содержимое ключей и доверие APT сохранены; исключение только для root:root0777/3607 с точной официальной контрольной суммой, после полной проверки source"
known_limitations:
  - "Фактический ключ runner ещё должен совпасть с официальным эталоном; неизвестный writable ключ остаётся отказом, промежуточный отказ не разрешён к слиянию"
  - "Фактический прежний источник AWS остаётся неизвестным; T110 не принята, новый Full и выпуск принимаются отдельно"
release_notes: "Известный официальный ключ Ubuntu с небезопасными правами 0777 после проверки контрольной суммы атомарно заменяется копией тех же байтов с правами 0644. Неизвестное содержимое, подмена, ошибка записи или readback блокируют APT; уже безопасный ключ не переписывается. Собственный скрипт выбирает прежнюю подготовку CI, числовые метаданные отказа не раскрывают содержимое"
