compatibility: "Состав обязательных проверок и защита выпуска сохранены. Для выбранных медиатестов нужны ffmpeg и ffprobe. Публичное приложение по-прежнему требует Developer ID, проверки Apple и подписи Sparkle."
known_limitations:
  - "Локальные замеры отдельных групп не являются гарантией длительности полного выпуска; время следующих настоящих выпусков учитывается отдельно"
release_notes: "Изменение заголовка или описания PR использует действительные результаты кода без повторного запуска тестов. Неуспешную или отменённую попытку нельзя скрыть прежним успехом. Подготовка встреч сокращена в проверенных семействах; выбранные серверные проверки выполняются параллельно, а последовательные проверки прав и производительности остаются отдельно. Полный CI сначала выполняет короткие критические проверки. Удалены пять точных дублей; проверка CSRF выполняет настоящий JavaScript, обязательные проверки PostgreSQL и медиа больше не скрываются пропусками. Синхронизация задач сохраняет проектный шаблон PR. Сервер повторно использует проверенные образы для выкатки и отката. Сборка macOS сохраняет совместимый кэш; упаковка, запросы Apple и загрузка файлов продолжаются с сохранённого этапа с проверкой исходников, подписей и целостности файлов."
