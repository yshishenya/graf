schema_version: 1
feature_id: 211
category: Ops
summary: "Подготовка Ubuntu в CI проверяет собственный скрипт и безопасно сообщает метаданные отказа"
issue: 7859
tasks: [T112, T113]
compatibility: "Только GitHub-hosted Ubuntu 24.04/noble amd64: набор пакетов сохранён, ключи и доверие APT, три вызывающие задачи и рабочий сервер не меняются"
known_limitations:
  - "Функциональная причина фактического отказа метаданных пока неизвестна; диагностический промежуточный отказ не разрешён к слиянию"
  - "Фактический прежний источник AWS остаётся неизвестным; T110 не принята, новый Full и выпуск принимаются отдельно"
release_notes: "При прежнем отказе метаданных общий скрипт сообщает только фиксированную категорию файла и числовые тип, владельца, группу, права и размер. Проверки безопасности сохранены; существующая подготовка браузера выбирается также при изменении самого скрипта. Содержимое файлов, URI и окружение в сообщение не включаются"
