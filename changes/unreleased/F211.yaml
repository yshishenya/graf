summary: "Ошибка отката базы данных больше не теряется после успешной команды"
issue: 6989
tasks: [T116]
compatibility: "Без миграций и изменений данных; прежние ветви и образы отката сохранены"
release_notes: "При отказе миграции, проверки роли или удаления роли сценарий немедленно возвращает ошибку. Последующие операции не маскируют отказ; старое окружение и откат хранилища не запускаются по ложному успеху. Сохранённые решения об аналитике не удаляются ради отката."
known_limitations: ["Настоящий полный прогон и рабочая выкладка принимаются отдельно", "Общая F211, рабочее измерение и T0 не закрываются"]
