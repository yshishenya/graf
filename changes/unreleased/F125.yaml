schema_version: 1
feature_id: 125
category: Security
summary: "Добавлены исполняемые проверки запрета скрытого импорта контактов при поиске получателей"
issue: 4454
tasks: [T048]
compatibility: "Код продукта, API, данные, зависимости и настройки доставки не меняются"
known_limitations:
  - "Проверяется только поиск и локальный выбор получателей; native Contacts, provider lookup и referral остаются отдельными задачами"
  - "Синтетические проверки не заменяют приёмку выпуска и работающего приложения"
release_notes: "Поиск получателей проверяется через действующую браузерную форму и оба серверных маршрута: без доступа к адресной книге, скрытых запросов к поставщикам контактов и неявной выдачи доступа. Новые возможности и разрешения не включаются."
