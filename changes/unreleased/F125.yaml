release_notes: "Поиск получателей проверяется через действующую браузерную форму и оба серверных маршрута: без доступа к адресной книге, скрытых запросов к поставщикам контактов и неявной выдачи доступа (T048/#4454). Для будущего подключения Google/Microsoft определены права только на чтение, короткое хранение результатов, отключение и понятное согласие (T047/#4453). Новые возможности и разрешения не включаются."
