schema_version: 1
feature_id: 292
category: Changed
summary: Компактная панель передачи доступа к встрече
issue: 7899
tasks: [T030, T031, T032]
compatibility: >-
  Действующие права, ссылки, сроки и способы экспорта сохранены.
  Миграций базы данных и изменений приложения macOS нет.
release_notes: >-
  Приглашение, список людей, общая аудитория и копирование ссылки помещаются
  на первом экране. Роли, состав материалов, срок и отправка итогов доступны в настройках.
  Общая встреча без времени начала открывается через API, а данные возврата после
  входа передаются в защищённом cookie даже за прокси.
known_limitations:
  - Аудитории и приглашения по-прежнему зависят от включённых серверных возможностей.
