schema_version: 1
feature_id: 292
category: Fixed
summary: Доступные цели в просмотре встречи и сохранение адресного доступа
issue: 7906
tasks: [T006, T007]
compatibility: Права, действующие ссылки и форматы выдачи сохранены. Миграций и изменений приложения macOS нет.
release_notes: >-
  Проверка в фоне учитывает приглашение и исходное пространство встречи.
  Получатель может продолжать просмотр и прослушивание без файловых прав.
  После отзыва прежняя запись и проигрыватель скрываются.
  На странице получателя увеличены области нажатия для входа, вкладок и таймкодов.
  В общем проигрывателе короткие интервалы можно точно выбрать из списка (#7905).
known_limitations:
  - Права определяются действующим приглашением и политикой пространства.
