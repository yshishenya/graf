schema_version: 1
feature_id: 292
category: Fixed
summary: Сохранение выбора cookies при возвращении в окно браузера
issue: 7938
tasks: [T029]
compatibility: API, база данных, редакция согласия и настройки провайдеров не меняются. Действующие ограничения публичной аналитики сохраняются.
release_notes: Возврат в окно браузера больше не отменяет выполняемое сохранение выбора cookies. Изменение выбора в другой вкладке, очистка или повреждение записи по-прежнему отключают необязательную аналитику и отвергают устаревший ответ. При ошибке доступен явный повтор.
known_limitations:
  - Изменение не включает новые виды аналитики и не меняет серверные разрешения.
  - Выпуск требует новых проверок точного коммита и полной проверки замороженного кандидата.
