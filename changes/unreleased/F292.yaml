  уведомлений и защищенной истории; прежние проверки каждой таблицы сохранены.
  Проверено: 88 предметных проверок написания и перечня защищенных таблиц,
  а также по 4 браузерных сценария в Chromium и WebKit — без отказов.
  Проверки правил проекта и Ruff также пройдены. Полная проверка нового
  кандидата и выпуск выполняются отдельно.
