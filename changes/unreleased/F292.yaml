schema_version: 1
feature_id: 292
category: Fixed
summary: Понятные права и материалы в окне передачи встречи
issue: 8016
tasks: [T033, T034]
compatibility: Старые ссылки и серверные исходные права сохраняются; миграций нет.
known_limitations:
  - Для прослушивания нужна готовая запись; её отсутствие не заменяется скачиванием.
  - Установленное приложение и выпуск принимаются отдельно от браузерных проверок.
release_notes: >-
  В окне «Поделиться» исправлены поля, значки и размещение нижней кнопки.
  Права нового приглашения видны сразу: просмотр итогов, расшифровки и
  доступной записи. Скачивание и экспорт включаются отдельно.
  Встреча остаётся закрытой, пока владелец явно не выберет общий доступ.
  Состав общего доступа можно выбрать до публикации, включая только итоги,
  без промежуточного доступа к записи и расшифровке.
  Существующие ссылки только на итоги сохраняют прежние ограничения.
  Запоздавший поиск адресатов больше не раскрывает подсказки после
  отправки приглашения или закрытия окна.
  Длинные адреса, состояния приглашений и выбор прав больше не накладываются
  на действия в списке участников. Истёкшая ссылка возобновляется после
  подтверждения на выбранный срок, сохраняя адрес и прежние ограничения.
  Кнопка копирования остаётся видна при длинном списке приглашений.
  Вкладки и закрытие доступны и при прокрутке дополнительных настроек.
