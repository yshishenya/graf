schema_version: 1
feature_id: 292
category: Fixed
summary: Упрощено окно передачи встречи и согласованы выпускные проверки
issue: 8025
tasks: [T017, T035]
compatibility: Существующие права, ссылки, записи и параметры доступа сохраняются; схема данных не меняется.
known_limitations:
  - Проверки кода не заменяют приёмку рабочего сервера и установленного приложения.
release_notes: >-
  Приглашения и люди с доступом собраны в компактную раскрываемую строку.
  Общая аудитория и материалы видны до копирования ссылки даже при длинном списке
  приглашений. Уточнены отправка итогов, разрешение скачивания для приглашённых
  и оформление срока ссылки. Сохранены просмотр расшифровки, итогов и аудио.
  Согласованы проверки окна передачи встречи, восстановления базы и служебных
  уведомлений; ограничения публичных страниц и защищённой истории сохранены.
