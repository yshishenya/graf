schema_version: 1
feature_id: 292
category: Fixed
summary: "Общая запись открывается без ожидающей позиции; замена сохраняет длительность новой версии, проверки и сборка Dev воспроизводимы"
issue: 8117
tasks: [T006, T007, T039, T040, T041]
compatibility: "Без миграций и изменения прав; исходные параметры встречи сохраняются. Ubuntu 24.04 закреплена только для трёх заданий с APT-помощником. Dev использует принятый образ PostgreSQL; формат БД, данные, защита совместимости, состав проверок, права и ограничения времени сохранены."
known_limitations: ["Ранее повреждённые принятые ревизии автоматически не переписываются", "Полный прогон выпуска и штатную живую приёмку интегрированного SHA выполняет основной оператор."]
release_notes: "Исправление #7906 сохраняет запуск общей записи без ожидающей позиции; сохранены проверки входа, адреса, версии, поздних ответов и позиции проигрывателя. Исправлены загрузка и повтор загрузки аудио другой длительности; общая страница использует длительность текущей записи. Старая версия по-прежнему требует явного обновления. В рамках #8119 устранено падение подготовки проверок после перехода ubuntu-latest на Ubuntu 26.04; добавлены контракт трёх заданий и отрицательная проверка возврата полного workflow к неподдерживаемой среде. В рамках #8121 закреплены одинаковые настройки PostgreSQL в Dev harness и Compose, чтобы обновление внешнего тега не блокировало проверку функции Поделиться. Новых параметров и зависимостей нет."
