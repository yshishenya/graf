schema_version: 1
feature_id: 292
category: Fixed
summary: "Общий кабинет корректно запускается без ожидающей позиции общей записи"
issue: 7906
tasks: [T006, T007]
compatibility: "Форматы, права доступа и обработка ссылок не меняются. Сохранены проверки адреса и версии записи, отмена устаревшей позиции и отсутствие автоматического воспроизведения."
known_limitations:
  - "Исправление проверено локально в Node, Chromium и WebKit; приёмка установленного Windows-приложения и проверка точного коммита в GitHub остаются отдельными этапами."
release_notes: >-
  Обработчик общей записи явно проверяет наличие ожидающей позиции перед
  чтением её полей. Это устраняет отказ запуска минимального тестового
  окружения с неполным адресом страницы. Сохранены прежние проверки входа,
  защиты форм, поздних ответов и позиции проигрывателя. Пройден полный модуль
  из 80 проверок и по 10 сценариев отложенной загрузки аудио в Chromium и WebKit.
