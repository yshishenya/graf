schema_version: 1
feature_id: 292
category: Fixed
summary: "Обязательные проверки восстанавливают запуск временной БД только после подтверждённой очистки"
issue: 8131
tasks: [T043]
compatibility: "Рабочие БД, приложение, API, схема, образы и правила доступа не меняются."
known_limitations: ["Причина отдельных задержек Docker не установлена; при повторном отказе или неопределённой очистке проверка остаётся неуспешной", "Выпуск и полная приёмка функции проверяются отдельно"]
release_notes: "После первого превышения времени запуска временного PostgreSQL разрешён один повтор только после доказанного удаления своего контейнера или его отсутствия. Ошибка очистки больше не скрывается. Тело проверки, миграции и правила безопасности не повторяются и не ослабляются."
