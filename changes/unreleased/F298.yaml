schema_version: 1
feature_id: 298
category: Ops
summary: "Релизный конвейер ускорен без ослабления проверок: самодостаточные строгие тесты PostgreSQL выполняются параллельно, готовность изолированного кластера ограничена общим бюджетом, дешёвые контрактные проверки OpenAPI, текста «ё» и маршрутов писем запускаются на PR, а релизные job не загружают полную историю и параллелят governance и контракты раннера."
issue: 8161
tasks: [T001, T002, T003, T004, T005, T006, T007, T008]
compatibility: >-
  Продуктовое поведение, формат данных, API и миграции не меняются. Меняется
  только исполнение проверок: набор тестов и точный SHA остаются прежними,
  доказательство полноты шардов сохраняется. Локальный запуск governance без
  xdist выполняется последовательно и сообщает причину. Для локального full-режима
  строгие тесты по-прежнему идут последовательно.
release_notes: >-
  Выпуск стал готовиться быстрее: тяжёлые проверки PostgreSQL, которые поднимают
  собственный временный кластер, больше не ждут друг друга и выполняются
  параллельно, а общие проверки и проверки с измерением времени по-прежнему идут
  по одной. Ошибки в описании API, в пользовательских текстах и в письмах теперь
  видны сразу на проверке pull request, а не в конце полного прогона. Сам набор
  проверок не сокращён.
known_limitations:
  - "Ускорение подтверждено локальными проверками; время полного прогона на Linux и фактическое сокращение критического пути будут измерены на следующем замороженном кандидате."
  - "Балансировка шардов по историческим длительностям отложена до данных нового релизного прогона."
  - "Частичный повтор только упавших job не реализован: он требует отдельного дизайна доказательств по слотам."
  - "Браузерные проверки локально не запускались без подготовленных Playwright-ресурсов; в CI они выполняются как прежде."
