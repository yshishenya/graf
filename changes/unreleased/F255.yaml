summary: "Единая боковая панель GRAF: системное оформление macOS, матовый веб и рабочее меню профиля"
issue: 6752
tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010, T011]
compatibility: "Нативное меню требует совместимых клиента и сервера; старые сочетания сохраняют HTML. Миграций данных нет. Liquid Glass доступен на macOS 26, прежние системы используют матовое оформление."
known_limitations:
  - "Фича в реализации: обязательная приёмка GRAF Dev, macOS 14.5/26 и доступности ещё открыта"
  - "Совместная проверка F245–F253 выполняется на согласованных объединённых ревизиях"
release_notes: "Основные разделы доступны также из настроек. Удалены десять постоянных заглушек и два пустых подменю. Тема сохраняется без ухода с текущей страницы, ошибки сохранения видны. Рабочая страница и управление записью сохраняют своих владельцев; новой настройки материала нет. Не включать в публичный выпуск до закрытия приёмки."
