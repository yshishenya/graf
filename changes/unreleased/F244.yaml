schema_version: 1
feature_id: 244
category: Fixed
summary: "Окно загрузки прокручивается на коротком экране и сохраняет видимый клавиатурный фокус; узкая панель не закрывает сфокусированное содержимое"
issue: 6568
tasks: [T004, T005, T006, T007]
compatibility: "Серверные API, загрузка, auth, хранение и формат sessionStorage не меняются; новых зависимостей нет. Мобильная навигация обычного браузера F240 сохраняется."
known_limitations:
  - "Общая приёмка тем F240 и взаимодействия F243 оформляется на совместном SHA отдельно; локальный HTML не является проверкой установленного WKWebView или production."
release_notes: "Окно загрузки получило доступное имя по видимому заголовку и прокрутку при малой высоте. Переходы Tab и Shift+Tab, включая переход по кругу и повторное открытие, показывают активный контрол. Во встроенном кабинете раскрытая панель оставляет основному содержимому ширину за узкой панелью; фокус в содержимом временно скрывает её без потери предпочтения."
