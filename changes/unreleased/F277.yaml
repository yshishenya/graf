schema_version: 1
feature_id: 277
category: Changed
summary: Единые компактные уведомления GRAF без дублирующего системного канала
issue: 7276
tasks: T001-T026
compatibility: >-
  macOS 14 и новее. Полезные локальные настройки сохраняются; тихий режим по
  умолчанию выключен. Старые системные уведомления приложения очищаются при
  запуске. Встроенная страница настроек использует единственный контракт версии 2;
  ранее открытая страница требует обновления. Старый отдельный маршрут настроек
  уведомлений не поддерживается.
  Новые записи по обнаруженной встрече сохраняют признак подтверждения запуска;
  исторические пакеты без него проходят прежние проверки допуска.
release_notes:
  - Общая карточка для встречи, вопроса о записи, проблемы, короткой записи и проверки; высота зависит от содержания, крестик слева сверху не занимает колонку.
  - Отсчёт и флажок обновляются без замены окна; закрытие не сохраняет правило записи, просроченные действия отклоняются.
  - Напоминания учитывают выбранные 0, 1 или 5 минут; тихий режим не скрывает вопрос записи, индикатор и остановку.
  - Существенные результаты доступны в краткой нейтральной истории текущего сеанса; к карточке можно перейти командой меню.
  - Удалены прежний системный планировщик, обработчики, разрешения уведомлений, отдельная обёртка короткой записи и их устаревшие потребители.
  - Отменённый запуск записи остаётся запрещённым для отправки после ошибки сохранения, восстановления и повторной попытки; обычная отправка и чтение состояния уже загруженных встреч сохраняются.
known_limitations:
  - Собственные карточки требуют запущенного GRAF и не следуют режимам фокусирования macOS автоматически; скрытие при чужой демонстрации экрана не гарантируется.
  - История ограничена 50 нейтральными событиями в памяти текущего запуска и контекста, без повторного выполнения действий.
  - Восьмисекундное поведение автозаписи сохранено; изменение этой политики не входит в оформление уведомлений.
  - Проверки и незавершённые пункты приёмки отражены в specs/277-compact-notifications/validation.md; этот фрагмент не подтверждает выпуск или развёртывание.
