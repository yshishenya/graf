release_notes: "Объединены исправления F249/F255 после релиза и полезный объём F258. Календарное уведомление показывает время и отдельные действия подключения и настройки. Локальная ошибка открывает нужную запись; кнопка обновления встроенного кабинета больше не отменяет собственный запрос. Частичные итоги явно показывают ограничения. Готовый звук доступен до итогов; результаты выбранного формата появляются автоматически без потери проигрывания и введённого названия."
