schema_version: 1
feature_id: 272
category: Fixed
summary: "Устранены оставшиеся блокировки оплаты: истёкшее ожидание платежа не мешает новому оформлению и сохраняет позднюю сверку; неопределённое продление не запускает второе автоматическое списание. Лэндинг и кабинет проверяют один одобренный каталог, а встроенная оплата macOS ограничивает переходы и очищает завершённую платёжную цепочку."
issue: 7165
tasks: [T003, T013, T015, T016, T018, T019, T020, T031, T044, T045, T048, T049]
compatibility: "Новых миграций нет. Истёкшее ожидание известного платежа получает локальное состояние observation_expired без отмены платежа у провайдера. Цены, редакция оферты и оплаченный срок сохраняются. Первый внешний переход macOS допускается только на точные домены ЮKassa; банковское продолжение ограничено живой 15-минутной цепочкой HTTPS."
known_limitations:
  - "Локальные проверки не заменяют ревью, обязательные GitHub-проверки точного SHA и release-full замороженного кандидата."
  - "Развёртывание, согласование фактических настроек наблюдения, установка и регистрация вебхука, подписи запуска и живая оплата остаются незакрытыми условиями; эти изменения не включают оплату в production."
release_notes: "Исправлено восстановление оплаты и безопасное продолжение через банк в macOS. Кабинет больше не принимает каталог, который лэндинг считает неподходящим. Документы запуска разделяют отключение автопродления и конец оплаченного доступа, требуют точного ответа проверки секрета и проверки настроек работающих служб. Добавлен открытый чек-лист качества требований для ревью перед выпуском."
