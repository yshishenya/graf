schema_version: 1
feature_id: 272
category: Fixed
summary: "Платные сервисы GRAF переведены в боевой режим: первый вход по коду из письма или через провайдера создаёт аккаунт, каталог цен создаётся миграцией базы вместо ручной настройки, а платёж, ответ провайдера по которому был потерян, автоматически связывается с операцией, поэтому деньги и доступ больше не расходятся. Продление делает три попытки списания заранее и предупреждает письмом, оплатить можно досрочно и перейти на год с сохранением остатка периода, а зависшая операция больше не блокирует новую оплату. Аварийная остановка биллинга удалена полностью."
issue: 7165
tasks: [T001, T002, T004, T005, T006, T007, T008, T009, T011, T012, T013, T014, T015, T016, T017, T018, T019, T020, T021, T022, T023, T024, T026, T027, T028, T029, T030, T031, T033, T034, T035, T044, T045]
compatibility: "Отдельная страница регистрации сохранена и продолжает работать: на неё ведут реферальные ссылки. Обычный вход теперь создаёт аккаунт, поэтому текст на странице входа изменён. Аварийная остановка биллинга удалена: вместо неё остаётся штатный выключатель оплаты TWOBRAIN_BILLING_CHECKOUT_ENABLED. Каталог цен создаётся миграцией 0093 и не перезаписывает уже настроенные значения."
known_limitations:
  - "Живая оплата в боевом магазине проверяется владельцем продукта вручную: агент не может ввести данные карты"
  - "Путь оплаты внутри приложения macOS проверяется вручную владельцем продукта"
release_notes: "GRAF переходит на реальную оплату. Зарегистрироваться теперь можно просто войдя в кабинет: первый код из письма или вход через Яндекс либо VK создаёт аккаунт, отдельная страница регистрации больше не обязательна. Цены настроены в самой базе и воспроизводятся при развёртывании. Если ответ платёжного сервиса потерялся, система сама находит созданный платёж и выдаёт доступ, а незавершённая операция больше не блокирует новую оплату. Продление подписки пытается списать оплату заранее и предупреждает письмом, если карта не прошла. Заплатить можно и раньше срока, а переход с месяца на год сохраняет уже оплаченные дни. Аварийная остановка биллинга удалена за ненадобностью: штатного выключателя оплаты достаточно."
