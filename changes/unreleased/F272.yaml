schema_version: 1
feature_id: 272
category: Fixed
summary: "Исправлены восстановление оплаты и три попытки продления: подтверждённый отказ обрабатывается одинаково через ответ провайдера, опрос и вебхук, письмо не дублируется, оплаченный срок сохраняется. Старая оферта не создаёт платёж, а повторный просмотр сохраняет период и промокод."
issue: 7165
tasks: [T003, T013, T015, T016, T018, T019, T020, T031, T044, T045, T048, T049, T050, T051, T052, T053, T054]
compatibility: "Новых миграций нет. Старые открытые формы без актуальной версии оферты получают 409: новый платёж не создаётся, требуется повторный просмотр и два согласия. Восстановление уже созданного платежа по прежнему ключу сохраняется. Цены и оплаченный срок не меняются; HTTP 429 повторяет ту же попытку с исходным ключом до его прежнего срока."
known_limitations:
  - "Локальные проверки не заменяют ревью, обязательные GitHub-проверки точного SHA и release-full замороженного кандидата."
  - "Развёртывание, согласование фактических настроек наблюдения, установка и регистрация вебхука, подписи запуска и живая оплата остаются незакрытыми условиями; эти изменения не включают оплату в production."
  - "T054 остаётся открытой: автоматические проверки Chromium и WKWebView пройдены, кандидат cad0f8b31c73 установлен штатным dev-harness, первый Tab на /billing достигает ссылки «Промокоды и скидки». Shift+Tab, видимое кольцо фокуса, VoiceOver, темы, масштаб 200 % и полный путь оплаты ещё не приняты."
release_notes: "Сохранены восстановление истёкшего ожидания платежа, единый одобренный каталог лэндинга и кабинета и ограниченная платёжная цепочка macOS. После подтверждённой отмены с ID провайдера следующая попытка разрешена, неопределённый исход по-прежнему блокирует её. Устранены взаимные блокировки опроса и вебхука, проверены повторная доставка, поздний отказ, RLS, CSRF и согласия. Исправлены начальный фокус и фокус ошибки; на странице статуса оставлена одна область объявления результата. Встроенный кабинет macOS включает переход Tab по ссылкам через штатную настройку WebKit. Независимый чек-лист требований прошёл 18 из 18 пунктов, но это не разрешение на выпуск."
