schema_version: 1
feature_id: 254
category: Security
summary: "Основа системной консоли: отдельные учётные записи, права на конкретные объекты и обязательный журнал доступа"
issue: 6708
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019, T020, T021, T022, T023, T024, T025, T026, T027, T028, T029, T030, T031, T032, T033, T034, T035]
compatibility: "Добавочные миграции 0086–0105 (0100 объединяет историю с миграциями календаря и часового пояса); после миграции нужно повторить настройку runtime ролей для ограниченной проверки адресата и блокировки пространства рабочими процессами; системная роль создаётся без входа. Системные права не выдаются обычным пользователям; обработчик аудио получает ограниченное чтение каталога и назначений в своём контексте. Проекции биллинга и эксплуатации доступны только изолированной системной роли и проверяют разрешение на каждый запрос. После создания системных личностей разрушительный откат этой миграции запрещён."
known_limitations:
  - "Изменения не развёрнуты; автоматического создания суперадминистратора нет"
  - "Полный браузерный/e2e проход, нагрузка 10k пользователей/100k встреч/1M событий, 60-минутный отказ telemetry и миграционный rehearsal на production-подобной восстановленной базе остаются отдельными release gates"
  - "Сохранены legacy writers и совместимость до миграционного барьера; их retirement выполняется отдельной задачей после двух релизов с подтверждённой telemetry"
release_notes: "Создание новых итогов учитывает назначенные права, сохраняет принятые задания и показывает понятный отказ без закрытия встречи. Исправлены поиск и создание внутренних приглашений под рабочими правами БД. Сохранение аудио проверяет тариф при приёме записи, без изменения ранее принятого выбора; отказ объясняется в веб-форме и корректно классифицируется в macOS. Назначенный запрет обмена блокирует новые приглашения и ссылки, сохраняя возможность явно отозвать прежний доступ. Скачивания и экспорт учитывают назначенные ограничения и точные форматы; отзыв во время подготовки повторно проверяется перед выдачей. Страница хранилища учитывает назначения; публичная витрина не возвращается к старой цене после закрытия управляемого тарифа. Покупка сохраняет выбранный тариф, точную цену и скидку; закрытие продаж не изменяет уже созданные счета, изменённый повтор формы отклоняется. Возобновление автопродления проверяет показанные цену и расписание; старые открытые формы требуют обновления. Системная область PostgreSQL отделена от пользовательских данных. Проверка текущей сессии и роли обязательна поверх старых политик доступа. Подмена пользовательского контекста, отзыв роли и возврат соединений в пул проверяются на отдельной тестовой БД. Повторная настройка ролей не расширяет системный доступ. Консоль получила таблицы подписок, счетов, тарифов и акций с версиями условий, индивидуальными назначениями, неизменяемым аудитом и одноразовой выдачей кодов. Добавлены безопасные эксплуатационные проекции очереди, обращений, устройств, интеграций, зависимостей, хранилища, оповещений, статистики и каталога настроек."
