schema_version: 1
feature_id: 254
category: Security
summary: "Основа системной консоли: отдельные учётные записи, права на конкретные объекты и обязательный журнал доступа"
issue: 6708
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T010, T011, T012, T013, T014, T015]
compatibility: "Добавочные миграции 0086–0095; системная роль создаётся без входа. Существующие роли приложения не повышаются. После создания системных личностей разрушительный откат этой миграции запрещён."
known_limitations:
  - "Основание T002 готово; доступны метаданные встреч и ограниченная пользовательская/финансовая проекция. Постраничная расшифровка и поиск требуют сохранённого аудита; каноническое аудио выдаётся через проверяемый серверный поток; экспорт и сохранённая диагностика ещё не подключены"
  - "Рабочий промежуточный участок: добавлены хранение команд, вход с MFA и первые страницы; повтор обработки и удаление встречи подключены; полный каталог/биллинг/акции, диагностика и приёмка ещё не завершены"
  - "Изменения не развёрнуты; автоматического создания суперадминистратора нет"
release_notes: "Системная область PostgreSQL отделена от пользовательских данных. Проверка текущей сессии и роли обязательна поверх старых политик доступа. Подмена пользовательского контекста, отзыв роли и возврат соединений в пул проверяются на отдельной тестовой БД. Повторная настройка ролей не расширяет системный доступ."
