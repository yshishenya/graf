schema_version: 1
feature_id: 254
category: Security
summary: "Основа системной консоли: отдельные учётные записи, права на конкретные объекты и обязательный журнал доступа"
issue: 6708
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T010, T011, T012, T013, T014, T015, T016, T017, T018]
compatibility: "Добавочные миграции 0086–0099; системная роль создаётся без входа. Системные права не выдаются обычным пользователям; обработчик аудио получает ограниченное чтение каталога и назначений в своём контексте. После создания системных личностей разрушительный откат этой миграции запрещён."
known_limitations:
  - "Основание T002 готово; доступны метаданные встреч и ограниченная пользовательская/финансовая проекция. Постраничная расшифровка и поиск требуют сохранённого аудита; каноническое аудио выдаётся через проверяемый серверный поток; экспорт и сохранённая диагностика ещё не подключены"
  - "Рабочий промежуточный участок: добавлены хранение команд, вход с MFA и первые страницы; повтор обработки и удаление встречи подключены; полный каталог/биллинг/акции, диагностика и приёмка ещё не завершены"
  - "Профиль API, сводка тарифа, использование и управление подпиской учитывают назначенные права; выбор и покупка публичных управляемых тарифов подключены; остальные потребители ещё требуют перевода"
  - "Изменения не развёрнуты; автоматического создания суперадминистратора нет"
  - "Подтверждение оплаты и продления сохраняет точные возможности нового тарифа; новые покупательские формы требуют повторного подтверждения после смены условий; миграционный барьер и остальные потребители ещё не завершены"
release_notes: "Страница хранилища учитывает назначения; публичная витрина не возвращается к старой цене после закрытия управляемого тарифа. Покупка сохраняет выбранный тариф, точную цену и скидку; закрытие продаж не изменяет уже созданные счета, изменённый повтор формы отклоняется. Возобновление автопродления проверяет показанные цену и расписание; старые открытые формы требуют обновления. Системная область PostgreSQL отделена от пользовательских данных. Проверка текущей сессии и роли обязательна поверх старых политик доступа. Подмена пользовательского контекста, отзыв роли и возврат соединений в пул проверяются на отдельной тестовой БД. Повторная настройка ролей не расширяет системный доступ."
