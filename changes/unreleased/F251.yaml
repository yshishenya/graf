schema_version: 1
feature_id: 251
category: Fixed
summary: "Полные сведения встреч Google и Яндекса, автоматическое обновление календаря и восстановление после сбоев"
issue: 6654
tasks: [T002, T003, T004, T005, T006, T007, T008]
compatibility: "Миграция 0086 расширяет текстовые поля. После обновления выполняется полный импорт Google для восстановления ранее отброшенных сведений; разрешения провайдеров прежние. Откат сохраняет расширенные поля без усечения."
known_limitations:
  - "Провайдер должен предоставить сведения: из режима только занятости отсутствующее название восстановить нельзя."
  - "Фоновая проверка раз в минуту и обновление экрана каждые 30 секунд зависят от доступности провайдера и очереди."
  - "Реальный полный путь подключения, изменения тестовых встреч и отключения обновлённого продакшена проверяется после выпуска."
release_notes: "Названия приватных встреч, описания, места, участники и ссылки доступны владельцу без текстового фильтра; защищённые сведения сохраняются зашифрованно. Исправлены повторы, часовые пояса, переносы, отмены, выбор календарей, восстановление зависших задач и обновление пустого списка. Сбой одного источника или Temporal не блокирует остальные календари. Формы и фокус сохраняются при обновлении."
