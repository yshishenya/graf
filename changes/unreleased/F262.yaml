schema_version: 1
feature_id: 262
category: Fixed
summary: "Удаление проверяет принятие сервером, доступ и смену сеанса; отмена сохраняет исходное устройство"
issue: 6880
tasks: [T005, T006, T007, T008, T010, T012, T014, T015, T016, T018]
compatibility: "Формат очереди и отчёта, основания очистки сохранены. Внутренний протокол отправки требует контекст сеанса; HTTP использует существующую серверную проверку expected actor/workspace. Требуется обновление приложения и совместимый сервер."
known_limitations:
  - "Запрет доступа при неизвестном состоянии сохраняется до подтверждения сервером."
  - "Новый выпуск и установленная приёмка этим изменением не подтверждены."
  - "Полная приёмка индекса отчётов T018 и всей F262 остаётся отдельной задачей."
  - "Для старых подтверждений отмены без аудита историческое устройство не восстанавливается."
  - "Приёмка T015 дополнена проверками списка; T016 остаётся открытой до позднего смешанного ответа и установленного server-only удаления с перезапуском."
release_notes: "Пакетная проверка состояния записи дополнена настоящими серверными сеансами: отзыв доступа или членства действует при следующем запросе, чужое пространство и чужой локальный источник не раскрываются. Подтверждение удаления получает только текущий владелец или управляющий с соответствующим правом; недоступность не разрешает очистку. Проверены общая граница 100 целей и устранение повторов; рабочий серверный код не меняется. Сетевое подтверждение удаления теперь требует явного phase=accepted как в прямом ответе, так и при выяснении результата через lifecycle. Неверное или отсутствующее поле не разрешает очистку локальных файлов; операция остаётся доступной для выяснения результата. Сохранённые подтверждённые операции прежней очереди продолжают читаться без изменения формата. Новая отмена записи до создания встречи сохраняет исполнителя, устройство и связь с серверным подтверждением в существующем журнале аудита. Подтверждение и аудит фиксируются одной транзакцией; при ошибке аудита отмена не принимается. Повтор с другого допустимого устройства сохраняет исходное подтверждение и первое устройство. Повторная проверка серверного удаления покрывает HTML/HTMX, смену сессии и отзыв прав управляющего; рабочий серверный код не меняется. Состояние записи и отчёт поддержки различают неизвестный ответ и подтверждённое серверное удаление. Принятое сервером подтверждение удаления сохраняет приоритет после позднего неизвестного ответа или устаревшего разрешения просмотра, в том числе при копировании отчёта после перезапуска приложения. Копирование, отправка и обновление обращения проверяют принадлежность всех выбранных записей: смена аккаунта, пространства, сервера или выход блокируют чужой отчёт до изменения очереди и обращения к сети. Локальное удаление и отмена ещё не созданной встречи не выдаются за удаление серверной копии. Ссылка просмотра учитывает блокирующее состояние удаления. Недоступные записи исключаются до группировки доступных кандидатов отчёта. Асинхронная отправка привязана к исходному сеансу и документу кабинета; устаревшие ответы не меняют очередь. Пересекающиеся отправки отклоняются до второго запроса. Прерванная отправка восстанавливает доступные действия без перезапуска только в своём контексте; обновление сохраняет известный номер обращения и доступно для повтора. Активный запрос и чужое состояние не изменяются. PostgreSQL-проверки create/cancel дополнены одинаковым ID записи у разных пользователей и в разных пространствах: отмена одной записи не затрагивает другую, повторы сохраняют исходные ID и подтверждения, независимые запреты создания хранятся отдельно. Повторная приёмка списка проверяет одну команду после переноса выбора на серверную строку, согласованные счётчики после нескольких удалений и независимую защиту от старого HTML и повторного состояния локальных копий. Браузер без сети сохраняет строку и сообщает об ошибке до явного повтора; код продукта не меняется."
