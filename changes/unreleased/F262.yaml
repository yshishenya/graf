schema_version: 1
feature_id: 262
category: Fixed
summary: "Отчёт записи учитывает подтверждённое удаление и доступ текущего аккаунта"
issue: 6880
tasks: [T005, T006, T018]
compatibility: "Формат очереди, сетевой контракт и основания очистки файлов сохранены; исправление требует обновления приложения."
known_limitations:
  - "Запрет доступа при неизвестном состоянии сохраняется до подтверждения сервером."
  - "Новый выпуск и установленная приёмка этим изменением не подтверждены."
release_notes: "Повторная проверка серверного удаления покрывает HTML/HTMX, смену сессии и отзыв прав управляющего; рабочий серверный код не меняется. Состояние записи и отчёт поддержки различают неизвестный ответ и подтверждённое серверное удаление. Принятое сервером подтверждение удаления сохраняет приоритет после позднего неизвестного ответа или устаревшего разрешения просмотра, в том числе при копировании отчёта после перезапуска приложения. Копирование, отправка и обновление обращения проверяют принадлежность всех выбранных записей: смена аккаунта, пространства, сервера или выход блокируют чужой отчёт до изменения очереди и обращения к сети. Локальное удаление и отмена ещё не созданной встречи не выдаются за удаление серверной копии."
