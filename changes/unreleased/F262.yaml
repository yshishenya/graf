schema_version: 1
feature_id: 262
category: Fixed
summary: "Проверка удаления учитывает открытую запись и большую локальную историю"
issue: 6895
tasks: [T020, T024, T025]
compatibility: "Формат сохранённой очереди и серверные API не меняются. Для приоритетной проверки, ограниченного числа запросов и повторов требуется новый нативный клиент; видимость строк передаётся обновлённым cabinet.js."
known_limitations:
  - "Выпуск, production и новая установленная приёмка GRAF Dev в этом PR не выполняются."
  - "T019/T021/T022/T023 и установочные остатки T013/T016 F262 остаются открытыми."
  - "Срок повтора округляется вверх к секундной точности существующей очереди: прибавка меньше одной секунды."
release_notes: "Приложение объединяет одновременные проверки состояния, сначала проверяет открытые и видимые записи, а остальную историю обходит порциями до 100 записей. Старые записи с неизвестной принадлежностью проверяются отдельно и не задерживают открытую запись. Проверка состояния, удаление и подтверждение очистки используют общий предел двух запросов; отменённый запрос и запрос прежнего аккаунта или пространства не отправляются после ожидания. Повторы удаления получают небольшой устойчивый разброс времени; срок сохраняется после перезапуска и никогда не становится раньше указанного сервером."
