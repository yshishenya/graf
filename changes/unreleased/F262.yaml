release_notes: "На странице «Удаления» теперь видны текущие операции приложения и незавершённая очистка файлов на Mac. Раньше обработчик пытался разместить этот статус только рядом со списком встреч, которого на странице отчётов нет. Статус обновляется без дублей; принятый запрос и завершённая локальная очистка по-прежнему различаются. Регрессионная проверка настоящего серверного шаблона включена в существующий браузерный набор и обязательные проверки кабинета."
