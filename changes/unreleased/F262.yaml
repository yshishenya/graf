schema_version: 1
feature_id: 262
category: Fixed
summary: "Просмотр и отчёт записи учитывают удаление, текущий доступ и смену сеанса"
issue: 6880
tasks: [T005, T006, T007, T018]
compatibility: "Формат очереди и отчёта, основания очистки сохранены. Внутренний протокол отправки требует контекст сеанса; HTTP использует существующую серверную проверку expected actor/workspace. Требуется обновление приложения и совместимый сервер."
known_limitations:
  - "Запрет доступа при неизвестном состоянии сохраняется до подтверждения сервером."
  - "Новый выпуск и установленная приёмка этим изменением не подтверждены."
  - "Полная приёмка индекса отчётов T018 и всей F262 остаётся отдельной задачей."
release_notes: "Повторная проверка серверного удаления покрывает HTML/HTMX, смену сессии и отзыв прав управляющего; рабочий серверный код не меняется. Состояние записи и отчёт поддержки различают неизвестный ответ и подтверждённое серверное удаление. Принятое сервером подтверждение удаления сохраняет приоритет после позднего неизвестного ответа или устаревшего разрешения просмотра, в том числе при копировании отчёта после перезапуска приложения. Копирование, отправка и обновление обращения проверяют принадлежность всех выбранных записей: смена аккаунта, пространства, сервера или выход блокируют чужой отчёт до изменения очереди и обращения к сети. Локальное удаление и отмена ещё не созданной встречи не выдаются за удаление серверной копии. Ссылка просмотра учитывает блокирующее состояние удаления. Недоступные записи исключаются до группировки доступных кандидатов отчёта. Асинхронная отправка привязана к исходному сеансу и документу кабинета; устаревшие ответы не меняют очередь. Пересекающиеся отправки отклоняются до второго запроса. Прерванная отправка восстанавливает доступные действия без перезапуска только в своём контексте; обновление сохраняет известный номер обращения и доступно для повтора. Активный запрос и чужое состояние не изменяются. PostgreSQL-проверки create/cancel дополнены одинаковым ID записи у разных пользователей и в разных пространствах: отмена одной записи не затрагивает другую, повторы сохраняют исходные ID и подтверждения, независимые запреты создания хранятся отдельно."
