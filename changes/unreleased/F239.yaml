schema_version: 1
feature_id: 239
category: Changed
summary: "Полноценные протоколы встреч с темами, решениями, задачами и таймкодами; модель и параметры управляются в Langfuse"
issue: 6503
tasks: [T001, T011, T014, T027, T035, T037, T043, T050, T054, T055, T057, T059]
compatibility: "Нужна миграция protocol_json и согласованная активация GRAF, нового корневого набора промптов и снятия прежнего специального ограничения LiteLLM в отдельной задаче общего выпуска. Старые плоские итоги не преобразуются и требуют новой генерации; идентификаторы шаблонов и привязки доступа сохраняются."
known_limitations:
  - "Root 41 не допущен: из трёх реальных попыток одна завершилась HTTP 504, две — отказом проверяющей LLM; семь контролей не запускались. Для готовности нужен успешный сокращённый прогон 3+7. Качество всех встреч базы не заявляется."
  - "Рабочего старого генератора и резервного плоского формата нет; без совместимого проверенного корневого набора новые итоги не создаются."
release_notes: "Итоги получают связное резюме, цели, тематические обсуждения, отдельно подтверждённые решения и таблицу задач со ссылками на источники. Формулировки создаёт LLM; ГРАФ проверяет структуру и ссылки, добавляет канонические таймкоды и отображает документ без смысловой правки. Модель сначала извлекает факты, затем составляет протокол; перед публикацией отдельная модельная стадия сверяет его с полной расшифровкой. Интерфейс, совместный доступ и выгрузки используют один принятый документ. Отозванная общая ссылка показывает понятную страницу недоступности без раскрытия встречи. Модель и параметры всех трёх стадий берутся из точных версий Langfuse без значений по умолчанию в коде. Приёмка качества и подготовка проверенного PR продолжаются; merge и production-активация не входят в эту задачу."
