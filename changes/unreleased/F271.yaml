schema_version: 1
feature_id: 271
category: Changed
summary: "Релизный прогон запускает обязательный набор серверных тестов в восемь потоков вместо четырёх — это верхняя граница, которую допускает скрипт набора в режиме --full. Компонент Ubuntu, задающий критический путь релиза, сократился с 26 минут 21 секунды до 17 минут 26 секунд, а весь релиз — с 26 минут 55 секунд до 17 минут 54 секунд. Состав проверок не изменился: снятых случаев ноль, добавлен один — новая контрактная проверка диапазона потоков."
issue: 7153
tasks: [T003, T004, T005, T006, T007, T008, T010, T014]
compatibility: "Изменений совместимости нет: состав проверок, пороги, строгая фаза, фаза производительности, набор тестов и доказательства сохраняются. Меняется только число потоков pytest в задаче Ubuntu релизной проверки."
known_limitations:
  - "Выигрыш ограничен числом ядер раннера: восемь потоков работают на четырёх vCPU с перегрузкой, поэтому измеренный выигрыш меньше линейного. Значение подтверждено прогоном release-full и при замедлении возвращается к четырём."
  - "Разбиение набора по нескольким раннерам (шардирование) в этот выпуск не входит: оно требует вынести статические проверки в отдельную задачу, изменить разбор доказательств по компонентам и согласовать правку с открытой фичей F269, которая меняет тот же файл."
release_notes: "Полная проверка перед выпуском стала почти в два с половиной раза быстрее. Набор серверных тестов в задаче Ubuntu запускается с восемью потоками вместо четырёх, и компонент Ubuntu сократился с 26 минут 21 секунды до 17 минут 26 секунд, а весь релизный прогон — с 26 минут 55 секунд до 17 минут 54 секунд. Состав проверок при этом не изменился: статические проверки, строгая фаза и фаза производительности выполняются как прежде, ни один случай не снят и не ослаблен, отказов нет. Дополнительно добавлена контрактная проверка, которая не даст вывести число потоков за допущенный диапазон и не даст выродить его в один поток."
