schema_version: 1
feature_id: 271
category: Changed
summary: "Релизный прогон полнее использует параллелизм раннера: обязательный набор серверных тестов запускается с восемью потоками вместо четырёх, состав проверок не меняется. Критический путь релиза сократился с 43 минут 6 секунд до 26 минут 55 секунд за счёт предыдущей работы, а эта правка снимает ограничение в четыре потока."
issue: 7152
tasks: [T003, T004, T005, T006, T007, T008, T010]
compatibility: "Изменений совместимости нет: состав проверок, пороги, строгая фаза, фаза производительности, набор тестов и доказательства сохраняются. Меняется только число потоков pytest в задаче Ubuntu релизной проверки."
known_limitations:
  - "Выигрыш ограничен числом ядер раннера: при четырёх vCPU восемь потоков работают с перегрузкой, поэтому итог подтверждается прогоном release-full, и при замедлении значение возвращается к четырём."
  - "Разбиение набора по нескольким раннерам (шардирование) в этот выпуск не входит: оно требует согласованного изменения контракта workflow и вынесения статических проверок в отдельную задачу."
release_notes: "Полная проверка перед выпуском проходит быстрее. Набор серверных тестов в задаче Ubuntu запускается с восемью потоками вместо четырёх — это верхняя граница, которую допускает скрипт набора, поэтому ограничение в четыре потока больше не удлиняет критический путь. Состав проверок не изменился: статические проверки, строгая фаза и фаза производительности выполняются как прежде, поэтому качество проверки не снижается. Итог подтверждается отдельным прогоном релизной проверки с записанными длительностями задач."
