schema_version: 1
feature_id: 271
category: Changed
summary: "Обновление приложения готовится параллельно выпуску, а не после него. Сплошной замер дал 21 минуту 14 секунд: подпись и загрузка обновления (3 минуты 54 секунды) шли после выкатки и целиком входили в критический путь. Теперь черновик выпуска создаётся сразу после подготовки, а подпись и загрузка идут в фоне параллельно поезду, полной проверке и выкатке. Тег по-прежнему создаётся только после всех проверок."
issue: 7127
tasks: [T032]
compatibility: "Изменений совместимости нет. Публикация остаётся последним действием, тег создаётся после всех проверок, состав проверок и ворота сохраняются. Ожидаемый итог — около 17 минут вместо 21."
known_limitations:
  - "Замена публичной ленты обновлений infra/runtime/public-downloads/graf-appcast.xml остаётся отдельным осознанным действием владельца."
release_notes: "Выпуск стал быстрее. Раньше подпись и загрузка обновления приложения шли после выкатки и добавляли почти четыре минуты к общему времени. Теперь черновик выпуска готовится сразу после подготовки, а подпись и загрузка идут одновременно с серверной проверкой и выкаткой. Выпуск по-прежнему становится публичным последним действием, а тег создаётся только после того, как все проверки прошли."
