schema_version: 1
feature_id: 271
category: Changed
summary: "Полная проверка релиза перестала быть узким местом: фаза серверных тестов, занимавшая 19 минут 39 секунд в одной задаче, разбита на четыре части на разных раннерах, статические проверки вынесены в отдельную параллельную задачу. Подтверждённый поезд релиза больше не считается непроверенным: подтверждение, решение и выкатка переиспользуют записанное доказательство вместо повторной сверки квитанций, которая занимала десятки минут. Проверка квитанций повторяется при временном сетевом сбое. Двенадцать ручных команд выпуска заменены одной командой scripts/release.sh с замером каждого шага."
issue: 7127
tasks: [T016, T017, T018, T019, T020, T021, T022, T023, T024]
compatibility: "Изменений совместимости нет: состав проверок, пороги, строгая фаза, фаза производительности и доказательства сохраняются. Разбиение набора доказано полнотой покрытия: объединение частей обязано точно совпадать с полным списком случаев, а агрегирующая задача проваливает проверку при пропуске или повторе случая. Резервная копия перед выкаткой остаётся обязательной."
known_limitations:
  - "Проверка восстановления из резервной копии больше не выполняется на каждом релизе: она вынесена в отдельный запуск по расписанию, чтобы не удваивать работу с копией на каждом выпуске. Сама резервная копия в релизе сохраняется."
  - "Выигрыш разбиения ограничен временем подготовки раннера и сбором списка случаев (около 4 минут), которое каждая часть выполняет независимо."
release_notes: "Выпуск новой версии стал заметно быстрее, и обновление приложения выходит одной командой вместо одиннадцати ручных шагов. Полная проверка перед выпуском, которая раньше выполняла весь набор серверных тестов одной длинной задачей, теперь идёт в несколько параллельных задач, а статические проверки — отдельно и одновременно с тестами; полнота покрытия проверяется автоматически, ни один случай не потерян. Подтверждённый поезд релиза перестал считаться непроверенным: шаги подтверждения, решения и выкатки переиспользуют уже записанное доказательство вместо повторной сверки, которая добавляла к выпуску десятки минут. Случайный сетевой сбой при проверке квитанций больше не останавливает выпуск. Вместо двенадцати ручных команд с разными форматами аргументов появилась одна команда scripts/release.sh, которая печатает длительность каждого шага и останавливается только на двух решениях оператора — вливать ли пул-реквест подготовки и выкатывать ли в прод."
