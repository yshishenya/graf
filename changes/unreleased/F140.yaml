schema_version: 1
feature_id: 140
category: Fixed
summary: "Кабинет показывает проверку прежнего списания раньше совета заменить карту или оплатить заново."
issue: 4922
tasks: [T068, T070]
compatibility: "Без миграций и новых зависимостей. Деньги, оплаченный срок и разрешение на автопродление сохраняются."
known_limitations:
  - "Ручная приёмка на единственном GRAF Dev и VoiceOver ещё не выполнена."
  - "Новое письмо об отсутствии способа оплаты и полные T068/T070 остаются отдельной работой; настоящее получение писем не подтверждено."
release_notes: "Пока результат прежнего продления проверяется, обзор тарифа и подписка ведут в историю платежей и сохраняют отключение будущих списаний. Неоднозначная ошибка не выдаётся за отсутствие карты. Проверено в изолированной PostgreSQL и автоматических проверках Chromium/WebKit; выпуск и развёртывание требуют отдельных ворот. Refs #4922, #4926."
