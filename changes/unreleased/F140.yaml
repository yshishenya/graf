release_notes: "Содержание существующих событий фиксируется в той же транзакции и остаётся правдивым после отмены и поздней доставки; периоды хранилища перечисляются отдельно. Внутренний отчёт доступен только служебной роли PostgreSQL, читает согласованный снимок без записи и отделяет нули от неподключённых источников. Финансовые действия и права не меняются; #4932 остаётся открытой."
