compatibility: "Без миграций и новых служб; финансовые действия и права не меняются"
known_limitations: ["Число строк не является балансом дней или показателем работы заданий", "Отчёт T077 всегда неполный; остальные источники, регулярность, тревоги и сохраняемая реакция FR-089 не завершены"]
release_notes: "В существующий внутренний отчёт добавлен обзор реестра бонусных дней: состояния строк и четыре временные группы ожидающих и доступных начислений. Будущая дата созревания допустима; достигнутая дата сама по себе не доказывает готовность начисления или сбой. Число строк не является балансом дней. Показатели заданий дополнений, попыток, ошибок и повторов остаются неизвестными; покрытие неполное. Доступ остаётся только у служебной роли PostgreSQL, данные читаются согласованным снимком без записи. Финансовые действия и права не меняются; #4932 остаётся открытой."
