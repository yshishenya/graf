summary: "Добавлены напоминание до продления и уведомления о неизвестном результате и подтверждённом отказе при окончании периода"
issue: 4903
tasks: [T048]
compatibility: "Используется существующая очередь; схема БД, платежи и правила доступа не меняются"
known_limitations: ["Остальные события T048 и фактическая доставка писем остаются открытыми; обратной массовой рассылки нет"]
release_notes: "Текущий плательщик получает одно напоминание при создании первой допустимой попытки продления за 72–48 часов до окончания периода, а также сообщение о неизвестном результате или подтверждённом отказе. Поздний ответ провайдера учитывается по времени обработки после ожидания, включая уже состоявшийся переход на Free. Напоминание содержит принятую сумму, цикл, даты МСК и безопасную маску способа оплаты. Записи сохраняются атомарно с существующей операцией или переходом и не повторяются при повторной обработке. Текст описывает расписание или событие в прошлом и направляет за актуальным статусом в кабинет без предложения повторной оплаты."
