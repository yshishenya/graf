schema_version: 1
feature_id: 140
category: Fixed
summary: Проверять привязку чеков YooKassa и сохранять подтверждение отмены чека возврата
issue: 4930
tasks: [T075, T077]
compatibility: Миграция проверяет прежние карты чеков и останавливается при неоднозначной связи.
known_limitations:
  - Для старых операций без проверенного магазина отдельное основание отмены пока не создаётся.
  - Оповещение оператора и эскалация после 72 часов выполняются отдельными шагами.
release_notes: >-
  GRAF проверяет идентификатор чека в ответе YooKassa и не заменяет уже
  привязанный чек оплаты другим чеком. Ответы о платеже и чеке обновляют
  одно состояние; ошибка в данных чека не отменяет подтверждение оплаты.
  Один чек в том же магазине и среде нельзя привязать к двум счетам.
  Проверенная связь старого счёта с магазином сохраняется для повторной сверки.
  Для чека возврата
  подтверждённая отмена сохраняется с временем проверки, если исходная
  операция привязана к тому же магазину и среде. Повтор не создаёт второе
  основание; отмена регистрации чека не меняет оплату или возврат.
