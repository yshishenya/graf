known_limitations: ["Сохранённый срок fair-use не доказывает нарушение общего срока, доставку или завершённую реакцию; удаление и общая реакция неизвестны", "Число строк не является балансом дней или показателем работы заданий", "Наблюдения возвратов считаются строками всей доступной БД, без возраста, чеков и финансовой сверки; текущий магазин не доказан", "Отчёт T077 всегда неполный; остальные источники, регулярность, тревоги и сохраняемая реакция FR-089 не завершены"]
release_notes: "В существующий внутренний отчёт добавлен обзор реестра бонусных дней: состояния строк и четыре временные группы ожидающих и доступных начислений. Будущая дата созревания допустима; достигнутая дата сама по себе не доказывает готовность начисления или сбой. Число строк не является балансом дней. Показатели заданий дополнений, попыток, ошибок и повторов остаются неизвестными; покрытие неполное. Доступ остаётся только у служебной роли PostgreSQL, данные читаются согласованным снимком без записи. Также добавлен подсчёт сохранённых наблюдений возвратов по совместной паре статуса и источника; неизвестные значения выделены отдельно. Локальное время наблюдения не выдаётся за дату возврата или срок банка. Чеки и финансовая сверка остаются неизвестными, покрытие неполное. Добавлен обзор сохраняемых fair-use проверок: пять состояний и четыре группы ожидающих рассмотрения по корректности расписания, началу и достижению срока. Будущие даты допустимы, не конечные или неверные выделяются отдельно. confirmed может сохранять ограничение, а достигнутый срок сам по себе не доказывает нарушение общего срока или завершённую реакцию. Даты и частные сведения не выводятся; удаление и общая реакция остаются неизвестными, покрытие неполное. Финансовые действия и права не меняются; #4932 остаётся открытой."
