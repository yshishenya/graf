schema_version: 1
feature_id: 140
category: Fixed
summary: Проверять ответ о чеке YooKassa и сохранять подтверждение отмены чека возврата
issue: 4930
tasks: [T075, T077]
compatibility: Миграций нет. Несовпадающий ответ не меняет состояние счёта.
known_limitations:
  - Для старых операций без проверенного магазина отдельное основание отмены пока не создаётся.
  - Оповещение оператора и эскалация после 72 часов выполняются отдельными шагами.
release_notes: >-
  GRAF проверяет идентификатор чека в ответе YooKassa. Для чека возврата
  подтверждённая отмена сохраняется с временем проверки, если исходная
  операция привязана к тому же магазину и среде. Повтор не создаёт второе
  основание; отмена регистрации чека не меняет оплату или возврат.
