schema_version: 1
feature_id: 140
category: Added
summary: Уведомления о реферальном бонусе
issue: 4926
tasks: [T068, T070]
compatibility: Правила начисления и остальные письма не меняются. Миграций нет.
release_notes: >-
  GRAF уведомляет владельца личного пространства, когда реферальный бонус
  становится доступен, применяется или отменяется. Перед отправкой GRAF
  проверяет право получателя, подтвержденный адрес и настройку писем.
  Добавлены автоматические проверки пяти уведомлений об оплате и продлении.
known_limitations:
  - Письма создаются для новых переходов; уведомления задним числом не отправляются.
