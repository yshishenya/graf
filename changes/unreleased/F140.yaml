schema_version: 1
feature_id: 140
category: Fixed
summary: Письма о пробном сроке и проверка доставки платёжных уведомлений
issue: 4926
tasks: [T068, T070]
compatibility: Срок пробного доступа и платёжные настройки не меняются. Миграций нет.
known_limitations:
  - Пропущенные окна отправки не догоняются; старые письма о начале не восстанавливаются.
  - Проверка транспорта подставная; получение реальных писем проверяется отдельно.
  - Пороги хранилища, другие состояния чека и поздний успех оплаты проверяются отдельно.
release_notes: >-
  Подтверждённый владелец получает письмо при явном начале пробного срока,
  напоминания за три дня и за сутки, а также письмо при окончании.
  Письма содержат даты и объясняют, что карта и автосписание не требуются.
  В изолированной PostgreSQL проверяются оплата, готовый чек, напоминание
  о продлении, неизвестный исход и поздний подтверждённый отказ (#4922).
  Штатный обработчик передаёт каждое из этих уведомлений подтверждённому получателю один раз.
