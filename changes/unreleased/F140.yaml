schema_version: 1
feature_id: 140
category: Fixed
summary: Подтверждение чеков YooKassa и письма о пробном сроке
issue: 4930
tasks: [T068, T070, T075, T077]
compatibility: Миграция проверяет прежние карты чеков и останавливается при неоднозначной связи.
known_limitations:
  - Без проверенной привязки магазина время ожидания и основание отмены не сохраняются.
  - Проверка получения письма владельцем и проверка тестового магазина остаются отдельными шагами.
  - Пропущенные окна отправки не догоняются; старые письма о начале не восстанавливаются.
release_notes: >-
  GRAF проверяет идентификатор чека в ответе YooKassa и не заменяет уже
  привязанный чек оплаты другим чеком. Ответы о платеже и чеке обновляют
  одно состояние; ошибка в данных чека не отменяет подтверждение оплаты.
  Один чек в том же магазине и среде нельзя привязать к двум счетам.
  Проверенная связь старого счёта с магазином сохраняется для повторной сверки.
  Для чеков оплаты и возврата GRAF сохраняет первое подтверждённое время
  ожидания и основание подтверждённой отмены. Повтор не меняет уже
  сохранённое время. Если свежий ответ после 72 часов всё ещё показывает
  ожидание, GRAF сохраняет основание просрочки. Отмена регистрации чека
  не меняет оплату или возврат.
  При ограниченном опросе недоступность YooKassa не меняет последнее
  подтверждённое состояние, а просрочка помечается как требующая сверки.
  Операторское наблюдение получает три раздельных накопительных счётчика
  без сведений о счёте и клиенте. Счётчики переживают удаление счёта.
  Образы наблюдателей должны понимать формат 2 перед переключением источника.
  Подтверждённый владелец получает письмо при явном начале пробного срока,
  напоминания за три дня и за сутки, а также письмо при окончании.
  Письма содержат даты и объясняют, что карта и автосписание не требуются.
  Сквозная проверка подтверждает, что готовый после опроса чек даёт одно
  уведомление, а отмена, ожидание и неполный ответ не меняют оплату.
