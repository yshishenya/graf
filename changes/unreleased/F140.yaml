schema_version: 1
feature_id: 140
category: Fixed
summary: Обязательные письма о планировании и отмене закрытия аккаунта
issue: 4926
tasks: [T068, T070]
compatibility: Новых миграций и настроек нет; неполные исторические снимки очереди подавляются без рассылки задним числом.
known_limitations:
  - "Подставной транспорт в проверках не подтверждает реальное получение письма; задача #7524 остаётся отдельной."
  - Полные T068/T070 и остальные семейства уведомлений сохраняют отдельную приёмку.
  - Уже сохранённую попытку отправки нельзя отозвать у транспорта после начала финализации.
release_notes: >-
  Новое планирование и сохранённая отмена закрытия аккаунта ставят обязательные
  письма в той же транзакции. Повтор не создаёт письмо, новое планирование
  после отмены имеет отдельную историю. Перед отправкой заново проверяются
  исходный запрос, его даты, активный владелец и подтверждённый адрес.
  Письмо описывает сохранённое действие с точными датами и ведёт в настройки
  аккаунта; оно не обещает текущее закрытие или завершённое удаление.
  После начала финализации новая отправка запрещена; ранее сохранённую
  попытку нельзя отозвать у транспорта. Неполная старая очередь подавляется.
  Известный временный отказ допускает повтор не раньше 60 секунд и максимум
  пять попыток, неопределённый исход не повторяется. Проверены browser→commit→
  outbox→обычный отправщик, откаты, права, финализация и конкуренция на
  синтетической PostgreSQL; реальное получение и выпуск проверяются отдельно.
  Связанные задачи: #4922/T068 и #4926/T070; полностью они этим не закрываются.
