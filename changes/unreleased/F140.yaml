schema_version: 1
feature_id: 140
category: Fixed
summary: Исторические письма о сохранении и отмене выбора хранилища
issue: 4926
tasks: [T068, T070]
compatibility: Новых миграций, настроек и зависимостей нет. Отмена сохраняет отдельную операцию без движения денег; неполная старая очередь подавляется без рассылки задним числом.
known_limitations:
  - Реальное получение письма и задача #7524 требуют отдельной приёмки.
  - Полные T068/T070, платное увеличение и остальные семейства уведомлений этим срезом не закрываются.
  - После сохранённого начала отправки неопределённый исход не повторяется автоматически; уже ушедший запрос нельзя отозвать.
release_notes: >-
  Сохранение выбора хранилища следующего неоплаченного периода и его отмена
  ставят обязательное письмо в той же транзакции. Повтор принятого предложения
  и отмена уже пустого выбора не создают новое письмо; устаревшая отмена не
  удаляет более новый выбор. Письмо сохраняет принятые байты, период, цену и
  даты, не подменяет их текущим каталогом и не обещает оплату или чек.
  Перед отправкой заново проверяются исходный владелец, подтверждённый адрес
  и сохранённая операция. Начало финализации запрещает новую отправку.
  Известный временный отказ допускает ограниченный повтор, неопределённый
  результат не повторяется. Отмена не сокращает оплаченные права и не
  принимает новую цену. Связанные задачи: #4922/T068 и #4926/T070.
