schema_version: 1
feature_id: 140
category: Ops
summary: "Добавлен внутренний импорт платёжных реестров; требования интерфейса согласованы с действующей конституцией"
issue: 4930
tasks: [T075, T079, T083]
compatibility: "Требуется миграция 0107_billing_registry: две отдельные служебные таблицы с обязательной RLS; откат запрещён при наличии истории. Проверка восстановления учитывает точное состояние последовательностей. По умолчанию команда только проверяет файлы"
known_limitations:
  - "Поддерживается один русский CSV-профиль UTF-8; импорт доступен только фактической служебной роли PostgreSQL"
  - "financial_status=not_checked: полнота файлов не доказывает сверку с API YooKassa и финансовыми записями GRAF"
  - "T075 и #4930, проверка магазина и открытие продаж остаются незавершёнными"
  - "Счётчики последовательностей не входят в снимок PostgreSQL: расхождение между чтениями pg_dump и описи отклоняет восстановление и требует повторного резервирования"
release_notes: "Результат проверки и ответственные за расхождения сохраняются без исходного CSV, сумм и платёжных идентификаторов. Повтор не дублирует результат, замена проверяет текущую версию, отдельная команда читает состояние после перезапуска. Импорт не меняет платежи или доступ пользователя. Требования F140 к интерфейсу приведены к действующей конституции: допускается наблюдаемый интерфейс Krisp при независимом коде, подтверждённых правах на материалы, доступности и правдивых текстах GRAF; ручная приёмка T079/T083 остаётся открытой"
