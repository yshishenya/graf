schema_version: 1
feature_id: 140
category: Fixed
summary: "Внутренний отчёт показывает реестры бонусных дней, возвратов, наблюдений чеков, fair-use проверок, запросов удаления и байтов хранения"
issue: 4932
tasks: [T077]
compatibility: "Без миграций и новых служб; финансовые действия и права не меняются"
known_limitations: ["Байты хранения — проекция существующих строк, не сверка MinIO или оплаты; historical cache сохраняется, недоказанный источник делает все суммы неизвестными", "Записи JSON наблюдений чеков не являются уникальными чеками или доказательством доставки; возраст pending и реакция неизвестны", "Сохранённый срок fair-use не доказывает нарушение общего срока, доставку или завершённую реакцию; детали удаления и общая реакция неизвестны", "Состояние запроса active_purge_complete не доказывает фактическую очистку артефактов, локальных копий, резервных копий или внешних систем; сохранённая наблюдаемость не удаляется", "Число строк не является балансом дней или показателем работы заданий", "Наблюдения возвратов считаются строками всей доступной БД, без возраста и финансовой сверки; текущий магазин не доказан", "Отчёт T077 всегда неполный; остальные источники, регулярность, тревоги и сохраняемая реакция FR-089 не завершены"]
release_notes: "В существующий внутренний отчёт добавлен обзор реестра бонусных дней: состояния строк и четыре временные группы ожидающих и доступных начислений. Будущая дата созревания допустима; достигнутая дата сама по себе не доказывает готовность начисления или сбой. Число строк не является балансом дней. Показатели заданий дополнений, попыток, ошибок и повторов остаются неизвестными; покрытие неполное. Доступ остаётся только у служебной роли PostgreSQL, данные читаются согласованным снимком без записи. Также добавлен подсчёт сохранённых наблюдений возвратов по совместной паре статуса и источника; неизвестные значения выделены отдельно. Локальное время наблюдения не выдаётся за дату возврата или срок банка. Финансовая сверка остаётся неизвестной, покрытие неполное. Добавлен обзор сохраняемых fair-use проверок: пять состояний и четыре группы ожидающих рассмотрения по корректности расписания, началу и достижению срока. Будущие даты допустимы, не конечные или неверные выделяются отдельно. confirmed может сохранять ограничение, а достигнутый срок сам по себе не доказывает нарушение общего срока или завершённую реакцию. Даты и частные сведения не выводятся; детали удаления и общая реакция остаются неизвестными, покрытие неполное. Добавлен отдельный обзор сохраняемых наблюдений чеков оплаты и возврата: 18 совместных сочетаний вида, статуса и источника и одна неизвестная группа. Отсутствующая или неверная map учитывается отдельно; пустой объект допустим. Число записей не выдаётся за уникальные чеки, timestamps не дают возраст pending. Чеки и возвраты не складываются; финансовая сверка, эскалация и реакция остаются неизвестными. Добавлен отдельный обзор запросов удаления по четырём объявленным состояниям и одной неизвестной группе. Число запросов не является числом удалённых встреч, active_purge_complete не доказывает фактическую очистку, соблюдение срока или результаты резервных копий, локального клиента и внешних систем. Generation Call, Langfuse и Temporal сохраняются по политике оператора. Даты и частные сведения не читаются; детали артефактов, сроки, показатели заданий и реакция остаются неизвестными. Добавлена проекция used/reserved/capacity по существующим расчётам на единый момент снимка для всех видимых пространств. Отсутствующая подписка, неизвестные планы, некорректные резервы и непредставимые сроки учитываются отдельно; неполный источник даёт неизвестные суммы вместо частичного итога. Истёкшие активные резервы выделены отдельно без их изменения. Предел 500 пространств проверяется целиком, превышение безопасно отказывает отчёту. Это не сверка фактических объектов или финансовых прав. Финансовые действия и права не меняются; #4932 остаётся открытой."
