schema_version: 1
feature_id: 140
category: Ops
summary: "Добавлен внутренний импорт платёжных реестров с сохранением результата и истории расхождений"
issue: 4930
tasks: [T075]
compatibility: "Требуется миграция 0107_billing_registry: две отдельные служебные таблицы с обязательной RLS; откат запрещён при наличии истории. По умолчанию команда только проверяет файлы"
known_limitations:
  - "Поддерживается один русский CSV-профиль UTF-8; импорт доступен только фактической служебной роли PostgreSQL"
  - "financial_status=not_checked: полнота файлов не доказывает сверку с API YooKassa и финансовыми записями GRAF"
  - "T075 и #4930, проверка магазина и открытие продаж остаются незавершёнными"
release_notes: "Результат проверки и ответственные за расхождения сохраняются без исходного CSV, сумм и платёжных идентификаторов. Повтор не дублирует результат, замена проверяет текущую версию, отдельная команда читает состояние после перезапуска. Импорт не меняет платежи или доступ пользователя"
