schema_version: 1
feature_id: 284
category: Fixed
summary: "Длинный звонок сохраняет непрерывную автозапись, а сохранённое на Mac аудио открывается из карточки встречи"
issue: 7447
tasks: [T001, T002, T003, T004, T005, T006, T007, T008]
compatibility: "Тарифы, серверные права и формат локальных файлов сохранены; миграций нет. Кнопка локального аудио требует обновлённых macOS-приложения и кабинета"
known_limitations:
  - "Квота серверного хранения сохраняется; локальная кнопка доступна только на Mac с собственной сохранённой копией"
  - "Непрерывность проверена 45-минутной эмуляцией и автоматическими проверками; приёмка на настоящем длительном звонке не выполнена"
release_notes: "Текущая активность микрофона проверяется через CoreAudio вместо устаревшего системного журнала. При завершении действует ожидание 15 секунд, при потере наблюдения — защитная остановка через 600 секунд. Нехватка места больше не отображается как ошибка кодека. Локальное воспроизведение сохраняет проверки доступа, удаления и целостности; кнопка работает в настоящей разметке и после обновления статуса. Технический перезапуск наблюдения сохраняет незавершённое предложение записи."
