schema_version: 1
feature_id: 248
category: Fixed
summary: "Приложение GRAF для macOS и браузеры различаются в едином разделе устройств и сеансов; завершение сеанса действительно отзывает серверный доступ."
issue: 6614
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009]
compatibility: "Миграция БД не требуется. Для точного распознавания новых входов приложения нужен выпуск обновлённого macOS клиента и сервера; старые неполные сведения остаются неопределёнными. Сроки входа и область рабочего пространства сохраняются."
known_limitations:
  - "Список относится к текущему рабочему пространству и логическим сеансам, а не к физическим компьютерам."
  - "Отзыв прекращает доступ к серверу; он не удаляет локальные файлы и не останавливает локальную запись."
  - "Публикация клиента и сервера выполняется отдельным релизом с обязательными проверками."
release_notes: "Текущий сеанс показан первым. Название приложения или браузера отделено от способа входа; даты учитывают часовой пояс профиля. Завершённые и недоступные записи помещены в историю. Завершение другого или остальных сеансов требует подтверждения и сохраняет текущий вход. Исправлены проверка привязки устройства, независимость браузерного перехода к оплате, обновление активности при выходе и конфликт параллельного отзыва. Проверено целевыми тестами PostgreSQL, интерфейсом Chromium/WebKit и настоящим WKWebView."
