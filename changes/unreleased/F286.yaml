schema_version: 1
feature_id: 286
category: Added
summary: "Передача выбранных итогов по ссылке и по почте, с отдельным управлением автоотправкой участникам."
issue: 7546
tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019]
compatibility: "Добавочные миграции 0102–0104. Ранее выданный доступ сохраняется; непринятые приглашения требуют самостоятельного входа с подтвержденной почтой. Автоотправка по умолчанию выключена. Выпуск сервера сохраняет установленное приложение и подписанные файлы обновления."
known_limitations:
  - "Автоотправка доступна только для проверенного полного состава участников Google Calendar внутри пространства; остальные встречи отправляются вручную."
  - "Неизвестный результат доставки требует проверки и не повторяется автоматически."
  - "Письмо считается отправленным после принятия почтовой службой; получение во входящих проверяется отдельно."
release_notes: "Получатель читает сохраненные выбранные итоги. Аудио и расшифровка не открываются по общей ссылке. Ссылку можно обновить, заменить или отключить. Автоотправка включается явно для встречи или будущих встреч серии, с паузой и отменой."
