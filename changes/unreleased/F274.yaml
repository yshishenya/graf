schema_version: 1
feature_id: 274
category: Changed
summary: "Уведомления GRAF в macOS показываются собственной карточкой поверх всех окон, как в эталоне: карточка встречи с названием, временем начала и действиями «Подключиться» и «Подключиться и начать запись», компактный индикатор записи с длительностью и кнопкой останова. Карточка и индикатор не зависят от системного разрешения на уведомления и от режима «Не беспокоить», закрытая карточка не возвращается для того же события, а системный баннер больше не дублирует её."
issue: 7207
tasks: [T001, T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T024]
compatibility: "Изменений совместимости нет. Системные уведомления macOS остаются дополнительным каналом и по-прежнему управляются настройками и разрешением. Контракты верхней панели и разделения «контроль сейчас» и истории не меняются."
known_limitations:
  - "Внешний вид карточки воспроизводит наблюдаемые параметры эталона; побайтовое совпадение шрифтов и значков не заявляется."
  - "Звук напоминания остаётся у системного баннера: собственная карточка звук не проигрывает."
release_notes: "Уведомления в macOS стали заметными и полезными. Перед встречей появляется карточка поверх всех окон: название встречи, время начала и кнопки «Подключиться» и «Подключиться и начать запись». Во время записи виден компактный индикатор с длительностью и кнопкой останова. Карточка и индикатор работают независимо от системного разрешения на уведомления и от режима «Не беспокоить», поэтому напоминание о встрече больше не теряется. Закрытая карточка не появляется повторно для той же встречи, а системное уведомление не дублирует её."
