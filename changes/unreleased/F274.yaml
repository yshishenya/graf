schema_version: 1
feature_id: 274
category: Changed
summary: "Все сообщения GRAF в macOS показываются одной карточкой в правом верхнем углу, как в эталоне: окно 448 на 104 точки, скругление 16, знак закрытия в верхнем правом углу. Карточка встречи несёт название, время начала и действия «Записать» и «Подключиться»; вопрос о записи встречи, сообщение о короткой записи, состояния записи и расшифровки и проверка из настроек используют ту же поверхность. Карточка не зависит от системного разрешения на уведомления и от режима «Не беспокоить», исчезает сама по истечении срока, а закрытая вручную не возвращается для того же события и исчезает при закрытии приложения. Карточка закрывается нажатием по знаку закрытия и тогда, когда GRAF не впереди: нажатие перехватывает сторож, не забирая клавиатурный фокус."
issue: 7207
