compatibility: "Изменений совместимости нет. Системные уведомления macOS остаются дополнительным каналом и по-прежнему управляются настройками и разрешением. Контракты верхней панели и разделения «контроль сейчас» и истории не меняются."
known_limitations:
  - "Внешний вид карточки воспроизводит наблюдаемые параметры эталона; побайтовое совпадение шрифтов и значков не заявляется."
  - "Звук напоминания остаётся у системного баннера: собственная карточка звук не проигрывает."
  - "Постоянного окна с длительностью записи нет: состояние записи и расшифровки сообщается один раз на переход, а ход записи виден в строке меню и в окне приложения."
release_notes: "Уведомления в macOS стали заметными, спокойными и одинаковыми по виду. Перед встречей в правом верхнем углу появляется карточка: название встречи, время начала и кнопки «Записать» и «Подключиться». Вопрос «Записать встречу?», сообщение о том, что запись короче 30 секунд не сохранена, сообщения «Запись началась» и «Расшифровка началась» и проверка уведомлений из настроек показываются той же карточкой. Висящее окно поверх всех приложений с надписью «идёт запись» убрано: ход записи виден в строке меню, а GRAF сообщает о смене состояния один раз. Любое сообщение исчезает само, закрывается знаком в верхнем правом углу и больше не показывается для той же встречи."
