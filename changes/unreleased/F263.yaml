release_notes: "Карта проверок включает существующие контрактные и интеграционные проверки календаря при изменении его реализации. Они выполняются через штатный изолированный PostgreSQL с обязательной проверкой скорости. Повторный календарный этап не запускается; остальные проверки сохраняются. Для неизменных требований описано повторное использование полного чтения в том же диалоге с проверкой хешей и доступности контекста. Первое чтение и полное перечитывание при неизвестной области или изменении принципа сохраняются."
