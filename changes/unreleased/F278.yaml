compatibility: "Добавочные миграции 0100 и 0101; минимальный платёж карты 100 копеек. Исторические права сохраняются; откат схемы с финансовыми данными запрещён. Новые продажи включаются отдельно."
known_limitations: ["Настоящий тестовый магазин, ручная приёмка GRAF Dev и независимые прохождения ещё не подтверждены", "Боевые списания, чеки и банковское зачисление ещё не проверены; публичное открытие оплаты не выполнено"]
release_notes: "В базу входят 5 ГБ; каждый дополнительный пакет 5 ГБ стоит 250 ₽/месяц или 2500 ₽/год, максимум 500 ГБ. Продление по изменённой цене требует явного согласия. Единый расчёт показывает разовую скидку, срок, общий объём и полную цену следующего периода. Неизвестный результат восстанавливается без повторного списания; операции защищены от дублей и ограничены общим бюджетом приёмки. Оплаченные интервалы хранилища сохраняются при предоплате и уменьшении. Полная готовность выпуска требует отдельной живой приёмки."
