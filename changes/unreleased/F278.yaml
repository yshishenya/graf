schema_version: 1
feature_id: 278
category: Fixed
summary: "После успешной оплаты GRAF обновляет задержанный чек; кнопка «Проверить чек» возвращает результат в сведения платежа, сохраняя приоритет незавершённых оплат и чередование ожидающих чеков при ошибках и отсутствии владельца."
issue: 7512
tasks: [T031]
compatibility: "Без миграций и изменения цен. Сохраняются оплаченные интервалы, суммы, бюджет, отменённое автопродление и причина невыданного доступа, если оплаченная услуга требует разбирательства. После смены владельца доступна только проверка регистрации чека, без карты, контакта и ссылки прежнего плательщика. Провайдер получает только запросы чтения существующего платежа."
known_limitations:
  - "Фоновое наблюдение задержанного чека ограничено первыми 24 часами; позднее доступна явная проверка владельцем."
  - "Полная финансовая и человеческая приёмка F278 остаётся отдельным условием: внешние возвраты и обязательные ручные сценарии ещё не закрыты."
release_notes: "Исправление требует проверок точного SHA, полного выпуска и подтверждения годового чека в рабочей среде."
