schema_version: 1
feature_id: 278
category: Fixed
summary: "После успешной оплаты GRAF обновляет задержанный чек; в сведениях платежа доступна отдельная проверка чека."
issue: 7512
tasks: [T031]
compatibility: "Без миграций и изменения цен. Сохраняются оплаченные интервалы, суммы, бюджет и отменённое автопродление. Провайдер получает только запросы чтения существующего платежа."
known_limitations:
  - "Фоновое наблюдение задержанного чека ограничено первыми 24 часами; позднее доступна явная проверка владельцем."
  - "Полная финансовая и человеческая приёмка F278 остаётся отдельным условием: внешние возвраты и обязательные ручные сценарии ещё не закрыты."
release_notes: "Исправление требует проверок точного SHA, полного выпуска и подтверждения годового чека в рабочей среде."
