schema_version: 1
feature_id: 273
category: Security
summary: "Публичная аналитика проверяет основание и сохраняет обработчик SDK при остановке"
issue: 7696
tasks: [T106]
compatibility: "Рабочие флаги и редакция согласия не меняются; public путь требует читаемого валидного реестра, отсутствие файла закрывает передачу"
known_limitations:
  - "Профиль SDK ограничен analytics-only, локальными ответами и 20 секундами; replay, реальный backend, серверное обновление разрешения активной вкладки, индивидуальный серверный отзыв, полный T106, измерение и T0 ещё не приняты"
release_notes: "Общее свежее решение применяется к контексту страницы, приёму события и доставке. Сохранённый выбор посетителя сверяется перед управляемыми отправками и при возврате вкладки; старое уведомление не восстанавливает отозванное согласие. Очистка очереди сохраняет исходный массив и обработчик SDK, чтобы команда остановки действительно исполнялась. Ручной профиль проверяет настоящий SDK при полностью перехваченной сети. Дополнительная проверка PostHog сохранена; ошибки аналитики не останавливают продукт"
