  - "Раскрытие и основание хранения остаются отдельной T111; правка кода не подтверждает юридическую или коммерческую готовность."
release_notes: "Ежедневная задача больше не удаляет агрегаты и атрибуцию по возрасту. Миграция снимает TTL событий без удаления строк. Отдельные сроки удаления не выводятся из срока хранения."
