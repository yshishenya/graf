schema_version: 1
feature_id: 273
category: Fixed
summary: Отчёты аналитики показывают отсутствие данных для пропущенных счётчиков и неизвестного периода
issue: 7699
tasks: [T060, T090, T099]
compatibility: Поле results использует предусмотренное схемой пустое значение для неизвестного числа. Миграций нет.
release_notes: >-
  Если счётчик активаций, скачиваний или нажатий не поступил, отчёт показывает
  отсутствие данных. Явный ноль сохраняется, а стоимость рассчитанного
  результата не меняется. Доля согласия недоступна, если для сравнения
  счётчиков не задан период.
known_limitations:
  - Отчёту по-прежнему нужны подтверждённые источники расхода и конверсий.
