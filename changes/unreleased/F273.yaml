schema_version: 1
feature_id: 273
category: Fixed
summary: "История аналитики в хранилищах ГРАФ сохраняется до отдельного решения об удалении."
issue: 7185
tasks: [T098, T109, T111, T115]
compatibility: "Нужны явный GRAF_PRODUCT_ANALYTICS_RETENTION_MODE=until_decision, удаление старой POSTHOG_EVENT_RETENTION_DAYS и операторская миграция event TTL; старые receipts не открывают готовность; проверка режима действительна менее 26 часов и не принимает будущее или неизвестное время. Окно атрибуции и сессии не продлены. Неиспользуемый TWOBRAIN_PRODUCT_ANALYTICS_RETENTION_MIN_DAYS убран из настройки API/Compose; условия для зарегистрированных пользователей обновлены до 2026-10-22.1 и until_decision. Новый выбор сохраняется после смены редакции; повторные обработчики проверяют действительную сохранённую revision и категории до включения измерения. Публичная редакция согласия 2026-10-22.1 требует нового выбора необязательных целей; старый env отключает браузерное измерение."
known_limitations:
  - "T115: добавлена миграция 0105 с закрытым регионом и полным ключом; схема должна обновиться до запуска новых readers. При nonunknown строках откат схемы запрещён. Длительность блокировки на рабочем объёме не принята."
  - "T098: убрано CLI-перекрытие доверия прокси, штатный FORWARDED_ALLOW_IPS принимает только точные IP; пустое значение, wildcard и CIDR отклоняются. Изолированная сетевая матрица 14/14 принята независимым ревью; рабочая приемка нового peer еще не выполнена."
  - "Рабочие настройки, политики провайдера и полное восстановление требуют отдельной приемки; расширенная аналитика и запись IP не включены."
  - "Новая редакция подготовлена локально; публикация, рабочие настройки и применимое основание T111 ещё не приняты. Правка кода не подтверждает юридическую или коммерческую готовность."
release_notes: "Агрегаты используют фиксированный порог 3 до суммирования; малые исходные счётчики скрыты. Публичная география остаётся unknown. Ежедневная задача больше не удаляет агрегаты и атрибуцию по возрасту. Миграция снимает TTL событий без удаления строк. Отдельные сроки удаления передаются через план из реестра отзыва и не выводятся из срока хранения."
