schema_version: 1
feature_id: 273
category: Fixed
summary: "Подключена проверка показанного результата к защищённым кабинетным маршрутам при закрытом рабочем сборе"
issue: 7698
tasks: [T112]
compatibility: "Оба кабинета используют один защищённый обработчик POST и общий выбор отображённого текста. Подпись относится к исходной версии конкретного блока; истёкшая подпись обновляется отдельной читающей операцией без принятия события. Две первые вехи сохраняются одной прежней транзакцией. Старый клиент сохраняет просмотр без нового учёта. Каталог событий, старые payload, тексты и оформление сохраняются"
known_limitations:
  - "Настоящий источник проверенного периода T113 остаётся закрытым для читающей операции и сохранения пары. Подставленная граница в изолированных тестах не разрешает рабочий сбор, внешнюю передачу, новый период или T0"
  - "Исходные пределы 128 SQL, 2 секунды, резерв очистки 0,5 секунды и ограничения исходных данных сохранены. Большой допустимый по размеру результат может получить безопасный отказ по исходному времени; обычный продуктовый просмотр продолжается"
  - "T112 целиком, ручная приёмка GRAF Dev, T113/readiness/восстановление, точные GitHub-проверки и рабочий выпуск остаются отдельными воротами. Незавершённое не считается принятым"
  - "Наблюдаемый показ не доказывает прочтение, пользу, локальную запись или статус нового внешнего клиента. Эвристический external и HTTP-ответ сами по себе не являются внешним визитом или коммерческой активацией"
release_notes: "Подготовлен серверный путь подтверждения показа непустого результата в обычном и встроенном кабинетах. Открытие страницы и обновление истёкшего подтверждения не принимают событие; защищённый POST проверяет доступ, исходную версию и текущий источник перед общей записью двух первых вех. Ошибки дополнительной проверки сохраняют обычный просмотр. Подтверждение не содержит текста встречи и не сохраняется в аналитике. Изменение не включает рабочий сбор и не подтверждает новые визиты, регистрации или оплаты"
