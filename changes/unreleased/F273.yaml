schema_version: 1
feature_id: 273
category: Fixed
summary: "Защита аналитики отклоняет недоказанное восстановление; проверка транспорта отдельно подтверждает штатную блокировку."
issue: 7185
tasks: [T116, T117, T118, T119]
compatibility: "Нужна отдельная установка согласованных helpers и операторская приёмка. Рабочие флаги расширенной аналитики и записи IP не включены. До полноценного T118 самодекларированные отчёты восстановления блокируют готовность."
known_limitations:
  - "T116: подготовлен полный учёт выделенных блоков и защитное состояние до ручного восстановления. Полный свежий вход, принятый бюджет и итоговая готовность проверяются отдельно; противоречивая неготовность имеет собственную причину. Рабочие замеры, установка и доставка оповещений ещё не приняты."
  - "T117: локальный кандидат проверяет inventory томов, manifest и архивы, атомарно завершает набор и сохраняет последние 7 пригодных копий. Готовность требует минимум 2 полных набора моложе 26 часов. Рабочая установка и восстановление остаются открытыми; потеря узла может уничтожить историю."
  - "T118: самодекларированный отчёт с произвольными хешами и списком классов не открывает готовность. Полный согласованный механизм восстановления ещё не реализован и не установлен. Возраст отчёта проверяется независимо. Проверка транспорта использует только синтетические данные внутри тестового процесса и подтверждает блокировку до и после неё."
  - "T119: подготовлен независимый наблюдатель доступности с повтором доставки и отдельным состоянием канала. Установка на отдельный узел и получение учебного оповещения ещё не приняты."
release_notes: "Исправлены выбранная группа чтения состояния, очистка собственных неудачных копий, имена томов проекта, локальные причины готовности аналитики и проверки резервных копий; подготовлен независимый контроль доступности. Изменения не подтверждают работающий монитор, восстановление, трафик или продажи и не включают необязательное измерение."
