schema_version: 1
feature_id: 273
category: Fixed
summary: "Резервная копия и восстановленная БД проходят сверку схемы, прав и контрольных количеств"
issue: 7804
tasks: [T113]
compatibility: "Проверка восстановления требует закрытый полный комплект с inventory формата 2 и контрольными суммами. Старые комплекты сохраняются, но новую проверку не проходят. Восстановление сохраняет владельцев объектов и создаёт отдельную временную БД для разбора исходной схемы"
release_notes: "Штатные psql и pg_dump используют один экспортированный снимок для дампа, схемы, полного счёта таблиц и состояний первых вех. Перед восстановлением проверяются файлы и характеристики исходного журнала первых действий; после него сверяются схема, владельцы, права, ограничения, количества строк и состояния доставки. SQL-выражения сравниваются после разбора самим PostgreSQL. Обе временные БД и служебные файлы очищаются до успешного результата"
known_limitations:
  - "Принят только участок сравнения восстановленной БД; карантин доставки, повтор точных удалений, неизвестный интервал после копии и готовность первого локального периода требуют дальнейшей реализации"
  - "Роли не входят в обычный pg_dump: сохранены только их безопасные характеристики для последующего сравнения, без паролей"
  - "Рабочая установка, включение аналитики, IP и получателей этим срезом не выполняются"
