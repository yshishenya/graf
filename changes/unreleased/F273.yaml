schema_version: 1
feature_id: 273
category: Fixed
summary: "Репетиция восстановления использует только собственные временные цели и проверяет очистку"
issue: 7804
tasks: [T113]
compatibility: "Формат копии сохранён; автоматический выбор использует только полные датированные комплекты GRAF, остальные комплекты задаются явным абсолютным путём"
known_limitations:
  - "Полная проверка схемы, ролей, RLS, реестра первых вех и повторного удаления остаётся отдельным срезом T113"
  - "Локальный режим, рабочая установка и включение аналитики этим исправлением не принимаются"
release_notes: "Новые БД и хранилище имеют уникальные имена и создаются без переиспользования. Удаляются только подтверждённые собственные цели. Дамп передаётся через стандартный ввод без общего временного файла, журнал закрыт и удаляется. Ошибка восстановления, удаления или проверки отсутствия целей запрещает успешный результат; общий замок исключает одновременную выкладку и репетицию."
