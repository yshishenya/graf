compatibility: "Схема БД, авторизация, ответы, cookies и настройки сбора не меняются"
known_limitations:
  - "Обезличенный шаг не является полным реестром внешних клиентов; сбой между сохранением аккаунта и счётчиком может оставить пробел"
  - "Рабочее измерение, T098/T113, T099/R11 и T0 требуют отдельной приёмки"
release_notes: "Новый аккаунт считается прежним обезличенным шагом только после успешного сохранения. Обычный вход, повтор и привязка провайдера не добавляют регистрацию. Сбой записи аналитики не отменяет успешный вход; рабочий сбор этим исправлением не включается."
