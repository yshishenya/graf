release_notes: "Подготовлено хранение первого события каждого типа на аккаунт: повторные запросы и перезапуск не должны увеличивать счёт. Для двух получателей отдельно сохраняется состояние доставки; неопределённый исход не разрешает слепой повтор. Закрытие аккаунта удаляет только его историю, а откат непустой таблицы блокируется. Подключение к реальным событиям и рабочее включение аналитики ещё предстоят."
