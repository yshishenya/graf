schema_version: 1
feature_id: 273
category: Fixed
summary: "Сохранять отказ от аналитики и явно показывать пропуски в отчётах"
issue: 7696
tasks: [T060, T090, T099, T106]
compatibility: "Миграций нет. В существующих полях отчёта пустое значение означает, что показатель не измерен."
release_notes: >-
  Страница не дублирует проверку сохранённого выбора при загрузке и возврате
  из кэша. Пока выбор не подтверждён, необязательный сбор выключен. Если
  сохранение было прервано, страница предлагает повторить действие или открыть
  настройки; поздний ответ не возобновляет прерванное действие.
  Отчёт стоимости результата отличает пропущенные счётчики от явного нуля
  (#7699). Отчёт о согласии скрывает долю и оба счётчика, если период неизвестен.
known_limitations:
  - "Рабочее включение аналитики, внешний счётчик и остальные сценарии T106 требуют отдельной приёмки."
  - "Для отчётов нужны подтверждённые источники расхода, конверсий и числа согласившихся визитов."
