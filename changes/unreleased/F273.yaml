compatibility: "Миграция 0108 добавляет отдельную таблицу контроля выбора; relay требует UUID выбора и серверную редакцию разрешения"
known_limitations: ["Работа не готова к выпуску: браузерное подтверждение и lifecycle/restore ещё не завершены", "Рабочее измерение, внешний SDK, T106/T113 и T0 остаются закрытыми"]
release_notes: "Отзыв сохраняется независимо от включения аналитики. Передача проверяет текущий выбор под общей блокировкой PostgreSQL. Старые запросы не получают нового разрешения; неоднозначная доставка не повторяется автоматически. Это промежуточная серверная реализация, не рабочий запуск."
