schema_version: 1
feature_id: 273
category: Fixed
summary: "Первые события принимаются однократно и доставляются с явным состоянием каждого получателя"
issue: 7698
tasks: [T113, T106, T112]
compatibility: "Добавлена миграция 0106; откат непустой истории намеренно запрещён. Формы запросов сохраняются; account-вехи требуют существующую авторизацию и серверный псевдоним. Старый клиент без авторизации получает безопасный отказ аналитики"
known_limitations:
  - "Общий приём подключён к двум API и desktop-авторизации; ограниченная служебная доставка реализована; подтверждение чтением, триггеры результата и проверка восстановления GRAF DB ещё не завершены"
  - "Рабочая аналитика, запись IP и доставка провайдерам этим изменением не включаются"
  - "Готовность копирования, восстановления и полной воронки остаётся отдельной приёмкой"
release_notes: "Подготовлено хранение первого события каждого типа на аккаунт: повторные запросы и перезапуск не должны увеличивать счёт. Для двух получателей отдельно сохраняется состояние доставки; неопределённый исход не разрешает слепой повтор. Закрытие аккаунта удаляет только его историю, а откат непустой таблицы блокируется. Оба API и серверный desktop-вход используют общий авторизованный приём; обычный браузерный вход не считается подключением приложения. Прямая отправка первых событий и временный счёт в памяти убраны. До проверки полного восстановления GRAF DB запись закрыта; служебная доставка ограничена 20 строками за проход и одним запросом получателю, её неизвестный исход не пересылается автоматически. Закрытие аккаунта отменяет ожидающие отправки до удаления содержимого. Подтверждение события у получателя и показ результата требуют следующей приёмки."
