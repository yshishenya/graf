schema_version: 1
feature_id: 273
category: Fixed
summary: "Подготовлены проверка происхождения результата и короткое подписанное подтверждение для достоверного учёта просмотра"
issue: 7698
tasks: [T112]
compatibility: "Построитель требует явный bool или неизвестное значение. Новая внутренняя проверка использует существующие таблицы приёма и общий критерий готовности; производственные вызовы ещё не подключены. Каталог событий и старые payload сохраняются"
known_limitations:
  - "T112 не завершена: разрешённая проекция, наблюдение browser/native, защищённый POST и общая T113 ещё не подключены; рабочее измерение остаётся закрытым"
  - "Подтверждение источника и корректная подпись сами по себе не доказывают показ, действующий доступ или готовность хранения; полный набор проверок и выпускные ворота остаются открытыми"
release_notes: "Будущий учёт просмотра сможет проверять завершённый приём записи, её владельца, версию результата и защиту от удаления. Подтверждение связано с текущей сессией и блоком, действует десять минут и не содержит текста встречи. Подтверждённое отсутствие локального захвата передаётся как false, неизвестное значение не включается в событие. Этот срез не включает сбор и не подтверждает новые визиты или активации"
