schema_version: 1
feature_id: 273
category: Fixed
summary: Сохранить три прежних направления при переходе входа ГРАФ
issue: 7698
tasks: [T098]
compatibility: Публичные адреса и прежняя таблица маршрутов сохраняются. Требуются полная проверка действующей конфигурации,
  исходные проверки соседей, поэтапный переход и возврат; автоматического применения нет.
known_limitations:
  - Рабочие проверки соседей, настоящий VLESS/REALITY и полный переход ещё не приняты; изолированная HTTPS-заглушка их не заменяет.
  - Измерение и сбор IP не включаются. Истёкшее исключение сохраняет блокировку слияния и выпуска до действительного решения.
release_notes: Отдельный вход ГРАФ использует свободный по описи порт, а один внутренний ретранслятор сохраняет исходную таблицу
  SNI всех соседей. Повреждённые PROXY-заголовки не попадают в новые журналы. Добавлены изолированные проверки трёх направлений,
  байтов TLS, журналов и поэтапного перехода с возвратом. Рабочая приёмка и выпуск выполняются отдельно.
