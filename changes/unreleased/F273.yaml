schema_version: 1
feature_id: 273
category: Fixed
summary: "Подготовлены проверка показанного результата и общее согласованное сохранение первых вех"
issue: 7698
tasks: [T112]
compatibility: "Построитель требует явный bool или неизвестное значение. Renderer и подготовка подтверждения используют общий выбор текста; проверка источника использует существующие таблицы приёма и критерий готовности. Необязательное подтверждение относится только к непустому телу. Общий наблюдатель проверяет видимость, а встроенный кабинет дополнительно требует текущий native документ и активное окно; старый клиент сохраняет просмотр без нового учёта. Рабочие вызовы source/proof ещё не подключены. Каталог событий, старые payload, текст и оформление сохраняются"
known_limitations:
  - "Добавлены изолированные числовые проверки исходного размера и структуры выбранных данных на стороне PostgreSQL. Повторные ключи JSON сохраняются при проверке глубины и числа узлов; преобразование в JSONB не подменяет исходный размер. Общий запрос результата проверен без изменения ответа. Подготовлен отдельный владелец сессии только для чтения с перехватом фактических ORM-запросов, ограничением всех управляющих/числовых/исходных SQL и общего срока. Независимое повторное ревью приняло R1–R3 после 75 тестов PostgreSQL и обнаружило R4: перехваченная ошибка исходного чтения не сохраняла отказ. Исправление R4 прошло весь набор из 44 проверок сессии и независимое ревью P1/P2=0 в пределах отдельного компонента чтения. К рабочему admission компонент не подключён. HTTP и рабочий сбор остаются закрытыми"
  - "В трёх общих запросах кабинетных метаданных добавлен ID последним ключом сортировки. При равных прежних ключах выбор становится определённым; при разных датах и номерах попыток приоритет сохраняется. Полная граница сессии вместе с записью пары вех ещё не принята; само это исправление не подключает HTTP-триггер или рабочую аналитику"
  - "T112 не завершена: рабочая выдача и обновление подтверждения, защищённый POST и общая T113 ещё не подключены; рабочее измерение остаётся закрытым. Подготовленная внешняя граница запроса изолированно проверена для авторизации, продления сессии, pre-ping, одной отмены startup и native rollback при Session.close. Инициализация холодного соединения и сохраняющийся отказ при противоречивом владельце имеют новый локальный профиль 207 проверок; повторная независимая проверка исправления I1 пройдена в этом ограниченном объёме. Для hard invalidate(None) собственного соединения без транзакции найден и исправлен отказ срока закрытия: новый профиль 233 проверок и независимое ревью реализации пройдены в этой узкой области, P1/P2=0. Новая причинная проверка замены поколения до checkout дала 1 normal PASS и 1 fault FAIL на неизменном guard; независимое ревью приняло P1-R1. Отдельный проект Pool.close испытан и остановлен: требуемый active root временно неактивен при получении соединения; пробный runtime diff сохранён вне дерева и отменён. Исправленный независимый проект истории root принят; callback использует public AUTOBEGIN/revoke и отдельный witness, сохраняя list3 lease. Реальные Session события и partial rollback проверены; после исправления всех3 замечаний независимое scoped ревью реализации PASS, P1/P2=0. Полный текущий unit257 PASS, native normal/fault2 PASS для client EOF/prevented wait с исходным2s и same-pool F/P; общий PostgreSQL профиль294 PASS без пропусков. Приёмка ограничена idle precheckout Pool.close сценарием, не всеми исходами закрытия соединений. Рабочего включения и выпуска нет. Обычный close/TLS/pool reset, остальные исходы commit и полная HTTP-очистка ещё не приняты"
  - "Подтверждение источника и корректная подпись сами по себе не доказывают показ, действующий доступ или готовность хранения; полный набор проверок и выпускные ворота остаются открытыми"
  - "Внутренний приём пары перечитывает сессию, членство, устройство и выбранный результат под блокировками; проверен с подставленным периодом. Проверка показа из HTTP ещё не подключена, настоящий контекст периода отсутствует"
release_notes: "Будущий учёт просмотра сможет проверять завершённый приём записи, её владельца, собственную версию показанного текста и защиту от удаления. Закреплённые итоги сохраняют свою версию при более новой расшифровке. Подтверждение связано с текущей сессией и блоком, действует десять минут и не содержит текста встречи. Наблюдатель исключает скрытые и пустые блоки, фоновые документы, устаревшие ответы и повторы по таймеру. Запрос сохраняет только действующий выбор показанного результата; повторные и пустые значения разбираются как при открытии страницы. Подтверждённое отсутствие локального захвата передаётся как false, неизвестное значение не включается в событие. Этот срез не включает сбор и не подтверждает новые визиты или активации"
