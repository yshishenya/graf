schema_version: 1
feature_id: 273
category: Security
summary: "Публичная аналитика повторно проверяет актуальное основание перед отправкой"
issue: 7696
tasks: [T106]
compatibility: "Рабочие флаги и редакция согласия не меняются; public путь требует читаемого валидного реестра, отсутствие файла закрывает передачу"
known_limitations:
  - "Настоящая сетевая остановка внешнего счётчика, серверное обновление разрешения активной вкладки, полный T106, измерение и T0 ещё не приняты"
release_notes: "Общее свежее решение применяется к контексту страницы, приёму события и доставке. Сохранённый выбор посетителя сверяется перед управляемыми отправками и при возврате вкладки; старое уведомление не восстанавливает отозванное согласие. Дополнительная проверка PostHog сохранена; ошибки аналитики не останавливают продукт"
