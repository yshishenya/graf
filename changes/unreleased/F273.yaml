schema_version: 1
feature_id: 273
category: Fixed
summary: "Дамп БД и контрольные количества резервной копии получают из одного снимка PostgreSQL"
issue: 7804
tasks: [T113]
compatibility: "К существующему postgres.dump добавлены закрытые schema.sql, inventory.jsonl и checksums.sha256; действующий способ восстановления дампа сохранён"
release_notes: "Штатные psql и pg_dump используют один экспортированный снимок для дампа, схемы, полного счёта таблиц и состояний первых вех. До записи успешного результата проверяются контрольные суммы скопированных файлов. Недостаточные права, неправильная БД, ошибка выгрузки и повреждение копии запрещают успешный результат"
known_limitations:
  - "Полученные метаданные сами по себе не подтверждают восстановление, удаление, карантин доставки или готовность первого локального периода"
  - "Роли не входят в обычный pg_dump: сохранены только их безопасные характеристики для последующего сравнения, без паролей"
  - "Рабочая установка, включение аналитики, IP и получателей этим срезом не выполняются"
