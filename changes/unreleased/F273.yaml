schema_version: 1
feature_id: 273
category: Fixed
summary: "Исправлена проверка сохранённого выбора аналитики при возврате на страницу"
issue: 7696
tasks: [T106]
compatibility: "Схема данных, API и прежние настройки согласия не меняются."
release_notes: >-
  Страница не дублирует проверку сохранённого выбора при загрузке и возврате
  из кэша. Пока выбор не подтверждён, необязательный сбор выключен.
  Если сохранение было прервано, страница предлагает явный повтор или открытие
  настроек; поздний ответ не возобновляет прерванное действие.
known_limitations:
  - "Рабочее включение аналитики, внешний счётчик и остальная T106 требуют отдельной приёмки."
