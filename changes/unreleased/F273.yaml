schema_version: 1
feature_id: 273
category: Fixed
summary: "Подготовить безопасное локальное измерение и остановку служб перед восстановлением"
issue: 7804
tasks: [T113]
compatibility: "Проверка восстановления требует закрытый полный комплект с inventory формата 2 и контрольными суммами. Старые комплекты сохраняются, но новую проверку не проходят. Сохранённая revision должна быть известна в линейной цепочке начиная с 0106 и совпадать с восстановлением, но не обязана быть текущим head проверяющего checkout. Восстановление сохраняет владельцев объектов и создаёт отдельную временную БД для разбора исходной схемы"
release_notes: "Штатные psql и pg_dump используют один экспортированный снимок для дампа, схемы, полного счёта таблиц и состояний первых вех. После восстановления сверяются схема, права, ограничения, количества и состояния доставки. Одноразовый процесс в собственной учебной БД помещает неподтверждённую доставку в карантин и повторяет точные удаления по актуальным явным решениям с ответственным и сроком. Карантин и удаления выполняются одной транзакцией с отдельным чтением результата; неизвестный исход сохранения и ошибка очистки не дают успеха. Повреждённый реестр запрещает запись аналитики, сохраняя обычную работу продукта"
known_limitations:
  - "Подготовлен закреплённый запуск оператора из точного Git-коммита с общим замком выпуска и проверкой всех файлов пакета. Отмена и очистка процессов не разрешают продолжение. Полная предварительная проверка и рабочие операции ещё не подключены: подготовка всегда заканчивается запретом допуска"
  - "Повтор удалений принимает только собственный учебный источник и временную UUID-цель. Полнота текущего состояния, верхний оператор остановки служб, рабочее восстановление, неизвестный интервал после копии и готовность первого локального периода требуют дальнейшей реализации"
  - "Роли не входят в обычный pg_dump: сохранены только их безопасные характеристики для последующего сравнения, без паролей"
  - "Подготовлен local_only без внешних намерений: оба HTTP-формата и серверный вход используют общий учёт, свежая проверка режима/настроек сохраняется. Доверенный recovery verifier ещё не подключён, рабочий допуск закрыт"
  - "Рабочая установка, включение аналитики, IP и получателей этим срезом не выполняются"
  - "Файловая блокировка подключена к общему приёму событий до создания DB-сессии и удерживается до её полного закрытия, включая повторную отмену запроса. SQL-приём использует общий замок до блокировки аккаунта. Проверка доверенной готовности ещё не подключена; рабочий допуск остаётся закрытым"
  - "Начало локального измерения определено одним фиксированным T0 для новых аккаунтов. Подготовлены сверка текущих версии/образа/базы/схемы и проверка серверной даты создания аккаунта; безусловный запрет до доверенной проверки восстановления сохранён"
  - "Подготовлены внутренние шаги остановки служб, PostgreSQL drain и контролируемого экспорта с проверкой всех сессий, подтверждённым limit0 и безопасной отменой. Однократный marker запрещает заменить потерянный initial новым T0. Верхний оператор восстановления ещё не реализован; готовность и рабочий T0 не создаются"
  - "Внутренняя репетиция удерживает временные БД и объекты до повтора удалений и нового чтения сохранённого результата. Проверяются все байты объектов и завершение процессов внутри контейнера; неизвестное состояние сохраняет используемые данные и запрещает готовность. Подключение штатного входа и полный рабочий оператор остаются впереди"
  - "Внутренняя стадия согласованной копии связывает native snapshot БД с полным чтением объектов до и после копирования, проверяет текущее покрытие удалений и сохраняет журнал каждой попытки. Успех требует очистки, подтверждения записи каталога и manifest на диск; рабочий initial и верхний оператор остаются впереди"
  - "Подготовлена физическая проверка двух полных копий и последней попытки по журналу: типы, байты, native metadata, неизменность выбранных каталогов и срок менее 26 часов. Она не создаёт рабочую готовность; верхний оператор, ротация и рабочая приёмка ещё открыты"
