schema_version: 1
feature_id: 273
category: Fixed
summary: "Репетиция восстановления сверяет каждый восстановленный объект с исходной копией до удаления временной корзины"
issue: 7804
tasks: [T113, T116]
compatibility: "Без миграций, новых служб и изменения аргументов планового запуска; требуется закреплённый образ rec-api с существующим MinIO SDK"
known_limitations: ["Проверка доказывает совпадение наблюдаемой копии, но не полноту её первоначального создания", "Неизвестное завершение контейнера или очистки оставляет отказ и временные ресурсы для разбора", "Реальные копии, полная готовность аналитики и T0 требуют отдельной приёмки; удаления резервных копий нет"]
release_notes: "После копирования в собственную временную корзину штатная репетиция перечитывает точный перечень объектов и каждый байт, сравнивает размеры и SHA256, повторно проверяет источник и неизменность закрытого манифеста. Проверяющий контейнер запускается из действующего закреплённого образа с доступом только для чтения. Общий срок чтения ограничен, очистка имеет отдельный невозобновляемый срок; сигналы и неизвестный исход не дают успешного результата. Корзина не удаляется до подтверждения завершения проверяющего контейнера. Исходные комплекты и рабочие данные сохраняются."
