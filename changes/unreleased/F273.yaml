schema_version: 1
feature_id: 273
category: Fixed
summary: "Проверять резервную копию и повторять точные удаления в учебной восстановленной БД"
issue: 7804
tasks: [T113]
compatibility: "Проверка восстановления требует закрытый полный комплект с inventory формата 2 и контрольными суммами. Старые комплекты сохраняются, но новую проверку не проходят. Сохранённая revision должна быть известна в линейной цепочке начиная с 0106 и совпадать с восстановлением, но не обязана быть текущим head проверяющего checkout. Восстановление сохраняет владельцев объектов и создаёт отдельную временную БД для разбора исходной схемы"
release_notes: "Штатные psql и pg_dump используют один экспортированный снимок для дампа, схемы, полного счёта таблиц и состояний первых вех. После восстановления сверяются схема, права, ограничения, количества и состояния доставки. Одноразовый процесс в собственной учебной БД помещает неподтверждённую доставку в карантин и повторяет точные удаления по актуальным явным решениям с ответственным и сроком. Карантин и удаления выполняются одной транзакцией с отдельным чтением результата; неизвестный исход сохранения и ошибка очистки не дают успеха. Повреждённый реестр запрещает запись аналитики, сохраняя обычную работу продукта"
known_limitations:
  - "Повтор удалений принимает только собственный учебный источник и временную UUID-цель. Полнота рабочей истории, остановка всех пишущих служб, рабочее восстановление, неизвестный интервал после копии и готовность первого локального периода требуют дальнейшей реализации"
  - "Роли не входят в обычный pg_dump: сохранены только их безопасные характеристики для последующего сравнения, без паролей"
  - "Подготовлен local_only без внешних намерений: оба HTTP-формата и серверный вход используют общий учёт, свежая проверка режима/настроек сохраняется. Доверенный recovery verifier ещё не подключён, рабочий допуск закрыт"
  - "Рабочая установка, включение аналитики, IP и получателей этим срезом не выполняются"
  - "Файловая блокировка подключена к общему приёму событий до создания DB-сессии и удерживается до её полного закрытия, включая повторную отмену запроса. SQL-приём использует общий замок до блокировки аккаунта. Проверка доверенной готовности ещё не подключена; рабочий допуск остаётся закрытым"
