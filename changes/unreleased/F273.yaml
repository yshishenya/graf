schema_version: 1
feature_id: 273
category: Fixed
summary: "Подготовлены общая проекция текста, проверка происхождения результата и короткое подтверждение для достоверного учёта просмотра"
issue: 7698
tasks: [T112]
compatibility: "Построитель требует явный bool или неизвестное значение. Renderer и подготовка подтверждения используют общий выбор текста; проверка источника использует существующие таблицы приёма и критерий готовности. Рабочие вызовы source/proof ещё не подключены. Каталог событий, старые payload, текст и оформление сохраняются"
known_limitations:
  - "T112 не завершена: выдача подтверждения для блока, наблюдение browser/native, защищённый POST и общая T113 ещё не подключены; рабочее измерение остаётся закрытым"
  - "Подтверждение источника и корректная подпись сами по себе не доказывают показ, действующий доступ или готовность хранения; полный набор проверок и выпускные ворота остаются открытыми"
release_notes: "Будущий учёт просмотра сможет проверять завершённый приём записи, её владельца, собственную версию показанного текста и защиту от удаления. Закреплённые итоги сохраняют свою версию при более новой расшифровке. Подтверждение связано с текущей сессией и блоком, действует десять минут и не содержит текста встречи. Подтверждённое отсутствие локального захвата передаётся как false, неизвестное значение не включается в событие. Этот срез не включает сбор и не подтверждает новые визиты или активации"
