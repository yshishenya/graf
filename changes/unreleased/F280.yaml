schema_version: 1
feature_id: 280
category: Changed
summary: "Управление подпиской упрощено: тариф, срок и понятное продление без лишних предупреждений."
issue: 7503
tasks: [T046, T047, T048, T049, T050, T051, T057]
compatibility: "Без миграций и изменений платежных API, согласий или денежных обработчиков. Раскрытие сведений доступно без JavaScript."
release_notes: "На странице подписки сразу видны тариф, срок оплаты и автопродление. Доступна заметная кнопка продления, дополнительные условия раскрываются по запросу. Убрано ложное предупреждение при отсутствии карты; при ожидающем платеже предлагается проверка его результата. Пробный период отображается по действующему тарифу. История прямо названа в дополнительных сведениях; проверка карты остается доступной при незавершенной операции, а истечение ключа само по себе не меняет правила нового оформления. Любой неподтвержденный платеж описывается нейтрально, без утверждения отправки."
known_limitations: ["Частный экран пользователя, банковское зачисление, возврат, реальное автоматическое продление и человеческая приёмка остаются отдельными проверками."]
