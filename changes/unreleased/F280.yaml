compatibility: "Платёжные расчёты, цены, подписки и серверное подтверждение покупки сохранены. Новые чеки продления используют текущую подтверждённую почту плательщика; при её отсутствии сохранён прежний выбор из оплаченного счёта. Старые документы не меняются. Новых зависимостей и схемы данных нет."
