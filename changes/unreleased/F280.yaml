summary: "Отключение автопродления и его условия видны целиком без JavaScript на узком экране при увеличении."
issue: 7614
tasks: [T069, T070]
compatibility: "Без миграций, изменения цен, согласий, API или платежных обработчиков. Изменения хранения и новых чеков из предыдущего среза сохранены."
release_notes: "Исправлена базовая мобильная сетка без JavaScript: кнопка отключения автопродления и последствия видны целиком при увеличении до 200%. Предварительное действие выбора объема называется «Проверить изменение» для увеличения и уменьшения. Сетка карточки не растягивается минимальной шириной формы, длинная подпись кнопки подписки переносится. Скрытие боковой панели ограничено кабинетом: административная навигация остается доступной на узких экранах."
known_limitations: ["Агентные и синтетические проверки не заменяют человеческую приемку, установленный GRAF Dev, банковское зачисление, возвраты и настоящее автоматическое продление."]
