release_notes: "В переключателе периода текст естественно переносится внутри доступной ширины. Сумма годовой экономии сохраняется полностью; обе кнопки оформления и ссылки выбора периода доступны с клавиатуры. На страницах оплаты и подписки обычное активное автопродление сопровождается коротким пояснением первой попытки за 3 дня до конца оплаченного срока. Пояснение связано с той же будущей датой первой попытки; при пропущенном окне, повторной попытке, ожидании результата или приостановке оно не показывается. Денежная сумма в кнопке оформления сохраняется целиком, остальные слова естественно переносятся. Связанные issues: #7659, #7661, #7664, #7671."
