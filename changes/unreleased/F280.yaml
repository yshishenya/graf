schema_version: 1
feature_id: 280
category: Fixed
summary: "Повторное оформление оплаты и сообщение о чеке используют действительный статус платежа."
issue: 7597
tasks: [T062, T063, T064, T065]
compatibility: "Без миграций, изменения цен, согласий или платежных API. Существующий платеж и его условия сохраняются; кнопки копирования появляются после подключения JavaScript."
release_notes: "Завершенный или неподтвержденный платеж открывает свой статус в GRAF вместо старой страницы провайдера. Сообщение об ошибке проверки чека подтверждает оплату только для действительно оплаченного счета. Без JavaScript номер платежа, адрес поддержки и ссылка приглашения остаются доступны для ручного копирования, а неработающие кнопки скрыты."
known_limitations: ["Проверки установленного GRAF Dev, понятности с участниками, банковского зачисления, возвратов и реального автоматического продления остаются отдельными этапами приемки."]
