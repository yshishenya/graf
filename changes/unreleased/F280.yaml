schema_version: 1
feature_id: 280
category: Fixed
summary: "Промокод и выбранный период оплаты сохраняются после обновления страницы и возврата к оформлению в течение пяти минут."
issue: 7366
tasks: ["T016", "T017", "T018", "T019"]
compatibility: "Цены, согласия и правила оплаты сохраняются. Миграции данных и обновление macOS-приложения не требуются; старое неподписанное состояние промокода не переносится."
release_notes: "Обновление оформления больше не убирает примененную скидку. Ошибочный код остается в поле для исправления; смена периода сохраняет ввод. Старые вкладки и просмотр истории не сбрасывают актуальный выбор. Период из страницы тарифов сохраняется и после отказа оформления. Итоговая цена проверяется заново перед оплатой."
known_limitations: ["Сохранение выбора ограничено пятью минутами и текущей сессией.", "Реальные платежи, чеки, банковское зачисление и возвраты F278 требуют отдельной финансовой приемки.", "Рост конверсии и удержания требует наблюдения за реальными пользователями."]
