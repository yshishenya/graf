schema_version: 1
feature_id: 280
category: Fixed
summary: "После оплаты GRAF автоматически показывает подтвержденный результат и оплаченный доступ."
issue: 7473
tasks: ["T029", "T030", "T031", "T032", "T033", "T034", "T035", "T036", "T037"]
compatibility: "Без новых API, зависимостей и миграций. Существующая очередь обработки платежей перенесена в службу с правильными правами базы; защита данных, сумма и повторяемость обработки сохранены. Обычная форма проверки работает без JavaScript."
release_notes: "Исправлена причина, по которой подтвержденный ЮKassa платеж оставался в ожидании и не предоставлял доступ. После возвращения страница проверяет существующий платеж без перезагрузки и показывает «Оплачено», сумму, оплаченный срок и кнопку «К встречам». Проверка ограничена по времени и числу попыток. При задержке или ошибке понятно, как обновить результат; повторно платить не нужно. Старая форма больше не открывает уже завершенную оплату."
known_limitations:
  - "При недоступной ЮKassa результат может потребовать более поздней проверки. Успех показывается только после подтверждения оплаты и предоставления доступа."
  - "Банковское зачисление, возврат, автоматическое продление и приемка людьми проверяются отдельно."
