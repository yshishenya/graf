schema_version: 1
feature_id: 290
category: Ops
summary: "Проверки GitHub Actions переведены на поддерживаемый Node24 с сохранением обязательных проверок и квитанций."
issue: 6501
tasks: [T001, T002, T003, T004, T005, T014, T015]
compatibility: "Node приложения остаётся 22.22.3; Swift остаётся 6.0.3, но используется Apple toolchain Xcode16.2 вместо Swift.org. SDK не переключается, кэш компилятора отделён. ZIP и имена артефактов сохранены. Проверочный инструмент читает argv через Foundation ProcessInfo для совместимости с concurrency-проверкой Apple Swift6.0.3. Два обращения к MainActor-методам через Optional.map используют явные синхронные замыкания с прежними проверками и текстом."
known_limitations:
  - "Настоящая hosted сборка и три exact-SHA PR проверки обязательны после разрешённого commit."
  - "macos-14 отключается 2026-11-02; перенос на другой image требует отдельного исследования и приёмки."
  - "Сохранённое изменение backup и четыре post-deploy сценария остаются открытыми; CI-срез не закрывает всю F290."
release_notes: "Шесть официальных Actions закреплены точными проверенными commits Node24. Убраны три Node20 setup-swift: установленный Swift проверяется до использования; неправильная версия, ошибка команды или изменение SDK останавливают шаг."
