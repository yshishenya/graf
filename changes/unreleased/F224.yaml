schema_version: 1
feature_id: 224
category: Fixed
summary: "Принадлежность GRAF Dev проверяется по GitHub origin и явной машинной привязке с сохранением прежнего состояния и блокировки."
issue: 6180
tasks: [T002, T003, T004, T005, T006, T007]
compatibility: "Перед первыми общими операциями нужен согласованный adopt-state. Данные, manifests, пути и прежний promote.lock не переносятся. Неподтверждённая принадлежность и несовместимый закреплённый resolver дают отказ."
known_limitations:
  - "Изолированные проверки не являются принятием занятого GRAF Dev; реальный adopt-state пока не выполнялся."
  - "Обычное аварийное продвижение, фактический полный runtime, живой rollback и сохранение разрешений имеют отдельные незавершённые задачи F224."
  - "Произвольный старый controller не знает новой привязки: его самостоятельные jobs исключаются оператором до принятия состояния."
release_notes: "Рабочие копии одного origin используют один принятый каталог без смены inode блокировки. Ошибки Git, credentials, неоднозначные адреса и небезопасные пути отклоняются. Искусственные файловые проверки не управляют приложением или общими Docker tags. Выпуск и общая приёмка F224 ещё не завершены."
