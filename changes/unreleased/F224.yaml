schema_version: 1
feature_id: 224
category: Fixed
summary: "GRAF Dev сохраняет материалы восстановления и принимает один управляющий root без присвоения соседних архивов"
issue: 7641
tasks: [T009, T010]
compatibility: "Сохраняются существующие команды, каталог состояния, блокировка и путь единственного GRAF Dev; старое неопределённое состояние не принимается автоматически"
known_limitations:
  - "Изолированная проверка T010 не заменяет живую приёмку компонентов, отката и разрешений T009/T011/T012"
  - "Переход схемы использует существующее восстановление F249, без нового механизма миграций"
  - "T009/#7640 остаётся открытой до реальной проверки одного Dev, всех служб и отказа при остановке обязательной службы; сохранённые неизвестные архивы не используются"
  - "Принятие по плану классификации требует уже существующие безопасные блокировки всех управляющих состояний; отсутствие блокировки даёт отказ без её создания"
release_notes: "После аварийного завершения переключения или отката стенд сообщает о необходимости восстановления. Копия предыдущего приложения сохраняется до проверки результата; повтор проверяет закреплённые версии, пакет и работающие компоненты. Другие операции не могут удалить материалы незавершённого восстановления. Явный полный план классификации позволяет сохранить невыбранные состояния и архивы на месте без присвоения; повторные снимки и прежние блокировки защищают принятие единственного управляющего состояния."
