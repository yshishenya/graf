schema_version: 1
feature_id: 224
category: Fixed
summary: "Незавершённое переключение GRAF Dev сохраняет материалы восстановления и требует проверенного повтора той же операции"
issue: 7641
tasks: [T010]
compatibility: "Сохраняются существующие команды, каталог состояния, блокировка и путь единственного GRAF Dev; старое неопределённое состояние не принимается автоматически"
known_limitations:
  - "Изолированная проверка T010 не заменяет живую приёмку компонентов, отката и разрешений T009/T011/T012"
  - "Переход схемы использует существующее восстановление F249, без нового механизма миграций"
release_notes: "После аварийного завершения переключения или отката стенд сообщает о необходимости восстановления. Копия предыдущего приложения сохраняется до проверки результата; повтор проверяет закреплённые версии, пакет и работающие компоненты. Другие операции не могут удалить материалы незавершённого восстановления."
