schema_version: 1
feature_id: 200
category: Changed
summary: "Windows GRAF: восстановление кабинета, нативных окон и безопасной локальной записи после синхронизации с master"
issue: 6641
tasks: [T070, T071, T080, T081, T082, T083, T084, T085, T086, T092]
compatibility: "Сохранён формат локальных записей v5 и чтение очереди v2. Реестр очереди обновлён до схемы v3: прежний файл читается и перезаписывается новой схемой при первой же записи, имя файла не меняется, поэтому очередь с неотправленными записями не теряется. Отметка времени строки добавляется при обновлении реестра и на поведение отправки не влияет. Время начала и окончания записи и смещение часового пояса добавлены в манифест необязательными полями: пакеты прежних сборок читаются как прежде и просто не сообщают время, миграция не нужна. Тело запроса на создание встречи расширено только теми полями, которые уже принимает сервер; новых требований к серверу нет. Режимы автозаписи сохраняются по постоянному ключу продукта в ApplicationRulesV2. Дорелизный V1 и глобальные настройки не читаются как разрешения и не удаляются; пустой прежний каталог не позволял сохранять реальные правила через UI. Изменений macOS и развёртывания сервера в этом срезе нет."
known_limitations:
  - "Запись каталога Windows привязана к точной сборке: Яндекс Телемост 2.42.4.9707 и Teams 26213.1006.5014.9784. Другая версия или архитектура требуют отдельной проверенной записи и сами в каталог не попадают."
  - "Живое срабатывание автозаписи не проверено: подписанное приложение встречи должно держать одновременно потоки воспроизведения и захвата, а в машине проверки Teams требует входа, и окно Телемоста не рисуется (x64-приложение под ARM64 через эмуляцию)."
  - "Задачи T087, T088, T089, T090, T091 (переносы удаления, сессии, уведомлений, оформления и моста настроек кабинета) имеют код в ветке, но отдельной живой проверки по ним не записано."
  - "Живое срабатывание автозаписи в тестовой машине не проверено: определитель доверяет только подписанному приложению встреч, а его в машине нет (T082)."
  - "Образа без среды разработки для проверки установки нет: доступна одна ВМ, а предустановленный Microsoft.WindowsAppRuntime.2 из-под пользователя не удаляется. Framework лежит рядом с MSIX и объявлен зависимостью."
  - "Ограниченная запись проверена модульными тестами: в ВМ нет рабочего микрофона, а системный звук на молчащем устройстве не даёт пакетов, поэтому живое подтверждение требует физического компьютера (T071)."
  - "Проверка установки на образе без среды разработки не выполнена: доступна одна виртуальная машина, и в ней есть и среда, и runtime. Проверено то, что решает исход: все импортируемые библиотеки лежат внутри пакета (распространяемый пакет Visual C++ app-local), framework-пакет Windows App SDK поставляется рядом с MSIX в Dependencies\\x64\\, а установка, обновление и откат проходят на текущем образе."
  - "Срок сессии из X-GRAF-Auth-Expires-At ставится на cookie кабинета, но на живом сервере это не проверено: нужен вход в аккаунт. Проверены разбор заголовка, правило переписывания и то, что значение доходит от рабочего полёта до кабинета."
  - "Удаление записей из кабинета на Windows включено: выбранные строки проверяются воротами страницы, сохраняются в реестре очереди и отправляются на сервер; принятым считается только запрос, который сервер назвал в квитанции. Перед первой отправкой читается контекст уведомлений, поэтому сервер без объявленной поддержки протокола не получает ни одного изменения, а кабинет сообщает, что запрос сохранён и ждёт."
  - "Отклонённый сервером запрос удаления не повторяется из кабинета: имя запроса выводится из цели и аккаунта, поэтому повтор после отказа не создаёт новый запрос (в macOS повтор получает новое имя). Пока это ограничение: запись, удаление которой сервер отклонил, остаётся видимой, и её удаление из кабинета не перезапускается."
  - "Файл реестра очереди сохраняет прежнее имя desktop-upload-queue.v2, хотя внутри уже схема v3: переименование осиротило бы очередь с неотправленными записями. Версия, которая имеет значение, записана внутри файла."
  - "Windows-каталог содержит только проверенный Microsoft Teams 26213.1006.5014.9784 ARM64. Другие версии и настоящее обнаружение встреч/фоновая автозапись ещё не приняты. Юридических условий старта больше нет; техническая готовность остаётся обязательной."
  - "Ручной сценарий в Parallels теперь прошёл до saved_local: Record/Pause/Resume/WebView reload/Stop, 960/960 и 988/988 обработанных/записанных блоков, reason_code=none. Это x64-приложение под эмуляцией Windows ARM64, а не доказательство физического x64, 60-минутной записи, качества AEC или сквозной отправки. Тихий сценарий без пригодного системного источника ожидаемо завершился endpoint_invalidated и не считается успешным стартом."
  - "Windows ARM64 в Parallels с x64-приложением не заменяет проверку физического x64-компьютера."
  - "Состав полей манифеста локального пакета на Windows отличается от macOS: имена в snake_case и сокращённый набор против 23 обязательных полей контракта. Отправку это не блокирует: сервер тело манифеста не разбирает, а сверяет sha256 дорожки manifest и проверяет роли дорожек и их параметры. Расхождение проявится только у инструмента проверки контракта macOS; сведение имён и состава полей — отдельная задача."
  - "Подтверждение серверной очистки локальных копий требует авторизации отдельной установки: сквозная проверка на настоящей задаче сервера не выполнена. Уровень реестра и упакованного приложения проверен — задача сопоставляется со строками по встрече, удаляются только копии, которые сервер уже считает своими, а подтверждается лишь доказанное (непроверяемый тип задачи не трогает файлы и отвечает local_purge_unverified)."
  - "Страница уведомлений кабинета доступна только для чтения: в Windows у приложения нет местных напоминаний о встречах, обратная связь о записи живёт в самом приложении. Адрес /desktop/settings/meeting-detection открывает нативное окно определения встреч, а не страницу кабинета: сервер такую страницу не отдаёт."
  - "Признак скрытых записей кабинету передаётся всегда false: macOS скрывает строки с недоступным жизненным циклом и объясняет это уведомлением, а Windows показывает строку с её причиной, поэтому уведомление было бы неправдой. Если Windows начнёт скрывать строки, значение обязано измениться вместе с поведением. Поле progressPercent в строке не передаётся: кабинет его не читает."
  - "Подтверждение очистки отправляется без чтения ответа по каждой задаче, в отличие от macOS: сбой сети оставляет задачу неотвеченной, и следующий проход повторяет ответ из записи в реестре. Доказанное удаление записывается до отправки, поэтому повторный вопрос получает тот же ответ."
  - "Первоначальная проверка аккаунта использует существующие /desktop/settings/spaces и /auth/me без изменения сервера. Контрактные тесты порядка запросов, отмены и принадлежности пройдены; сквозная отправка в настоящем кабинете ещё не подтверждена."
  - "MSIX собирается, подписывается отладочным сертификатом `CN=GRAF`, проходит статический smoke-тест, устанавливается и запускается из пакета. Причина прежнего отказа запуска устранена: полезная нагрузка собиралась как распакованное приложение и несла загрузчик рантайма Windows App SDK, который завершал процесс до точки входа; теперь полезная нагрузка пакета собирается без загрузчика. Обновление и откат версии проверены. Установка на образ без распространяемого пакета Visual C++ не подтверждена. Публичный подписанный выпуск не готовится."
  - "Порог короткой записи на Windows: запись короче 30 секунд канонического аудио не сохраняется только при нормальной остановке; прерывание и сбой захвата сохраняют фрагмент. Порог считается в 10-мс кадрах (3 000 кадров), а не в сырых отсчётах."
  - "Первая версия предназначена внешним клиентам. По Constitution 7 правовая политика пространства и подтверждения уведомления/согласия не блокируют запись; текст пользовательского соглашения отложен в отдельную задачу."
  - "Живая проверка кабинета ограничена: снимок настоящего окна подтверждает, что нативная оболочка и кабинет рисуются вместе, но содержимое страницы не читается ни деревом доступности (даже с принудительной доступностью), ни отладочным портом WebView2 (упакованные приложения не читают переменные среды), поэтому нажатие «Повторить загрузку» и действия внутри страницы остаются за ручной приёмкой. Нативная часть читается: четыре действия — «Назад в кабинете», «Вперёд в кабинете», «Открыть кабинет», «Встречи»."
  - "Оформление окна проверено в двух системных темах: оболочка берёт кисти из одного набора в двух палитрах по значениям кабинета, следует теме кабинета и задаёт `prefers-color-scheme` страницы явно. Светлая палитра применяется, когда кабинет объявит светлую тему или когда выбрана системная тема и система светлая; пока в кабинете тёмная тема, окно остаётся тёмным."
  - "Экран восстановления кабинета проверен живьём: при недоступном источнике показывается нативная карточка с безопасным кодом отказа, а нажатие «Повторить загрузку» возвращает кабинет в то же окно без перезапуска. Размер окна задаётся в логических точках и ставится при первой активации, поэтому на экранах с масштабом панель управления помещается целиком."
release_notes: >-
  Кабинет использует общий веб-интерфейс. Исправлены инициализация
  WinUI/WebView2, восстановление навигации, маршруты аккаунта и продолжение
  входа через провайдеров. Нативная часть содержит выбор микрофона, состояния и
  таймер, видимый индикатор, неблокирующий запуск/остановку и сохранение
  подтверждённой части прерванной записи. Закрытие приложения ждёт финализации;
  локальные действия и безопасная сводка имеют явный результат. Удалены
  неиспользуемые проекции, пустые тестовые проекты, фиктивные подтверждения
  удаления, устаревшие команды моста и синхронная отправка. По Constitution 7
  удалены отменённые условия правовой политики и согласия; техническая
  готовность, видимый индикатор и Stop сохранены. Автозапись не зависит от
  видимости главного окна; отдельный индикатор подготавливается скрытым.
  Слежение за окончанием встречи начинается с запуска записи, допускает смену
  процесса того же проверенного приложения и ограничивает потерю подтверждения
  десятью минутами. Настройки трёх режимов сохраняются по постоянному ключу
  продукта, а обнаружение проверяет точную идентичность программы. Исправлены
  явный повтор отправки после исчерпания попыток, ограниченное сетевое
  восстановление проверки аккаунта, продолжение очереди после перезапуска и
  замена истёкшей сессии без повторного использования старого ключа. Потерянный
  ответ о завершении больше не превращается в новую сессию для уже принятой
  ревизии: завершение распознаётся по состоянию встречи так же, как в macOS,
  поэтому элемент переходит в отправленные, а не исчерпывает повторы. Конфликты
  больше не повторяются вслепую: очередь действует по серверному классу повтора
  — вход при требовании действия пользователя, остановка автоматических попыток
  с понятной причиной при требовании администратора или исправления на
  компьютере, карантин при окончательном отказе. Локальная строка связывается с
  серверной встречей по сохранённому идентификатору, поэтому после отправки
  кабинет показывает серверную запись, а не отдельный элемент «На этом
  компьютере». Удаление записей из кабинета доведено до сервера и до локальных
  файлов: приложение читает объявленную поддержку протокола до первой отправки,
  хранит запросы в реестре очереди, повторяет ожидающие по расписанию и отвечает
  странице по квитанциям, а не по факту отправки. Копия, о которой сервер
  никогда не слышал, удаляется локально без запроса. Строка локальной записи
  получает время начала и префикс заголовка, поэтому кабинет показывает дату в
  часовом поясе читателя вместо «На этом компьютере». Для прерванной записи, у
  которой сохранился подтверждённый префикс, кабинет сообщает, сколько сохранено
  из всей длительности сессии. Кнопка уведомлений и переход к удалениям в
  кабинете снова работают: раньше эти страницы отклонялись политикой переходов.
  Ссылка «Обратиться в поддержку» открывает почтовую программу, если адрес
  прошёл проверку. Время записи больше не теряется: пакет хранит начало и
  окончание записи и смещение часового пояса, поэтому встреча получает понятное
  имя по местному времени начала и встаёт на своё место в списке, а не на момент
  отправки. WASAPI сохраняет точность QPC100ns; преобразование частоты ведёт
  непрерывную фазу, общая шкала проверяет порядок диапазонов и ограничивает
  коррекцию 48 кадрами. Event-driven worker использует GetNextPacketSize, а
  bounded queue отделяет WASAPI callback от timeline/AEC3/writer; переполнение и
  сбой worker завершают запись fail-closed. Удалены неработающие настройки
  ожидания восстановления звука. Только первый непустой пакет с точным флагом
  начального разрыва может быть освобождён без чтения звука; повторный разрыв
  остаётся отказом. Готовность наступает после нормализованных данных, срок
  запуска остаётся пять секунд. Добавлены раздельные типизированные причины и
  фактические счётчики этого отбрасывания без изменения форматов v2/v5.
  Окончательные исходники прошли 22 переносимых теста из 22 и сборку решения
  MSBuild; четыре аудио- и диагностические проверки дополнительно прошли
  контроль памяти/неопределённого поведения. Новое приложение собрано и запущено
  в Parallels, панель раскрыта через UIA. Контролируемые сценарии
  Record/Pause/Resume/WebView reload/Stop завершились локальным сохранением с
  reason_code=none; состояние микрофона восстановлено. Это не подтверждает
  60-минутную запись, все окна, authenticated upload, подписанный пакет,
  физический x64 или внешний выпуск. Упакованное приложение больше не
  завершается до точки входа: полезная нагрузка MSIX собирается без загрузчика
  рантайма Windows App SDK, запускается из установленного пакета, проходит
  обновление и откат версии. Полоса WebView2 дополнена регрессиями состояния,
  отказа, повтора и навигации. Проверки репозитория для WebView2 и
  аудиоконтракта пройдены на стенде, идентичность AEC3 подтверждена по пину.
  Новая часть: ответ 429 с заголовком `Retry-After` больше не превращается в
  немедленный повтор. Клиент читает паузу, не начинает попытку раньше срока и не
  расходует на ожидание лимит автоповторов: ожидание, которого потребовал
  сервер, не должно приближать запись к исчерпанию бюджета. Нечитаемое значение
  даёт 60 секунд, как в macOS, пауза длиннее суток не удерживается, а сетевой
  сбой, 408 и 5xx идут прежним путём. Подтверждение аккаунта больше не
  повторяется на каждую попытку отправки: оболочка подтверждает текущего
  пользователя и рабочее пространство для текущей сессии и передаёт этот снимок
  в полёт. Снимок не является полномочием сам по себе — он должен описывать
  настоящий аккаунт и совпадать с рабочим пространством, с которым едет, а смена
  токена сессии стирает его до начала любой отправки. Добавлен контракт удаления
  записи: перед любой мутацией приложение читает ворота протокола и требует
  версию 1, а цель запроса объявляет заголовками ожидаемого аккаунта и рабочего
  пространства. Запрос не уходит вовсе, если область не описывает настоящий
  аккаунт: сервер прочитал бы его как запрос без области. Пути, тела запросов и
  разбор ответов сняты с контракта сервера и проверяются регрессией, которая
  считает и локальные отказы. Само удаление из кабинета и подтверждение очистки
  локальных копий ещё не включены: мост удаления не выставляет свою версию
  раньше настоящей серверной операции. Добавлен контракт задач очистки локальных
  копий: сервер просит устройство удалить локальные копии уже удалённой встречи
  и ответить тем, что удалось доказать. Задача адресуется встречей, читается
  списком и подтверждается по идентификатору; понимаются только типы и
  состояния, которые сервер действительно присылает, а доказательство берётся из
  словаря клиента. Адрес из ответа сервера не используется как цель запроса —
  путь всегда строится из проверенной личности задачи. Страницы настроек
  кабинета работают: автозапись читается и сохраняется через то же хранилище,
  что у нативного окна настроек, а страница уведомлений честно показывает, что
  местных напоминаний о встречах в Windows нет. Тема кабинета решает оформление
  окон: приложение узнаёт выбранную в кабинете тему тем же объявлением, что и
  macOS, и следует ей вместо жёсткой тёмной темы. Кабинет видит состояние
  удаления: вместе со строками ему передаются удаления в работе и признак
  локальной записи, поэтому панель «Удаления» показывает, что запрос сохранён и
  ждёт сервера, а диалог удаления прямо говорит, какие записи ещё не
  отправлялись на сервер. Удаление, прерванное до переноса файлов в Корзину,
  доводится до конца в обычном проходе восстановления. Задачи очистки локальных
  копий выполняются: приложение читает список задач, запрашивает недостающие по
  подтверждённому удалению, удаляет локальные копии тем же безопасным путём, что
  и подтверждённое пользователем удаление, и отвечает серверу тем, что удалось
  доказать. Мост удаления из кабинета собран и проверен: приложение принимает
  тот же запрос, что и macOS (версия 1, действие `deleteSelection`,
  идентификатор запроса в форме UUID, от одной до ста целей, встречи только как
  UUID), берёт для локальной записи каталог, который знает сервер, и отвечает
  только на ту страницу, которая спросила. Мост выставляется странице вместе с
  исполнителем: версия 1 объявляется только тогда, когда приложению есть что
  сохранить и что удалить, поэтому удаление встречи больше не идёт обходным
  путём. Приложение читает контекст уведомлений перед первой отправкой и без
  объявленной поддержки протокола не меняет ничего на сервере, а копию, о
  которой сервер не знает, удаляет на месте без запроса. Когда сервер удалил
  встречу, он просит это устройство убрать её локальные копии: приложение
  сопоставляет задачу со строками очереди только по встрече, которую вернул сам
  сервер, удаляет лишь те копии, которые сервер уже считает своими, и
  подтверждает только доказанное. Тип задачи, который клиент не может проверить,
  не трогает файлы и честно сообщает, что очистка не подтверждена. Доказанное
  удаление записывается в реестр раньше ответа, поэтому потерянный ответ не
  превращает выполненную очистку в неудачу. Реестр очереди обновлён до схемы
  `v3`: у каждой строки появилась отметка времени, у документа — своя, а запросы
  удаления хранятся в реестре и переживают перезапуск. Запрос хранится один раз
  на цель и аккаунт, и его имя выводится из них, поэтому повтор после
  перезапуска остаётся для сервера той же операцией. Принятие удаления
  записывается только вместе с квитанцией, назвавшей именно эту цель, а
  состояние ведёт себя монотонно: принятое удаление может стать только
  подтверждённым. Реестры прежней схемы по-прежнему читаются и обновляются,
  поэтому незавершённая отправка не теряется. Строка реестра очереди хранит
  отпечаток того, что сказал сервер: идентификатор принятой медиаревизии,
  идентификатор сессии загрузки и состояния встречи, обработки и ревизии. После
  перезапуска приложение знает это без нового запроса, а негодное значение
  отвергается, не портя файл. Срок сессии из `X-GRAF-Auth-Expires-At` больше не
  теряется: приложение читает его тем же правилом, что и macOS, и ставит на
  cookie кабинета, поэтому кабинет не просит вход раньше, чем истекает сессия на
  сервере. Переписывание отклоняется, если значение cookie уже другое, токена
  нет или срок в прошлом. Пакет стал самодостаточным: распространяемый пакет
  Visual C++ лежит внутри пакета рядом с приложением, а framework-пакет Windows
  App SDK поставляется рядом с MSIX, поэтому на чистом образе Windows не нужно
  ничего доустанавливать. Установка, обновление и откат проходят на текущем
  образе. Изменения находятся в проверке; этот фрагмент не разрешает публикацию.

release_notes_round25: |
  Доступ к микрофону и причины отказа. Приложение больше не считает запрет
  доступа исправным состоянием: согласие на микрофон читается по имени семейства
  пакетов, поэтому после ответа «No» в системном запросе запись не начинается, а
  панель «Запись» показывает «Разрешите доступ к микрофону в настройках Windows»
  и кнопку «Разрешить микрофон» с переходом в системные настройки. У каждой
  причины отказа теперь свой текст и следующий шаг: отказ в доступе, недоступное
  устройство, нехватка места, сбой кодирования, переполнение очереди и сбитые
  часы объясняются разными словами вместо одной общей фразы. Отказ микрофона
  больше не обрывает запись: системный звук продолжает писаться, сессия
  помечается ограниченной, а причина едет вместе с записью — так же ведёт себя
  macOS. Проверено портируемой полосой (30/30) и живьём в ВМ «Windows 11»:
  запрет доступа, диалог разрешений, переход в системные настройки и возврат в
  готовое состояние.

release_notes_round26: |
  Знак GRAF теперь стоит в заголовке каждого окна приложения, а не только
  главного: окна настроек, автозаписи и полосы записи больше не показывают
  системный значок-заглушку. Интерфейс пройден живьём в тёмной теме: кабинет с
  боковой панелью и без неё, уведомления, меню владельца и окно настроек
  выглядят цельно, а оформление берётся из выбора в кабинете («Вид»), система
  решает только при значении «системная».

  Установка, обновление и откат пакета проверены обычным путём. Пакет ставится на
  машину без приложения, обновляется до новой версии с сохранением данных и
  пользовательских настроек, а возврат на прежнюю версию делается удалением и
  установкой. Отдельно проверено, что обновление не проходит, пока приложение
  запущено, и что понижение версии поверх более новой отклоняется системой.

release_notes_round27: |
  Отказ любого источника теперь ограничивает запись, а не обрывает её, — так же
  ведёт себя macOS. Если отказал системный звук, запись продолжается с
  микрофоном, а человек читает «Системный звук недоступен. Проверьте устройство
  воспроизведения в параметрах Windows»; если отказал микрофон, запись
  продолжается с системным звуком. Общая фраза «устройство звука отключилось»
  больше не скрывает, что именно чинить. Запись обрывается только тогда, когда
  писать нечем: оба источника отказали или ни один не успел дать звук за срок
  запуска.

release_notes_round30: |
  Меню значка в области уведомлений теперь в палитре приложения: фон, текст,
  разделители и подсветка берутся из тех же кистей, что и окна, поэтому меню не
  выглядит светлым чужеродным пятном на тёмном окне. Тема приходит тем же
  решением, что и у окон, и меняется вместе с оформлением кабинета.

release_notes_round30_theme: |
  Проверено «во всех темах»: светлое оформление снято целиком — страница, рельс,
  панель записи, заголовок окна и полосы прокрутки. Найдено расхождение: смена
  темы внутри кабинета меняет страницу, но не оболочку; окно подхватывает тему
  только после перезагрузки. Дефект открыт как T084.

release_notes_round31: |
  Живое переключение оформления в кабинете теперь доходит до окна: объявление
  `app_appearance` не проходило проверку моста и молча терялось, поэтому смена
  темы меняла страницу, но не окно, пока не нажата перезагрузка. Команда
  добавлена в список разрешённых, поведение закреплено проверкой конверта.
  Дополнительно приложение ведёт короткий журнал моста (имена команд и причины
  отказа) — он помог найти причину и остаётся для диагностики.

release_notes_round32: |
  Проверено живьём поведение без сети: кабинет не открывается, но приложение
  показывает собственную поверхность — нативная запись и локальная сохранность
  работают отдельно от страницы, отказ назван безопасным кодом без адресов и
  внутренних подробностей, а «Повторить загрузку» возвращает кабинет после
  восстановления сети без перезапуска приложения.

release_notes_round32_progress: |
  Строка локальной записи теперь несёт прогресс отправки: кабинет показывает
  «Отправляется · N %», как в macOS. Прогресс считается из принятых сервером байт
  и веса дорожек локального пакета, а при неизвестном весе поле не отправляется
  вовсе — ноль процентов выглядел бы как «ничего не отправлено».

release_notes_round33: |
  Заголовки окон приложения теперь в оформлении GRAF: системная светлая полоса
  над тёмным окном настроек убрана, цвет заголовка, его текста и рамки берётся из
  палитры приложения. Приложение также ведёт короткий журнал оформления, по
  которому видно, какое объявление кабинета получено и какое решение принято.

release_notes_round34: |
  Оформление окон проверено в обеих темах: окно настроек, его заголовок и меню
  значка в области уведомлений совпадают с кабинетом и на светлой, и на тёмной
  теме, а живое переключение темы подтверждено журналами обеих сторон. Ранний
  выход из пересборки палитры убран: кэш «тема не менялась» мог разойтись с тем,
  что видно на экране.

release_notes_round35: |
  Закрытие окна больше не делает приложение недоступным: окно скрывается, а
  приложение остаётся в значке области уведомлений, как в macOS, и пункт
  «Открыть GRAF» возвращает то же окно. Раньше окно уничтожалось, а значок
  оставался без действия. Настоящий выход по-прежнему закрывает приложение.

release_notes_round36: |
  Возврат окна из значка области уведомлений проверен живьём: закрытие окна
  скрывает его, приложение остаётся в значке, щелчок по значку возвращает то же
  окно. Настоящий выход по-прежнему закрывает приложение.

release_notes_round37: |
  Настройки автозаписи проверены живьём: три режима («Всегда», «Спрашивать»,
  «Никогда»), отдельная настройка для Teams, выбор сохраняется между открытиями
  окна. Срабатывание автозаписи требует настоящего подписанного приложения встреч:
  определитель сверяет отпечатки исполняемого файла и издателя и не доверяет окну
  с похожим заголовком — это намеренное свойство, как и в macOS.

release_notes_round38: |
  Нативные окна и действия сверены с macOS по доказательствам и закрыты:
  читаемые настройки в обеих темах, двустороннее сворачивание через значок,
  навигация, микрофон, состояния с таймером и пауза/продолжение/остановка,
  recovery без сети, очередь без заглушек. Действия кабинета тоже проверены
  живьём, включая действие панели, которое открывает нативное окно настроек.

release_notes_round39: |
  Сквозная проверка собранного пакета: портируемая полоса 30/30, полосы приложения
  и пакета зелёные, установка из свежего пакета, запуск, настройки из панели и
  переключение темы из кабинета через страницу «Аккаунт» → «Тема» в обе стороны.
  Окно и страница меняют оформление вместе.

release_notes_round40: |
  Пакет объявляет платформу Visual C++: без этого приложение, собранное с
  динамической библиотекой времени выполнения, не запустилось бы на машине без
  отдельно установленного распространяемого пакета, и установка об этом не
  предупредила бы. До правки установленный пакет объявлял только платформу
  Windows App Runtime, после — обе.

release_notes_round41: |
  Каталог проверенных приложений Windows вырос до двух записей: добавлен Яндекс
  Телемост с постоянным ключом из общего продуктового каталога и точными хешами
  установленной сборки 2.42.4.9707 (подпись YANDEX LLC подтверждена). Настройки
  показывают новую строку. Тогда же найдена настоящая причина паузы автозаписи в
  машине проверки: согласие на микрофон для упакованного приложения стояло в
  положении «Спрашивать у пользователя»; после выдачи согласия панель пишет
  «Ожидаем встречу. Действует выбранный режим автозаписи».

release_notes_round41_gates: |
  Диагностическая полоса `infra/scripts/ci-local.sh --fast` впервые прошла и
  связала доказательство с точным коммитом: `ci_local_result=pass`,
  доказательство `.dev/ci-evidence/ci-fast-ee72b36e08c6-748d481025cc.json`.
  Окружение выровнено: установлен `specify 1.0.7` из замка проекта, проверка
  `speckit-bootstrap . --doctor --frozen` и `scripts/check_spec_kit_governance.py`
  отвечают успехом. Пункт про x64-железо отложен владельцем вместе с T071.

release_notes_round41_live: |
  Живая встреча в машине проверки проведена: подписанное приложение встречи
  создало комнату и держало активный микрофон (журнал приложения: 48 кГц,
  `ConferenceSession`, качество `EXCELLENT`), участник был один. GRAF приглашение
  не показал — и это правильное поведение: определитель требует у проверенного
  процесса одновременно активного захвата и воспроизведения, поэтому приложение
  с одним лишь микрофоном встречей не считается. Защита от ложных срабатываний
  подтверждена вживую. Для положительного случая в комнате должен говорить
  второй участник.

release_notes_round42_live: |
  Часть обещаний переноса проверена на установленном приложении, а не только
  тестами. Очередь и локальное хранилище: 12 записей против 12 каталогов,
  осиротевших каталогов нет, реестр удалений пуст, наружу не ушло ничего.
  Мост настроек кабинета подтверждён живыми строками журналов. Сессия и аккаунт
  пережили переустановку пакета и перезапуск. В настройках живьём видны три
  режима автозаписи и отдельные строки приложений. Границы записаны: удаление из
  кабинета до конца, выключение уведомлений и живое срабатывание автозаписи
  требуют отдельной проверки.

release_notes_round43_bridge: |
  Исправлена мёртвая ветка моста кабинета: команды `native_settings` (страницы
  настроек) и `delete_selection` (удаление записи из кабинета) отсутствовали в
  списке разрешённых команд конверта и отбрасывались. Из-за этого страницы
  настроек кабинета на Windows не работали вовсе — вместо честного ответа
  показывалась ложная ошибка загрузки, — а выбранное в кабинете удаление не
  доходило до приложения. Обе команды разрешены, строгий разбор полей остался в
  обработчиках, проверки расширены. Живое подтверждение: журнал моста пишет
  `accepted native_settings`, страница уведомлений показывает правду платформы.
  Открытым остаётся маковский текст этой страницы на Windows: копия общая с
  macOS, правка затронет обе платформы.

release_notes_round44_lifecycle: |
  Живьём проверены жизненный цикл удаления и запись. В кабинете Windows
  открывается вкладка «Удаления» с отчётами: жизненный цикл `active purge
  complete`, файлы под контролем GRAF с состояниями `purged` и `purge
  requested`. У строки локальной записи найдены действия: отметка выбора и
  красная корзина, которые появляются после взаимодействия со строкой. Во время
  записи панель показывает остановку одним действием, живые уровни микрофона и
  системного звука и честную подпись о том, что GRAF не может проверить
  микрофон во встрече. Граница: остановка через четыре секунды не создала
  локального пакета (каталогов записей 13, очередь не менялась), поэтому путь
  «строка кабинета → задача очистки → локальное хранилище» на своих данных
  пройти не удалось, а удалять записи владельца ради проверки не стал.
