schema_version: 1
feature_id: 200
category: Changed
summary: "Windows GRAF: восстановление кабинета, нативных окон и безопасной локальной записи после синхронизации с master"
issue: 6641
tasks: [T080, T081, T082, T083, T084]
compatibility: "Сохранён формат локальных записей v5 и чтение очереди v2. Старые глобальные настройки автозаписи не превращаются в разрешения отдельных приложений. Изменений macOS и развёртывания сервера в этом срезе нет."
known_limitations:
  - "Windows-каталог проверенных приложений пока пуст; настоящее обнаружение встреч и фоновая автозапись ещё не приняты. Юридических условий старта больше нет; техническая готовность остаётся обязательной."
  - "Нужна итоговая проверка окон, входа, отправки и аппаратной записи на окончательной сборке."
  - "Windows ARM64 в Parallels с x64-приложением не заменяет проверку физического x64-компьютера."
  - "Подтверждение серверной очистки локальных копий требует авторизации отдельной установки."
  - "Первоначальная проверка аккаунта использует существующие /desktop/settings/spaces и /auth/me без изменения сервера. Контрактные тесты порядка запросов, отмены и принадлежности пройдены; сквозная отправка в настоящем кабинете ещё не подтверждена."
  - "Подпись MSIX, чистая установка, обновление и публичный выпуск не подтверждены."
  - "Первая версия предназначена внешним клиентам. По Constitution 7 правовая политика пространства и подтверждения уведомления/согласия не блокируют запись; текст пользовательского соглашения отложен в отдельную задачу."
release_notes: "Кабинет использует общий веб-интерфейс. Исправлены инициализация WinUI/WebView2, восстановление навигации, маршруты аккаунта и безопасное продолжение входа через провайдеров. Нативная часть получает выбор микрофона, состояния и таймер, видимый индикатор до начала захвата, неблокирующий запуск и остановку устройств, очередь и сохранение подтверждённой части прерванной записи. Закрытие приложения ждёт финализации; локальные действия и безопасная диагностическая сводка имеют явный результат. Удалены неиспользуемые проекции, пустые тестовые проекты, фиктивные подтверждения безвозвратного удаления, устаревшие команды моста и синхронная отправка. По Constitution 7 удалены отменённые условия правовой политики и согласия, включая фиктивное разрешение ручной записи и постоянный запрет автозапуска. Технические ограничения, видимый индикатор и Stop сохранены. Готовность автозаписи больше не зависит от видимости главного окна; отдельный индикатор подготавливается скрытым. Слежение за окончанием встречи начинается с запуска записи, допускает смену процесса того же проверенного приложения и ограничивает потерю подтверждения десятью минутами. Удалены дублирующие поля состояния. Новая сборка прошла 20 переносимых и 20 Windows-тестов, запущена в Parallels; кабинет и нативная готовность проверены без записи звука. Изменения находятся в проверке; этот фрагмент не разрешает публикацию."
