schema_version: 1
feature_id: 200
category: Changed
summary: "Windows GRAF: восстановление кабинета, нативных окон и безопасной локальной записи после синхронизации с master"
issue: 6641
tasks: [T070, T071, T080, T081, T082, T083, T084, T085, T086, T092, T094, T095, T096, T097, T098, T099, T100, T101, T102, T103, T104, T105, T106, T107, T116]
compatibility: "Сохранён формат локальных записей v5 и чтение очереди v2. Реестр очереди обновлён до схемы v3: прежний файл читается и перезаписывается новой схемой при первой же записи, имя файла не меняется, поэтому очередь с неотправленными записями не теряется. Отметка времени строки добавляется при обновлении реестра и на поведение отправки не влияет. Время начала и окончания записи и смещение часового пояса добавлены в манифест необязательными полями: пакеты прежних сборок читаются как прежде и просто не сообщают время, миграция не нужна. Тело запроса на создание встречи расширено только теми полями, которые уже принимает сервер; новых требований к серверу нет. Режимы автозаписи сохраняются по постоянному ключу продукта в ApplicationRulesV2. Дорелизный V1 и глобальные настройки не читаются как разрешения и не удаляются; пустой прежний каталог не позволял сохранять реальные правила через UI. Изменений macOS и развёртывания сервера в этом срезе нет."
known_limitations:
  - "Запись каталога Windows привязана к точной сборке: Яндекс Телемост 2.42.4.9707 и Teams 26213.1006.5014.9784. Другая версия или архитектура требуют отдельной проверенной записи и сами в каталог не попадают."
  - "Живое срабатывание автозаписи не проверено: подписанное приложение встречи должно держать одновременно потоки воспроизведения и захвата, а в машине проверки Teams требует входа, и окно Телемоста не рисуется (x64-приложение под ARM64 через эмуляцию)."
  - "Задачи T087, T088, T089, T090, T091 (переносы удаления, сессии, уведомлений, оформления и моста настроек кабинета) имеют код в ветке, но отдельной живой проверки по ним не записано."
  - "Живое срабатывание автозаписи в тестовой машине не проверено: определитель доверяет только подписанному приложению встреч, а его в машине нет (T082)."
  - "Образа без среды разработки для проверки установки нет: доступна одна ВМ, а предустановленный Microsoft.WindowsAppRuntime.2 из-под пользователя не удаляется. Framework лежит рядом с MSIX и объявлен зависимостью."
  - "Ограниченная запись проверена модульными тестами: в ВМ нет рабочего микрофона, а системный звук на молчащем устройстве не даёт пакетов, поэтому живое подтверждение требует физического компьютера (T071)."
  - "Проверка установки на образе без среды разработки не выполнена: доступна одна виртуальная машина, и в ней есть и среда, и runtime. Проверено то, что решает исход: все импортируемые библиотеки лежат внутри пакета (распространяемый пакет Visual C++ app-local), framework-пакет Windows App SDK поставляется рядом с MSIX в Dependencies\\x64\\, а установка, обновление и откат проходят на текущем образе."
  - "Срок сессии из X-GRAF-Auth-Expires-At ставится на cookie кабинета, но на живом сервере это не проверено: нужен вход в аккаунт. Проверены разбор заголовка, правило переписывания и то, что значение доходит от рабочего полёта до кабинета."
  - "Удаление записей из кабинета на Windows включено: выбранные строки проверяются воротами страницы, сохраняются в реестре очереди и отправляются на сервер; принятым считается только запрос, который сервер назвал в квитанции. Перед первой отправкой читается контекст уведомлений, поэтому сервер без объявленной поддержки протокола не получает ни одного изменения, а кабинет сообщает, что запрос сохранён и ждёт."
  - "Отклонённый сервером запрос удаления не повторяется из кабинета: имя запроса выводится из цели и аккаунта, поэтому повтор после отказа не создаёт новый запрос (в macOS повтор получает новое имя). Пока это ограничение: запись, удаление которой сервер отклонил, остаётся видимой, и её удаление из кабинета не перезапускается."
  - "Файл реестра очереди сохраняет прежнее имя desktop-upload-queue.v2, хотя внутри уже схема v3: переименование осиротило бы очередь с неотправленными записями. Версия, которая имеет значение, записана внутри файла."
  - "Windows-каталог содержит только проверенный Microsoft Teams 26213.1006.5014.9784 ARM64. Другие версии и настоящее обнаружение встреч/фоновая автозапись ещё не приняты. Юридических условий старта больше нет; техническая готовность остаётся обязательной."
  - "Ручной сценарий в Parallels теперь прошёл до saved_local: Record/Pause/Resume/WebView reload/Stop, 960/960 и 988/988 обработанных/записанных блоков, reason_code=none. Это x64-приложение под эмуляцией Windows ARM64, а не доказательство физического x64, 60-минутной записи, качества AEC или сквозной отправки. Тихий сценарий без пригодного системного источника ожидаемо завершился endpoint_invalidated и не считается успешным стартом."
  - "Windows ARM64 в Parallels с x64-приложением не заменяет проверку физического x64-компьютера."
  - "Состав полей манифеста локального пакета на Windows отличается от macOS: имена в snake_case и сокращённый набор против 23 обязательных полей контракта. Отправку это не блокирует: сервер тело манифеста не разбирает, а сверяет sha256 дорожки manifest и проверяет роли дорожек и их параметры. Расхождение проявится только у инструмента проверки контракта macOS; сведение имён и состава полей — отдельная задача."
  - "Подтверждение серверной очистки локальных копий требует авторизации отдельной установки: сквозная проверка на настоящей задаче сервера не выполнена. Уровень реестра и упакованного приложения проверен — задача сопоставляется со строками по встрече, удаляются только копии, которые сервер уже считает своими, а подтверждается лишь доказанное (непроверяемый тип задачи не трогает файлы и отвечает local_purge_unverified)."
  - "Страница уведомлений кабинета доступна только для чтения: в Windows у приложения нет местных напоминаний о встречах, обратная связь о записи живёт в самом приложении. Адрес /desktop/settings/meeting-detection открывает нативное окно определения встреч, а не страницу кабинета: сервер такую страницу не отдаёт."
  - "Признак скрытых записей кабинету передаётся всегда false: macOS скрывает строки с недоступным жизненным циклом и объясняет это уведомлением, а Windows показывает строку с её причиной, поэтому уведомление было бы неправдой. Если Windows начнёт скрывать строки, значение обязано измениться вместе с поведением. Поле progressPercent в строке не передаётся: кабинет его не читает."
  - "Подтверждение очистки отправляется без чтения ответа по каждой задаче, в отличие от macOS: сбой сети оставляет задачу неотвеченной, и следующий проход повторяет ответ из записи в реестре. Доказанное удаление записывается до отправки, поэтому повторный вопрос получает тот же ответ."
  - "Первоначальная проверка аккаунта использует существующие /desktop/settings/spaces и /auth/me без изменения сервера. Контрактные тесты порядка запросов, отмены и принадлежности пройдены; сквозная отправка в настоящем кабинете ещё не подтверждена."
  - "MSIX собирается, подписывается отладочным сертификатом `CN=GRAF`, проходит статический smoke-тест, устанавливается и запускается из пакета. Причина прежнего отказа запуска устранена: полезная нагрузка собиралась как распакованное приложение и несла загрузчик рантайма Windows App SDK, который завершал процесс до точки входа; теперь полезная нагрузка пакета собирается без загрузчика. Обновление и откат версии проверены. Установка на образ без распространяемого пакета Visual C++ не подтверждена. Публичный подписанный выпуск не готовится."
  - "Порог короткой записи на Windows: запись короче 30 секунд канонического аудио не сохраняется только при нормальной остановке; прерывание и сбой захвата сохраняют фрагмент. Порог считается в 10-мс кадрах (3 000 кадров), а не в сырых отсчётах."
  - "Первая версия предназначена внешним клиентам. По Constitution 7 правовая политика пространства и подтверждения уведомления/согласия не блокируют запись; текст пользовательского соглашения отложен в отдельную задачу."
  - "Живая проверка кабинета ограничена: снимок настоящего окна подтверждает, что нативная оболочка и кабинет рисуются вместе, но содержимое страницы не читается ни деревом доступности (даже с принудительной доступностью), ни отладочным портом WebView2 (упакованные приложения не читают переменные среды), поэтому нажатие «Повторить загрузку» и действия внутри страницы остаются за ручной приёмкой. Нативная часть читается: четыре действия — «Назад в кабинете», «Вперёд в кабинете», «Открыть кабинет», «Встречи»."
  - "Оформление окна проверено в двух системных темах: оболочка берёт кисти из одного набора в двух палитрах по значениям кабинета, следует теме кабинета и задаёт `prefers-color-scheme` страницы явно. Светлая палитра применяется, когда кабинет объявит светлую тему или когда выбрана системная тема и система светлая; пока в кабинете тёмная тема, окно остаётся тёмным."
  - "Экран восстановления кабинета проверен живьём: при недоступном источнике показывается нативная карточка с безопасным кодом отказа, а нажатие «Повторить загрузку» возвращает кабинет в то же окно без перезапуска. Размер окна задаётся в логических точках и ставится при первой активации, поэтому на экранах с масштабом панель управления помещается целиком."
release_notes: >-
  Кабинет использует общий веб-интерфейс. Исправлены инициализация
  WinUI/WebView2, восстановление навигации, маршруты аккаунта и продолжение
  входа через провайдеров. Нативная часть содержит выбор микрофона, состояния и
  таймер, видимый индикатор, неблокирующий запуск/остановку и сохранение
  подтверждённой части прерванной записи. Закрытие приложения ждёт финализации;
  локальные действия и безопасная сводка имеют явный результат. Удалены
  неиспользуемые проекции, пустые тестовые проекты, фиктивные подтверждения
  удаления, устаревшие команды моста и синхронная отправка. По Constitution 7
  удалены отменённые условия правовой политики и согласия; техническая
  готовность, видимый индикатор и Stop сохранены. Автозапись не зависит от
  видимости главного окна; отдельный индикатор подготавливается скрытым.
  Слежение за окончанием встречи начинается с запуска записи, допускает смену
  процесса того же проверенного приложения и ограничивает потерю подтверждения
  десятью минутами. Настройки трёх режимов сохраняются по постоянному ключу
  продукта, а обнаружение проверяет точную идентичность программы. Исправлены
  явный повтор отправки после исчерпания попыток, ограниченное сетевое
  восстановление проверки аккаунта, продолжение очереди после перезапуска и
  замена истёкшей сессии без повторного использования старого ключа. Потерянный
  ответ о завершении больше не превращается в новую сессию для уже принятой
  ревизии: завершение распознаётся по состоянию встречи так же, как в macOS,
  поэтому элемент переходит в отправленные, а не исчерпывает повторы. Конфликты
  больше не повторяются вслепую: очередь действует по серверному классу повтора
  — вход при требовании действия пользователя, остановка автоматических попыток
  с понятной причиной при требовании администратора или исправления на
  компьютере, карантин при окончательном отказе. Локальная строка связывается с
  серверной встречей по сохранённому идентификатору, поэтому после отправки
  кабинет показывает серверную запись, а не отдельный элемент «На этом
  компьютере». Удаление записей из кабинета доведено до сервера и до локальных
  файлов: приложение читает объявленную поддержку протокола до первой отправки,
  хранит запросы в реестре очереди, повторяет ожидающие по расписанию и отвечает
  странице по квитанциям, а не по факту отправки. Копия, о которой сервер
  никогда не слышал, удаляется локально без запроса. Строка локальной записи
  получает время начала и префикс заголовка, поэтому кабинет показывает дату в
  часовом поясе читателя вместо «На этом компьютере». Для прерванной записи, у
  которой сохранился подтверждённый префикс, кабинет сообщает, сколько сохранено
  из всей длительности сессии. Кнопка уведомлений и переход к удалениям в
  кабинете снова работают: раньше эти страницы отклонялись политикой переходов.
  Ссылка «Обратиться в поддержку» открывает почтовую программу, если адрес
  прошёл проверку. Время записи больше не теряется: пакет хранит начало и
  окончание записи и смещение часового пояса, поэтому встреча получает понятное
  имя по местному времени начала и встаёт на своё место в списке, а не на момент
  отправки. WASAPI сохраняет точность QPC100ns; преобразование частоты ведёт
  непрерывную фазу, общая шкала проверяет порядок диапазонов и ограничивает
  коррекцию 48 кадрами. Event-driven worker использует GetNextPacketSize, а
  bounded queue отделяет WASAPI callback от timeline/AEC3/writer; переполнение и
  сбой worker завершают запись fail-closed. Удалены неработающие настройки
  ожидания восстановления звука. Только первый непустой пакет с точным флагом
  начального разрыва может быть освобождён без чтения звука; повторный разрыв
  остаётся отказом. Готовность наступает после нормализованных данных, срок
  запуска остаётся пять секунд. Добавлены раздельные типизированные причины и
  фактические счётчики этого отбрасывания без изменения форматов v2/v5.
  Окончательные исходники прошли 22 переносимых теста из 22 и сборку решения
  MSBuild; четыре аудио- и диагностические проверки дополнительно прошли
  контроль памяти/неопределённого поведения. Новое приложение собрано и запущено
  в Parallels, панель раскрыта через UIA. Контролируемые сценарии
  Record/Pause/Resume/WebView reload/Stop завершились локальным сохранением с
  reason_code=none; состояние микрофона восстановлено. Это не подтверждает
  60-минутную запись, все окна, authenticated upload, подписанный пакет,
  физический x64 или внешний выпуск. Упакованное приложение больше не
  завершается до точки входа: полезная нагрузка MSIX собирается без загрузчика
  рантайма Windows App SDK, запускается из установленного пакета, проходит
  обновление и откат версии. Полоса WebView2 дополнена регрессиями состояния,
  отказа, повтора и навигации. Проверки репозитория для WebView2 и
  аудиоконтракта пройдены на стенде, идентичность AEC3 подтверждена по пину.
  Новая часть: ответ 429 с заголовком `Retry-After` больше не превращается в
  немедленный повтор. Клиент читает паузу, не начинает попытку раньше срока и не
  расходует на ожидание лимит автоповторов: ожидание, которого потребовал
  сервер, не должно приближать запись к исчерпанию бюджета. Нечитаемое значение
  даёт 60 секунд, как в macOS, пауза длиннее суток не удерживается, а сетевой
  сбой, 408 и 5xx идут прежним путём. Подтверждение аккаунта больше не
  повторяется на каждую попытку отправки: оболочка подтверждает текущего
  пользователя и рабочее пространство для текущей сессии и передаёт этот снимок
  в полёт. Снимок не является полномочием сам по себе — он должен описывать
  настоящий аккаунт и совпадать с рабочим пространством, с которым едет, а смена
  токена сессии стирает его до начала любой отправки. Добавлен контракт удаления
  записи: перед любой мутацией приложение читает ворота протокола и требует
  версию 1, а цель запроса объявляет заголовками ожидаемого аккаунта и рабочего
  пространства. Запрос не уходит вовсе, если область не описывает настоящий
  аккаунт: сервер прочитал бы его как запрос без области. Пути, тела запросов и
  разбор ответов сняты с контракта сервера и проверяются регрессией, которая
  считает и локальные отказы. Само удаление из кабинета и подтверждение очистки
  локальных копий ещё не включены: мост удаления не выставляет свою версию
  раньше настоящей серверной операции. Добавлен контракт задач очистки локальных
  копий: сервер просит устройство удалить локальные копии уже удалённой встречи
  и ответить тем, что удалось доказать. Задача адресуется встречей, читается
  списком и подтверждается по идентификатору; понимаются только типы и
  состояния, которые сервер действительно присылает, а доказательство берётся из
  словаря клиента. Адрес из ответа сервера не используется как цель запроса —
  путь всегда строится из проверенной личности задачи. Страницы настроек
  кабинета работают: автозапись читается и сохраняется через то же хранилище,
  что у нативного окна настроек, а страница уведомлений честно показывает, что
  местных напоминаний о встречах в Windows нет. Тема кабинета решает оформление
  окон: приложение узнаёт выбранную в кабинете тему тем же объявлением, что и
  macOS, и следует ей вместо жёсткой тёмной темы. Кабинет видит состояние
  удаления: вместе со строками ему передаются удаления в работе и признак
  локальной записи, поэтому панель «Удаления» показывает, что запрос сохранён и
  ждёт сервера, а диалог удаления прямо говорит, какие записи ещё не
  отправлялись на сервер. Удаление, прерванное до переноса файлов в Корзину,
  доводится до конца в обычном проходе восстановления. Задачи очистки локальных
  копий выполняются: приложение читает список задач, запрашивает недостающие по
  подтверждённому удалению, удаляет локальные копии тем же безопасным путём, что
  и подтверждённое пользователем удаление, и отвечает серверу тем, что удалось
  доказать. Мост удаления из кабинета собран и проверен: приложение принимает
  тот же запрос, что и macOS (версия 1, действие `deleteSelection`,
  идентификатор запроса в форме UUID, от одной до ста целей, встречи только как
  UUID), берёт для локальной записи каталог, который знает сервер, и отвечает
  только на ту страницу, которая спросила. Мост выставляется странице вместе с
  исполнителем: версия 1 объявляется только тогда, когда приложению есть что
  сохранить и что удалить, поэтому удаление встречи больше не идёт обходным
  путём. Приложение читает контекст уведомлений перед первой отправкой и без
  объявленной поддержки протокола не меняет ничего на сервере, а копию, о
  которой сервер не знает, удаляет на месте без запроса. Когда сервер удалил
  встречу, он просит это устройство убрать её локальные копии: приложение
  сопоставляет задачу со строками очереди только по встрече, которую вернул сам
  сервер, удаляет лишь те копии, которые сервер уже считает своими, и
  подтверждает только доказанное. Тип задачи, который клиент не может проверить,
  не трогает файлы и честно сообщает, что очистка не подтверждена. Доказанное
  удаление записывается в реестр раньше ответа, поэтому потерянный ответ не
  превращает выполненную очистку в неудачу. Реестр очереди обновлён до схемы
  `v3`: у каждой строки появилась отметка времени, у документа — своя, а запросы
  удаления хранятся в реестре и переживают перезапуск. Запрос хранится один раз
  на цель и аккаунт, и его имя выводится из них, поэтому повтор после
  перезапуска остаётся для сервера той же операцией. Принятие удаления
  записывается только вместе с квитанцией, назвавшей именно эту цель, а
  состояние ведёт себя монотонно: принятое удаление может стать только
  подтверждённым. Реестры прежней схемы по-прежнему читаются и обновляются,
  поэтому незавершённая отправка не теряется. Строка реестра очереди хранит
  отпечаток того, что сказал сервер: идентификатор принятой медиаревизии,
  идентификатор сессии загрузки и состояния встречи, обработки и ревизии. После
  перезапуска приложение знает это без нового запроса, а негодное значение
  отвергается, не портя файл. Срок сессии из `X-GRAF-Auth-Expires-At` больше не
  теряется: приложение читает его тем же правилом, что и macOS, и ставит на
  cookie кабинета, поэтому кабинет не просит вход раньше, чем истекает сессия на
  сервере. Переписывание отклоняется, если значение cookie уже другое, токена
  нет или срок в прошлом. Пакет стал самодостаточным: распространяемый пакет
  Visual C++ лежит внутри пакета рядом с приложением, а framework-пакет Windows
  App SDK поставляется рядом с MSIX, поэтому на чистом образе Windows не нужно
  ничего доустанавливать. Установка, обновление и откат проходят на текущем
  образе. Изменения находятся в проверке; этот фрагмент не разрешает публикацию.

release_notes_round25: |
  Доступ к микрофону и причины отказа. Приложение больше не считает запрет
  доступа исправным состоянием: согласие на микрофон читается по имени семейства
  пакетов, поэтому после ответа «No» в системном запросе запись не начинается, а
  панель «Запись» показывает «Разрешите доступ к микрофону в настройках Windows»
  и кнопку «Разрешить микрофон» с переходом в системные настройки. У каждой
  причины отказа теперь свой текст и следующий шаг: отказ в доступе, недоступное
  устройство, нехватка места, сбой кодирования, переполнение очереди и сбитые
  часы объясняются разными словами вместо одной общей фразы. Отказ микрофона
  больше не обрывает запись: системный звук продолжает писаться, сессия
  помечается ограниченной, а причина едет вместе с записью — так же ведёт себя
  macOS. Проверено портируемой полосой (30/30) и живьём в ВМ «Windows 11»:
  запрет доступа, диалог разрешений, переход в системные настройки и возврат в
  готовое состояние.

release_notes_round26: |
  Знак GRAF теперь стоит в заголовке каждого окна приложения, а не только
  главного: окна настроек, автозаписи и полосы записи больше не показывают
  системный значок-заглушку. Интерфейс пройден живьём в тёмной теме: кабинет с
  боковой панелью и без неё, уведомления, меню владельца и окно настроек
  выглядят цельно, а оформление берётся из выбора в кабинете («Вид»), система
  решает только при значении «системная».

  Установка, обновление и откат пакета проверены обычным путём. Пакет ставится на
  машину без приложения, обновляется до новой версии с сохранением данных и
  пользовательских настроек, а возврат на прежнюю версию делается удалением и
  установкой. Отдельно проверено, что обновление не проходит, пока приложение
  запущено, и что понижение версии поверх более новой отклоняется системой.

release_notes_round27: |
  Отказ любого источника теперь ограничивает запись, а не обрывает её, — так же
  ведёт себя macOS. Если отказал системный звук, запись продолжается с
  микрофоном, а человек читает «Системный звук недоступен. Проверьте устройство
  воспроизведения в параметрах Windows»; если отказал микрофон, запись
  продолжается с системным звуком. Общая фраза «устройство звука отключилось»
  больше не скрывает, что именно чинить. Запись обрывается только тогда, когда
  писать нечем: оба источника отказали или ни один не успел дать звук за срок
  запуска.

release_notes_round30: |
  Меню значка в области уведомлений теперь в палитре приложения: фон, текст,
  разделители и подсветка берутся из тех же кистей, что и окна, поэтому меню не
  выглядит светлым чужеродным пятном на тёмном окне. Тема приходит тем же
  решением, что и у окон, и меняется вместе с оформлением кабинета.

release_notes_round30_theme: |
  Проверено «во всех темах»: светлое оформление снято целиком — страница, рельс,
  панель записи, заголовок окна и полосы прокрутки. Найдено расхождение: смена
  темы внутри кабинета меняет страницу, но не оболочку; окно подхватывает тему
  только после перезагрузки. Дефект открыт как T098.

release_notes_round31: |
  Живое переключение оформления в кабинете теперь доходит до окна: объявление
  `app_appearance` не проходило проверку моста и молча терялось, поэтому смена
  темы меняла страницу, но не окно, пока не нажата перезагрузка. Команда
  добавлена в список разрешённых, поведение закреплено проверкой конверта.
  Дополнительно приложение ведёт короткий журнал моста (имена команд и причины
  отказа) — он помог найти причину и остаётся для диагностики.

release_notes_round32: |
  Проверено живьём поведение без сети: кабинет не открывается, но приложение
  показывает собственную поверхность — нативная запись и локальная сохранность
  работают отдельно от страницы, отказ назван безопасным кодом без адресов и
  внутренних подробностей, а «Повторить загрузку» возвращает кабинет после
  восстановления сети без перезапуска приложения.

release_notes_round32_progress: |
  Строка локальной записи теперь несёт прогресс отправки: кабинет показывает
  «Отправляется · N %», как в macOS. Прогресс считается из принятых сервером байт
  и веса дорожек локального пакета, а при неизвестном весе поле не отправляется
  вовсе — ноль процентов выглядел бы как «ничего не отправлено».

release_notes_round33: |
  Заголовки окон приложения теперь в оформлении GRAF: системная светлая полоса
  над тёмным окном настроек убрана, цвет заголовка, его текста и рамки берётся из
  палитры приложения. Приложение также ведёт короткий журнал оформления, по
  которому видно, какое объявление кабинета получено и какое решение принято.

release_notes_round34: |
  Оформление окон проверено в обеих темах: окно настроек, его заголовок и меню
  значка в области уведомлений совпадают с кабинетом и на светлой, и на тёмной
  теме, а живое переключение темы подтверждено журналами обеих сторон. Ранний
  выход из пересборки палитры убран: кэш «тема не менялась» мог разойтись с тем,
  что видно на экране.

release_notes_round35: |
  Закрытие окна больше не делает приложение недоступным: окно скрывается, а
  приложение остаётся в значке области уведомлений, как в macOS, и пункт
  «Открыть GRAF» возвращает то же окно. Раньше окно уничтожалось, а значок
  оставался без действия. Настоящий выход по-прежнему закрывает приложение.

release_notes_round36: |
  Возврат окна из значка области уведомлений проверен живьём: закрытие окна
  скрывает его, приложение остаётся в значке, щелчок по значку возвращает то же
  окно. Настоящий выход по-прежнему закрывает приложение.

release_notes_round37: |
  Настройки автозаписи проверены живьём: три режима («Всегда», «Спрашивать»,
  «Никогда»), отдельная настройка для Teams, выбор сохраняется между открытиями
  окна. Срабатывание автозаписи требует настоящего подписанного приложения встреч:
  определитель сверяет отпечатки исполняемого файла и издателя и не доверяет окну
  с похожим заголовком — это намеренное свойство, как и в macOS.

release_notes_round38: |
  Нативные окна и действия сверены с macOS по доказательствам и закрыты:
  читаемые настройки в обеих темах, двустороннее сворачивание через значок,
  навигация, микрофон, состояния с таймером и пауза/продолжение/остановка,
  recovery без сети, очередь без заглушек. Действия кабинета тоже проверены
  живьём, включая действие панели, которое открывает нативное окно настроек.

release_notes_round39: |
  Сквозная проверка собранного пакета: портируемая полоса 30/30, полосы приложения
  и пакета зелёные, установка из свежего пакета, запуск, настройки из панели и
  переключение темы из кабинета через страницу «Аккаунт» → «Тема» в обе стороны.
  Окно и страница меняют оформление вместе.

release_notes_round40: |
  Пакет объявляет платформу Visual C++: без этого приложение, собранное с
  динамической библиотекой времени выполнения, не запустилось бы на машине без
  отдельно установленного распространяемого пакета, и установка об этом не
  предупредила бы. До правки установленный пакет объявлял только платформу
  Windows App Runtime, после — обе.

release_notes_round41: |
  Каталог проверенных приложений Windows вырос до двух записей: добавлен Яндекс
  Телемост с постоянным ключом из общего продуктового каталога и точными хешами
  установленной сборки 2.42.4.9707 (подпись YANDEX LLC подтверждена). Настройки
  показывают новую строку. Тогда же найдена настоящая причина паузы автозаписи в
  машине проверки: согласие на микрофон для упакованного приложения стояло в
  положении «Спрашивать у пользователя»; после выдачи согласия панель пишет
  «Ожидаем встречу. Действует выбранный режим автозаписи».

release_notes_round41_gates: |
  Диагностическая полоса `infra/scripts/ci-local.sh --fast` впервые прошла и
  связала доказательство с точным коммитом: `ci_local_result=pass`,
  доказательство `.dev/ci-evidence/ci-fast-ee72b36e08c6-748d481025cc.json`.
  Окружение выровнено: установлен `specify 1.0.7` из замка проекта, проверка
  `speckit-bootstrap . --doctor --frozen` и `scripts/check_spec_kit_governance.py`
  отвечают успехом. Пункт про x64-железо отложен владельцем вместе с T071.

release_notes_round41_live: |
  Живая встреча в машине проверки проведена: подписанное приложение встречи
  создало комнату и держало активный микрофон (журнал приложения: 48 кГц,
  `ConferenceSession`, качество `EXCELLENT`), участник был один. GRAF приглашение
  не показал — и это правильное поведение: определитель требует у проверенного
  процесса одновременно активного захвата и воспроизведения, поэтому приложение
  с одним лишь микрофоном встречей не считается. Защита от ложных срабатываний
  подтверждена вживую. Для положительного случая в комнате должен говорить
  второй участник.

release_notes_round42_live: |
  Часть обещаний переноса проверена на установленном приложении, а не только
  тестами. Очередь и локальное хранилище: 12 записей против 12 каталогов,
  осиротевших каталогов нет, реестр удалений пуст, наружу не ушло ничего.
  Мост настроек кабинета подтверждён живыми строками журналов. Сессия и аккаунт
  пережили переустановку пакета и перезапуск. В настройках живьём видны три
  режима автозаписи и отдельные строки приложений. Границы записаны: удаление из
  кабинета до конца, выключение уведомлений и живое срабатывание автозаписи
  требуют отдельной проверки.

release_notes_round43_bridge: |
  Исправлена мёртвая ветка моста кабинета: команды `native_settings` (страницы
  настроек) и `delete_selection` (удаление записи из кабинета) отсутствовали в
  списке разрешённых команд конверта и отбрасывались. Из-за этого страницы
  настроек кабинета на Windows не работали вовсе — вместо честного ответа
  показывалась ложная ошибка загрузки, — а выбранное в кабинете удаление не
  доходило до приложения. Обе команды разрешены, строгий разбор полей остался в
  обработчиках, проверки расширены. Живое подтверждение: журнал моста пишет
  `accepted native_settings`, страница уведомлений показывает правду платформы.
  Открытым остаётся маковский текст этой страницы на Windows: копия общая с
  macOS, правка затронет обе платформы.

release_notes_round44_lifecycle: |
  Живьём проверены жизненный цикл удаления и запись. В кабинете Windows
  открывается вкладка «Удаления» с отчётами: жизненный цикл `active purge
  complete`, файлы под контролем GRAF с состояниями `purged` и `purge
  requested`. У строки локальной записи найдены действия: отметка выбора и
  красная корзина, которые появляются после взаимодействия со строкой. Во время
  записи панель показывает остановку одним действием, живые уровни микрофона и
  системного звука и честную подпись о том, что GRAF не может проверить
  микрофон во встрече. Граница: остановка через четыре секунды не создала
  локального пакета (каталогов записей 13, очередь не менялась), поэтому путь
  «строка кабинета → задача очистки → локальное хранилище» на своих данных
  пройти не удалось, а удалять записи владельца ради проверки не стал.

release_notes_round45_audio: |
  Проверка удаления на своей записи упёрлась в честный отказ приложения: захват
  системного звука в виртуальной машине Parallels на Apple Silicon во время
  записи не работает, и приложение вместо пустой записи отвечает «Не удалось
  сохранить запись: системный звук недоступен. Проверьте устройство
  воспроизведения в параметрах Windows». Пустой канонический звук не доходит до
  порога короткой записи (T086, F6796), поэтому пакет не создаётся. Это тот
  случай, который отложен как гейт T071 до появления физического x64. Путь
  удаления на своих данных поэтому не пройден; команда удаления проверку моста
  проходит, отчёт об удалении в кабинете открывается.

release_notes_round45_env: |
  Уточнение к предыдущей записи: среда виртуальной машины в принципе работает —
  два более ранних локальных пакета лежат с `capture_status="normal"` и
  длительностью 9880 и 9600 мс. Сейчас каждый заход заканчивается честным
  ответом приложения «Не удалось сохранить запись: системный звук недоступен».
  Объяснение «устройство воспроизведения простаивало» проверено и отброшено:
  заход на 45 секунд без постороннего звука дал тот же отказ. Точная причина
  требует физического x64 (отложенный гейт T071).

release_notes_round46_quickstart: |
  Прогнан полный quickstart Feature 200, результат записан отдельным документом
  `specs/200-windows-desktop-app/quickstart-run-2026-09-19.md`. Пройдено: сборка и
  портируемые проверки (30/30), синтетический звуковой гейт, гейт безопасности и
  паритета WebView2 (7/7), гейт локального хранения (3/3 плюс живые инварианты
  очереди), гейт репозитория (`ci_local_result=pass mode=fast` на замороженном
  дереве) и дым установки MSIX: подпись `Valid`, установка `0.1.0.0`, обе
  библиотеки распространяемого пакета Visual C++ внутри пакета, запуск
  `responding=True`. Не пройдено и записано поимённо: физический x64 (T071),
  живое срабатывание автозаписи (T082), путь локального удаления (T087),
  маковский текст страницы уведомлений (T089).

release_notes_round47_themes: |
  Три темы проверены живьём вместе с нативными поверхностями: «Светлая», «Тёмная»
  и «Системная» меняют и кабинет, и нативную панель с заголовком окна — значит,
  объявление оформления действительно доходит из страницы до оболочки. Попутно
  подтверждён путь восстановления WebView2: после отказа процесса обозревателя
  кабинет показал честное сообщение «Не удалось открыть кабинет … browser-process ·
  0x80004005» и кнопку «Повторить загрузку», которая вернула кабинет без
  перезапуска приложения. Для будущих проверок зафиксировано, что окно занимает
  3240×1860 при смещении 180,9, поэтому координаты берутся относительно окна.

release_notes_round48_platform_words: |
  Общая страница настроек кабинета больше не называет Windows «Маком»: оболочка
  приводит слова к платформе («На этом компьютере», «разрешение Windows»,
  «настройки этого компьютера») и скрывает кнопку «Настройки macOS», которая на
  Windows вела бы в настройки, которых для этой страницы нет. Правка сделана в
  оболочке Windows, поэтому общая серверная страница и macOS не меняются.
  Добавлена проверка `testTheSharedSettingsPageStopsClaimingToBeAMac`; полосы
  сборки, пакета и установки прошли, пакет `sha256=56D07CD9…` установлен.
  Граница: исправленный текст глазами на живой машине не перепроверен — боковой
  список разделов настроек не отзывается на щелчки по координатам, хотя щелчки по
  содержимому той же страницы работают.

release_notes_round49_final_gate: |
  Итоговая сводка паритета по задачам с указанием доказательств добавлена в
  `parity-matrix.md`: отдельно собраны три исправленных дефекта (мёртвая ветка
  моста, маковские слова на Windows, отсутствие Телемоста в каталоге) и четыре
  границы, которые в этой машине закрыть нельзя. Полоса `ci-local.sh --fast`
  пройдена на замороженном дереве `49e21207ee7c`:
  `ci_local_result=pass mode=fast`, доказательство
  `.dev/ci-evidence/ci-fast-49e21207ee7c-9b323f1f6165.json`.

release_notes_round50_live_autorecord: |
  Получен положительный случай автозаписи живьём. Много кругов подряд он упирался
  в одно: у проверенного приложения встречи должен быть и захват, и
  воспроизведение, а одинокий участник давал только захват. На этом круге окно
  Телемоста действительно рисовалось и держало оба потока — и GRAF сработал сам:
  обнаружил встречу, показал уведомление с обратным отсчётом («через 8 секунд»,
  счётчик `0:06`) и начал запись без нажатия «Начать запись», как и описано для
  режима «Спрашивать». В каталоге записей появился пакет с
  `capture_status=degraded`, `capture_reason_code=clock_discontinuity`,
  `duration_ms=6430`. Срабатывание доказано; качество захвата остаётся машинной
  границей раунда 45. Согласие на микрофон было закрыто до начала записи, тестовый
  пакет удалён после записи фактов, файлы владельца не трогались.

release_notes_round51_mic_gate: |
  Уточнение к раунду 50 и точная причина границы локальной очистки. Снимаю слишком
  сильное утверждение: точная секунда переключения согласия на микрофон не
  записана, поэтому нельзя утверждать, что микрофон не попал в первые секунды
  тестовой записи; пакет был удалён сразу и за пределы машины не выходил.
  Отдельная находка: запрет доступа к микрофону **отключает запись целиком** —
  панель пишет «Не удалось сохранить запись», предлагает «Разрешить микрофон»,
  сообщает «Автозапись приостановлена», кнопка начала записи не отвечает.
  Приложение не подменяет отсутствующий источник тишиной, и это правильно; но
  свою локальную запись для проверки очистки получить без разрешения на микрофон
  нельзя, а оно записало бы звук комнаты владельца. Ради теста разрешение не
  включалось.

release_notes_round52_wording_not_live: |
  Живая проверка страницы уведомлений показала обратное записанному ранее: правка
  маковских слов и кнопки «Настройки macOS» на живой странице **не действует**.
  Видно «На этом Mac» и кнопку, хотя честный ответ платформы на месте — значит,
  оболочка и мост работают, а именно эта правка не исполняется. Исключены
  исходники (в зеркале правка есть), сборка (портируемая полоса 30/30 с проверкой
  строки из собранного кода) и пакет (`sha256=0EB6DF6C…`, установлен, запущен).
  Под подозрением способ установки оболочки: `ExecuteScriptAsync` после завершения
  навигации вместо `AddScriptToExecuteOnDocumentCreated`, из-за чего
  `DOMContentLoaded` может быть уже позади. Заодно найдена причина прежних неудач
  с навигацией: окно приложения смещается между запусками.

release_notes_round53_package_freshness: |
  Правка маковских слов на странице настроек запускается теперь надёжно: сразу, на
  `DOMContentLoaded`, на подстановке `htmx` и ещё дважды по времени, замена
  обёрнута в `try/catch`, а отчёт о запуске уходит в канал страницы и виден в
  `bridge.log`. Портируемая полоса — 30/30. Найдено главное: промежуточная папка
  пакета (`Installer\out\x64\Release\Core`) лежала в дереве двухдневной
  давности, а охранник свежести сравнивал время MSIX со временем приложения, а не
  содержимое пакета. Сборочный сценарий пакета удаляет и промежуточную копию;
  проверено, что в новом MSIX лежит файл 19.09 04:09 с правкой. Остаётся
  проверить, заменяет ли установка поверх версии `0.1.0.0` двоичные файлы —
  следующий круг ставит пакет после удаления прежнего.

release_notes_round54_wording_verified: |
  Правка маковских слов на странице настроек подтверждена живьём после **чистой**
  установки: на странице «Уведомления» видно «На этом компьютере», кнопки
  «Настройки macOS» нет, честный ответ платформы на месте. Причина прежних неудач
  найдена: пакет нёс старый двоичный файл, потому что промежуточная папка упаковки
  не обновлялась, а охранник свежести сравнивал время MSIX со временем приложения,
  а не содержимое пакета. Проверять на версии `0.1.0.0` поверх прежней нельзя —
  нужна чистая установка; это записано как обязательный шаг проверки.

release_notes_round54_final_tasks: |
  T089, T090 и T091 закрыты. T090: статических заглушек в `AppMain.cpp` не
  осталось (проверено поиском), живая проверка трёх режимов автозаписи, местного
  времени и трёх тем вместе с нативной панелью. T091: последний открытый пункт —
  маковский текст страницы уведомлений — решён и подтверждён живьём после чистой
  установки. Остаются открытыми T063, T071, T083, T087 и T088 с честно
  записанными границами: физический компьютер с Windows x64, живая проверка входа и
  выгрузки на боевом сервере, путь локальной очистки без разрешения на микрофон.

release_notes_round56_parity_in_progress: |
  После синхронизации с master от 24 сентября устранена возможность собрать
  приложение без настоящего эхоподавления. Сборка проверяет закреплённые
  исходники и происхождение библиотек. Уточнены временная шкала WASAPI,
  порядок остановки и безопасная финализация записи. Постоянный отказ сервера
  сохраняется атомарно и больше не предлагает бессмысленную повторную отправку.
  Дорабатываются загрузка кабинета, восстановление входа, уведомления о встречах
  и обработка ссылки grafrec. Сервер и macOS в этом срезе не меняются.
  Переносимые проверки и проверки внутри Windows прошли 31/31; настоящая
  обработка AEC подтверждена нативной самопроверкой. Номер тестового пакета
  повышен до 0.1.0.4: Windows запрещает замену отличающегося содержимого с тем
  же номером, а удалять пользовательское состояние ради обновления нельзя.
  Итоговая тестовая сборка 0.1.0.4 установлена без удаления профиля, содержимое
  EXE сверено с пакетом, самопроверка установленного EXE пройдена.
  Устранено попадание непроверенных значений
  веб-сообщений в журнал. Полная нативная проверка пользовательских сценариев
  и T097 пока не приняты. Это запись о ходе разработки, не объявление готовности
  внешнего выпуска; development-подпись не является доверенной публичной.

release_notes_round57_webview_recovery: |
  После разблокировки Mac обнаружен отказ кабинета в установленной тестовой
  версии. Устранена общая ошибка обработчика WebView2: автоматически
  восстанавливаемый вспомогательный процесс больше не отключает рабочую
  страницу. Отказ браузера или страницы сохраняет явное восстановление,
  инвалидирует старый мост и сообщает тип сбоя и числовой код без содержимого.
  Добавлены регрессии; переносимые и Windows-проверки прошли 31/31. Тестовый пакет
  0.1.0.5 собран и установлен без удаления профиля; кабинет при запуске
  загрузился с сохранённым входом. Причина сбоя старой версии пока не установлена;
  T097 и полная живая приёмка остаются открытыми.

release_notes_round58_profile_menu: |
  Общее меню Mac и Windows больше не выпускает нижние пункты за фон в низком
  окне. Основное меню прокручивается, а вложенные панели открываются сбоку
  и не обрезаются его границами. На действительно узком экране сохраняется
  встроенное раскрытие, которое не схлопывается при прокрутке. Проверены
  клавиатура, Escape, изменение размера, три подменю и ошибка сохранения темы.
  Удалены неиспользуемые правила прежнего позиционирования. Проверки общего
  кабинета прошли 172/172, браузерные сценарии — по 25 в Chromium и WebKit.
  Изменение общее и не требует отдельной Windows-страницы. Оно ещё не доставлено
  на рабочий сервер; установленный MSIX и вся задача T097 этим не приняты.

release_notes_round55_solution_build: |
  Исправлен путь NuGet в `GrafWindowsApp.vcxproj`: при заданном
  `NuGetPackageRoot` между корнем пакетов и `microsoft.web.webview2` теперь есть
  разделитель, поэтому `cppwinrt` находит `Microsoft.Web.WebView2.Core.winmd`.
  Свежая полная `GrafWindows.sln` собрана в Windows 11 ARM64 VM под x64-
  эмуляцией (`BUILD_EXIT=0`), CTest прошёл `30/30`, WebView2 — `7/7`, synthetic
  audio — `4/4`, custody/queue/upload — `4/4 + 3/3`. Свежий development MSIX
  собран (`PACKAGE_BUILD_EXIT=0`), подписан `Valid / CN=GRAF`, прошёл статический
  smoke и установлен/запущен из `WindowsApps` (`Responding=True`). Подпись не
  является внешней доверенной; физический Windows x64, clean-image lifecycle,
  реальные аудиоустройства и внешний релиз остаются открытыми.

release_notes_round59_package_signature: |
  Проверка установочного пакета теперь отклоняет недоверенную, повреждённую
  или неизвестную подпись, даже если сертификат присутствует. Шесть сценариев
  проверки прошли в Windows; действительный прежний тестовый пакет также
  проходит усиленную проверку. Это не подтверждение публичной подписи.
  Зафиксированы единые критерии полного паритета Windows и macOS, включая
  новые единые карточки и «Тихий режим» из выбранного GRAF Dev F277, поведение окон и
  сохранность пользовательского текста. Приёмка реализации продолжается.

release_notes_round60_windows_shell: |
  В тестовой Windows-сборке 0.1.0.6 разделены закрытие главного окна и выход
  из приложения. Скрытие зависит от фактической доступности значка в трее
  и управления остановкой записи. Добавлены команды начала записи и настроек
  в трее, восстановление значка после перезапуска Explorer и явный выход
  при недоступном трее. Фоновые окна показываются без запроса активации.
  Удалена глобальная подмена текста веб-страницы: платформенные подписи
  теперь задаются адресно в общем интерфейсе без изменения пользовательского
  содержимого. Полная сборка Visual Studio, 31 переносимый и 31 Windows-тест,
  проверки границы WebView и синтетического аудио прошли. Пакет установлен
  без удаления профиля, хеш установленного EXE совпал с пакетом. Живая
  приёмка управления окнами и доступности остаётся открытой.

release_notes_round61_shared_notifications: |
  Общая страница уведомлений приведена к выбранному GRAF Dev F277: добавлен
  «Тихий режим», оставлены пять настроек и проверочное уведомление, удалены
  прежние действия системных уведомлений и их неиспользуемые стили.
  Mac и Windows используют одну страницу с адресными платформенными подписями.
  Проверены сохранение настроек и черновиков, отказ устаревшего протокола,
  клавиатура, узкие окна и темы: 37 проверок контракта, по 28 браузерных
  сценариев в Chromium и WebKit, 224 сочетания настроек и 62 серверных теста.
  Независимая проверка общего кода не выявила замечаний. Нативная реализация
  новых карточек ещё разрабатывается; рабочий сервер не обновлялся, тестовый
  пакет 0.1.0.6 не содержит этот последующий перенос уведомлений.

release_notes_round63_native_notifications: |
  Нативные уведомления Windows соединены с правилами выбранного GRAF Dev F277:
  общий показ, «Тихий режим», история, однократный звук и переход к конкретной
  проблемной записи. Короткая запись не считается ошибкой; используется одна
  ограниченная очередь уведомления. Перед автоматическим стартом повторно
  проверяется актуальность разрешения после сна, блокировки и задержки
  системного ответа. Полная сборка Windows с закреплённым AEC3 и 31 Windows-тест
  прошли, как и проверки веб-границы и синтетического аудио. Независимая проверка
  кода не обнаружила новых серьёзных замечаний. Живая приёмка ещё не завершена;
  рабочий сервер и установленная версия 0.1.0.6 пока не обновлены.

release_notes_round64_audio_error_copy: |
  Исправлена неверная подсказка при нарушении синхронизации звука: приложение
  больше не предлагает менять системное время, а направляет к безопасной
  диагностике и проверке устройства. Регрессия текста проверена. Полученная
  диагностика прежней сборки указала на расхождение позиций пакетов микрофона
  до сохранения первого блока; причина ещё исследуется. Проверки целостности
  звука не ослаблены, успешная реальная запись этим изменением не подтверждена.

release_notes_round65_test_package: |
  Тестовый пакет Windows 0.1.0.7 с новыми нативными уведомлениями установлен
  поверх предыдущей версии без удаления профиля и записей. Подпись и состав
  пакета проверены, установленный исполняемый файл совпал с файлом в пакете,
  самопроверка нативной обработки эха прошла. Это не внешний выпуск:
  используется сертификат разработки, приёмка интерфейса и реального захвата
  не завершена, обновлённые общие страницы ещё не доставлены на рабочий сервер.

release_notes_round69_payment_adapter: |
  Реализована передача исходных платёжных форм в Windows WebView2:
  дочернее окно использует тот же профиль, не получает доступа к записи
  или нативным командам и возвращает пользователя в кабинет без повторной
  отправки формы. В Windows устранены два блокера открытия и пройдены семь
  синтетических сценариев с проверкой полученных форм и возврата. Последующая
  проверка исправила обработку раннего отказа и сохранение исходного срока
  оплаты; окончательный код прошёл независимое чтение и 31 переносимый тест.
  Повторный нативный прогон выявил раннее закрытие окна между прерыванием
  начальной загрузки и отправкой формы. После исправления однократно прошли
  11 сценариев; повтор выявил конфликт тестового файла результатов и возможность
  отправки GET внешнего фрейма при отмене навигации. Исправлены чтение квитанции
  и сетевой запрет документов после окончания оплаты. Итоговый изолированный
  прогон прошёл 12 из 12 сценариев с проверкой окончательных серверных счётчиков,
  сохранения форм и cookies, перенаправлений и запрета внешнего фрейма после
  возврата. Исправлена потеря кода завершения вспомогательного сервера в
  PowerShell; очистка временной папки прошла после ограниченного повтора.
  T102 ещё не принят; установленный
  пакет и рабочий сервер не обновлены, настоящих платежей или записи микрофона
  не было.

release_notes_round73_auth_http_errors: |
  Исправлено распознавание серверных HTTP-ошибок Windows WebView2:
  рабочие формы входа и привязки почты больше не подменяются сетевым отказом
  при общем коде ошибки браузерного компонента. Проверка заголовков текущего
  документа и запрет нативных команд в формах сохранены. Реальный нативный
  тест сначала воспроизвёл три отказа, затем прошёл все пять сценариев после
  исправления, включая безопасный возврат на вход при 401 и отказ кабинета
  при 503. Все 31 переносимый тест прошли. Добавлен способ передать тесту
  отдельную среду WebView2 без изменения обычного запуска приложения.
  Повтор сохранённого в репозитории нативного набора прошёл 5/5 сценариев,
  подтвердил штатное завершение каждого тестового браузера и очистку
  временных профилей; ранний выход и ошибка очистки не считаются успехом.
  Полная приёмка T103 и установленного пакета ещё не завершена; рабочий сервер
  и установленное приложение этим изменением не обновлялись.

release_notes_round74_explicit_auth_recovery: |
  Восстановление входа в Windows приведено к выбранному GRAF Dev для Mac:
  при истёкшей сессии сначала показывается причина и кнопка «Войти в кабинет»,
  при потере доступа к пространству — «Войти и выбрать пространство».
  Автоматический переход убран; безопасное место возврата сохраняется.
  Уже открытые формы входа остаются доступными. Кнопка учитывает актуальное
  состояние, блокирует повтор во время перехода и имеет соответствующее
  доступное имя; скрытая страница исключается из взаимодействия.
  Нативные проверки расширены до 14 сценариев, включая HTML429, JSON503,
  настоящий синтетический POST и отказы TLS/соединения. Переносимые тесты
  прошли 31/31; новый нативный набор прошёл 14/14 с проверкой окончательных
  серверных счётчиков, завершения браузеров и очистки. Код главного Windows-окна
  с новой кнопкой скомпилирован с /W4 /WX. Живая проверка установленного интерфейса ещё не завершена;
  установленное приложение и рабочий сервер этим раундом не обновляются.

release_notes_round75_update_check: |
  В Windows добавлена системная проверка обновлений из трея и общей кнопки
  кабинета. Отдельное окно не блокирует управление записью; повторное нажатие
  не создаёт второй запрос. Отсутствующий источник, неизвестный ответ и ошибка
  не выдаются за актуальную версию. Значок обновления появляется только после
  подтверждения Windows. Закрытие окна и поздние ответы не создают ложный результат;
  ожидание отмены объясняется, изменения статуса передаются экранному диктору.
  Переносимые проверки прошли 32/32, нативные регрессии входа на новом мосте 14/14.
  Это первая часть T112 (#7346): установка, проверенный канал и окончательная
  приёмка установленного окна остаются открытыми. Рабочий сервер, установленное
  приложение и источник поставки не изменены; публичный выпуск не выполнялся.
  Окончательный Windows-код скомпилирован с /W4 /WX; проверка Package API вне
  пакета корректно возвращает недоступность. В настоящем WebView2 прошла
  дополнительная проверка значка после замены страницы и одного обращения
  от кнопки, а весь нативный набор повторно прошёл 14/14. Это не сборка нового
  MSIX и не подтверждение работы окна в установленном приложении.

release_notes_round76_native_package: |
  Исправлена причина сбоя первой чистой сборки Windows-установщика: вместо
  лишней обёртки WebView2 для .NET 6 явно выбираются нативные компоненты.
  Удалена дублирующая ссылка на метаданные; необходимые библиотеки WinUI,
  загрузчик WebView2 и регистрация в Windows сохранены. Проверка пакета теперь
  отклоняет случайно попавшую управляемую проекцию; 6 проверок подписи и 2
  примера ошибочного содержимого прошли. Полная первая сборка в новом каталоге
  прошла без повторного использования кэша ошибочного извлечения ресурсов.
  Development-кандидат 0.1.0.8 подписан существующим тестовым сертификатом,
  состав и подпись проверены; настоящий аудиодвижок прошёл самопроверку без
  устройств в отладочном контексте установленного пакета. Это продолжение
  T071 (#5783), не публичный выпуск и не закрытие проверки приложения.
  Новый пакет ещё не установлен; ошибка часов микрофона, живая проверка окон,
  аппаратная матрица, установка обновлений T112 (#7346) и внешняя поставка
  остаются открытыми. Сервер, Mac-приложение и пользовательский профиль этим
  исправлением не менялись; формат записей и очередь отправки сохранены.

release_notes_round77_update_preparation: |
  Добавлена подготовка явной установки обновления Windows с защитой записи
  и локальных файлов. Новые записи и изменения временно не принимаются,
  уже начатые отправки и удаления завершаются. Если подготовка не завершилась
  за 30 секунд, установка не начинается. После передачи Windows отмена
  ожидает подтверждения системы; поздний успешный результат не называется
  откатом. Исправлена защита от повторной обработки системных ответов.
  Установка по умолчанию остаётся недоступной без отдельно утверждённого
  источника; страница не может передать свой адрес или начать установку.
  Для постоянных отказов отправки усилена проверка после перезапуска:
  повторная загрузка не выполняется, чтение и удаление локального файла
  сохраняются. Все 32 переносимых теста прошли; изменённый код скомпилирован
  в Windows, тесты контроллера и проверки ошибок памяти прошли.
  T107 и T112 остаются открытыми до полной приёмки. Настоящая установка
  обновления, ошибка синхронизации микрофона, живая проверка окон и внешний
  выпуск ещё не подтверждены. Новый пакет не собирался и не устанавливался;
  рабочий сервер, Mac-приложение и пользовательские записи не менялись.

release_notes_round78_full_windows_build: |
  После изменений подготовки обновления собран целый пакет Windows 0.1.0.8
  в новом каталоге. Состав и подпись проверены; используется существующий
  тестовый сертификат, не подпись для внешних клиентов. В Windows прошли
  все 32 теста, а на библиотеках новой сборки — 14 сценариев входа и
  12 сценариев платёжного окна в настоящем WebView2 с тестовыми данными.
  Из двух тестовых скриптов удалено устаревшее требование лишней библиотеки
  .NET; обязательные проверки результатов и очистки сохранены.
  Это продолжение T071, T102, T103 и T112, не их полное закрытие.
  Пакет ещё не установлен; реальная запись, ошибка часов микрофона,
  проверка окон и внешняя поставка остаются открытыми. Пользовательские
  записи, установленное приложение и рабочий сервер не изменялись.

release_notes_round79_signin_path_cleanup: |
  Удалён второй сборщик адреса входа Windows, который не использовался
  приложением. Его проверки перенесены на действующие компоненты входа
  и хранилища меток: безопасное место возврата, срок 90 дней без продления,
  очистка, повреждённые данные и недоступное хранилище. Прямые проверки
  фильтрации опасных полей сохранены. Все 32 переносимых теста и свежая
  сборка с 32 тестами непосредственно в Windows прошли.
  Поведение входа, формат хранения и серверные запросы не менялись.
  Это продолжение T106 (#7283), не закрытие проверки системного открытия
  приложения по ссылке. Новый пакет для этой правки ещё не собран;
  установленный GRAF, Mac-приложение и рабочий сервер не изменялись.

release_notes_round80_current_package: |
  После очистки пути входа собран новый полный тестовый пакет Windows
  из текущих исходников. Первая сборка в новом каталоге, проверка состава,
  тестовой подписи и самопроверка настоящего аудиодвижка прошли. Исполняемый
  файл внутри пакета совпадает с результатом сборки, копия на Mac проверена
  по контрольной сумме. Пакет ещё не установлен, публичного выпуска нет.
  Самопроверка не открывает микрофон и не подтверждает исправление ошибки
  часов. Проверка окон, реальной записи, оборудования и установки остаётся
  обязательной. Продолжение T071/T101/T106; задачи полностью не закрыты.

release_notes_round89_native_stop_result: |
  Исправлена потеря ошибки при остановке звукового потока Windows. Теперь
  отказ системного Stop передаётся до завершения потока и не позволяет
  показать успешное завершение записи. Более ранняя причина отказа сохраняется;
  ответ «уже остановлено» не считается ошибкой. Добавлены проверки обоих
  источников, точного кода отказа и единственности финализации.
  На Mac и в Windows прошли все 32 теста; независимая проверка этого
  исправления не выявила P1/P2. Это продолжение T094/T095/T096
  (#7237/#7238/#7239), не полное закрытие задач и не исправление установленного
  в коротком опыте разрыва потока. Реальный микрофон не включался.
  Формат записей, сервер и Mac-приложение не изменены. Новый MSIX не собирался
  и не устанавливался; аппаратная и полная пользовательская приёмка открыты.

release_notes_round91_stop_package: |
  После исправления обработки остановки собран полный Windows-пакет из
  текущих исходников в новом каталоге. Проверены состав, точное совпадение
  исполняемого файла, существующая тестовая подпись и самопроверка настоящего
  аудиодвижка без устройств. Пакет подготовлен для установки, но ещё не
  установлен: работающий GRAF не закрывался принудительно. Это продолжение
  T071/T094/T095/T096/T101, не закрытие задач и не публичный выпуск.
  Причина разрыва потока, реальная запись, приёмка интерфейса и внешняя
  поставка остаются открытыми. Сервер, Mac, настройки и пользовательские
  записи не изменены; форматы и совместимость сохранены.

release_notes_profile_submenu_right_flyout: |
  Исправлено раскрытие общего меню профиля в узком окне: «Вид» и другие
  подходящие разделы открываются вправо, а встроенный список остаётся только
  когда боковой панели не хватает места. Проверено в Chromium и WebKit на
  ширинах 1080, 744, 560, 500, 480 и 375 CSS px, включая клавиатуру,
  положение внутри окна, прокрутку и восстановление фокуса. Это локальная
  правка общего кабинета: публичные веб-ресурсы не развёрнуты, поэтому
  установленное Windows-приложение ещё требует живой визуальной приёмки.
  Рабочий сервер, данные клиентов, Mac-приложение и пакет не менялись.

release_notes_round110_clock_webview_regressions: |
  Добавлены точные проверки дрожания и скачка меток WASAPI, отказа за границей
  допуска и сохранения первого clock fault. Все 32 теста прошли на Mac и в
  Windows. На Windows также прошли 14 сценариев входа и 12 сценариев окон
  оплаты в настоящем WebView2, на локальных синтетических данных; временные
  профили очищены. Порог записи не менялся.
  Самопроверка AEC3 новой сборки падает с 0xC0000409; стек причины пока
  недоступен. Старое установленное приложение не заменялось, поскольку оно
  ещё работает и имеет более высокую версию, чем кандидат. Причина сбоя
  звуковых часов, аппаратная запись и визуальная приёмка открыты. Это не
  закрывает T071/T094/T096/T101/T102/T103 и не подтверждает внешний выпуск.

release_notes_round111_safe_aec3_selfcheck: |
  Проверка настоящего AEC3 теперь заранее отказывается запускать установленный
  GRAF, если приложение уже открыто, и не завершает процесс принудительно при
  тайм-ауте. В Windows подтверждён безопасный отказ при работающем GRAF
  (PID 2256); приложение осталось запущенным и отвечает. Самопроверка точного
  установленного пакета ещё не выполнена: текущий GRAF не закрыт, поэтому
  установка и холодный запуск отложены. Аудиодопуск, формат записей, Mac и
  рабочий сервер не менялись; T101 и аппаратная приёмка остаются открытыми.

release_notes_round112_full_solution_package: |
  Полная сборка Windows и новый MSIX 0.1.0.11 собраны из синхронизированных
  исходников; подпись разработчика, состав пакета и совпадение SHA исполняемого
  файла проверены. В Windows прошли 32/32 теста, WebView2 7/7, аудиосинтетика
  4/4 и custody 3/3. Пакет пока не установлен поверх работающего GRAF; его
  точный холодный запуск и интерфейс не проверены. Повторные schema5 не нашли
  причину clock_drift; порог не менялся. Аппаратная запись, физический Windows
  x64, доступность и полный установочный цикл остаются открытыми. Тестовая
  подпись не предназначена для внешних клиентов; это не публичный выпуск.

release_notes_round115_installed_aec3_verifier: |
  MSIX 0.1.0.11 установлен в Parallels без удаления пользовательского состояния;
  SHA исполняемого файла совпал с пакетом. Исправлена потеря кода завершения
  в проверочном скрипте: дескриптор процесса удерживается до чтения результата
  и освобождается в finally. Штатная проверка настоящего AEC3 из установленного
  MSIX прошла с кодом 73, как и восемь отрицательных проверок сборки компонента.
  Часы и продуктовый аудиокод не менялись. Schema6 по-прежнему отклоняется по
  clock_drift при непрерывном счётчике кадров; влияние VM остаётся гипотезой.
  Найден пробел шифрования локальных буферов в требованиях Windows. Реальная
  запись, аппаратная матрица, интерфейс, доступность и внешний выпуск открыты.

release_notes_round116_clock_architecture_research: |
  Собрана одинаковая диагностика временных меток x64 и ARM64; на каждой
  архитектуре прошли четыре проверки без устройств. Открыто только окно ARM64,
  живое сравнение ещё не выполнено. Синтетический стенд подтвердил: увеличение
  одного порога часов оставляет отказ ниже по аудиопотоку. Требования Windows
  явно наследуют шифрование локальных и временных файлов; исследованы нативные
  механизмы без новых паролей и повышения прав. План защиты и модели часов
  остаётся незавершённым, рабочий аудиокод и пользовательские данные не менялись.
  Это исследование, не подтверждение записи или готовности внешнего выпуска.

release_notes_round117_native_storage_stream_research: |
  Проверен нативный путь кодирования и чтения M4A через IStream/Media Foundation
  без временного media-файла: искусственный секундный сигнал прошёл кодирование,
  шифрование DPAPI/CNG, точное восстановление байтов и декодирование. Подмена
  данных, проверочного тега и номера блока отклоняется. Это исследовательский
  стенд, не внедрённая защита локальных записей; формат, восстановление после
  сбоя, ограничение памяти и работа обычного пользователя ещё требуют проверки.
  Независимое ревью приняло уточнения требований, но общий gate остаётся открыт.

release_notes_round118_dpapi_block_research: |
  На искусственных данных проверена защита отдельных ограниченных блоков DPAPI:
  точное восстановление трёх размеров и шесть отказных сценариев на каждом.
  Успех расшифрования дополнен проверкой структуры, длины и контрольного хеша.
  Исследован безопасный переход между неизменяемыми версиями блоков без новой
  БД или сервиса; найдены недостающие проверки сброса на диск и совместимости
  удаления коротких записей. Это ещё исследование формата, не защита рабочих
  записей и не аппаратная приёмка; пользовательские файлы не изменялись.

release_notes_round119_native_commit_recovery_research: |
  На отдельном локальном диске Windows проверено восстановление искусственных
  зашифрованных блоков при шести принудительных остановках процесса записи.
  До публикации восстанавливается предыдущая версия, после неё новая; временный
  индекс не считается завершённым сохранением. Повреждённая новая версия даёт
  только ограниченное восстановление прежней, повреждение обеих отклоняется.
  Это исследовательский стенд: рабочие записи не менялись, сбой питания,
  полный формат, ресурсы и аппаратная приёмка ещё не проверены.

release_notes_round120_native_arm64_clock_evidence: |
  Сбой часов воспроизведён в нативной диагностике ARM64 при непрерывном счётчике
  кадров и успешном освобождении всех пакетов. Значит, объяснение только
  эмуляцией x64 недостаточно; причина на стороне виртуальной машины пока не
  доказана. Синтетическая проверка всей цепочки подтвердила, что ослабление
  одного порога оставит отказ на следующем этапе. Рабочие аудиоограничения не
  менялись; подготовлено последовательное сравнение с той же диагностикой x64.

release_notes_round121_storage_design_choices: |
  Выбран путь дальнейшего проектирования защиты записей: блоки DPAPI по256КиБ,
  две версии защищённого индекса и чтение исходных байтов без открытого
  временного аудиофайла. Проверены численные границы и защита от переполнений;
  выбран нативный API прослушивания из потока. Найдено различие длительности,
  допускаемой локальным парсером и сервером; лимиты пока не менялись.
  Это ещё проектирование, не внедрённая защита и не приёмка проигрывания.

release_notes_round122_clock_identifiability: |
  Синтетический стенд проверил различие ошибки временной метки и устойчивого
  изменения частоты. Короткая диагностика и сглаживание сами по себе не
  подтверждают правильность часов; потери кадров проверяются независимо.
  Пороги и рабочая обработка звука пока не изменены, аппаратная приёмка открыта.

release_notes_round123_phase_filter_counterexample: |
  Проверка на искусственном тоне отвергла простое сглаживание временных меток:
  оно может убрать отказ, но нарушить выравнивание звука при нормальном уровне.
  Дальнейшее исправление должно согласовывать часы и преобразование частоты,
  а не только проходить проверку длительности. Рабочая обработка пока не менялась.

release_notes_round124_architecture_comparison: |
  Исследовательская диагностика теперь запускается явной командой без ручного
  клика, с видимым индикатором и остановкой, без чтения или сохранения звука.
  Последовательные опыты x64 и ARM64 оба получили сигнал разрыва от Windows;
  одной эмуляцией x64 проблему объяснить нельзя. Все полученные пакеты освобождены.
  Это проверка причины, не исправление рабочей записи и не приёмка выпуска.

release_notes_round124_release_exception_reproducer: |
  В отдельном искусственном опыте воспроизведена ошибка освобождения пакета
  при отказе выделения памяти до копирования звука. Добавлено основание для
  адресной проверки и исправления по существующей задаче аудиозахвата;
  рабочий код пока не менялся. Найден подходящий преобразователь частоты
  в уже используемом WebRTC, без новой библиотеки; его допуск ещё не завершён.

release_notes_round125_release_allocation_fix: |
  Исправлен возврат пакета WASAPI при отказе выделения памяти: освобождение
  выполняется один раз, его ошибка сохраняется, обработка звука не продолжается.
  Подготовка функции освобождения перенесена до получения пакета. Новая
  проверка воспроизвела дефект до исправления и прошла после; полный набор
  переносимых и Windows-проверок прошёл. Живая запись пока не принята.

release_notes_round125_mmcss_probe: |
  Отдельная проверка штатного планирования аудиопотока Windows показала,
  что одной регистрации MMCSS недостаточно: ошибка метаданных сохранилась.
  Звук не читался; рабочие пороги и настройки устройств не изменялись.

release_notes_round126_ratio_waveform: |
  Проверен преобразователь из уже используемого WebRTC на двух искусственных
  сигналах через настоящую временную шкалу приложения. При известных частотах
  изменение размеров блоков и частоты не нарушает форму сигнала; отрицательная
  проверка ловит искажение, незаметное по одному уровню звука. Последний неполный
  блок исследуется отдельно, без добавления тишины. Это исследование, не
  исправленная живая запись; рабочие часы и пакет приложения не менялись.

release_notes_round127_shared_ui_regressions: |
  Повторно проверены общие меню и настройки в Chromium и WebKit. Исправлена
  зависимость тестов времени от часового пояса компьютера и устаревшего способа
  смены зоны; проверки фокуса и выделения усилены. Два точных ожидания текста
  согласованы с уже действующей общей страницей. Код приложения не менялся;
  живая приёмка установленного клиента и исправление часов записи ещё открыты.

release_notes_round128_installed_package: |
  Собран и установлен тестовый MSIX 0.1.0.12 с исправленным освобождением
  аудиопакета при отказе памяти. Состав, прежняя подпись разработки, зависимости
  и совпадение установленного EXE с пакетом проверены; настоящая AEC3 самопроверка
  установленного клиента прошла без включения микрофона. Ошибка часов записи,
  полная приёмка интерфейса и публичный выпуск ещё не закрыты.

release_notes_round132_encryption_plan: |
  Накопленная Windows-работа сохранена одобренным промежуточным коммитом.
  План защиты локальных записей дополнен всей цепочкой: временная запись,
  кодирование, метаданные и очередь, восстановление, воспроизведение, хеширование
  и отправка. Добавлены пять открытых задач на исследование, окончательный
  формат, интеграцию, безопасный переход старых данных и сквозную приёмку.
  Независимая проверка приняла полноту этого дополнения, не готовую реализацию.
  Новое шифрование ещё не внедрено, пользовательские записи не мигрировались;
  аудиочасы, живая приёмка интерфейса и публичный выпуск остаются открытыми.

release_notes_round133_protected_stream_research: |
  На искусственных данных проверена совместная работа защищённых локальных
  блоков и штатного кодирования Windows: точное чтение диапазонов, повторное
  открытие в другом процессе, декодирование и переход по времени. Повреждение
  данных обнаруживается, повреждённые индексы не превращаются в пустую запись.
  Это отдельный исследовательский стенд, не внедрение шифрования в приложение.
  Проверка ограниченного пользователя пока не прошла и требует отдельного
  разбора; воспроизведение, полные ресурсные границы и миграция ещё не приняты.

release_notes_round134_medium_launch: |
  Найдена и исправлена причина отказа исследовательского запуска без прав
  администратора: доступ пользователя отсутствовал в созданном тестовом токене.
  Системные разрешения и UAC не менялись. После исправления запуск прошёл весь
  искусственный опыт защищённого хранения и кодирования Windows с проверкой
  отсутствия прав администратора внутри процесса. Это не изменение приложения
  и не приёмка отдельной обычной учётной записи или установленного клиента.
  Встроенное воспроизведение и полные проверки сохранения ещё открыты.

release_notes_round135_native_playback_research: |
  На искусственных данных проверен штатный плеер Windows, читающий защищённый
  поток без открытой копии записи: старт, пауза, перемотка, продолжение и
  закрытие прошли без прав администратора. Повреждение собственного тестового
  блока вызвало отказ чтения, а не обход защиты. Микрофон и рабочие записи не
  использовались. Это отдельный исследовательский стенд; в приложении путь
  воспроизведения пока не заменён. Полные ресурсные границы, сбои сохранения,
  переход старых данных и сквозная приёмка шифрования ещё остаются открытыми.

release_notes_round136_publish_recovery_research: |
  Восстановлена исчезнувшая рабочая копия и незакоммиченные документы этой
  функции; промежуточный коммит и контрольные суммы плана и задач сохранены.
  На искусственных данных найдена и исправлена коллизия оставшихся после сбоя
  файлов: 28 проверок прерывания сохранения и 16 повторных записей прошли
  с сохранением прежних данных. Усилена проверка точного места введённого
  отказа. Это исследовательский стенд, не изменение хранения в приложении;
  отключение питания, полные ресурсные границы, миграция и сквозная приёмка
  ещё не подтверждены. Пользовательские записи не читались и не менялись.

release_notes_round137_storage_resources: |
  На искусственных данных измерены память, чтение и запись защищённого потока,
  сохранение хвоста и завершение штатного кодирования Windows. Найдено важное
  ограничение: полная проверка 64 МиБ при повторном открытии занимает около
  девяти секунд и должна выполняться вне интерфейса и пути быстрого запуска.
  Отдельно проверен большой защищённый объект индекса; окончательные границы
  разных типов данных ещё нужно принять. Это исследование, не внедрение в
  приложение; пользовательские записи и системные настройки не менялись.

release_notes_round138_large_index_research: |
  На искусственных данных проверены два больших защищённых индекса: выбор
  новой версии, возврат к прежней при повреждении и отказ при повреждении
  обеих. Введённый отказ чтения не меняет сохранённые файлы. Индексы описывают
  размерность 64 ГиБ, но содержат только нулевые записи: медиа такого объёма
  не создавалось. Это отдельный стенд, не изменение приложения; реальная
  потеря ключа Windows и полный путь остановки записи ещё требуют проверки.

release_notes_round139_protected_stop_research: |
  На искусственных пакетах проверено существующее управление остановкой
  вместе с защищённым потоком: порядок данных, конец обоих источников,
  повторный Stop и запрет новой сессии до окончания сохранения. Переполнение,
  отказ приёмника и задержка свыше пяти секунд не дают ложного успеха,
  а сохранённые данные совпадают с ожидаемыми. Это отдельный стенд без
  микрофона и рабочих записей, не внедрение шифрования в приложение.
  По независимой проверке усилено условие достижения введённого отказа;
  свежая сборка и повтор всех пяти случаев прошли.

release_notes_round140_mixed_index_research: |
  На искусственных данных большой защищённый индекс проверен со ссылками
  на блоки в начале, середине и конце, включая короткий последний блок.
  Повреждение новой версии сохраняет доступ к прежней; отказ обеих версий
  не меняет файлы и не выдаётся за пустую запись. Два настоящих отказа
  расшифровки Windows также сохранили данные. Это исследовательский стенд,
  не изменение установленного приложения и не проверка потери ключей
  профиля; полная приёмка защищённого хранения ещё остаётся открытой.
  По независимой проверке усилено подтверждение причины отказа неверного
  индекса: расшифровка обязана пройти до проверки содержимого. Свежая
  сборка и повтор опыта прошли; код приложения в этом раунде не менялся.

release_notes_round141_combined_mf_io_research: |
  Завершено недостающее измерение чтения и записи в совместном исследовательском
  пути защищённого хранения и штатного кодирования Windows. Искусственная запись
  завершилась, повторно открылась, декодировалась и прошла перемотку; прежние
  проверки точных данных и сохранения хвоста также прошли. Большие записи
  по-прежнему требуют фоновой проверки, без задержки интерфейса и начала записи.
  Это исследование перед проектированием, не обновление установленного клиента
  и не полная приёмка производительности или защиты пользовательских записей.
  Независимая проверка приняла этот исследовательский этап; далее необходимо
  принять окончательные правила хранения и восстановления до внедрения в код.

release_notes_round142_protected_custody_design: |
  Подготовлен проект правил защищённого локального хранения Windows: точные
  данные записи сохраняются для воспроизведения и отправки, повреждённая очередь
  не заменяется пустой, а прежние записи переходят без перекодирования и смены
  идентификаторов. Правила ещё проходят независимую проверку; шифрование
  установленного приложения и миграция пользовательских данных не объявлены
  выполненными. Запись звука и общая приёмка Windows остаются открытыми.

release_notes_round144_custody_design_review: |
  По независимой проверке уточнены правила восстановления очереди после потери
  файла, перехода со старого хранения и подтверждения фонового сохранения.
  Удаление и отправка не должны начинаться по одному факту постановки работы
  в очередь; потеря нового состояния не должна отменять запрет на отправку.
  Служебные данные и временные файлы получили строгие правила проверки.
  Это исправление проекта перед внедрением, не обновление приложения;
  повторная независимая проверка и полная приёмка Windows ещё не завершены.

release_notes_round146_migration_design_review: |
  Уточнён первый переход со старой очереди: создание защитного режима больше
  не требует готовую новую очередь раньше копирования данных. После сбоя
  промежуточное состояние не должно разрешать отправку или создавать пустой
  реестр. Защитный маркер получил отдельные правила проверки и сохранения
  после перезапуска. Это проект перед внедрением; повторная независимая
  проверка и приёмка установленного приложения остаются открытыми.

release_notes_round156_mix_parity_research: |
  Сравнение по существующим проверкам Mac подтвердило качество подавления эха
  Windows на искусственных входах и выявило отдельное расхождение громкости:
  Windows складывал компоненты без коэффициента 0,5, который применяет Mac.
  Изолированный кандидат устранил разницу и прошёл все 31 проверки без изменения
  порогов. Это проверка решения перед внедрением, не обновление приложения;
  часы записи, защищённое хранение и установленный клиент ещё не приняты.

release_notes_round158_independent_audio_origins: |
  Проверен исследовательский вариант синхронизации источников с разными
  моментами запуска, независимыми счётчиками и дробными временными метками.
  Проверки общего интервала, голоса и уровня системного звука прошли;
  четыре дополнительные длинные проверки подавления эха сохраняют отказ.
  Отдельно показано, что непрерывность счётчика не доказывает точность первой
  метки. Это уточнение проекта часов, не обновление установленного приложения
  и не завершение общей приёмки Windows.

release_notes_round162_clock_candidate_gap: |
  Уточнён проект синхронизации звука без предварительного требования аппаратной
  калибровки первой метки. Отрицательная проверка на 48 000 искусственных пакетах
  показала, что новая ровная шкала времени может скрыть скачок, который текущая
  версия правильно отвергает. Этот пробел оставлен явным до исправления проекта.
  Производственный звуковой тракт и установленное приложение не изменены;
  запись, защищённое хранение и окончательная приёмка Windows ещё не завершены.

release_notes_round164_single_audio_timeline: |
  Проект звукового тракта уточнён без второй копии старого преобразователя:
  новые семплы с исходными временными метками проходят существующую временную
  шкалу, которая действительно исправляет небольшие расхождения и отвергает
  разрывы. Нативная исследовательская проверка Windows подтвердила предложенный
  предел входного буфера на 11 частотах; проверено относительное округление меток.
  Это ещё проект перед внедрением, не исправление установленной записи и не
  завершённая приёмка Windows. Проверка меню ждёт разблокировки Mac.

release_notes_round166_witness_quality_rejection: |
  Полная исследовательская звуковая цепочка Windows прошла проверки остановки
  при разрыве, но проверка ненулевого звука выявила сильную потерю подавления
  эха при небольших допустимых колебаниях временных меток. Сравнение с точными
  метками подтвердило регрессию; отключение плавной коррекции её не устранило.
  Этот вариант не перенесён в приложение, требования качества не снижены.
  Ошибка записи в Parallels и общая приёмка Windows остаются открытыми.

release_notes_round167_bounded_phase_research: |
  Другой исследовательский вариант преобразования звука прошёл 12 проверок
  качества при колебаниях временных меток и разных частотах часов устройств.
  Проверки остановки при скачке времени также прошли. По независимой проверке
  добавлен исполнимый предел накопленного входа; неиспользуемые старые
  проверочные пути удалены из нового варианта. Это не обновление приложения:
  ещё требуется согласовать защиту от соседних скачков меток, исправить живую
  запись в Parallels и пройти полную приёмку Windows.

release_notes_round168_adjacent_phase_guard_research: |
  Дополнительная проверка воспроизвела скачок между двумя отдельно допустимыми
  временными ошибками. В исследовательском варианте добавлен отдельный контроль
  такого перехода: теперь он останавливает выдачу звука, а прежние 12 проверок
  качества и проверки отказов проходят без изменения порогов.
  Это проверка проекта до внедрения, не обновление установленного приложения.
  Живая ошибка часов в Parallels и общая приёмка Windows остаются открытыми.

release_notes_round169_partition_research: |
  Исследовательская проверка выявила зависимость звукового сигнала от размера
  входных пакетов при включённой коррекции. Учёт точности представления временных
  меток устранил несовпадения в 44 сравнениях без увеличения допусков.
  Отдельный расчёт подтвердил полный пригодный диапазон в этих проверках;
  12 проверок качества и проверки остановки при разрывах также прошли.
  Это изменение проекта до внедрения, не обновление приложения: ошибка живой
  записи в Parallels и окончательная приёмка Windows ещё не закрыты.

release_notes_round170_native_support_research: |
  Проверены большие начальные временные метки и дробное начало записи.
  Независимое наблюдение настоящего звукового ядра подтвердило, что отбирается
  полный пригодный диапазон без начальных неподтверждённых данных; 792 сравнения
  разных размеров пакетов прошли без изменения допусков. Отдельное расхождение
  с идеальной математической моделью сохранено и объяснено округлением дробного
  шага. Это уточнение проекта, не обновление установленного приложения и не
  подтверждение исправления живой записи в Parallels.

release_notes_round171_numeric_residual_research: |
  В исследовательском звуковом варианте исправлена потеря точности при очень
  больших счётчиках и выбор соседнего отсчёта из-за округления. Проверки расчёта,
  полноты пригодного звука, качества и остановки при разрывах прошли в Windows
  без увеличения допусков. Это исправление проекта до внедрения; оно не объясняет
  текущую ошибку часов в Parallels и не меняет установленное приложение.

release_notes_calendar_join_design: |
  Уточнён отсутствующий в Windows общий сценарий календарного подключения:
  актуальная ссылка проверяется заново, повторное нажатие не открывает второй
  переход, а восстановление в браузере требует явного действия. Согласованы
  требования, границы моста, состояния и проверки отмены после смены аккаунта.
  Это проект до внедрения, не подтверждение работающей кнопки или готовности Windows.

release_notes_round176_clock_actuator_research: |
  Найдена причина отказа исследовательского преобразования звука при сочетании
  дрейфа и колебаний временных меток: ограничение силы коррекции было слишком
  малым. Отдельный вариант прошёл 12 проверок качества и повторные проверки
  остановки при разрывах и переполнении без увеличения допустимой ошибки часов.
  Также подтверждён запуск домашнего окна настоящего Windows-клиента Телемоста.
  Это проверка проекта до внедрения: установленное приложение не обновлялось,
  живая ошибка записи в Parallels и окончательная приёмка Windows не закрыты.

release_notes_round177_long_stream_research: |
  Исследовательский звуковой вариант обработал час искусственного сигнала
  потоково через преобразование частоты и подавление эха без отказа и сохранения
  звука; отклонение итоговой длительности составило 10 мс. Это длительная
  проверка алгоритма до внедрения, не реальная запись и не обновление приложения.
  Ошибка живых часов в Parallels, завершение записи и общая приёмка ещё открыты.

release_notes_round178_partition_counterexample: |
  Дополнительная проверка исследовательского звукового варианта выявила различия
  сигнала при разных размерах входных пакетов и постоянном дрейфе часов.
  Причина воспроизводится независимо от размера выходного блока. Вариант пока
  не внедряется: требуется исправить расчёт коррекции без увеличения допусков.

release_notes_round180_fixed_grid_research: |
  Причина зависимости исследовательского звука от входных пакетов воспроизведена
  даже без округления временных меток. Отдельный расчёт на фиксированной сетке
  устранил это расхождение на точных метках, но случаи с округлёнными метками ещё
  не проходят прежний допуск. Это проверка алгоритма до внедрения; приложение
  не обновлено, живая запись и окончательная приёмка остаются открытыми.

release_notes_round183_causal_grid_research: |
  Исследовательский звуковой вариант теперь использует только полученные
  временные метки и ограниченный буфер фактически скопированных данных.
  На точных метках выход совпадает при разных размерах пакетов, в том числе
  при дробном расчёте времени. Расширенная проверка округлённых меток всё ещё
  выявляет различия: допуски не увеличены, внедрение пока не выполнено.
  Установленное приложение, реальная запись и окончательная приёмка не закрыты.

release_notes_round185_causal_quality_research: |
  Новый исследовательский расчёт звука прошёл 12 проверок с настоящим подавлением
  эха без изменения прежних требований к качеству. Проверка запуска встреч также
  выявила, что открытый ключ ассоциации Windows не закрепляет ранее проверенного
  получателя ссылки. Это результаты до внедрения: приложение не обновлялось,
  ошибки живой записи и окончательная приёмка Windows остаются открытыми.

release_notes_round188_physical_truth_research: |
  Исследовательский звуковой расчёт проверен относительно независимого эталона
  и фактической позиции преобразователя: девять сценариев и 18 проверок прошли,
  контрольный сдвиг времени обнаружен. Исправлены две ошибки проверочного кода.
  Требования не ослаблялись; это ещё не исправление установленного GRAF,
  живая запись, защищённое хранение и окончательная приёмка остаются открытыми.

release_notes_round190_causal_support_bounds: |
  Исследовательское преобразование звука прошло 47 проверок полноты принятого
  сигнала и окончания без придуманной тишины; намеренно потерянный хвост обнаружен.
  Отдельные проверки выявили недостаточность прежнего предполагаемого буфера
  и подтвердили безопасный отказ при задержке потребителя без перезаписи данных.
  Размеры памяти и длинная работа ещё требуют обоснования. Это не обновление
  установленного приложения: живая запись и окончательная приёмка не закрыты.

release_notes_round193_long_fifo_counterexample: |
  Установлена причина роста исследовательского звукового буфера на длинном
  потоке: ожидание пакетов расходилось с фактическим потреблением данных.
  Отдельный вариант прошёл десять минут искусственного потока и проверки
  полноты сигнала, но расширенное сравнение выявило оставшиеся расхождения.
  Допуски не увеличены; вариант ещё не перенесён в приложение. Живая запись,
  качество и окончательная приёмка Windows остаются открытыми.

release_notes_round196_native_kernel_research: |
  Проверка звукового расчёта отделила небольшое расхождение временных позиций
  от скачка внутри преобразователя частоты. Скачок воспроизведён без микрофона
  и часов виртуальной машины. Отдельная тестовая правка уменьшила ошибки
  расширенного сравнения до пяти из 132, но прежние требования ещё не пройдены.
  Менять допуски и переносить этот вариант в приложение пока нельзя.
  Установленный GRAF не обновлялся; живая запись и общая приёмка ещё открыты.

release_notes_round199_clock_uncertainty_research: |
  Проверка показала, что оставшееся расхождение звука возникает ещё до остановки.
  Отдельный расчёт допустимых интервалов округления сократил ошибки до одной
  из 132; последняя проверка всё ещё не проходит прежний допуск.
  Дополнительные проверки защищают числовые границы и обнаруживают несовместимые
  метки. Этот опыт предполагает идеальное начало и постоянную частоту:
  переносить такие предпосылки на реальные устройства пока нельзя.
  Приложение не обновлялось; приёмка записи и Windows остаётся открытой.

release_notes_round202_clock_premises_and_kernel: |
  В отдельной проверке устранён скачок на границе преобразователя звука,
  сохранена симметрия фильтра и пройдены 18 проверок подавления эха и времени.
  Полное сравнение всё ещё выявляет пять расхождений из 132: допуски не изменены.
  Дополнительно показано, что идеальная модель постоянных часов не подходит
  для неточной первой метки и меняющейся частоты. Эти варианты пока не внедрены.
  Установленный GRAF не обновлялся; запись и окончательная приёмка ещё открыты.

release_notes_round203_storage_design_and_stream_hash: |
  Принят отдельно проверенный проект защищённого хранения Windows; его
  разработка не требует ждать исправления аудиочасов, но условия выпуска
  остаются прежними. Начато изменение общего вычисления SHA-256: запись
  читается небольшими блоками, а ошибка чтения не подменяется хешем пустых
  данных или успешного префикса. Потоковый хеш в Windows использует системный CNG.
  Это первый шаг, не готовое шифрование приложения. Перенос рабочих записей,
  установленная сборка, живая запись и полная приёмка пока не выполнены.
release_notes_round204_hash_failure_fences: |
  Устранены опасные последствия отказа системного хеширования Windows:
  идентификаторы больше не зависят от доступности этого механизма, а отправка
  записи блокируется до запроса к серверу, если проверить её манифест нельзя.
  Добавлены проверки намеренных отказов Windows и повреждённого допуска к отправке.
  Это не означает готовность полного шифрования хранения или выпуска.
release_notes_round205_protected_custody_codec: |
  Реализован системный формат защищённых блоков и индексов Windows.
  До успешного чтения проверяются запись-владелец, роль, версия, размер
  и контрольная сумма; повреждённые данные не подменяются пустыми файлами.
  Проверки на искусственных данных прошли в Windows и на Mac, приложение
  Windows собирается. Перевод всей записи, очереди и воспроизведения на это
  хранение ещё не завершён; рабочие записи и установленный GRAF не менялись.
release_notes_round206_protected_custody_files: |
  Добавлен файловый слой защищённых блоков и индексов Windows: проверка владельца,
  прав доступа и размера до записи, полная запись с повторной проверкой;
  повреждение и неопределённый результат не превращаются в успешное сохранение.
  Устранён дефект блокировки каталогов, добавлены проверки подмены пути и отказов.
  На окончательных исходниках прошли 36 тестов в Windows и 35 на Mac,
  полная Windows-сборка и независимая проверка кода. Подключение всей записи,
  очереди, воспроизведения и перенос прежних данных ещё не завершены.
  Установленный GRAF и рабочие записи не менялись; готовность выпуска не заявляется.
release_notes_round207_protected_snapshot_recovery: |
  Защищённое хранилище Windows проверяет оба индекса и все блоки до выбора
  сохранённого состояния. Системные отказы не подменяются повреждением данных;
  восстановленный префикс явно отличается от полностью сохранённой записи.
  Добавлены проверки повреждения, прерывания и настоящих отказов Windows.
  После отрицательного контрольного опыта восстановленный код снова прошёл
  36 тестов в Windows; независимая проверка исходников не нашла блокеров.
  Подключение всего пути записи, отправки и воспроизведения ещё не завершено.
  Установленное приложение и рабочие записи не менялись; выпуск не объявляется.
release_notes_round208_custody_owned_memory: |
  Защищённые буферы и индексы Windows получили общий лимит памяти 64 МиБ.
  Копии и рост буферов учитываются до выделения памяти; передача результата
  не снимает учёт раньше освобождения. Исчерпание бюджета блокирует запись
  и не выдаётся за повреждение или успешно восстановленную запись.
  На окончательных исходниках прошли 36 тестов Windows, 35 тестов на Mac,
  полная Windows-сборка и независимая проверка кода.
  Лимит всего приложения, кэш, удержание снимков и полный путь хранения
  ещё не приняты. Установленное приложение и рабочие записи не менялись.
release_notes_round209_protected_reader: |
  Реализовано чтение защищённой записи Windows без открытого временного файла:
  точные блоки и хвост, перемотка, независимые копии и удержание снимка.
  Общие ограничения памяти и числа потоков действуют до их фактического освобождения.
  Отказы и отмена чтения не выдаются за успешную передачу последнего блока.
  На окончательных исходниках прошли 36 тестов Windows, 35 общих тестов на Mac,
  полная Windows-сборка и повторная независимая проверка кода.
  Настоящий адаптер Media Foundation проверен на искусственных данных;
  подключение всей записи, очереди, отправки и воспроизведения ещё не завершено.
  Установленное приложение и рабочие записи не менялись; готовность выпуска не заявляется.
release_notes_round210_protected_metadata: |
  Добавлено защищённое сохранение полного значения служебных данных Windows:
  очереди, состояния записи, восстановления и перехода старых копий.
  Публикация подтверждается повторным чтением точных блоков и индексов;
  частичный отказ запрещает дальнейшую запись через тот же объект,
  сохраняя файлы для проверки и восстановления.
  Проверка воспроизвела найденный дефект до исправления и прошла после него.
  На окончательных исходниках прошли 36 тестов Windows, 35 общих тестов на Mac,
  полная Windows-сборка и повторный независимый обзор кода.
  Подключение всей записи, отправки и воспроизведения ещё не завершено.
  Установленное приложение и рабочие записи не менялись; выпуск не объявляется.
release_notes_round211_protected_media_writer: |
  Добавлено ядро защищённой записи Windows с перемоткой, изменением размера
  и подтверждённым сохранением точных блоков без открытой временной копии.
  Полностью восстановлена рабочая копия из автоматического снимка Git:
  последние исходники, требования и отчёты проверки не потеряны.
  Проверены завершившиеся тесты Windows и Mac и свежая полная Windows-сборка.
  Независимый обзор исходников не нашёл блокирующих дефектов ядра.
  Длительная запись и скорость полного повторного чтения ещё не приняты;
  подключение всей цепочки приложения продолжается. Рабочие записи,
  установленное приложение, macOS и сервер не менялись; выпуск не объявляется.
release_notes_round212_writer_scaling_probe: |
  Расширены проверки отказов защищённого сохранения Windows.
  На свежих исходниках прошли 36 тестов Windows и 35 общих тестов на Mac.
  Отдельная проверка на искусственных данных выявила замедление при росте
  файла: сохранение последнего блока на 64 МиБ заняло 3,42 секунды.
  Это блокирует подключение текущего пути к длительной записи;
  проверка целостности не ослаблена, готовность производительности не заявлена.
  Сравнение с master также выявило точные недостающие платёжные переходы
  и нативные расхождения календаря, напоминаний и клавиатурной навигации.
  Рабочие записи, установленное приложение, macOS и сервер не менялись.
release_notes_round213_billing_route_parity: |
  Windows теперь разрешает четыре точных платёжных перехода, уже доступных
  в Mac: выбор места хранения, отмену выбора, предварительный расчёт
  раннего продления и подтверждение покупки. Серверная логика оплаты не менялась.
  Добавлены проверки подмены адреса, запрещённых соседних путей и возврата
  после входа без автоматического повторения платёжного действия.
  Новый тест воспроизвёл дефект до исправления и прошёл после него;
  повторно прошли все 36 тестов Windows и 35 общих тестов на Mac.
  Независимые проверки требований и исходников не нашли блокирующих замечаний.
  Живая проверка установленного приложения и полный выпуск ещё не завершены.
release_notes_round214_native_hash_lifetime: |
  Убрано повторное открытие SHA-256 алгоритма Windows для каждой проверки:
  используется системный алгоритм и отдельный вычислитель для каждой суммы.
  Ошибки вычисления не включают запасной путь и не разрешают отправку файла.
  Проверки отказов переведены на действующий вызов без потери проверки
  нехватки памяти, сохранности файлов и освобождения ресурсов.
  Прошли 36 тестов Windows, 35 общих тестов на Mac и полная Windows-сборка.
  Проверка на искусственных 64 МиБ снова выявила ограничение скорости:
  повторное чтение всех старых блоков нужно устранить отдельно.
  Устойчивое ускорение и готовность длительной записи не заявляются.
  Рабочие записи и установленное приложение не менялись; выпуск не объявляется.
release_notes_round215_storage_design_amendment: |
  Согласовано изменение проверки больших локальных записей: новые данные
  проверяются до подтверждения сохранения, старые — при чтении и полном
  повторном открытии. Наследование проверки действует только при непрерывном
  владении файлом; обнаруженная ошибка не разрешает обычную отправку.
  Шифрование Windows и запрет возврата к старому реестру сохранены.
  Определён новый формат, границы памяти и правила восстановления и удаления.
  Независимая проверка выявила три пробела; требования уточнены перед кодом.
  Искусственные проверки Windows подтвердили выбранные правила совместного
  доступа к файлу; это не приёмка записи или нового формата в приложении.
  Рабочие записи, установленное приложение, macOS и сервер не менялись.
release_notes_round216_packed_wire: |
  Принят проект обновлённого хранения Windows и начата его реализация.
  Добавлены точная кодировка заголовка и строгий разбор ссылок на блоки:
  неизвестные типы, неверные размеры, версии, границы и переполнение отвергаются.
  Новые проверки используют только искусственные байты; разбор структуры
  сам по себе не подтверждает шифрование или сохранность записи.
  Пройдены 37 проверок Windows и полная сборка приложения.
  Подключение формата к записи, проигрыванию, отправке и переносу старых
  данных остаётся отдельной работой. Установленное приложение не менялось.
release_notes_round217_packed_codec: |
  Реализована защита новых блоков, узлов и заголовков хранения Windows:
  точные размеры, контекст и контрольные суммы проверяются до использования.
  Общий нативный механизм защиты повторно используется прежним форматом.
  Независимая проверка выявила пробел в тесте отказа выделения памяти;
  тест усилен, итоговая проверка исходников завершена без замечаний.
  Пройдены 39 проверок Windows, 37 переносимых проверок и полная сборка.
  Новый формат ещё не подключён ко всей цепочке записи и переносу данных;
  установленное приложение, рабочие записи и сервер не менялись.
release_notes_round218_packed_owner: |
  Добавлен нативный слой удержания защищённого файла Windows и ограниченного
  чтения/добавления зашифрованных блоков. Живые результаты чтения удерживают
  тот же файл; внешняя запись, изменяемые проекции памяти, жёсткие ссылки и
  дополнительные потоки проверяются на отказ. Сбой после начала записи
  заголовка сохраняет неопределённый результат и запрещает следующие изменения.
  Исправлены порядок фиксации ошибки под блокировкой, обработка нехватки памяти,
  границы чтения и некопируемый счётчик нативных задач. Пройдены 40 проверок
  Windows, 38 переносимых проверок и полная сборка приложения.
  Это ещё не завершение нового формата хранения: проверка всего дерева,
  подключение к записи/отправке и перенос старых данных остаются отдельной работой.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round227_packed_resize: |
  Защищённое дерево записи теперь умеет обрезать и увеличивать размер,
  не возвращая отброшенные байты. Дополнение нулями не создаёт огромный файл;
  старые открытые читатели сохраняют свои данные и прежнюю длину.
  Используется общий механизм добавления и перезаписи, без второго хранилища.
  Проверены окончательные тесты Windows Release/Debug, искусственные отказы
  чтения/записи/сброса на диск и 39 переносимых проверок. Это этап хранения:
  подключение к записи, проверка установленного приложения и выпуск ещё впереди.
release_notes_round226_manifest_capacity: |
  Подготовлено защищённое хранение истории пауз: допустимый размер сведений
  о записи увеличен с 4 до 64 КиБ внутри существующего кодека. Остальные
  ограничения памяти, очередей и звука не менялись. Проверены точное чтение,
  шифрование Windows, отказ при превышении размера и нехватке памяти.
  Пройдены 41 проверка Windows Release, две актуальные группы Windows Debug
  и 39 переносимых проверок. Требования паузы уточнены по текущему Mac;
  само управление паузой и подключение защищённого писателя ещё не завершены.
  Это подготовительный этап, не готовое приложение. Установка, рабочие
  записи, macOS, сервер и публичный выпуск не менялись.
release_notes_round219_packed_tree: |
  Реализована проверка обеих текущих версий защищённого файла Windows
  и ограниченное чтение блоков из проверенного дерева без плоского индекса.
  Добавлены проверки повреждений, сохранения старой версии, нехватки памяти
  и одновременного чтения/сохранения. Воспроизведён и исправлен аварийный
  отказ отладочной сборки при передаче результата на пределе памяти;
  ограничения памяти и проверки защиты не отключались.
  Исправлены первый запуск кэша при закрытии чтения, потеря удержания файла
  при неудачном перемещении результата и аварийный отказ создания метаданных
  на пределе памяти. Безопасная передача памяти теперь применяется и к индексу;
  при неудачной передаче метаданных сохраняются удержание файла и состояние
  операции. После чистой пересборки кода и обновления проверок пройдены
  39 переносимых проверок, 41 проверка Windows Release и четыре группы
  Windows Debug с проверками отказов и служебной памяти.
  Полная пересборка Visual Studio Release/x64 и проверки собранного ядра
  завершились успешно. Новый EXE не устанавливался и не выдаётся за
  проверенный пользовательский пакет. Независимая проверка приняла текущие
  исправления без критических замечаний; отдельная граница покрытия ошибки
  возврата метаданных сохранена в отчёте, не объявлена пройденной.
  Подключение нового хранения ко всей цепочке приложения,
  перенос старых данных и полная приёмка остаются отдельной работой.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round221_packed_full_block: |
  Реализована последовательная дозапись одного полного блока защищённого
  хранения Windows с ограниченной проверкой изменённых узлов дерева.
  Новая версия подтверждается только после сохранения на диск, проверки
  обеих ячеек заголовка и повторного чтения новых блоков. При сбое сохраняются
  исходный файл, первая ошибка и запрет небезопасного повторения операции.
  Добавлены проверки границ, удержания старой версии, подмены корректного
  заголовка, отказов чтения/записи и нехватки памяти до фиксации новой версии.
  Пройдены 41 проверка Windows Release, две группы Windows Debug и
  39 переносимых проверок. Независимая проверка приняла этот ограниченный
  этап после усиления теста допустимой подмены ссылки внутри узла дерева.
  Это основа нового хранения, ещё не подключённая
  к полной цепочке записи, воспроизведения, отправки и переноса старых данных.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round222_packed_short_tail: |
  Расширен существующий путь защищённого хранения Windows: добавлены точное
  сохранение неполного блока и полная замена последнего короткого блока
  без неявного усечения или дополнения нулями. Старые версии сохраняют свои
  байты и длину; пределы памяти и проверки фиксации новой версии сохранены.
  Добавлены проверки границ, старых версий, отказов и подмены соседних ссылок.
  Независимая проверка требований пройдена; 39 переносимых проверок пройдены.
  Обе группы новых проверок непосредственно в Windows прошли в Release и
  Debug; остальные 39 проверок Windows также прошли. Независимая проверка
  приняла исходники этого ограниченного этапа без замечаний.
  Сборка приложения Visual Studio Release/x64 завершилась успешно; новый
  исполняемый файл не устанавливался и не выдаётся за проверенную версию для клиентов.
  Подключение ко всей цепочке приложения и общая приёмка остаются открытыми.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round223_packed_existing_block: |
  Существующий путь защищённого хранения Windows теперь поддерживает полную
  замену одного существующего блока, не меняя соседние данные и короткий хвост.
  Старые версии сохраняют свои точные байты; запрещены запись за концом файла,
  неявное усечение и подмена соседних ссылок. Удалён прежний отдельный тестовый
  метод замены хвоста: обе операции используют один путь фиксации.
  Добавлены проверки первого, среднего и последнего блока, границ дерева,
  сохранности старых версий, файловых отказов и корректно защищённого блока
  с недопустимой длиной. Пройдены все 41 проверка Windows Release и
  39 переносимых проверок, а также обе группы хранения в Windows Debug.
  Приложение Release/x64 собрано без установки; независимая проверка приняла
  исходники этого ограниченного этапа без замечаний. Полная цепочка не принята.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round224_packed_reader: |
  Существующий механизм чтения Windows расширен для нового защищённого
  снимка записи. Сохранены чтение по диапазонам, перемотка, независимые
  позиции клонов, общая отмена и ограниченный кэш без открытых файлов звука.
  Старый снимок удерживает свои байты и владельца файла до фактического
  освобождения последнего потока, даже после смены текущей версии.
  Память каждого объекта потока теперь учитывается в общем пределе;
  прежний тест клона уточнён для проверки выделения и точного освобождения.
  При ошибке чтения скопированный префикс очищается, первая ошибка сохраняется
  и дальнейшее чтение всех клонов блокируется. Независимая проверка требований
  пройдена. На окончательных исходниках пройдены 41 проверка Windows Release,
  три группы Windows Debug и 39 переносимых проверок. Сборка приложения
  Release/x64 завершилась без установки; независимая проверка приняла
  исходники и результаты этого ограниченного этапа без замечаний.
  Это ограниченный этап хранения, не подтверждение готовности приложения.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round228_packed_writer: |
  Существующий механизм защищённой записи Windows расширен для нового
  формата хранения: частичная запись, изменение заголовка, запись через
  границу блока, явные пустые промежутки и изменение длины используют
  одного владельца файла и один буфер. Старые версии чтения не меняются;
  отрезанные данные не возвращаются после повторного увеличения длины.
  Исправлены отмена между сохранениями, передача первой файловой ошибки
  и учёт памяти самого объекта записи. Подтверждены очистка памяти до
  освобождения и прекращение новых записей после ошибки или отзыва права.
  Новые проверки прошли в Windows Release и Debug; переносимые проверки
  прошли 39/39. Полный набор Windows Release прошёл 41/41, приложение
  Release/x64 собрано с проверенной библиотекой AEC3 без установки;
  независимая проверка приняла исходники этого ограниченного этапа.
  Результаты фиксируются в validation-2026-10-02.md; готовность приложения
  этим этапом не подтверждается. Подключение к кодированию, отправке,
  воспроизведению и установленному приложению ещё не завершено.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round229_packed_cadence: |
  Добавлено измерение последовательного защищённого хранения Windows
  на искусственных звуковых кадрах без чтения микрофона или рабочих записей.
  Проверены рост до 64 МиБ, сохранность прежнего снимка, точный короткий
  остаток и побайтное восстановление после закрытия и повторного открытия.
  Исправлены счётчик узлов и предел последовательной записи в самом тесте;
  код хранения и защитные ограничения для прохождения проверки не менялись.
  Два длинных прогона, короткая проверка Debug, все 41 проверка Windows
  Release и 39 переносимых проверок завершились успешно.
  Независимая проверка приняла этот ограниченный измерительный тест.
  Это проверка хранения, не подтверждение часовой записи, кнопки Стоп
  или готовности приложения. Подключение к кодированию, воспроизведению,
  отправке и строгому формату метаданных остаётся отдельным этапом.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round232_calendar_response: |
  Закреплён подтверждённый ключ schema для метаданных защищённого хранения;
  логический формат записей v5 не меняется. Для календарного подключения
  Windows добавлены проверка идентификатора события и строгий разбор ответа
  сервера в существующем клиенте API. Проверяются совпадение события, JSON,
  Unicode и ограничения размера; неизвестные корректные поля игнорируются.
  Ссылка с параметрами сохраняется без изменений, но разбор ответа сам по
  себе ещё не разрешает её запуск. Проверки прошли: переносимые 39/39,
  календарный набор Windows Release/x64 1/1 на свежей копии внутри VM.
  T119 отслеживается в GitHub #7540 и остаётся открытой: получение ссылки,
  запуск приложения, отмена и приёмка установленной версии ещё впереди.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round233_calendar_resolver: |
  Добавлено получение свежей ссылки календарной встречи через существующий
  нативный HTTP-код Windows. До запроса проверяются событие, подтверждённый
  аккаунт и рабочее пространство; ответы после отмены или истечения общего
  срока не разрешают переход. Ответ ограничен 64 КБ с проверкой полного
  чтения; перенаправления и cookies выключены. Сетевые дескрипторы закрываются
  автоматически тем же рабочим потоком, в том числе при исключениях.
  Независимая проверка приняла этот ограниченный этап без замечаний.
  Переносимые проверки прошли 40/40, Windows Release/x64 в Parallels — 43/43;
  исправлена однострочная несовместимость теста хранения с MSVC.
  Это ещё не готовая кнопка Подключиться: общий обработчик, проверка ссылки,
  запуск приложения и приёмка установленной версии остаются в открытой T119.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round234_calendar_url: |
  Для календарных ссылок Windows введён один общий обработчик проверки HTTPS.
  Он сохраняет параметры подключения, проверяет международные имена, порты,
  недопустимые символы и адреса по общему набору правил Mac и сервера.
  Старый параллельный обработчик заменён вызовом общей проверки. Исправлена
  найденная независимой проверкой ошибка: неверный IPv6-адрес с точкой больше
  не исправляется и не принимается. Новых внешних зависимостей нет.
  Итоговая независимая проверка кода — без замечаний; проверки после исправления:
  переносимые 41/41, Windows Release/x64 в Parallels — 44/44.
  Общий набор 141 календарной ссылки сохранён без изменения ожидаемых результатов.
  T119 остаётся открытой: единая операция подключения, запуск приложения,
  восстановление после отказа и приёмка установленного пакета ещё впереди.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round235_calendar_operation: |
  Добавлена единая логика состояния календарного подключения Windows:
  повторное нажатие не создаёт параллельную попытку, отменённый ответ не
  меняет новую операцию. После отмены занятость сохраняется до фактического
  завершения работы, которое должен подтвердить нативный обработчик.
  Смена аккаунта, рабочего пространства, сеанса или документа отменяет
  применение результата. Проверяются общий срок получения ссылки и
  новый срок после явного подтверждения перехода в браузер; исходный срок
  действия не продлевается. Новых внешних зависимостей нет.
  Независимая проверка приняла этот ограниченный код без замечаний;
  дополнительные проверки подмены завершения и предельного времени также
  добавлены. Итоговые проверки: переносимые 42/42, Windows Release/x64
  в Parallels 45/45. Это ещё не работающая кнопка Подключиться:
  подключение к кабинету, меню, карточке и запуску приложений, а также
  проверка установленного пакета остаются в открытой T119.
  Установленное приложение, рабочие записи, macOS и сервер не менялись.
release_notes_round236_calendar_launcher: |
  Реализован нативный обработчик запроса запуска календарной встречи Windows.
  Zoom и Teams выбираются по проверенным адресу и пути, Телемост — через
  штатную связь HTTPS с приложением. Параметры подключения сохраняются как
  в Mac; неверный UTF-8 в пути не допускает нативного запуска.
  Отмена не выдаётся за завершение системного запроса; поздний ответ не
  применяется. Неизвестное состояние сохраняет занятость, повторное нажатие
  не создаёт второй запрос. Переход в браузер не запускается автоматически
  после ошибки. Новых внешних зависимостей или параллельного интерфейса нет.
  Независимая проверка ограниченного кода принята без открытых замечаний;
  после исправления пути прошли переносимые 43/43 и Windows Release/x64
  в Parallels 47/47. Это проверки исходников и системных интерфейсов на
  искусственных данных, не сквозной запуск настоящего приложения встречи.
  T119 открыта: подключение к кнопке кабинета, карточке, меню и диалогу,
  проверка входа и допуска записи, сборка и приёмка установленного MSIX
  ещё впереди. Рабочие записи, установленный GRAF, Mac и сервер не менялись.
release_notes_round237_calendar_wire: |
  Реализован строгий разбор сообщений календарного перехода и его отмены.
  Принимаются только нужные поля и идентификаторы; двойные поля, неверный
  Unicode и слишком большие сообщения отвергаются. Подготовлен разбор
  исходного JSON до нормализации Windows SDK. Код использует уже существующий
  разборщик, без новой зависимости или отдельной службы.
  Уточнены правила отмены при смене календарной кнопки и защиты от повторного
  запроса. Независимая проверка требований и ограниченного кода пройдена;
  дополнительная несовместимость записи тестового Unicode с MSVC исправлена.
  На окончательных файлах прошли переносимые 44/44 и Windows Release/x64
  в Parallels 48/48. Это проверки разбора данных, не работающий переход
  из установленного приложения. T119 открыта: подключение к кабинету,
  карточке, меню и общему обработчику, проверки входа, интерфейса и записи
  ещё нужны. Разрешённые команды живого веб-моста пока не расширены.
  Установленный GRAF, рабочие записи, macOS и сервер не менялись.
release_notes_round238_calendar_host: |
  Реализован обработчик календарных сообщений текущего документа WebView2:
  проверяются исходный JSON, адрес, одноразовые идентификаторы и состояние.
  Отмена документа выполняется до отзыва его полномочий; поздний ответ не
  применяется к новой странице. Исправлена найденная независимой проверкой
  ошибка: исключение старого обработчика больше не отменяет новый запрос.
  Проверка требований и ограниченного кода принята без открытых замечаний.
  На окончательных файлах прошли переносимые проверки 45/45 и Windows
  Release/x64 в Parallels 49/49, полная сборка GrafWindows.sln с WebView2
  и штатной проверкой AEC3. Новых внешних зависимостей нет.
  Календарные команды запрещены по умолчанию: общий обработчик приложения
  и кнопка кабинета ещё не подключены. T119 остаётся открытой; проверка
  установленного приложения, входа, запуска встречи и записи ещё впереди.
  Рабочие записи, установленный GRAF, macOS и сервер не менялись.
release_notes_round239_calendar_presentation: |
  Подготовлена кнопка календарного перехода в общем кабинете: одно действие,
  проверенные идентификаторы, состояния перехода и отмена при смене страницы
  или встречи. Повторное нажатие не создаёт второй запрос. Исправлена найденная
  независимой проверкой рассинхронизация доступности кнопки после ошибки.
  Проверки окончательных файлов: Chromium и WebKit 2/2, переносимые 45/45,
  Windows Release/x64 в Parallels 49/49 и полная сборка GrafWindows.sln.
  Один отдельный отказ файлового теста сохранён с неустановленной причиной;
  последующие последовательные повторы прошли, изменения защиты файлов нет.
  Новых зависимостей и изменений Mac или сервера нет. Кнопка пока выключена
  по умолчанию: общий обработчик приложения ещё нужно подключить и проверить
  в установленном GRAF. T119 и приёмка всего Windows-приложения остаются открытыми.
release_notes_round240_calendar_owner: |
  Подключён общий нативный обработчик календарного перехода для кабинета и
  карточки напоминания. Карточка не исчезает при нажатии до успешного запуска
  встречи: повторные нажатия подавляются, закрытие и исходный срок сохраняются.
  Повтор после ошибки заново проверяет встречу; восстановление через браузер
  требует явного подтверждения и свежего запроса. Отмена не считается окончанием
  фоновой работы. Перед записью повторно проверяются учётная запись, сама встреча,
  исходный срок и системная готовность, включая смену события во время создания
  индикатора. Новых зависимостей, серверных или macOS-изменений нет.
  Проверка ограниченного исходного кода принята без открытых замечаний;
  переносимые проверки окончательных файлов прошли 45/45. Это промежуточный
  результат: путь из меню и приёмка точного установленного приложения ещё
  не завершены. T119 остаётся открытой; новая версия клиентам не опубликована.
  Окончательные Windows Release/x64 проверки в Parallels прошли 49/49;
  полная сборка GrafWindows.sln успешна. Контрольные суммы десяти проверенных
  файлов совпали в обеих Windows-копиях. Сборка не заменяет проверку установки.
release_notes_round241_calendar_menu_fields: |
  Уточнено меню ближайших встреч по приложению Mac: отдельный список до 12
  событий, настройки названия и времени с сервера, встреча на весь день,
  явный повтор после ошибки и общий обработчик подключения. Сервер не меняется.
  Windows больше не теряет эти три поля календарного ответа: неверный тип
  отвергается, прежние проверки доступа и приватности сохранены.
  Требования и ограниченный исходный код прошли независимую проверку;
  переносимые проверки прошли 45/45. Сам список меню и его подключение к
  обработчику ещё нужно реализовать и проверить в установленном приложении.
  T119 остаётся открытой; опубликованного обновления, изменений Mac, сервера
  или пользовательских записей нет. Новых зависимостей не добавлено.
  Окончательные Windows Release/x64 проверки в Parallels прошли 49/49;
  контрольные суммы трёх изменённых файлов совпали перед сборкой тестов.
  Полная сборка GrafWindows.sln успешна; контрольные суммы совпали также
  в копии сборки приложения. Установленное приложение пока не обновлялось.
release_notes_round242_calendar_upcoming_projection: |
  Подготовлен список ближайших встреч для меню Windows: до 12 событий,
  сортировка по времени и событию, сохранение настроек времени и названия
  с сервера. Закрытое напоминание, «Тихий режим» и текущая запись не скрывают
  этот список. Выбранная встреча проверяется по исходному событию, а не по
  позиции в обновлённом меню. При ошибке обновления устаревшие пункты становятся
  недоступными, даже если карточка ошибки сохранена для повторной попытки.
  Прежний срок карточки и её повтор сохранены. Новых зависимостей, изменений
  сервера, Mac или пользовательских записей нет.
  Требования и пять ограниченных исходных файлов прошли независимую проверку;
  переносимые проверки прошли 45/45, Windows Release/x64 в Parallels — 49/49.
  Сами пункты меню, их общий обработчик и приёмка установленного приложения
  ещё не завершены. T119 остаётся открытой; обновление клиентам не опубликовано.
  Полная сборка GrafWindows.sln успешна; контрольные суммы семи файлов совпали
  в обеих Windows-копиях. Установленное приложение пока не обновлялось.
release_notes_round243_calendar_user_time: |
  Для меню Windows подготовлены строгая проверка данных часового пояса аккаунта
  и системное форматирование времени встречи с учётом летнего времени.
  Устранено округление, которое могло переносить время в следующую минуту:
  ошибка воспроизведена в Windows, новые граничные проверки прошли после исправления.
  Требования и ограниченный исходный код прошли независимую проверку.
  Переносимые проверки окончательных файлов прошли 45/45; два затронутых
  набора Windows Release/x64 — 2/2. Предшествующий общий прогон 49/49
  не выдаётся за повторную проверку всех тестов после последнего исправления.
  Привязка к текущему аккаунту и документу, само меню и приёмка установленного
  приложения ещё впереди. T119 остаётся открытой. Новых зависимостей,
  изменений сервера, Mac, пользовательских записей или настроек ОС нет;
  установленное приложение не обновлялось, выпуск клиентам не опубликован.
  Полная сборка GrafWindows.sln Release/x64 успешна; контрольные суммы семи
  окончательных файлов совпали в обеих Windows-копиях, основные тесты сборки
  завершились успешно. Эта сборка не заменяет проверку установленного пакета.
release_notes_round244_calendar_user_time_binding: |
  Часовой пояс Windows привязан к подтверждённому аккаунту и текущей странице.
  Чтение начинается после сверки сессии; смена пользователя, пространства или
  сессии сбрасывает прежнюю зону, а запоздавший ответ не стирает новую.
  Некорректные данные возвращают системное время без повторных скрытых запросов.
  Переносимые проверки прошли 45/45, четыре затронутых набора Windows — 4/4;
  сценарий чтения и прежние календарные действия проверены в Chromium и WebKit.
  Само меню, сквозной сценарий и проверка установленного пакета ещё не завершены.
  T119 остаётся открытой. Сервер, Mac, пользовательские записи и настройки ОС
  не менялись; приложение не обновлялось, выпуск клиентам не публиковался.
release_notes_round245_calendar_safe_rows: |
  Для меню Windows подготовлены строки ближайших встреч по образцу Mac:
  одинаковый порядок и предел в 12 встреч, безопасные названия, настройки
  видимости с сервера, пользовательское время и отметка «Весь день».
  Встречи без безопасной ссылки остаются видимыми, но недоступными для выбора.
  Тихий режим и закрытые карточки уведомлений не скрывают список встреч.
  Исходный код прошёл независимую проверку, переносимые тесты — 45/45.
  Подключение к самому меню и общему действию с повторной попыткой ещё впереди;
  T119 остаётся открытой. Общая Windows-проверка ещё не засчитана:
  два теста хранилища превысили ограничение времени при одновременной сборке.
  Сервер, Mac, записи, настройки ОС и установленное приложение не менялись.
  Полная сборка приложения Release/x64 прошла на окончательных исходниках.
  Последовательный повтор без компилятора тоже не принят: один тест хранилища
  превысил 300 секунд. Причина ещё не установлена; проверка не пропущена,
  общая готовность Windows и установленного приложения не объявлена.
  Последовательный Windows-прогон дал 48/49; оставшийся тест хранилища
  остановлен по времени. Основные тесты новой сборки отдельно прошли успешно.
release_notes_round246_calendar_native_menu: |
  Ближайшие встречи подключены к меню Windows и общему действию подключения.
  Выбор сохраняет конкретное событие; смена списка или аккаунта отзывает старое
  меню. Срок действия фиксируется при выборе и не продлевается обновлениями.
  Этот пункт не включает запись. Сохранены история и обычные команды меню;
  добавлены системный шрифт, масштаб, ограничение ширины и доступные названия.
  Независимая проверка выявила два краевых дефекта повторного входа и очистки
  подменю; оба исправлены и повторно проверены по окончательным исходникам.
  Полная сборка Windows Release/x64 и её основные тесты прошли; четыре
  затронутых набора Windows и 45 переносимых тестов тоже прошли повторно.
  Настоящие сценарии меню и повторная попытка после ошибки ещё впереди;
  T119 остаётся открытой. Общий тест хранилища с тайм-аутом не закрыт.
  Приложение не обновлялось и не выпускалось; сервер, Mac, пользовательские
  записи и настройки ОС не менялись. Полный паритет ещё не объявлен.
release_notes_round247_calendar_owned_retry: |
  Для ошибки подключения из меню Windows добавлен явный повтор по образцу Mac.
  Он появляется после завершения прежней операции и заново проверяет событие
  и аккаунт. Повтор не продлевает срок события, не использует старую ссылку
  и не включает запись. Поздние ответы и отмена не запускают вторую попытку.
  Независимая проверка выявила ошибку первого тайм-аута; она исправлена,
  добавлена регрессия, окончательный код принят без замечаний.
  Полная сборка Windows Release/x64 и основные тесты прошли; четыре связанных
  набора Windows и 45 переносимых тестов тоже прошли на окончательном коде.
  Живая проверка меню, окна ошибки и установленного пакета ещё впереди:
  T119 не закрыта, полная готовность Windows не объявлена. Приложение
  не обновлялось и не выпускалось; сервер, Mac, записи и настройки ОС не менялись.
release_notes_round248_calendar_actual_popup: |
  Добавлена проверка настоящего меню Windows на искусственных встречах:
  выбор с клавиатуры, неизменный и заменённый список, смена аккаунта и времени,
  замена обработчика, повторный вход и уничтожение окна. Старый выбор после
  изменения не запускается; успешный выбор передаёт только исходную встречу.
  В испытательной сборке используется тот же значок, что и в приложении;
  параметры компилятора C++ отделены от компилятора ресурсов Windows.
  Десять сценариев настоящего меню прошли дважды; четыре связанных набора
  Windows — 4/4, переносимые проверки — 45/45. Это не заменяет экранный
  диктор, все темы и масштабы, окно ошибки, сквозной путь или точный MSIX.
  T119 и T097 остаются открытыми. Тайм-аут общего теста хранилища не закрыт.
  Установленное приложение, сервер, Mac, записи и настройки ОС не менялись;
  сборка для клиентов и выпуск не публиковались.
release_notes_round249_calendar_actual_dialog: |
  Добавлена проверка настоящего окна повторной попытки Windows на искусственных
  событиях. Проверены повтор, отмена, устаревшее действие и задержка закрытия:
  она входит в срок новой попытки и не даёт дополнительные 15 секунд.
  Готовый ответ рабочего потока не считается завершением самого потока;
  прежняя работа освобождается только после наблюдаемого завершения.
  Шесть сценариев настоящего окна прошли дважды на одних исходниках;
  переносимые тесты — 45/45. Независимая проверка кода и инструкции принята
  без замечаний. Добавлены воспроизводимые команды сборки и запуска проверки.
  Это не подтверждает полный путь внутри AppMain, авторизацию, запуск встречи,
  клавиатуру и доступность или установленный пакет. T119 и T097 открыты;
  тайм-аут общего теста хранилища и аппаратная приёмка не закрыты.
  Приложение не обновлялось и не выпускалось; сервер, Mac, пользовательские
  записи и настройки ОС не менялись. Полная готовность Windows не объявлена.
release_notes_round250_full_windows_validation: |
  Полный набор Windows на текущих исходниках прошёл: 49 из 49 проверок,
  без пропуска случаев и увеличения времени ожидания. Сборка успешна;
  совпадение 170 исходных файлов и исполняемого файла повторно проверено.
  Полный тест защищённого хранилища прошёл и отдельно, и в общем наборе.
  Это не объясняет причину прежнего тайм-аута и не подтверждает работу всего
  защищённого пути приложения. Календарный эталон Mac сверён со свежим master.
  Независимая проверка пока не допускает обновление рабочего профиля:
  нужны доказательства сохранности данных при запуске, переходе и откате.
  Установленный GRAF, пользовательские записи, сервер и Mac не менялись;
  аппаратная, сквозная и установочная приёмка остаются открытыми. Выпуска нет.
release_notes_round250_protected_package_codec: |
  Реализован строгий разбор и запись служебного описания защищённого пакета
  двух принятых форматов. Неизвестные и повторные поля, неверные числа,
  несовпадение пакета и повреждённая форма отвергаются без пустого результата.
  Память ограничена прежними пределами; новых зависимостей и файловых эффектов нет.
  Добавлены проверки границ, отказов памяти и корней защищённого хранилища.
  Новый код прошёл независимую проверку; переносимый набор — 46 из 46,
  связанные проверки Windows — 5 из 5. Само приложение с Windows App SDK
  и настоящим AEC3 собрано успешно, но не запускалось и не устанавливалось.
  Этот шаг ещё не подключает защищённое хранилище ко всем функциям приложения
  и не подтверждает безопасное обновление рабочего профиля. Записи не тронуты;
  задачи интеграции, перехода данных и полной приёмки остаются открытыми.
release_notes_round251_protected_historical_reader: |
  Добавлена полная проверка старой версии защищённого аудиофайла после
  перезапуска, даже когда её уже нет среди двух текущих версий. Проверяются
  настоящий файл, принадлежность записи, все связанные данные и границы.
  Исторический снимок доступен только для чтения: запись через него запрещена
  и не повреждает действующую запись. Повреждение сохраняет первую причину
  отказа; оно не заменяется пустыми данными или успешным результатом.
  Независимая проверка исходников принята. Связанные проверки Windows —
  6 из 6, переносимый набор — 46 из 46; приложение с Windows App SDK и
  настоящим AEC3 собрано, исходники и исполняемые файлы повторно сверены.
  Дополнительно весь текущий набор Windows прошёл 50 из 50 без сокращения
  испытаний и увеличения предела времени; протокол и файлы сверены отдельно.
  Исправлена ошибка тестового стенда, который проверял не ту папку файла;
  неудачный прогон сохранён, после исправления выполнен полный повтор.
  Этот шаг ещё не подключает защищённое хранение ко всему приложению и
  не доказывает безопасный перенос существующих записей. Рабочий профиль,
  установленный GRAF, сервер, Mac и настройки ОС не менялись. Выпуска нет;
  сквозная, аппаратная и установочная приёмка остаются открытыми.
release_notes_round252_protected_metadata_pair: |
  Защищённое описание локальной записи читается в обеих сохранённых версиях
  под одной блокировкой. Повреждённая старая версия не скрывается исправной
  новой; запись запрещена до освобождения последней ссылки на результат.
  Исправлена общая ошибка классификации: сбой чтения идентификатора файла
  сохраняет настоящую причину Windows, а неверный идентификатор отвергается.
  Код принят независимой проверкой; переносимые тесты — 46 из 46, связанные
  проверки Windows — 6 из 6, полный отладочный тест хранения тоже прошёл.
  Приложение с Windows App SDK и настоящим AEC3 собрано; контрольные суммы
  исходников и исполняемых файлов сверены отдельно. Это ещё не подключение
  защиты ко всем функциям приложения и не перенос существующих записей.
  Рабочий профиль и установленный GRAF не менялись, выпуска клиентам нет.
  Дополнительно весь текущий набор Windows прошёл 50 из 50 без пропуска
  случаев и увеличения времени ожидания; исходники и файлы проверены повторно.
  Инструкция проверки принята независимо. Полная приёмка приложения открыта.
release_notes_round253_protected_sealed_member: |
  Защищённое описание записи связано с чтением конкретного запечатанного файла.
  Проверяются его принадлежность, точная версия, весь размер и контрольная сумма;
  старая версия не подменяется текущей. Блокировки описания и файла сохраняются
  до закрытия последнего читателя. При повреждении другой сохранённой версии
  сохраняется исходная причина отказа; частичный успешный результат не выдаётся.
  Подсчёт контрольной суммы читает ограниченные порции без открытой временной
  копии; общий прежний рабочий буфер теперь очищается после использования.
  Связанные проверки Windows прошли 8 из 8, переносимые — 46 из 46.
  Это ещё не проверка всей записи, её форматов и загрузки, не полный переход
  существующих данных и не готовность приложения к выпуску. Рабочий профиль,
  установленный GRAF, записи, сервер и Mac не менялись. Полная приёмка открыта.
  Дополнительно прошли три полных отладочных набора. Само приложение с
  Windows App SDK и настоящим AEC3 собрано; протоколы проверок, исходники
  и исполняемые файлы повторно сверены. Новый код принят независимо;
  все эти результаты относятся к проверенному шагу, не к выпуску приложения.
release_notes_round254_joint_protected_readers: |
  Все запечатанные файлы обеих сохранённых версий описания записи теперь
  проверяются вместе. Последний читатель удерживает всю запись, а не один файл;
  повреждение старой версии и конфликт форматов не скрываются здоровой новой.
  При отказе частичный успешный результат не выдаётся; исходная ошибка сохраняется.
  Связанные проверки Windows прошли 8 из 8, отладочные — 3 из 3,
  переносимые — 46 из 46. Исходники приняты независимо без оставшихся замечаний.
  Это проверенный шаг хранения, ещё не подключение ко всему приложению:
  восстановление незавершённой записи, форматы, загрузка, воспроизведение,
  безопасный переход старых данных и приёмка установленной версии остаются открытыми.
  Рабочий профиль, записи, установленный GRAF, Mac и сервер не менялись.
  Дополнительно весь текущий набор Windows прошёл 50 из 50, само приложение
  собрано с Windows App SDK и настоящим AEC3. Исходники, протоколы и
  исполняемые файлы повторно сверены; это ещё не приёмка установленной версии.
release_notes_round255_shared_package_format: |
  Исправлена общая проверка записи перед загрузкой: совпадение контрольной суммы
  M4A больше не заменяет проверку AAC, частоты, числа каналов и длительности.
  Неподходящий файл отклоняется до отправки; проверенный WAV и повреждённая
  запись сохраняются. Проверка воспроизведения использует тот же результат.
  Связанные проверки Windows прошли 4 из 4 в обычной и отладочной сборках,
  переносимые — 46 из 46. Само приложение собрано с Windows App SDK и AEC3.
  Положительные проверки AAC и этапов загрузки используют настоящий Windows
  кодировщик; переносимые проверки подтверждают только отказ и сохранность.
  Это ещё не полная проверка формата, шифрования и перехода прежних данных,
  не приёмка установленного приложения и не готовность к выпуску.
  Рабочий профиль, установленный GRAF, записи, Mac и сервер не менялись.
  Дополнительно весь текущий набор Windows прошёл 50 из 50. Исходники,
  протоколы проверок и собранные исполняемые файлы повторно сверены.
  Исходники и документация этого исправления приняты независимо без замечаний;
  это не закрывает общую приёмку приложения или готовность к выпуску.
release_notes_round256_live_sealed_readers: |
  Убрано препятствие совместному чтению защищённых рабочих и завершённых
  файлов записи: прежняя рабочая ссылка не требует удаления старой версии
  описания. Рабочая ссылка использует текущий проверенный снимок, запечатанная
  сохраняет точную историческую версию и контрольную сумму. Ошибка любой
  ссылки отклоняет всю группу; последняя ссылка чтения удерживает все файлы.
  Прежние проверки повреждений, отмены, ограничений памяти и владения сохранены.
  Проверки Windows прошли 2 из 2 в обычной и отладочной сборках, полный набор
  — 50 из 50, переносимый — 46 из 46. Приложение собрано с Windows App SDK
  и AEC3; исходники, протоколы и исполняемые файлы повторно сверены.
  Это необходимый этап подключения защищённого хранения, не готовая загрузка,
  не полная приёмка записи и не готовность к выпуску. Рабочий профиль,
  установленное приложение, записи, микрофон, Mac и сервер не менялись.
release_notes_round257_aac_payload_diagnosis: |
  На искусственной записи воспроизведён дефект проверки Windows: повреждённые
  звуковые данные с правильными заголовками, размером и пересчитанной контрольной
  суммой ошибочно принимаются за исправную запись. Настоящий декодер доходит
  до конца, но не возвращает звуковых кадров; проверка контейнера этого не замечает.
  Новый проверочный пример намеренно остаётся красным до исправления.
  Общая исправленная цепочка ещё не принята: перед полным декодированием нужны
  неизменный удерживаемый поток, настоящая отмена и ограничение фоновых работ.
  Рабочий код этой проверки, установленное приложение, профиль, пользовательские
  записи, микрофон, Mac и сервер в этом раунде не менялись. Выпуск заблокирован;
  прежние успешные проверки не означают прохождение нового примера.
  Исходник нового примера и сохранённые результаты независимо проверены:
  расхождений не найдено. Это подтверждение диагноза, не принятие исправления.
release_notes_round258_protected_aac_consumer: |
  Реализована проверка настоящих звуковых кадров через защищённый поток Windows,
  без открытого временного файла. Владельцы всех файлов сохраняются до конца
  проверки, учитываются отмена и общий предел фоновых работ. Исправный AAC
  принимается, повреждённое звуковое содержимое с правильной контрольной суммой
  отклоняется. Проверки Windows прошли в обычной и отладочной сборках, включая
  образцы на 1 и 30 секунд, отмену, нехватку памяти и повреждение соседнего файла;
  переносимые проверки — 46 из 46. Исходники и исполняемые файлы сверены.
  Это подготовленный защищённый потребитель, ещё не замена старой проверки
  приложения: подключение описания записи, отправки и прослушивания впереди.
  Рабочий профиль, пользовательские записи, микрофон, Mac и сервер не менялись.
  Полная приёмка Windows и готовность к выпуску не подтверждены.
  Код этого ограниченного потребителя и сохранённые результаты независимо
  проверены без оставшихся замечаний; это не заменяет его подключение в приложение.
release_notes_round259_protected_v5_inspector: |
  Реализована защищённая проверка описания записи и приватных пауз Windows:
  неверные поля, даты, длительность, контрольные суммы и повреждённый звук
  отвергаются. Для восстановленной записи проверяется только подтверждённая
  часть звука; исправные итоговые файлы допускаются и без описания записи.
  Владельцы файлов удерживаются до конца, учтены отмена и ограничения памяти.
  В обычной и отладочной сборках Windows прошли 45 вариантов описания записи
  и 14 вариантов восстановления. Календарные проверки — 8 из 8, переносимые
  — 46 из 46. Исходники, результаты и исполняемые файлы повторно сверены;
  независимая проверка кода и сохранённых результатов не оставила замечаний.
  Это ещё не замена прежних путей приложения: подключение записи, очереди,
  отправки и прослушивания остаётся открытым. Рабочий профиль, установленное
  приложение, пользовательские записи, микрофон, Mac и сервер не менялись.
  Полная функциональность Windows и готовность к выпуску пока не подтверждены.
  Дополнительная сборка самого приложения обнаружила конфликт имён Windows
  и WinUI; порядок подключения заголовков исправлен, приложение собрано с
  Windows App SDK и AEC3. Общий набор проверок дал 49 успешных из 50:
  оставшаяся проверка подтверждает прежний дефект неподключённого старого пути
  чтения повреждённого звука. Проверка не отключена, дефект остаётся открытым.
release_notes_round260_bootstrap_codec: |
  Добавлена строгая проверка служебного описания защищённого хранилища Windows:
  оно связывает режим работы с конкретным хранилищем, очередью и переходом
  старых записей. Пропущенные, повторённые, неверные поля и повреждённые данные
  отклоняются целиком. Использованы прежний разбор метаданных и ограничения
  памяти, без новой зависимости или второй очереди.
  Сначала подтверждено падение нового теста без реализации. Затем обычная
  и отладочная проверки Windows прошли по 2 из 2, переносимые — 46 из 46;
  само приложение собрано с Windows App SDK и AEC3.
  Это необходимая часть подключения, ещё не готовая защищённая цепочка записи.
  Отдельная проверка на свежем коде снова подтвердила дефект старого пути
  чтения повреждённого звука: он не скрыт и остаётся открытым.
  Рабочий профиль, установленное приложение, пользовательские записи,
  микрофон, Mac и сервер не менялись. Полная готовность Windows не подтверждена.
  Независимая проверка этого ограниченного кода и сохранённых результатов
  не оставила замечаний; она не заменяет подключение хранения к приложению.
release_notes_round261_migration_codec: |
  Добавлена строгая проверка описания перехода Windows на защищённое хранилище:
  этапы копирования, ссылки на исходные и будущие файлы, контрольные суммы
  и сведения для разрешённой очистки. Несогласованные данные отклоняются
  целиком; само успешное чтение описания не разрешает удаление или отправку.
  Использованы прежний разбор метаданных и ограничения памяти, без новой
  зависимости, контроллера или второй очереди.
  Новый тест сначала упал без реализации. На финальных исходниках обычная
  и отладочная проверки Windows прошли по 2 из 2, переносимые — 46 из 46;
  приложение собрано с Windows App SDK и AEC3.
  Это необходимая часть будущего перехода, а не уже работающая миграция.
  Подключение записи, очереди, отправки и прослушивания остаётся открытым.
  Рабочий профиль, пользовательские записи, микрофон, установленное приложение,
  Mac и сервер не менялись. Полная готовность Windows не подтверждена.
  Независимая проверка финального кода и результатов тестов завершена
  без незакрытых замечаний; она относится только к этому описанию перехода,
  а не к приёмке всего приложения или разрешению выпуска.
release_notes_round262_migration_history: |
  Добавлена проверка исходной записи перехода Windows на защищённое хранение:
  точная версия файла, его контрольная сумма, настоящее расшифрование Windows
  и совпадение исходных данных с текущим описанием перехода. Проверка работает
  и после замены старых индексов; повреждённые или несогласованные данные
  отклоняются. Успешное чтение не разрешает удаление, отправку или восстановление.
  Использованы существующие разбор данных, безопасное чтение файлов и лимиты
  памяти, без новой зависимости, очереди или контроллера.
  Новый тест сначала упал без реализации. Финальные обычная и отладочная
  проверки Windows прошли по 4 из 4; переносимые — 46 из 46. Приложение
  собрано с Windows App SDK и AEC3. Ошибки подготовки тестов и сверки сборок
  исправлены с повторными запусками; лимиты приложения не ослаблены.
  Полный набор на финальном коде дал 49 успешных проверок из 50: остаётся
  прежний дефект старого пути чтения повреждённого AAC, он не отключён и
  не выдан за исправленный. Новых отказов не найдено; финальные исходники
  и исполняемые файлы тестов в обычной и отладочной сборках, а также
  обычная сборка приложения повторно сверены.
  Независимая проверка финального кода и сохранённых результатов завершена
  без незакрытых замечаний к этому компоненту; она не заменяет подключение
  защищённого хранения к приложению и полную приёмку Windows.
  Это часть будущего перехода, не уже подключённая защищённая цепочка записи.
  Рабочий профиль, пользовательские записи, микрофон, установленное приложение,
  Mac и сервер не менялись. Полная готовность Windows пока не подтверждена.
release_notes_round263_bootstrap_pair: |
  Добавлено чтение обеих защищённых копий управляющей записи хранилища с
  удержанием защиты файлов до последнего владельца результата. Повреждённая
  вторая копия не заменяется удобной старой; ошибки и отмена не дают успеха.
  Использованы существующие системные средства, без новой зависимости.
  Проверки компонента Windows прошли по 4 из 4 в обычной и отладочной
  сборках, переносимые — 46 из 46. Приложение собрано и точные исходники
  и исполняемые файлы повторно сверены. Полный набор — 49 из 50:
  прежний дефект чтения повреждённого AAC остаётся открытым.
  Это ещё не подключение защищённой очереди, записи и отправки к приложению.
  Рабочие данные и установленное приложение не менялись; полный паритет
  и готовность Windows к выпуску пока не подтверждены.
  Независимая проверка кода и результатов приняла только этот компонент.
  Она не заменяет подключение защищённого хранения и полную приёмку Windows.
release_notes_round264_bootstrap_discovery: |
  Добавлено безопасное получение идентификаторов существующего хранилища и
  очереди из закреплённых файлов Windows. Подмена, отсутствие или повреждение
  идентификатора не создаёт пустую очередь и не даёт разрешения на операции.
  Защита файлов удерживается до освобождения последнего владельца результата.
  Использованы прежние проверки и системные средства, без новой зависимости.
  Проверки Windows прошли по 4 из 4 в обычной и отладочной сборках,
  переносимые — 46 из 46. Приложение собрано; исходники и исполняемые файлы
  повторно сверены. Полный набор — 49 из 50: прежний дефект повреждённого
  AAC остаётся открытым, его проверка не отключена.
  Это ещё не подключённая защищённая очередь и цепочка записи/отправки.
  Рабочие данные, микрофон и установленное приложение не менялись.
  Полная готовность и соответствие Windows приложению Mac пока не подтверждены.
  Независимая проверка кода и результатов приняла только этот компонент;
  она не заменяет проверку очереди, подключение и приёмку всего приложения.
release_notes_round265_queue_load_candidate: |
  Исправлено повторное чтение очереди: подтверждения локального удаления больше
  не наследуются из прошлого состояния и не считаются лишними дубликатами.
  Весь файл проверяется отдельно; новое состояние принимается целиком только
  после необходимых проверок и успешного сохранения восстановления.
  Ошибка чтения, нехватка памяти или отказ записи сохраняет прежнее состояние
  и блокирует небезопасные операции. Исчезнувшая известная очередь, даже
  пустая, не считается первым запуском. Предел файла проверяется до его чтения.
  Формат очереди и совместимость прежних записей не изменены, зависимостей нет.
  Windows проверки очереди и удаления прошли по 6 из 6 в обычной и отладочной
  сборках, переносимые — 46 из 46. Приложение собрано, исходники и исполняемые
  файлы повторно сверены. Полный Windows набор — 49 из 50: прежняя ошибка
  проверки повреждённого AAC остаётся открытой, её тест не отключён.
  Это ещё не защищённая очередь и не подключённая цепочка записи/отправки.
  Рабочие данные, установленное приложение, Mac и сервер не менялись.
  Готовность Windows и полный паритет с Mac пока не подтверждены.
  Независимая проверка дополнительно выявила и приняла исправление обрыва
  файла после числовой метки времени: повреждение отправляется в карантин,
  прежнее состояние сохраняется. Новый тест воспроизвёл ошибку до исправления;
  повторные проверки обычной и отладочной сборок прошли. Принят только
  компонент чтения очереди, не защищённый поток и не готовность приложения.
release_notes_round266_protected_queue_input: |
  Исправлена причина отказа чтения защищённой очереди: запрет записи больше
  не ошибочно делает данные недоступными для чтения. Блокировки файлов и
  прежние правила отказа при повреждении сохранены.
  Обе копии очереди проверяются целиком; отсутствие, повреждение, отмена и
  нехватка памяти не превращаются в пустую очередь или частичный успех.
  Windows проверки компонента прошли по 4 из 4 в обычной и отладочной сборках,
  переносимые — 46 из 46. Приложение собрано, исходники и исполняемые файлы
  повторно сверены. Формат данных и зависимости не изменены.
  Это компонент чтения защищённых данных, ещё не подключённая цепочка
  записи, отправки и удаления. Прежняя ошибка проверки повреждённого AAC
  и полная приёмка Windows остаются открытыми; готовность не заявляется.
  Рабочие данные, установленное приложение, Mac и сервер не менялись.
  Независимая проверка приняла защищённый вход очереди и его проверки;
  подключение к приложению и полная приёмка остаются обязательными.
release_notes_round267_queue_fields: |
  Исправлен общий разбор очереди: вложенные поля больше не подменяют данные
  записи, запроса удаления или подтверждения очистки. Строки восстанавливаются
  по правилам JSON; неверный тип известного поля и переполнение числа
  отклоняют весь файл, а не превращаются в значение по умолчанию.
  Формат файлов и запись очереди не менялись; прежние записи совместимы.
  Нехватка памяти сохраняет исходный файл и прежнее загруженное состояние.
  Windows проверки очереди и удаления прошли по 6 из 6 в обычной и отладочной
  сборках, переносимые — 46 из 46; приложение собрано. Это компонент,
  не завершённая защищённая цепочка и не готовность Windows к выпуску.
  Прежняя ошибка проверки повреждённого AAC остаётся открытой.
  Рабочие записи, установленное приложение, Mac и сервер не менялись.
  После добавления четырёх проверок запрещённых символов в пути переносимый
  набор снова прошёл полностью. Последний обычный Windows набор — 5 из 6:
  восстановление загрузки превысило прежний срок ожидания. Этот отказ
  сохранён; причина ещё не установлена, итоговая проверка не завершена.
release_notes_round271_protected_queue_candidate: |
  Реализован отдельный компонент проверки обеих защищённых копий очереди.
  Он сохраняет прежние форматы, данные записи, загрузки и удаления; повреждение,
  отмена или нехватка памяти не превращаются в пустую очередь либо частичный успех.
  Память разбора и результата учитывается в общей квоте, включая служебные
  выделения Visual Studio. Исправлены аварийное копирование вместо перемещения
  строки и пропуск проверок отмены внутри длинных строк с escape-последовательностями.
  Используется один общий разборщик JSON; новых зависимостей и форматов нет.
  Переносимый набор прошёл 46 из 46; выбранные Windows проверки — по 18 из 18
  в обычной и отладочной сборках. Само приложение с WebView2 и проверенным AEC3
  собрано, но не установлено и не запущено. Проверка уязвимостей NuGet не завершена
  из-за недоступности источника; сборка не объявляется свободной от предупреждений.
  Компонент ещё не подключён к полной цепочке записи, отправки и удаления.
  Прежняя ошибка проверки повреждённого AAC, защищённая миграция и полная приёмка
  Windows остаются открытыми. Рабочие записи, установленная версия, Mac и сервер
  не менялись; готовность к выпуску и полный паритет пока не подтверждены.
  Независимая проверка исходников и результатов приняла только этот компонент;
  она не заменяет подключение, миграцию, проверку установленной версии и выпуск.
release_notes_round272_migration_v2_codec: |
  В существующий разбор защищённых метаданных добавлен принятый формат миграции
  для упакованного хранения. Старый формат сохраняется; новая схема проверяет
  представление, идентификатор контейнера и структуру сохранённого корня.
  Проверка исходного состояния миграции отклоняет смену схемы и контейнера.
  Новых зависимостей, разборщиков JSON и пользовательских окон нет.
  Испытания на искусственных данных обнаружили аварийные завершения при нехватке
  памяти в служебных строках Visual Studio Debug. Общий помощник SHA-256 исправлен
  в двух местах; построение имени и пути блока также исправлено без изменения
  результата хеширования, имён файлов, прав доступа и условий проверки.
  Переносимый набор прошёл 46 из 46. Выбранные Windows проверки прошли по 6 из 6
  в отладочной и обычной сборках; проверены все фактические отказы выделения
  памяти и повторные попытки для обеих схем и видов миграции. Исходники,
  квитанции и 12 тестовых файлов сверены после запусков. Прежние неудачные
  результаты сохранены; эти проверки не заменяют приёмку всего приложения.
  Само Windows-приложение с WebView2 и проверенным AEC3 собрано на тех же
  исходниках, итоговый файл сверён. Оно не установлено и не запущено; сборка
  содержит прежние предупреждения и не означает завершённую проверку уязвимостей.
  Независимая проверка приняла только этот компонент и его исправления;
  связь с текущей очередью, безопасный переход старых записей и подключение
  полного защищённого потока ещё не завершены.
  Это промежуточная реализация, не законченная миграция или приёмка приложения.
  Рабочие записи, установленная версия, Mac и сервер не менялись.
release_notes_round273_migration_pair: |
  Добавлена отдельная проверка двух сохранённых копий состояния перехода
  на защищённое хранение. Она проверяет обе копии, неизменность подтверждённых
  данных, исходную зашифрованную запись перехода и отмену на последнем шаге.
  Проверка удерживает файлы от конкурирующего изменения и не разрешает сама
  по себе отправку, удаление или очистку записей. Полный переход и подключение
  к приложению ещё не завершены.
  Отладочные испытания обнаружили аварийные завершения при нехватке памяти
  в служебных строках, путях и контейнерах Visual Studio. Причины исправлены
  без отключения проверок памяти, прав доступа и отмены; имя пакета проверяется
  по принятому набору ASCII, русские и другие символы корневого пути сохранены.
  На окончательном снимке обычная и отладочная Windows-сборки прошли по шесть
  выбранных наборов, включая каждый фактический отказ памяти, отмену и повтор.
  Исходники, квитанции и 12 тестовых файлов сверены после запусков.
  Переносимые проверки прошли 46 из 46. Неуспешные результаты сохранены;
  эти проверки не заменяют подключение компонента и приёмку всего приложения.
  Само приложение с WebView2 и проверенным AEC3 также собрано на этих исходниках,
  итоговый файл сверён. Оно не установлено и не запущено; прежние предупреждения
  сборки сохранены, завершённая проверка уязвимостей не заявляется.
  Дополнительные общие проверки прошли по пять из шести в обеих сборках:
  старый путь допускает повреждённый AAC, а отладочный тест этой ошибки
  завершился по сроку ожидания после окна ошибки. Эти отказы не скрыты;
  весь набор и приложение пока не приняты, обновление не устанавливалось.
  Пользовательские записи, установленное приложение, Mac и сервер не менялись.
release_notes_round274_bootstrap_intent_link: |
  Состояние перехода на защищённое хранение теперь связывается с проверенными
  служебными данными того же хранилища. Корень и идентификаторы берутся
  из удерживаемых файлов, а не из переданного пути или содержимого записи.
  Подмена папки, повреждение, противоречащие копии, отмена и нехватка памяти
  не дают результата; файлы и память освобождаются, повтор остаётся возможным.
  На точных исходниках обычная и отладочная Windows-сборки прошли по шесть
  выбранных наборов. Проверены все фактические точки отказа нового компонента,
  включая создание конечного результата; исходники и 12 тестовых файлов сверены.
  Переносимые проверки прошли 46 из 46. Неуспешные запуски сохранены:
  одно новое ожидание теста исправлено после доказательства правильного отказа
  Windows при расшифровке, без ослабления защиты или замены ошибки на успех.
  Это служебная связь, не готовый переход или разрешение записи и отправки.
  Подключение полного защищённого потока, исправление старого пути AAC и
  приёмка установленного приложения остаются впереди. Пользовательские записи,
  установленная версия, Mac и сервер не менялись.
release_notes_round274_sdk_build: |
  На окончательных исходниках заново собрано Windows-приложение с WebView2
  и проверенным AEC3. Исходники и итоговый файл сверены в самой Windows.
  Сборка не устанавливалась и не запускалась; прежние предупреждения сохранены,
  завершённая проверка уязвимостей и готовность всего приложения не заявляются.
release_notes_round275_native_startup: |
  Убран небезопасный запуск локальной очереди до подключения защищённого
  хранения. Настоящий класс записи используется приложением и нативным тестом
  без копии реализации. Старые файлы не загружаются и не очищаются на запуске;
  запись, отправка, удаление и поздние ответы не обходят закрытое хранение.
  Вход и общие настройки остаются отдельными. Это временный защитный запрет,
  не готовая запись: полный зашифрованный поток ещё нужно подключить.
  На искусственных данных обычная и отладочная Windows-сборки прошли по семь
  выбранных наборов. Исходники, квитанции и 14 тестовых файлов сверены;
  переносимые проверки прошли 46 из 46. Первый отказ сохранён и исправлен
  указанием нового файла в тесте без ослабления его проверок.
  Само приложение с WebView2 и AEC3 собрано на этих исходниках, итоговый файл
  сверён в Windows. Оно не устанавливалось и не запускалось; готовность всего
  приложения, сквозная приёмка, физический Windows x64 и выпуск не заявляются.
  Пользовательские записи, установленная версия, Mac и сервер не менялись.
release_notes_round275_record_caller_correction: |
  Независимая проверка обнаружила проверку устройств до отказа по недоступному
  хранению в общем обработчике записи. Порядок исправлен для окна, трея и
  календаря; новая проверка сначала воспроизвела ошибку. Первый отказ сохранён.
  На исправленных исходниках обе Windows-сборки прошли по восемь выбранных
  наборов, переносимые проверки — 46 из 46. Исходники и 16 тестовых файлов
  сверены. Само приложение заново собрано в отдельном каталоге, итоговый файл
  и исходники подтверждены отдельной проверкой в Windows. Прежняя сборка
  не выдаётся за проверку новых исходников. Установка, запуск, готовность
  полного защищённого потока и выпуск по-прежнему не заявляются.
release_notes_round276_protected_startup: |
  Подключён явный запуск защищённого локального хранилища на отдельном потоке:
  создание нового хранилища, проверка при повторном запуске, подтверждение
  результата и освобождение файлов при обновлении. Интерфейс получает только
  результат; владение файлами остаётся на рабочем потоке. Отмена доходит до
  разбора очереди; пустой реестр создаётся без лишних копий в памяти.
  Обычная Windows-сборка прошла восемь выбранных наборов. Отладочная сначала
  превысила лимит времени на файловом наборе; отказ сохранён. Повтор на тех же
  файлах с отдельным лимитом прошёл восемь наборов. Это не подтверждение
  быстродействия приложения. Переносимые проверки прошли 46 из 46.
  Исходники и 16 тестовых файлов сверены в Windows. Само приложение с WebView2
  и AEC3 собрано и отдельно сверено, но не устанавливалось и не запускалось.
  Полная защищённая запись, отправка, воспроизведение, удаление и переход старых
  данных ещё не подключены; готовность Windows-версии и выпуск не заявляются.
  Пользовательские записи, установленная версия, Mac и сервер не менялись.
release_notes_round277_protected_queue_recovery: |
  Восстановление очереди после входа подключено к защищённому рабочему потоку.
  Изменение строк сохраняется одной операцией; интерфейс принимает результат
  только после подтверждения. Смена аккаунта не откатывает уже сохранённые
  данные и не разрешает отправку от старого аккаунта. Ошибка записи или
  неопределённый результат закрывают дальнейшие изменения до новой проверки.
  На искусственных данных проверены перезапуск, отмена, закрытие окна, ошибки
  операций с файлами и нехватка памяти. Windows Release и Debug прошли по
  восемь выбранных наборов; переносимые проверки — 46 из 46. Само приложение
  собрано, исходники и итоговый файл отдельно сверены в Windows.
  Сборка не устанавливалась и не запускалась. Полная защищённая запись аудио,
  отправка, воспроизведение, удаление и перенос старых данных ещё не завершены;
  готовность Windows-версии и выпуск не заявляются. Рабочие записи, Mac и
  сервер не менялись.
release_notes_round278_protected_v5_vertical_started: |
  Начата замена открытых временных аудиофайлов на защищённый путь записи.
  Добавлен тест через настоящий контроллер: захват искусственного звука,
  завершение, проверка пакета, подтверждение очереди и перезапуск. Сначала
  зафиксирована ожидаемая ошибка сборки из-за отсутствующего нового пути.
  Проверка добавления строк очереди прошла отдельно; полная запись пока
  не прошла приёмку. Требуются сборка и испытания всей связки, проверка
  завершения кодировщика, ошибок и удаления короткой записи. Готовность
  Windows-версии и выпуск не заявляются. Пользовательские записи, установленное
  приложение, Mac, микрофон и сервер не менялись.
release_notes_round284_protected_recording_shutdown: |
  Защищённая запись подключена к созданию пакета, завершению кодировщика,
  проверке содержимого и подтверждению очереди. Исправлены ошибки выхода:
  слот записи не освобождается до завершения хранения, ошибки устройства
  не теряются без последнего опроса интерфейса, отказ памяти при завершении
  не оставляет диспетчер зависшим. Срок остановки проверяется по времени
  завершения потоков, а не по времени закрытия окна. После команды выхода
  новые действия запрещены, ранее принятые операции должны завершиться.
  Свежий снимок прошёл 47 переносимых проверок; 209 файлов сверены с веткой.
  Это не проверка всей связки в Windows: нативные испытания остановлены
  до запуска из-за недостатка свободного места на Mac. Порог безопасности
  не снижен. Старые собственные сборки архивированы с проверкой всех файлов;
  удалённые копии восстановимы. Рабочие записи и установленная версия сохранены.
  Полная отправка, воспроизведение, удаление, перенос старых данных и приёмка
  установленного приложения ещё требуются. Готовность Windows и выпуск
  не заявляются. Реальный звук, сервер и macOS-код не менялись.
release_notes_round285_exit_recovery_admission: |
  После команды выхода отложенное восстановление очереди больше не начинает
  новую операцию; уже принятые результаты должны завершиться и сохраниться.
  Исправлена зависимость проверки позднего закрытия окна от порядка потоков.
  Новый снимок прошёл 47 переносимых проверок; 209 файлов сверены с веткой.
  Независимая узкая проверка кода не нашла оставшихся серьёзных замечаний
  в этих исправлениях. Это не подтверждение полного приложения в Windows:
  нативные испытания и установочная приёмка ещё требуются, готовность выпуска
  не заявляется. Пользовательские записи, микрофон, Mac и сервер не менялись.
release_notes_round290_native_aac_validation: |
  Проверка прежних локальных пакетов теперь использует тот же полный
  декодер AAC, что и защищённый поток: одних заголовков и совпавшего SHA
  недостаточно для признания записи исправной. Повреждённая аудиодорожка
  без декодированных кадров не должна допускаться к отправке. Размеры для
  отображения прогресса берутся из готовой фоновой проверки, без чтения
  и декодирования файла в потоке интерфейса; неиспользуемый помощник удалён.
  Исправлены тестовая подача пакетов через настоящий диспетчер и освобождение
  завершённого кодировщика до создания следующего тестового файла, без
  увеличения рабочих ограничений памяти, очереди или срока остановки.
  Свежие переносимые проверки прошли 47/47. В Windows прежний снимок
  подтвердил шесть вариантов завершения защищённой записи в Release;
  полный новый прогон Windows Release прошёл 52/53 наборов. Исправленный
  допуск повреждённого AAC подтверждён: пакет отклонён, попыток отправки 0.
  Остался отказ сценария с пакетом на 10 мс; точная причина ещё выясняется.
  Debug выполняется, сборка всего приложения и установочная приёмка ещё
  требуются. Проверки выполняются на искусственных данных, без
  микрофона и пользовательских записей. Полная защищённая отправка,
  воспроизведение, удаление и установочная приёмка ещё не приняты.
  Готовность Windows-версии и выпуск не заявляются; Mac и сервер не менялись.
release_notes_round292_offline_controller_regression: |
  Усилена проверка записи при недоступной веб-части: настоящий контроллер
  принимает искусственные кадры до и после отказа, сохраняет индикатор и
  завершает обычную 30-секундную запись командой «Стоп». Для генераторов
  теста автозапуска исправлено переполнение общей очереди, рабочие пределы
  приложения не увеличены. Добавлена безопасная диагностика освобождения
  памяти и завершение ошибочных Debug-тестов без ожидания диалога.
  Переносимые проверки прошли 47/47. Полный Windows Debug ещё выполняется;
  выявленные отказы не объявлены исправленными без свежего нативного повтора.
  Проверка пакета на 10 мс, освобождения памяти, сборка всего приложения
  и установочная приёмка ещё требуются. Готовность Windows и выпуск
  не заявляются. Реальный звук, пользовательские записи, Mac и сервер
  не затрагивались.
release_notes_round301_native_mf_lifetime: |
  Исправленные проверки остановки, недоступной веб-части и освобождения памяти
  прошли в Windows: три набора в Release и три в Debug. В существующем тесте
  защищённого потока проверены настоящие обратные вызовы Media Foundation,
  освобождение писателя до позднего COM-вызова, отмена и отказ диска.
  Частичный успешный ответ Media Foundation не скрывает исходную ошибку;
  повторная запись и сохранение после отказа остаются заблокированными.
  Отдельный нативный набор прошёл Release/Debug. Полная проверка 53 наборов,
  сборка всего приложения, защищённая отправка, воспроизведение, удаление
  и установочная приёмка ещё требуются. Это не объявление готовности выпуска.
  Реальный звук, пользовательские записи, Mac и сервер не затрагивались.
release_notes_round302_persisted_package_discovery: |
  Добавлен внутренний путь открытия защищённого пакета после перезапуска
  без сохранённого в памяти идентификатора: используется удерживаемое
  системное владение хранилищем и прежняя строгая проверка обоих индексов.
  Изменена проверка настоящего цикла записи и добавлены случаи повреждённых
  идентификаторов, потери индексов, отмены и нехватки ресурсов.
  Переносимая сборка и 47 проверок прошли; новые случаи Windows ещё требуют
  отдельного нативного выполнения. Формат, права отправки и удаления,
  рабочие ограничения и закрытая готовность хранилища не изменены.
  Это промежуточная реализация T116, не полная приёмка Windows или выпуск.
release_notes_round317_protected_http_body_and_worker_teardown: |
  Защищённые файлы отправляются через общую логику загрузки без открытой
  временной копии. Буфер части файла учитывается в общем ограничении памяти,
  сохраняется до окончания сетевого запроса и освобождается после последнего
  владельца. В Windows проверены настоящая логика отправки и совпадение байтов
  с независимо прочитанной записью в Release и Debug. Исправлено слишком
  раннее объявление завершения фоновой задачи: захваченные объекты теперь
  освобождаются до принятия результата и разрешения следующей отправки.
  Новый тест воспроизвёл ошибку до исправления; после него прошли все
  47 переносимых проверок. Добавлены проверки отмены, ошибочного диапазона,
  нехватки памяти и неверного подтверждения сервера; Windows Release прошёл,
  Debug и полный новый нативный набор ещё требуют завершения.
  Учёт всех вспомогательных сетевых буферов, защищённое сохранение результата
  в очереди, воспроизведение, удаление и установочная приёмка ещё не завершены.
  Это промежуточная реализация T116, не готовность Windows-версии или выпуск.
  Рабочие лимиты не увеличены; Mac, сервер и пользовательские записи не менялись.
release_notes_round319_known_upload_progress_preserved: |
  Исправлена потеря сведений о принятых сервером байтах при ошибке памяти
  в следующем сетевом запросе. Ошибка сначала воспроизведена в Windows после
  настоящей логики записи и загрузки с искусственными сетевыми ответами.
  Исправление находится в общем пути отправки: уже известный прогресс
  сохраняется, повторная отправка или ложная финализация не запускаются.
  Проверки исправления прошли в Windows Release и Debug; все 47 переносимых
  проверок тоже прошли. Пять прежних отказных сценариев сохранены.
  Начат полный повтор 53 наборов для обеих конфигураций; прежний полный
  Debug-набор очереди был остановлен коротким сроком теста и не принят.
  Полный учёт вспомогательной памяти и безопасная передача готового результата
  в защищённую очередь ещё не реализованы. Установочная приёмка и выпуск
  остаются закрытыми; Mac, сервер и пользовательские записи не менялись.
release_notes_round322_native_validation_progress: |
  Полная проверка 53 нативных наборов Windows прошла в Release и Debug.
  Пройдена отдельная проверка отказа памяти при возврате подтверждённого
  результата сохранения: подтверждены точное место отказа, сохранение
  владения файлами, запрет дальнейшей записи и освобождение ресурсов.
  Проверка использовала искусственные данные и неизменный рабочий код;
  независимая приёмка подтвердила результат и закрыла последнее замечание
  проверочного списка. Это снимает остановку на списке, не закрывает всю T116.
  Сборка всего приложения, защищённая очередь, воспроизведение, удаление,
  установочная и аппаратная приёмка остаются открытыми. Это не готовность
  Windows-версии или выпуска; Mac, сервер и пользовательские записи не менялись.
release_notes_round323_terminal_allocation_investigation: |
  Добавлена проверка повторного отказа памяти после подтверждённой отправки.
  В Windows воспроизведено аварийное создание результата, но первый запуск
  не принят как точное доказательство: отладочная привязка конструктора
  оказалась в заголовке вместо ожидаемой строки вызова. Неуспешный результат
  сохранён без переименования в пройденную проверку; уточняется точная привязка.
  Согласована конструкция заранее выделенного результата без позднего переноса.
  Полная защищённая очередь и выпуск остаются открытыми. Пользовательские
  записи, Mac и сервер не менялись; тест использует искусственные данные.
release_notes_round327_preowned_upload_terminal: |
  Исправлен повторный отказ памяти при возврате результата загрузки после
  подтверждённой отправки. Результат создаётся до первого сетевого запроса,
  общий механизм заполняет его на месте; подтверждённые байты сохраняются
  без позднего создания и переноса нового результата.
  Проверка Windows Debug подтвердила отсутствие сети при отказе подготовки,
  сохранение прогресса после отправки и прежние отказные сценарии. Ошибка
  сначала точно воспроизведена; неуспешные диагностические запуски сохранены
  отдельно. Все47 переносимых проверок того же рабочего кода прошли.
  Полное сохранение результата в защищённую очередь и учёт всей вспомогательной
  памяти ещё не завершены. Это промежуточное исправление, не готовность
  Windows-версии или выпуска. Mac, сервер и пользовательские записи не менялись.
release_notes_round330_winhttp_wide_quota: |
  Временные строки Windows при сетевом обмене теперь используют общий лимит
  памяти: адрес, путь, заголовки запроса и буферы заголовков ответа. Повторно
  использован существующий механизм, без новых зависимостей; заголовки
  подтверждённого аккаунта формируются без лишних копий.
  Проверки Windows Debug и Release подтвердили отказ до отправки и после
  получения ответа, закрытие соединений до освобождения тела запроса,
  точность Unicode и заголовков. Все47 переносимых проверок также прошли.
  Полный учёт памяти и сохранение результата в защищённую очередь ещё открыты.
  Это промежуточное исправление, не готовность Windows-версии или выпуска.
  Mac, сервер и пользовательские записи не менялись.
release_notes_round333_protected_http_response_quota: |
  Ответы защищённой загрузки теперь учитывают общий лимит памяти до чтения
  данных: тело ответа, служебные заголовки и их внутренние буферы. Убрано
  лишнее копирование обработчика отправки; общий сетевой алгоритм сохранён.
  Новый тест сначала воспроизвёл прежнее чтение после исчерпания лимита,
  затем подтвердил отказ до чтения и правильное закрытие соединений.
  Пройдены 8 выбранных проверок Windows Debug/Release и все47 переносимых.
  Подтверждены точные отправляемые bytes, отсутствие повторного копирования
  обработчика и сохранение принятого сервером прогресса при отказе памяти.
  Неуспешная промежуточная сборка сохранена отдельно; строгие предупреждения
  не отключались. Полный учёт памяти и защищённое сохранение результата
  остаются открытыми. Это не полная приёмка Windows и не готовность выпуска;
  Mac, сервер и пользовательские записи не менялись.
release_notes_round335_protected_account_response: |
  Убрано лишнее копирование ответа при проверке аккаунта перед защищённой
  отправкой. Обычный и защищённый транспорт используют один алгоритм проверки;
  защищённый разбор учитывает общий лимит памяти до выделения внутренних данных.
  При исчерпании лимита следующий сетевой запрос не отправляется, а данные
  неподтверждённого аккаунта не принимаются. Ошибка сначала воспроизведена.
  Все 10 выбранных запусков Windows Debug/Release и 47 переносимых проверок
  прошли. Исходники и исполняемые файлы повторно сверены по контрольным суммам.
  Полный учёт памяти и сохранение результата в защищённую очередь остаются
  открытыми. Это промежуточное исправление, не полная приёмка Windows и не
  готовность выпуска. Mac, сервер и пользовательские записи не менялись.
release_notes_round337_owned_http_response_data: |
  Исправлено ложное завершение защищённой загрузки при нехватке памяти во
  время обработки ответа сервера. Результат, сведения об аккаунте и состоянии
  загрузки используют общий обработчик; защищённый вариант учитывает лимит
  памяти с первого выделения, обычный сохраняет прежнее поведение.
  Подтверждённые сервером части не теряются при последующем отказе памяти.
  Ошибка сначала воспроизведена; затем прошли 10 выбранных запусков Windows
  Debug/Release и 47 переносимых проверок. Исходники, исполняемые файлы и
  отладочные символы повторно сверены по контрольным суммам.
  Полная обработка защищённой очереди, очистка памяти и оставшиеся буферы
  отправки ещё требуют завершения. Это не полная приёмка и не выпуск Windows.
  Mac, сервер, микрофон и пользовательские записи не затрагивались.
release_notes_round341_342_custody_memory_wipe: |
  В рамках T116 (#7444) исправлены остатки данных в защищённых буферах Windows
  после очистки, уменьшения, замены и освобождения памяти. Короткие строки и
  память прежнего владельца после переноса тоже очищаются. Нужная часть данных
  сохраняется; очистка проверена даже при полностью занятом лимите памяти.
  Ошибка сначала воспроизведена, затем исправление прошло 168 выбранных
  запусков Windows Debug/Release и переносимые проверки. После этого 39
  регрессий подключены к обычному тесту кодека: он заново прошёл в Windows
  Debug/Release, переносимый набор — 47 из 47. Независимая проверка приняла
  исходники и результаты; контрольные суммы файлов программы повторно сверены.
  Новых зависимостей и форматов файлов нет. Временные тестовые сборки удалены,
  журналы и отчёты сохранены. Полная защищённая очередь, оставшиеся буферы
  отправки и приёмка приложения ещё не завершены; T116 остаётся открытой.
  Это не выпуск и не подтверждение готовности всего Windows-приложения.
  Сервер, приложение Mac, микрофон и пользовательские записи не менялись.
release_notes_round343_native_regression: |
  Полный набор из 53 проверок Windows прошёл отдельно в Release и Debug.
  В тесте нехватки памяти исправлено время освобождения тестового буфера:
  он уничтожается до повторного открытия хранилища, а не сохраняет выделенную
  память после присваивания пустого значения. Рабочий код этим не менялся.
  Повторная сверка подтвердила исходники, журналы и 159 файлов сборки.
  Ограничение длины команд Parallels обойдено передачей неизменённых проверок
  через файл с проверкой контрольной суммы, без перезапуска VM и тестов.
  Это проверка конкретного снимка исходников, не полная приёмка приложения:
  защищённая очередь, установленный интерфейс, сквозные и аппаратные сценарии
  ещё требуют завершения. Сервер, Mac и пользовательские записи не менялись.
release_notes_round348_charged_http_request_types: |
  В рамках T116 (#7444) настройки и поля защищённых запросов Windows теперь
  учитывают общий лимит памяти с момента создания. Убраны лишний промежуточный
  буфер JSON, неиспользуемое поле пути и создание обычного файлового потока в
  защищённой отправке. Обычный и защищённый варианты используют один алгоритм;
  формат отправляемых данных, даты, ключи повторов и файлы хранения не изменены.
  Без возможности отмены запрос не отправляется. Проверены отдельные отказы
  при разборе ответа и после подтверждения первой части: следующий блок не
  отправляется, уже подтверждённый прогресс сохраняется.
  Прошли 12 выбранных запусков Windows Debug/Release и 47 переносимых проверок;
  исходники, исполняемые файлы и журналы повторно сверены по контрольным суммам.
  Это промежуточное исправление: защищённая строка очереди, работа в фоне,
  принятие результата, воспроизведение, удаление и приёмка приложения ещё не
  завершены. Полный учёт всех выделений памяти и готовность выпуска не заявлены.
  Сервер, Mac, микрофон и пользовательские записи в этом раунде не менялись.
release_notes_round350_direct_protected_queue_item: |
  В рамках T116 (#7444) защищённая отправка Windows принимает строку защищённой
  очереди напрямую. Убрано промежуточное преобразование в обычные строки и путь;
  снимок очереди удерживается до завершения вызовов. Обычный и защищённый
  варианты по-прежнему используют один алгоритм, формат хранения и обмена
  с сервером не менялся. Проверен ключ повторного запроса после истечения
  серверной сессии, включая повтор той же сессии и другую истёкшую сессию.
  Сначала новая проверка типов выявила две ожидаемые ошибки старого кода;
  после исправления прошли четыре выбранных запуска Windows Debug/Release
  и 47 переносимых тестов. Исходники, исполняемые файлы и журналы сверены.
  Это промежуточный результат: планировщик защищённой отправки, сохранение и
  принятие результата, воспроизведение, удаление и полная приёмка приложения
  ещё не завершены. Готовность внешнего выпуска не заявлена. Сервер, Mac,
  установленный GRAF, микрофон и пользовательские записи не менялись.
release_notes_round352_single_upload_result_write: |
  Исправлено сохранение результата загрузки Windows: подтверждение сервера и
  новый статус очереди записываются вместе, одним действием. При отказе записи
  не применяются срок ожидания повторной отправки и обновление срока сессии.
  Обычная и защищённая очереди используют один алгоритм; защищённая меняет
  только частную копию до отдельного подтверждения сохранения. Добавлены
  проверки ответов сервера, устаревшей строки, отмены и нехватки памяти;
  прежние проверки постоянного отказа сервера сохранены без ослабления.
  Это промежуточная часть T116, а не готовность приложения или внешнего
  выпуска. Подключение защищённой фоновой отправки и полная приёмка остаются
  открытыми. Сервер, Mac и пользовательские записи не менялись.
release_notes_round366_protected_storage_native_checks: |
  В защищённой цепочке хранения Windows исправлены работа с длинными путями
  и порядок выделения памяти при открытии и копировании потока чтения.
  При нехватке памяти прежний поток остаётся пригодным для чтения; неверные
  варианты пути отклоняются до создания дочерних файлов. Выбранные проверки
  хранения, фоновой отправки и сохранения результата прошли 22 запуска в
  Windows Debug/Release. Результат собран из двух частей без повторения
  успешных тестов: сценарий проверки ошибочно ожидал одинаковую длину пути
  Debug и Release. Все исходники, журналы и исполняемые файлы сверены.
  Переносимый набор из 47 тестов принят на тех же исходниках предыдущего
  прогона. Это промежуточная часть T116, не полный набор Windows и не приёмка
  установленного приложения. Конкурентная проверка пакетов, оставшиеся
  потребители защищённых данных и общая готовность ещё не приняты. Сервер,
  приложение Mac, микрофон и пользовательские записи не менялись.
release_notes_round372_recording_failure_caption: |
  Индикатор Windows при ошибке записи теперь показывает нейтральное сообщение
  «Запись завершилась с ошибкой», как в Mac. Оно не утверждает, что ничего
  не сохранено: проверенный фрагмент записи может остаться на компьютере.
  Проверки индикатора и состояния записи прошли в Windows Debug/Release;
  сверены исходники, исполняемые файлы и журналы. В генераторе тестового звука
  убран горячий опрос заполненной очереди без уменьшения длительности записи
  и без увеличения срока проверки. Переносимые 47 проверок также прошли.
  Это промежуточная проверка, не приёмка установленного приложения и не
  готовность внешнего выпуска. Работа записи, доступность, аппаратные
  испытания и полное соответствие Mac остаются отдельными критериями.
release_notes_round377_concurrent_recording_preparation: |
  Полная проверка старой локальной записи перенесена на уже существующий
  исполнитель отправки, чтобы не занимать очередь подготовки новой записи.
  Устранён лишний одновременный учёт завершённого этапа создания файлов:
  лимиты операций, защита файлов и обязательная проверка сохранения не ослаблены.
  На искусственных данных в Windows Debug и Release прошли два сценария:
  создание пакета при нагрузке и подготовка новой записи при задержанном
  чтении старой. Проверены отмена без отправки и освобождение ресурсов.
  Это промежуточная проверка T116, не приёмка установленного приложения.
  Остановка активной записи, остальные действия с защищёнными записями,
  аппаратные испытания и выпуск для внешних клиентов ещё не приняты.
release_notes_round383_concurrent_recording_stop: |
  Исправлен лишний вложенный учёт операций при завершении записи Windows.
  Лимиты памяти и одновременной работы с файлами не увеличены; проверки
  целостности и владельцы защищённых данных сохранены. В Debug и Release
  прошли сохранение при двух занятых внутренних допусках и остановка новой
  записи во время задержанной проверки старой. Новая запись проверена после
  перезапуска, старая сохранена; проверено штатное освобождение ресурсов.
  Переносимые 47 проверок также прошли. Это часть T116, не полная приёмка
  Windows или установленного приложения. Воспроизведение, поздние ошибки
  кодировщика, остальные действия с записями и внешние испытания ещё проверяются.
release_notes_round385_concurrent_playback: |
  Исправлен лишний вложенный учёт операций при открытии защищённой записи
  для воспроизведения. Владельцы файлов освобождаются до допуска декодировщика;
  лимиты ресурсов и проверка целостности не ослаблены. В Windows Debug и Release
  прошли десять выбранных проверок: запись, воспроизведение при нагрузке,
  отказы хранилища, поток записи, завершение и остановка во время проверки
  старого пакета. Переносимые 47 проверок также прошли. Это часть T116,
  не приёмка установленного приложения или готовность внешнего выпуска.
  Поздние ошибки кодировщика, остальные действия с записями, аппаратные
  испытания и полное соответствие Mac ещё проверяются.
release_notes_round386_encoder_output_error: |
  Кодировщик Windows теперь наблюдает уже сохранённую ошибку выходного потока
  до и после следующей операции. Такая ошибка не объявляется повреждением
  исходной записи. В Debug и Release прошли шесть выбранных проверок,
  включая настоящий отказ записи AAC на искусственных данных: возвращена
  точная ошибка, обычный готовый пакет не заявлен, проверенный исходный
  фрагмент сохранён, ресурсы освобождены. Сценарий подключён к штатному CTest
  и отдельно повторно прошёл в Debug и Release; проверены точные команды
  и последовательный запуск. Переносимые 47 проверок прошли.
  Это не доказательство устранения всех поздних зависаний внутри Finalize:
  короткая запись, оставшиеся защищённые действия, установленный интерфейс
  и аппаратная приёмка остаются отдельными проверками T116 и Windows.
release_notes_round389_protected_problem_projection: |
  Подготовлен общий расчёт проблем локальных записей для защищённой очереди
  Windows. Он сохраняет точную принадлежность аккаунту, не объявляет проблему
  устранённой по неполным данным и учитывает всю очередь, включая более 32 записей.
  Промежуточные данные и результат учитываются в существующем лимите памяти;
  её нехватка не превращается в пустой успешный ответ. В Windows Debug и Release
  прошли четыре выбранных проверки, переносимые 47 проверок также прошли.
  Это внутренняя часть T116: подключение списка и действий приложения,
  установленный интерфейс и полное соответствие Mac ещё не приняты.
release_notes_round391_protected_queue_observation: |
  Сводка локальных записей Windows читает подтверждённое состояние защищённой
  очереди. Пока сохранение не завершено, она сообщает о проверке состояния,
  а ошибку не выдаёт за пустую очередь или успешную отправку. При обновлении,
  выходе и новом запуске чтения прежние данные не объявляются актуальными.
  В Debug и Release прошли шесть выбранных проверок, включая ошибки сохранения,
  смену состояния очереди, перезапуск и отсутствие изменений от закрытых действий.
  Переносимые 47 проверок прошли. Это часть T116: список, уведомления о проблемах,
  воспроизведение, остальные действия и приёмка установленного приложения ещё
  не завершены. Полный набор Windows и внешние испытания не заявлены пройденными.
release_notes_round393_protected_account_problems: |
  Проверка принадлежности локальной записи Windows и расчёт проблем подключены
  к подтверждённой защищённой очереди. Смена рабочего пространства, выход и
  устаревший ответ авторизации не дают доступа от прежнего аккаунта. Нехватка
  памяти не выдаётся за пустую очередь или подтверждение устранения проблемы;
  оболочка отзывает действия уведомления, сохраняя историю нерешённой проблемы.
  В Debug и Release прошли восемь выбранных проверок, переносимые 47 также прошли.
  Это часть T116: установленный интерфейс, действия списка, полная проверка
  Windows и внешний выпуск ещё не приняты. Проверка текста обработчика отказа
  памяти не заменяет его испытание в живом интерфейсе.
release_notes_round396_problem_ui_memory_fault: |
  В Windows добавлена проверка настоящего обработчика нехватки памяти в
  оболочке приложения. В отдельном тестовом окне прошли три случая: действия
  проблемной записи отзываются, а обычное напоминание, предложение записи,
  история и ожидающее уведомление о короткой записи сохраняются. Защищённые
  тестовые файлы не изменились, ресурсы освобождены. Исправлена ошибка времени
  самого теста; логику уведомлений ради прохождения проверки не меняли.
  Это проверка части T116 в Parallels, не приёмка установленного приложения,
  реальной записи, раннего закрытия теста или полного соответствия Mac.
  Полная Windows-проверка и внешний выпуск остаются открытыми.
release_notes_round397_local_duration_unknown: |
  Неизвестная длительность локальной записи больше не показывается как ноль
  секунд или якобы сохранённая часть записи. В Windows отсутствие измерения
  сохраняется до общего интерфейса; измеренный ноль остаётся известным нулём.
  Поиск и оба порядка сортировки различают эти состояния. Известные обычные
  и частичные длительности Mac сохраняют прежний вид. Прошли браузерная
  проверка, все 47 переносимых проверок, сборка приложения Windows с SDK
  и четыре случая передачи полей через настоящий WebView2 на искусственных
  данных. Это часть T116, не приёмка установленного приложения, полного
  защищённого списка, записи и выпуска для внешних клиентов.
release_notes_round398_protected_local_inventory: |
  Список локальных записей Windows подключён к подтверждённому защищённому
  состоянию очереди. Удалены прежнее сканирование пакетов для интерфейса и
  его обычные копии списка. Проверка и недоступность больше не выдаются за
  пустой исправный список; записи чужого аккаунта или рабочего пространства
  не передаются странице. Неизвестные дата и длительность не выдумываются.
  Полный список не обрезается до 32 строк или 64 КиБ; общая квота памяти
  сохраняется, после её освобождения повторяется передача того же снимка.
  Прошли 47 переносимых проверок и браузерные проверки общей страницы.
  Сборка Windows и передача 300 строк через настоящий WebView2 прошли;
  проверены восстановление после нехватки памяти и смена рабочего пространства.
  Исправлен также выход исключения при отказе резервного уведомления WebView.
  Это часть T116: защищённые метаданные, воспроизведение, отправка, удаление,
  установленное приложение и полная Windows/Mac приёмка ещё не завершены.
release_notes_round399_protected_recording_timing: |
  Локальный список Windows получает настоящие дату и длительность из
  проверенного защищённого пакета записи. Проверка работает в фоне отдельно
  от отправки, не меняет очередь и не задерживает интерфейс чтением файлов.
  При выходе из аккаунта поздний результат не возвращает прежние данные;
  неизвестная длительность не подменяется нулём. Исправлены завершение фоновой
  проверки, приоритет ожидающей отправки и повтор после отказа по памяти.
  Прошли все 47 переносимых проверок, пять выбранных нативных проверок
  в Parallels и сборка приложения с Windows SDK. Использованы искусственные
  записи, без микрофона и личных данных. Это часть T116: защищённые действия
  с записью, установленный пакет, аппаратная и полная Windows/Mac приёмка
  остаются открытыми. Общая страница, Mac и сервер в этом раунде не менялись.
release_notes_round400_readonly_storage_recovery: |
  Исправлена блокировка хранилища Windows после временной нехватки памяти
  или отмены фонового чтения. После освобождения памяти или нового запроса
  хранилище заново полностью проверяется и снова читает список и пакеты;
  допускается создание следующего пакета. Настоящее повреждение, ошибка
  файлов или незавершённая запись по-прежнему блокируют опасные операции.
  До исправления дефект воспроизведён на настоящем хранилище с искусственными
  данными. После исправления прошли 47 переносимых и восемь выбранных
  нативных проверок в Parallels, а также сборка приложения с Windows SDK.
  Это часть T116, не готовность всего Windows-приложения: защищённые действия,
  миграция, установленный пакет, аппаратная и полная Windows/Mac приёмка
  остаются открытыми. Mac, сервер и пользовательские записи не менялись.
release_notes_round401_protected_reader_release: |
  Добавлена проверяемая граница освобождения защищённого потока Windows.
  Удержанная внешняя ссылка продолжает считаться занятой после отмены;
  завершение подтверждается только после настоящего освобождения потока,
  его владельцев и памяти. Это основа безопасного закрытия проигрывателя,
  а не уже подключённое прослушивание из интерфейса. Новый тест сначала
  воспроизвёл отсутствие этой границы, затем прошли 12 выбранных нативных
  и все 47 переносимых проверок, а также сборка приложения с Windows SDK.
  Отдельно в VM проверены создание и закрытие Media Engine без источника
  и с выключенным звуком. T116, открытие записи кнопкой, установленный пакет
  и полная Windows/Mac приёмка остаются открытыми; Mac и сервер не менялись.
release_notes_round402_protected_media_engine: |
  Добавлен настоящий проигрыватель защищённой локальной записи Windows
  на встроенном MediaEngine. На искусственной записи проверены загрузка,
  продвижение воспроизведения, пауза, перемотка и возобновление без открытого
  временного аудиофайла. Закрытие не объявляется завершённым, пока внешняя
  ссылка удерживает именно поток, переданный MediaEngine; после её освобождения
  закрытие и освобождение памяти завершаются. Отменённые и неверные запросы
  отклоняются. Звук проверки принудительно выключен, микрофон не использован.
  На окончательных исходниках прошли 13 выбранных нативных и все 47 переносимых
  проверок, сборка приложения с Windows SDK и сверка 214 входных файлов.
  Сохранён первый неполный прогон с превышением времени старого теста;
  успешный повтор не является аппаратной или скоростной приёмкой.
  Проигрыватель пока не подключён к пользовательской кнопке открытия:
  актуальность аккаунта, очереди и пакета, отзыв доступа и окно проигрывателя
  остаются следующей частью T116. Установленный пакет и полный паритет
  с Mac этим раундом не принимаются. Mac и сервер не менялись.
release_notes_round403_retained_package_revalidation: >-
  Повторная проверка защищённого пакета теперь перечитывает оба индекса и
  метаданные через уже удерживаемый файл, без конфликтующего повторного
  открытия и без ослабления защиты. Проверяются происхождение владения,
  точный запрос отмены, текущее хранилище и неизменность принятого состояния;
  исправное шифрование и прежний номер поколения сами по себе не дают успеха.
  На сгенерированных данных подтверждены сначала точный конфликт Windows,
  затем успешная проверка, отказы при повреждении обоих индексов и изменении
  метаданных, восстановление после нехватки ресурсов и сохранение замеченной
  ошибки. Native14 и portable47 прошли, приложение собрано обычным SDK,
  214 исходных файлов и EXE повторно сверены. Отдельно обнаружен и пока не
  исправлен конфликт проверки содержимого при живом только что созданном
  хранилище: сценарий после перезапуска не принимается вместо него.
  Пользовательский проигрыватель, установленный пакет и полный паритет с Mac
  остаются незавершёнными; T116 и общий доступ к действиям не открыты.
release_notes_round404_live_root_reader: >-
  Исправлена проверка защищённой записи сразу после первого создания хранилища:
  больше не требуется закрывать приложение и повторно открывать хранилище,
  чтобы избежать конфликта доступа Windows. Чтение использует уже удерживаемый
  доступ, сохраняет проверки прав и целостности и не занимает общую блокировку
  записи. На искусственных обычной и прерванной записях проверены чтение,
  повтор после нехватки ресурсов и подготовка следующего пакета до окончания
  чтения старого. Отдельно подтверждены обработка остановки записи и завершение
  проигрывателя после настоящего освобождения потока. Прошли 16 выбранных
  нативных и все 47 переносимых тестов, сборка приложения с Windows SDK и
  сверка 214 исходных файлов. Кнопка открытия записи и окно проигрывателя
  ещё не подключены к этому защищённому пути; установленный пакет, аппаратная
  приёмка и полный паритет с Mac остаются незавершёнными. Формат диска,
  Mac и сервер не менялись; T116 и общий доступ к действиям не открыты.
release_notes_round405_local_playback_consumer: >-
  Действие «Открыть» локальной записи подключено к защищённому проигрывателю
  в отдельном нативном окне Windows: воспроизведение, пауза, перемотка,
  закрытие и явный повтор после ошибки. Прежний переход к открытому файлу
  удалён. Аккаунт, документ, строка очереди и пакет перепроверяются;
  позднее событие старого окна не управляет новым, а закрытие ждёт настоящего
  освобождения потока. Исправлен воспроизведённый дефект: пауза при занятом
  хранилище теперь передаёт фактическое состояние в окно до ответа проверки;
  возобновление звука по-прежнему требует свежего подтверждения. На неизменных
  итоговых исходниках прошли 20 выбранных Windows-тестов, все 47 переносимых
  тестов и ещё три последовательных повтора сценария проигрывания;
  приложение собрано с Windows SDK, сверены 214 входных файлов и EXE.
  Проверки использовали только искусственную запись с выключенным звуком,
  без микрофона и рабочего сервера. Настоящая проверка окна, установленный
  пакет и полный паритет с Mac остаются открытыми. Серверные записи,
  отправка, удаление и общий допуск записи этим изменением не открыты;
  T116 остаётся незавершённой. Mac, сервер и формат диска не менялись.
  Отдельная сборка на искусственных данных подтвердила настоящую загрузку
  через изолированный локальный HTTPS, подтверждение сеанса и штатное
  освобождение ресурсов. Блокер перехваченного ответа устранён в тестовом
  стенде без ослабления защиты приложения; приёмку кнопок и окна это не заменяет.
release_notes_round406_privacy_pause_timeline: >-
  Исправлена утечка ожидающего звука микрофона после возобновления записи:
  пауза необратимо обнуляет накопления внутри общей временной шкалы и её
  последнее значение для коррекции часов. Новые данные паузы сохраняются
  нулевыми только после проверки исходных отсчётов и временных меток.
  Тест сначала воспроизвёл дефект, затем прошли повторные и частичные паузы,
  отрицательные сценарии, проверки памяти, все47 переносимых тестов и
  отдельный синтетический тест, собранный Visual Studio для Windows x64.
  Полная приватная пауза ещё не принята: очередь захвата, точная граница
  возобновления и защищённая история OPEN/CLOSE остаются в T120/#7590
  с зависимостью от T116. Установленный пакет, аппаратная приёмка и выпуск
  этим исправлением не закрыты. Mac, сервер и формат диска не менялись.
release_notes_round407_privacy_accepted_fifo: >-
  Пауза микрофона теперь сохраняет подавление для старых блоков принятой
  очереди, в том числе уже извлечённых из неё. Возобновление пропускает
  только новые блоки; системный звук и проверки исходных данных сохранены.
  На искусственных данных прошли 47 переносимых тестов, проверка памяти
  временной шкалы и отдельный тест очереди, собранный для Windows x64.
  Затем прошли оба выбранных нативных набора, включая полный набор отказов
  захвата, и сборка самого приложения Windows SDK с проверкой 214 входов.
  Полная приватная пауза остаётся незавершённой: данные до входа в очередь,
  защищённая история и асинхронное принятие действий требуют продолжения
  T120 и T116. Установленный пакет, аппаратная приёмка и выпуск не приняты.
release_notes_round408_privacy_prefetch_resampler: >-
  Пауза теперь сохраняет происхождение пакета микрофона до очереди: задержка
  в захвате или после преобразования частоты не делает старые данные новыми
  после возобновления. Остаток преобразования 44,1 в 48 кГц подавляется без
  сдвига временной шкалы; новые отсчёты и системный звук сохраняются.
  Неверные исходные данные, отсутствующая или будущая нативная метка дают
  отказ. На искусственных данных прошли шесть сценариев задержки, шестнадцать
  вариантов преобразования, отрицательные проверки, все47 переносимых
  тестов и проверка памяти. Три выбранных набора Windows тоже прошли;
  приложение собрано Windows SDK с повторной проверкой 214 входных файлов.
  Предупреждения связывания атомарных счётчиков требуют отдельного разбора;
  сборка не считается окончательной приёмкой. Защищённая история пауз, асинхронные действия,
  установленное приложение и полный T120 с зависимостью T116 ещё не приняты.
release_notes_round409_live_metadata_checkpoint: >-
  Исправлено защищённое сохранение состояния во время записи: новая версия
  метаданных публикуется вместе со ссылкой из пакета, предыдущая остаётся
  читаемой при отказе между шагами. Пройдены пять последовательных сохранений,
  шесть сбоев публикации, повторное открытие, завершение записи после обновлений,
  отказ на повреждённой резервной версии и проверки ограничений ресурсов.
  Четыре выбранных набора Windows и все47 переносимых тестов прошли;
  приложение собрано Windows SDK с проверкой214 входных файлов.
  Отдельно воспроизведено предупреждение компилятора об атомарном счётчике;
  оно не подавлялось и не считается полной проверкой приложения.
  История пауз по модели Mac, асинхронные действия и установленное приложение
  этим этапом не приняты; T116/T120 и внешние условия выпуска остаются открытыми.
release_notes_round410_privacy_history: >-
  В защищённое хранилище записи добавлена история пауз по настоящей модели
  Mac: открытие паузы подтверждается сохранением, длительность закрытой паузы
  не зависит от перевода системных часов. Перед открытием проверяется размер
  всего будущего описания записи; старая история не обрезается, для завершения
  записи сохраняется место. Исправлено ограничение преобразования дат Windows.
  На искусственных данных прошли четыре выбранных набора Windows, включая
  нехватку памяти, шесть точек отказа публикации, предельную историю и повторное
  открытие пакета; три выбранных переносимых набора тоже прошли. Само приложение
  собрано Windows SDK, повторно сверены214 исходных файлов. Временные сборки
  убраны, компактные результаты сохранены. Подключение истории к асинхронным
  Pause/Resume/Stop и сохранение её в прерванной записи ещё не завершены.
  Прежнее предупреждение компоновщика не подавлялось. Установленный пакет,
  аппаратная приёмка и полный паритет с Mac не приняты; T116/T120 открыты.
release_notes_round411_async_privacy_boundary: >-
  Пауза микрофона больше не ждёт занятый обработчик звука в потоке интерфейса:
  защищённая история сохраняется на прежнем обработчике до принятия паузы,
  повторные команды не дублируются. Возобновление не отменяется нефатальным
  отказом сохранения закрывающей отметки, а Стоп остаётся доступным и закрывает
  историю до финализации. Исправлена гонка между Стопом и принятием паузы.
  Все47 переносимых проверок и шесть выбранных наборов Windows прошли;
  отдельно прошли проверки асинхронных команд. Настоящий защищённый пакет
  на искусственных данных заново открыт с двумя закрытыми паузами.
  Приложение собрано Windows SDK из того же снимка214 исходных файлов.
  История в прерванной записи ещё требует доработки; прежнее предупреждение
  компоновщика, установленный пакет, живой звук и полный паритет с Mac этим
  этапом не приняты. T116/T120 остаются открытыми, публичного выпуска нет.
release_notes_round412_privacy_degraded_retention: >-
  История приватных пауз теперь сохраняется и в доверенном фрагменте
  прерванной записи. Незакрытые паузы остаются незакрытыми; повреждённая
  история, неверная сессия и длительность не принимаются. Формат восстановления
  не расширен, новый журнал не добавлен. Проверены предельная история без
  обрезки и отказы до и после настоящей публикации описания записи.
  Все47 переносимых тестов и восемь выбранных наборов Windows прошли;
  отдельная проверка памяти дважды вернулась к точному исходному счётчику.
  Исправлена подготовка отдельного теста к разовому служебному объекту кэша,
  без допуска на утечки. Приложение собрано Windows SDK из того же снимка214
  входов с повторной сверкой. Прежние предупреждения компоновщика не закрыты.
  Обычный запуск записи, ручная отправка и удаление ещё требуют полного
  подключения защищённой очереди; T116/T120, установленный пакет, аппаратная
  приёмка и весь паритет с Mac остаются открытыми. Публичного выпуска нет.
release_notes_round413_protected_deletion_intent: >-
  Запрос удаления локальной записи с серверной идентичностью теперь можно
  надёжно сохранить через существующий защищённый обработчик и восстановить
  после перезапуска. Повтор не дублирует запрос и не сбрасывает принятый ответ.
  Исправлена гонка, при которой завершение первого запроса могло стереть второй;
  проверка воспроизводит её на настоящем обработчике до исправления.
  Прошли47 переносимых тестов, шесть выбранных наборов Windows и отдельная
  проверка прежнего реестра удалений; приложение собрано Windows SDK из того же
  снимка214 файлов. Это ещё не удаление из кабинета до конца: сетевой ответ,
  очистка файлов, обычная запись и ручная отправка требуют полного подключения.
  Прежние предупреждения компоновщика, установленный пакет, аппаратная приёмка
  и полный паритет с Mac остаются открытыми. T116/T120 не закрыты, выпуска нет.
release_notes_round414_atomic_deletion_answer: >-
  Ответ сервера об удалении теперь сохраняется одной операцией вместе с попыткой,
  подтверждением и связью локальной записи со встречей. Устранено частичное
  сохранение при отказе диска; ответ старой сессии или прежнего состояния очереди
  отклоняется, повтор подтверждения не создаёт новую попытку. Используются
  существующие защищённый обработчик и ограничение памяти, без нового хранилища.
  Прошли47 переносимых тестов и девять выбранных проверок Windows, включая пять
  сбоев/отмен на настоящей границе записи и восстановление после перезапуска.
  Приложение собрано Windows SDK из того же снимка214 файлов. Общая кнопка
  удаления, сетевое продолжение, очистка локальных файлов, ручная отправка и
  обычная запись ещё требуют полного подключения; старые пути не открывались.
  T116/T120, предупреждения сборки, установленный пакет, аппаратная приёмка
  и полный паритет с Mac остаются открытыми. Выпуска и обновления установки нет.
release_notes_round415_atomic_deletion_selection: >-
  Смешанный выбор удаления теперь готовится и сохраняется целиком: серверные
  запросы и отметки локальных записей не публикуются частями. Неверная или чужая
  цель отклоняет весь выбор; повторные цели не создают лишние операции.
  Исправлена возможность сохранить частичный результат отвергнутого выбора.
  Используется существующий защищённый обработчик; старый внутренний путь,
  остававшийся только в тестах, удалён. Прошли47 переносимых тестов, десять
  выбранных проверок Windows и полная сборка Windows SDK из одного снимка214
  файлов. Это ещё не удаление из кабинета до конца: сетевое продолжение и
  очистка файлов требуют подключения и проверки. Обычная запись, ручная
  отправка, T116/T120, предупреждения сборки, установленный пакет, аппаратная
  приёмка и полный паритет с Mac остаются открытыми. Выпуска нет.
release_notes_round416_deletion_continuation: >-
  В защищённом обработчике запрос удаления удерживается после сохранения
  намерения до принятия ответа; запоздалое завершение прежнего запроса не
  освобождает новый. Неопределённый результат записи на диск требует сверки
  фактического состояния; отказ чтения не выдаётся за успех. Исправлена гонка
  со считыванием сведений для списка записей. Общий HTTP-код использует прежние
  проверки аккаунта, протокола и ограничение памяти, без нового сетевого клиента.
  Прошли47 переносимых и12 выбранных проверок Windows; приложение собрано
  Windows SDK из того же снимка214 файлов. Проверка пересечения чтения и удаления
  ограничена временным окном, а не гарантированным воспроизведением гонки.
  Это ещё не удаление из кабинета до конца: подключение оболочки и очистка
  локальных файлов остаются обязательными. T116/T117/T118/T120, обычная запись,
  ручная отправка, прежние предупреждения сборки, установленный пакет,
  аппаратная приёмка и полный паритет с Mac не закрыты. Выпуска нет.
release_notes_round417_deletion_shell: >-
  Защищённое удаление подключено к оболочке Windows через существующий
  NativeCapture: следующий запрос ждёт сохранения и принятия предыдущего ответа.
  Убраны detached-поток удаления, зависимость хранения от callback окна и три
  неиспользуемые обёртки. Выход и обновление дренируют допустимый полученный
  ответ; смена аккаунта не применяет его к новой сессии. Нехватка памяти при
  ответе странице повторяет только доставку, не запрос на удаление. Прошли47
  переносимых и17 выбранных проверок Windows, включая18 generated-data случаев;
  настоящее приложение собрано Visual Studio из того же снимка214 файлов.
  Это не установленная/UI приёмка. Кнопка локального удаления ещё закрыта:
  защищённая очистка файлов, обычная запись, ручная отправка, миграция и полный
  паритет с Mac остаются обязательными. Не сняты предупреждения сборки,
  T116/T087/T117/T118/T120 и внешние аппаратные/релизные проверки. Выпуска нет.
release_notes_round418_atomic_link_consistency: >-
  Устранены все25 C4744 общего счётчика памяти в полной сборке Windows без
  подавления предупреждений. Причина воспроизведена двумя исходными файлами;
  три строки в общем заголовке обеспечивают полноту атомарного типа до
  определения счётчика. Лимит64MiB и алгоритм учёта не меняются. Новая строгая
  Release-проверка компоновки подтверждает общий счётчик, квоту и освобождение
  памяти; прошли48 переносимых и18 выбранных тестов Windows. Приложение собрано
  Visual Studio из того же снимка216 файлов. Остались C4100/D9025. Защищённая
  очистка файлов и полная приёмка T116/T087/T117/T118/T120 не завершены;
  установленный пакет и пользовательские сценарии этим раундом не приняты.
  Изменений форматов данных, установок и выпуска нет. Refs T116/#7444, T118/#7446.
release_notes_round419_protected_local_purge: >-
  Защищённый локальный пакет удаляется настоящей Корзиной Windows после
  сохранения намерения и завершения чтения. Проверяются владелец, поколение,
  физический каталог и фактическое отсутствие; успех возвращается только
  после сохранения и принятия новой очереди. Отказ, занятый файл или перезапуск
  не теряют намерение удаления и не создают ложного успеха. Переиспользованы
  существующие worker, continuation и commit/reconciliation, без нового
  формата или зависимостей. Прошли19 выбранных native тестов Windows, включая9
  сценариев protected purge,48 переносимых тестов, строгая Release-компоновка
  и отдельная прежняя проверка удаления. Полное приложение собрано Visual
  Studio из того же снимка216 файлов. Это ещё не приёмка установленного
  приложения или серверного удаления; T116/T087/T117/T118/T120, запись,
  пользовательские сценарии и аппаратные проверки остаются открытыми.
  Общие переключатели допуска не открыты, формат не менялся, выпуска нет.
  Refs T116/#7444, T118/#7446.
release_notes_round420_purge_retry_truth: >-
  Исправлены общие правила серверной очистки локальных копий. Сохранённый ответ
  теперь повторно подтверждает только ту же задачу и встречу; другой тип или
  чужая встреча не получают доказательство удаления. После отказа Корзины
  завершённая отправка сохраняет свой статус и намерение очистки, поэтому
  та же серверная задача может повториться после перезапуска. Этот путь
  не подменяется пользовательским подтверждением; незавершённая отправка
  прямым server proof не удаляется. Формат реестра и серверный API не менялись.
  Прошли48 переносимых и20 выбранных тестов Windows, включая настоящий отказ
  Корзины и повтор после перезапуска; полное приложение и строгая Release
  проверка компоновки собраны из одного снимка216 файлов.
  Полное подключение защищённого server-purge, установленный пакет и общая
  приёмка Windows ещё не завершены; общие переключатели допуска не открыты.
  Старые quarantined-intents автоматически не переименовываются в uploaded.
  Refs T116/#7444, T087/#7230.
release_notes_round421_protected_purge_protocol: >-
  Подготовлен защищённый сетевой путь задач локальной очистки: получение списка,
  адресный запрос задачи и отправка ответа используют общий разбор и проверки
  аккаунта, протокола, отмены и памяти. Обычное и защищённое представления
  сохраняют одинаковые правила и прежний серверный API; адрес из ack_url
  не используется. Лимит200 и отказ всего повреждённого списка сохранены.
  Это часть T116/T087, не полная цепочка удаления: ещё нужны подключение
  к существующему продолжению, сохранение намерения, физическое удаление,
  атомарное сохранение доказательства и его принятие до HTTP-подтверждения.
  Общие переключатели допуска не открыты, установленное приложение не обновлено.
  Refs T116/#7444, T087/#7230.
release_notes_round422_protected_purge_worker: >-
  Серверная задача очистки подключена к защищённым заданиям хранилища Windows:
  сначала принимается сохранённое намерение, затем выполняется перенос
  завершённой копии в Корзину. Последняя строка и доказательство отсутствия
  сохраняются одним изменением очереди. Незавершённые и чужие копии не удаляются
  и блокируют подтверждение полной очистки. Повтор после сбоя использует
  сохранённое намерение; успешное задание без изменений само по себе не доказывает
  удаление. Полная сетевая цепочка получения задачи и подтверждения серверу,
  установленный пакет и общая приёмка Windows остаются открытыми.
  Общие переключатели допуска не открыты. Refs T116/#7444, T087/#7230.
release_notes_round423_protected_purge_flight: >-
  Полная цепочка задач серверной очистки подключена к существующему защищённому
  продолжению Windows: получение задачи, сохранение намерения, Корзина,
  сохранение и принятие доказательства, затем ответ серверу. Потерянный ответ
  повторяется после перезапуска без повторного удаления; выход, обновление
  и смена аккаунта прекращают новые действия. Задержка после429 относится
  только к действующей сессии. Старая дублирующая цепочка интерфейса удалена.
  Прошли48 переносимых и14 выбранных нативных тестов, включая13 сквозных
  сценариев; полное приложение и строгая Release-компоновка собраны из одного
  снимка216 файлов. Испытания используют только искусственные записи и тестовые
  HTTP-ответы. Предел списка200 сохранён. T116/T087, ручная отправка защищённых записей,
  миграция, установленный пакет и общая приёмка Windows остаются открытыми;
  общие переключатели допуска не открыты. Refs T116/#7444, T087/#7230.
release_notes_round424_protected_manual_send: >-
  Ручная отправка собственной локальной записи подключена к защищённой очереди
  Windows. Кнопка использует те же правила, что и очередь: нельзя отправить
  чужую запись, обойти окончательный отказ сервера или незавершённое удаление.
  Повтор сохраняет идентификаторы и уже принятые сервером части. Запрос сначала
  сохраняется и принимается приложением, затем запускается прежний транспорт;
  ожидание сохранения не показывается как успех. Старые синхронные пути отправки
  и назначения владельца удалены. При смене страницы или аккаунта собственное
  сообщение ожидания больше не зависает и не стирает более новый результат.
  Записи без подтверждённого владельца остаются
  скрытыми: их публичный сценарий восстановления ещё не принят. Общие
  переключатели допуска, установленный пакет и общая приёмка Windows не
  объявляются готовыми. Refs T116/#7444, T083/#6640.
release_notes_round425_protected_local_copy_removal: >-
  Нативный путь удаления собственной локальной копии Windows подключён к
  защищённому хранилищу: подтверждение пользователя, сохранение намерения, завершение
  чтения и воспроизведения, Корзина Windows и принятие обновлённой очереди.
  Уже отправленная серверная запись не удаляется; её идентификаторы и
  принятые части не превращаются в новую задачу серверного удаления.
  Сохранённое незавершённое намерение продолжается после перезапуска только
  для того же владельца. Отказ сохранения не получает обещания автоматического
  повтора, а при неизвестном результате интерфейс не сообщает об успехе.
  Старые синхронные Native пути удаления убраны. Отдельный вход из интерфейса
  ещё не принят: обычная корзина списка сохраняет общий смысл удаления и не
  подменяется локальным действием. Общий допуск, миграция, установленный
  пакет и полная приёмка Windows остаются открытыми.
  Refs T116/#7444, T087/#7230.
release_notes_round426_native_local_copy_action: >-
  В нативной панели «Выбранная запись», открытой из сообщения о проблеме,
  добавлено отдельное действие «Удалить локальную копию…». Оно требует
  отдельного подтверждения, проверяет текущего владельца и выбранную копию
  перед выполнением и использует прежнюю защищённую цепочку удаления.
  Общая корзина списка встреч и серверная запись не меняются. Временная
  занятость хранилища не сбрасывает панель; кнопка сохраняется при обновлении
  состояния. Результат принятого удаления не теряется только из-за того,
  что сама строка уже удалена. В изолированном настоящем окне проверены
  кнопка и диалоги отмены и отозванного подтверждения после повторного
  выбора записи. Положительное удаление в Корзину, фокус и установленный пакет
  ещё требуют приёмки; это не завершение T116/T087 и не доступ к удалению
  любой строки кабинета. Общие условия допуска записи не ослаблены.
  Refs T116/#7444, T087/#7230.
release_notes_round427_native_local_copy_recycle_acceptance: >-
  На искусственном защищённом пакете проверен положительный маршрут
  нативного действия «Удалить локальную копию…»: настоящая кнопка и диалог,
  перемещение того же каталога в Корзину Windows с сохранением содержимого,
  подтверждённое обновление очереди и правдивое сообщение об успехе.
  Все поля другой строки очереди сохранены; повторное открытие защищённого
  хранилища подтверждает принятое состояние. Проверки отмены, устаревшего
  подтверждения и отказа памяти сохранены — шесть сценариев прошли.
  Пользовательские записи, сервер и производственный код в этом раунде
  не менялись. Это изолированная проверка WinUI, не установленного MSIX,
  клавиатуры, записи звука или завершения T116/T087. Синтетический пакет
  оставлен восстанавливаемым в Корзине, а не объявлен уничтоженным.
  Refs T116/#7444, T087/#7230.
