schema_version: 1
feature_id: 200
category: Changed
summary: "Windows GRAF: восстановление кабинета, нативных окон и безопасной локальной записи после синхронизации с master"
issue: 6641
tasks: [T080, T081, T082, T083, T084, T085]
compatibility: "Сохранён формат локальных записей v5 и чтение очереди v2. Режимы автозаписи сохраняются по постоянному ключу продукта в ApplicationRulesV2. Дорелизный V1 и глобальные настройки не читаются как разрешения и не удаляются; пустой прежний каталог не позволял сохранять реальные правила через UI. Изменений macOS и развёртывания сервера в этом срезе нет."
known_limitations:
  - "Windows-каталог содержит только проверенный Microsoft Teams 26213.1006.5014.9784 ARM64. Другие версии и настоящее обнаружение встреч/фоновая автозапись ещё не приняты. Юридических условий старта больше нет; техническая готовность остаётся обязательной."
  - "Ручной сценарий в Parallels теперь прошёл до saved_local: Record/Pause/Resume/WebView reload/Stop, 960/960 и 988/988 обработанных/записанных блоков, reason_code=none. Это x64-приложение под эмуляцией Windows ARM64, а не доказательство физического x64, 60-минутной записи, качества AEC или сквозной отправки. Тихий сценарий без пригодного системного источника ожидаемо завершился endpoint_invalidated и не считается успешным стартом."
  - "Windows ARM64 в Parallels с x64-приложением не заменяет проверку физического x64-компьютера."
  - "Подтверждение серверной очистки локальных копий требует авторизации отдельной установки."
  - "Первоначальная проверка аккаунта использует существующие /desktop/settings/spaces и /auth/me без изменения сервера. Контрактные тесты порядка запросов, отмены и принадлежности пройдены; сквозная отправка в настоящем кабинете ещё не подтверждена."
  - "Подпись MSIX, чистая установка, обновление и публичный выпуск не подтверждены."
  - "Первая версия предназначена внешним клиентам. По Constitution 7 правовая политика пространства и подтверждения уведомления/согласия не блокируют запись; текст пользовательского соглашения отложен в отдельную задачу."
release_notes: >-
  Кабинет использует общий веб-интерфейс. Исправлены инициализация WinUI/WebView2,
  восстановление навигации, маршруты аккаунта и продолжение входа через провайдеров.
  Нативная часть содержит выбор микрофона, состояния и таймер, видимый индикатор,
  неблокирующий запуск/остановку и сохранение подтверждённой части прерванной записи.
  Закрытие приложения ждёт финализации; локальные действия и безопасная сводка
  имеют явный результат. Удалены неиспользуемые проекции, пустые тестовые проекты,
  фиктивные подтверждения удаления, устаревшие команды моста и синхронная отправка.
  По Constitution 7 удалены отменённые условия правовой политики и согласия;
  техническая готовность, видимый индикатор и Stop сохранены. Автозапись не зависит
  от видимости главного окна; отдельный индикатор подготавливается скрытым.
  Слежение за окончанием встречи начинается с запуска записи, допускает смену
  процесса того же проверенного приложения и ограничивает потерю подтверждения
  десятью минутами. Настройки трёх режимов сохраняются по постоянному ключу
  продукта, а обнаружение проверяет точную идентичность программы.
  Исправлены явный повтор отправки после исчерпания попыток, ограниченное сетевое
  восстановление проверки аккаунта, продолжение очереди после перезапуска и
  замена истёкшей сессии без повторного использования старого ключа.
  WASAPI сохраняет точность QPC100ns; преобразование частоты ведёт непрерывную
  фазу, общая шкала проверяет порядок диапазонов и ограничивает коррекцию
  48 кадрами. Event-driven worker использует GetNextPacketSize, а bounded queue
  отделяет WASAPI callback от timeline/AEC3/writer; переполнение и сбой worker
  завершают запись fail-closed. Удалены неработающие настройки ожидания
  восстановления звука.
  Только первый непустой пакет с точным флагом начального разрыва может быть
  освобождён без чтения звука; повторный разрыв остаётся отказом. Готовность
  наступает после нормализованных данных, срок запуска остаётся пять секунд.
  Добавлены раздельные типизированные причины и фактические счётчики этого
  отбрасывания без изменения форматов v2/v5. Окончательные исходники прошли
  20 переносимых и 20 Windows-тестов; четыре аудио- и диагностические проверки
  дополнительно прошли контроль памяти/неопределённого поведения.
  Новое приложение собрано и запущено в Parallels, панель раскрыта через UIA.
  Контролируемые сценарии Record/Pause/Resume/WebView reload/Stop завершились
  локальным сохранением с reason_code=none; состояние микрофона восстановлено.
  Это не подтверждает 60-минутную запись, все окна, authenticated upload,
  подписанный пакет, физический x64 или внешний выпуск.
  Изменения находятся в проверке; этот фрагмент не разрешает публикацию.
