summary: "Проверка метаданных встречи больше не принимает неполный ответ за готовый результат"
issue: 1819
tasks: [T020]
compatibility: "Схема сервера не меняется. Проверка только состояния сервера без контекста владельца теперь завершается кодом 1; код 0 означает успешную ограниченную проверку метаданных API."
known_limitations: ["T019 и T020 остаются открытыми до фактической приёмки свежей записи из установленного приложения", "Успешные метаданные не доказывают работу интерфейса, воспроизведения, выпуска или развёртывания"]
release_notes: "Исправлены чтение вложенного состояния встречи, привязка UUID ответа к запросу, строгая проверка типов и состояний, счётчики расшифровки, полос, интервалов, переходов и восьми категорий итогов. Запрещены перенаправления с Cookie; неизвестные ответы и ошибки выводятся безопасными причинами. Добавлены изолированные проверки без сети и настоящих данных."
