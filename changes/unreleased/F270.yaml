schema_version: 1
feature_id: 270
category: Fixed
summary: "Страница списка встреч перестала обращаться к базе пропорционально числу встреч: вместо 144 обращений при пяти встречах и примерно 1500 при пятидесяти страница делает постоянное число обращений, поэтому кабинет больше не замедляется по мере накопления записей."
issue: 7127
tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019]
compatibility: "Изменений совместимости нет: схема данных, миграции, состав полей ответа, порядок, сортировка, фильтры, предел списка и тексты не менялись. Решения о доступе, признаки удаления и правила выгрузки сохранены."
known_limitations:
  - "Внутренняя избыточность страницы детали встречи (постоянные 84 обращения, не зависящие от числа записей) в этот выпуск не входит и запланирована отдельно."
release_notes: "Кабинет открывается быстрее и не замедляется с ростом числа встреч. Исправлена причина: чтение списка встреч делало запросы к базе на каждую встречу отдельно. Теперь данные подгружаются пакетно, а проверка-предохранитель не даст этой зависимости вернуться."
