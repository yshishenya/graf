release_notes: "Обе страницы «Поделились со мной» используют пакетное чтение прав и ревизий в пределах рабочего пространства владельца. Установка проверенного контекста выполняется одним SQL на проход с сохранением локальности транзакции. Полная страница встречи использует существующую предвыборку данных: готовая встреча требует 24 SQL, опубликованные итоги со встроенным или личным шаблоном — 25 SQL. При росте истории с 5 до 50 связей число обращений остаётся 24. Решения о доступе и подтверждённые адреса получателя читаются заново; выбор источника, итогов, календаря и правила удаления сохраняются. Локальные проверки и независимое ревью пройдены; итоговая приёмка F270 остаётся открытой."
