release_notes: "Обе страницы «Поделились со мной» используют пакетное чтение прав и ревизий в пределах рабочего пространства владельца. Пустой список и одна встреча сохраняют прежнюю стоимость; неоднозначные выдачи доступа сохраняют прежний одиночный выбор. Установка проверенного контекста выполняется одним SQL на проход с сохранением локальности транзакции и восстановления после commit/rollback. Синтетическая деталь сократилась с 84 до 68 SQL; исходный предел 25 SQL и полная приёмка F270 ещё не достигнуты."
