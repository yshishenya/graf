schema_version: 1
feature_id: 270
category: Changed
summary: "Страница списка встреч перестала обращаться к базе пропорционально числу встреч (144 обращения при пяти встречах, около 609 при двадцати — теперь постоянное число), а обязательный полный прогон серверных тестов ускорился в 3,5 раза: 7583 секунды превратились примерно в 2148 на том же наборе из 481 файла."
issue: 7127
tasks: [T002, T003, T004, T005, T006, T007, T008, T009, T010, T011, T012, T013, T014, T015, T016, T017, T018, T019, T020]
compatibility: "Изменений совместимости нет: схема данных, миграции, состав полей ответа, порядок, сортировка, фильтры, предел списка и тексты не менялись. Решения о доступе, признаки удаления и правила выгрузки сохранены."
known_limitations:
  - "Внутренняя избыточность страницы детали встречи (постоянные 84 обращения, не зависящие от числа записей) в этот выпуск не входит и запланирована отдельно."
  - "Разбиение выпускного прогона на параллельные задачи и привязка доказательств к дереву кода ждут вливания открытой фичи F269, потому что меняют те же файлы."
release_notes: "Кабинет открывается быстрее и не замедляется с ростом числа встреч. Исправлена причина: чтение списка встреч делало запросы к базе на каждую встречу отдельно. Теперь данные подгружаются пакетно, а проверка-предохранитель не даст этой зависимости вернуться. Заодно обязательный прогон серверных тестов стал в 3,5 раза быстрее за счёт переиспользования одного экземпляра приложения между тестами, поэтому проверки перед выпуском проходят заметно быстрее при том же покрытии. Убраны три источника ложных отказов: устаревшая строка с коммитом в описании пул-реквеста, замечание о лишней пустой строке, находившееся только после всех тестов, и проверка синтаксиса, зависевшая от языка системы."
