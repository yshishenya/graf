release_notes: "Звук доступен независимо от пустого слота итогов. Длительная подготовка и временный разрыв связи не останавливают автоматическую проверку. Обновление страницы итогов сохраняет проигрывание и ввод названия. Нативные статусы отделяют доступность экрана от готовности расшифровки, уведомления привязаны к владельцу и свежей версии результата."
